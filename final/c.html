: ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "I is true; II is false because `super()` must be the very first statement in a constructor."}, {"id": 201, "num": 8, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "What is the output of:\nString s = \"Hello World\".substring(3, 7).toUpperCase();\nSystem.out.println(s + \"|\" + s.indexOf('O') + \"|\" + s.length());", "options": ["LO W|1|4", "LO W|1|5", "LO WO|1|5", "LLO |2|4"], "ans": 0, "exp": "Indices 3..6 = \"lo W\" → \"LO W\"; indexOf('O') = 1; length = 4 → `LO W|1|4`."}, {"id": 202, "num": 9, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "In Java, the data type ______ is 16 bits in size and stores Unicode characters.", "options": ["byte", "short", "char", "int"], "ans": 2, "exp": "Java `char` is 16-bit unsigned Unicode (0 to 65,535)."}, {"id": 203, "num": 10, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding Java?\nI. break terminates the innermost loop immediately.\nII. A labelled break (break outer;) can be used to exit an outer loop from inside an inner loop.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both statements are correct."}, {"id": 204, "num": 11, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "What is the output of:\nint[] a = {1, 2, 3}; int[] b = a; b[0] = 9; a = new int[]{4, 5};\nSystem.out.println(b[0] + \" \" + a.length + \" \" + b.length);", "options": ["1 2 3", "4 2 2", "9 2 3", "9 3 3"], "ans": 2, "exp": "`b` still points to `{9, 2, 3}` (length 3) while `a` points to `{4, 5}` (length 2) → `9 2 3`."}, {"id": 205, "num": 12, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "The number of characters in a Java String s is returned by ______.", "options": ["s.size()", "s.count()", "s.length", "s.length()"], "ans": 3, "exp": "Java Strings use the `s.length()` method."}, {"id": 206, "num": 13, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding comparing strings in Java?\nI. The == operator compares the references of two String objects.\nII. The equals() method compares the contents (characters) of two strings.", "options": ["Only I", "Only II", "Neither I nor II", "Both I and II"], "ans": 3, "exp": "Both statements are correct."}, {"id": 207, "num": 14, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "What is the output of the Java program where main prints \"A\", triggers 1/0 (catching ArithmeticException prints \"C\"), finally prints \"D\", and then prints f() which has `try { return 1; } finally { return 2; }`?", "options": ["AD2", "ACD1", "ABCD2", "ACD2"], "ans": 3, "exp": "Prints A, skips B, catches C, finally D, and `finally { return 2; }` overrides `return 1` → `ACD2`."}, {"id": 208, "num": 15, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "In Java, converting a value of one type explicitly to another, as in (char) 67, is called type ______.", "options": ["promotion", "boxing", "casting", "overloading"], "ans": 2, "exp": "Explicit conversion such as `(char) 67` is called type casting."}, {"id": 209, "num": 16, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which Java operator is used to compare two int values for equality?", "options": ["=", "==", "===", "equals"], "ans": 1, "exp": "`==` compares primitive values in Java."}, {"id": 210, "num": 17, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which method is the entry point of a stand-alone Java application?", "options": ["public static void main(String[] args)", "public void start()", "static int run()", "void init()"], "ans": 0, "exp": "The JVM begins execution at `public static void main(String[] args)`."}, {"id": 211, "num": 18, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding Java?\nI. The keyword this can be used inside a static method.\nII. A call to super() may be written after other statements in a constructor.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 3, "exp": "Both are false: `this` cannot be used in static methods, and `super()` must be the first statement in a constructor."}]}, {"id": 12, "category": "Java", "code": "Java Mock 02", "title": "Java — Mock 02", "subtitle": "Core Java, JVM, Strings, Exceptions, Threads & APIs", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 212, "num": 1, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "In Java, the wrapper class for the primitive type int is ______.", "options": ["Int", "Integer", "Number", "Long"], "ans": 1, "exp": "The `java.lang` wrapper class for `int` is `Integer`."}, {"id": 213, "num": 2, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "What is the output of the following Java code?\nStringBuilder sb = new StringBuilder(\"JAVA\");\nsb.append(sb.length()).insert(0, sb.charAt(1)).reverse();\nSystem.out.println(sb);", "options": ["4AVAJJ", "4AVAJA", "A4AVAJ", "4AVAJ"], "ans": 1, "exp": "append(4) → \"JAVA4\" → insert(0, 'A') → \"AJAVA4\" → reverse() → \"4AVAJA\"."}, {"id": 214, "num": 3, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "What is the output of the following Java code?\nint x = 2;\nswitch (x) {\n  case 1: x += 1;\n  case 2: x += 2;\n  case 3: x += 3; break;\n  default: x += 10;\n}\nSystem.out.println(x);", "options": ["7", "4", "17", "5"], "ans": 0, "exp": "Matches case 2 (x = 4) and falls through to case 3 (x = 7), then hits break → prints 7."}, {"id": 215, "num": 4, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "In Java, objects are created at run time with the ______ operator.", "options": ["create", "alloc", "malloc", "new"], "ans": 3, "exp": "The `new` operator allocates memory on the heap and invokes the class constructor."}, {"id": 216, "num": 5, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Java: class A { int x=10; int get(){return x;} } class B extends A { int x=20; int get(){return x;} }\n`A o = new B(); System.out.println(o.x + \" \" + o.get());`", "options": ["20 10", "20 20", "10 10", "10 20"], "ans": 3, "exp": "Fields are resolved by reference type A (o.x = 10); overridden methods dispatch on runtime object B (o.get() = 20) ⇒ 10 20."}, {"id": 217, "num": 6, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Java: overloaded `static void m(Object o)` and `static void m(String s)`. What does `m(null);` print?", "options": ["Compilation error: ambiguous call", "Object", "String", "NullPointerException"], "ans": 2, "exp": "Java selects the most specific applicable overload: String is a subclass of Object, so m(String) runs."}, {"id": 218, "num": 7, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Output of Java code:\nString s1=\"Java\", s2=\"Ja\"+\"va\", s3=\"Ja\", s4=s3+\"va\";\nSystem.out.println((s1==s2)+\" \"+(s1==s4)+\" \"+(s1==s4.intern()));", "options": ["true true true", "true false true", "false false true", "true false false"], "ans": 1, "exp": "s2 is compile-time pooled (true), s4 is runtime heap object (false), s4.intern() returns pooled s1 (true) → true false true."}, {"id": 219, "num": 8, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Output of Java program:\nstatic int g() { int x=10; try { x=20; return x; } finally { x=30; System.out.print(x+\" \"); } }\npublic static void main(String[] a) { System.out.println(g()); }", "options": ["20 30", "30 30", "30 20", "20 20"], "ans": 2, "exp": "return x saves 20; finally executes next and prints \"30 \" without altering the saved return value; main prints 20 → 30 20."}, {"id": 220, "num": 9, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Regarding Java threads:\nI. Calling run() directly executes in the current thread without creating a new thread.\nII. Calling start() twice on the same Thread object throws IllegalThreadStateException.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both statements are correct about Java's Thread lifecycle."}, {"id": 221, "num": 10, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "In Java, the ______ keyword ensures every read and write of a variable goes to main memory, making changes immediately visible to other threads.", "options": ["transient", "volatile", "synchronized", "static"], "ans": 1, "exp": "`volatile` enforces main-memory visibility across threads."}, {"id": 222, "num": 11, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "What is the output of the following Java statement?\nSystem.out.println(-7 / 2 + \" \" + -7 % 2 + \" \" + Math.round(-2.5) + \" \" + Math.round(2.5));", "options": ["-4 1 -3 3", "-3 -1 -2 3", "-3 -1 -3 3", "-4 -1 -2 2"], "ans": 1, "exp": "Java integer division truncates toward 0: -7/2 = -3, -7%2 = -1. Math.round(x) = floor(x+0.5): Math.round(-2.5) = -2, Math.round(2.5) = 3 → `-3 -1 -2 3`."}, {"id": 223, "num": 12, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "In Java, a static variable of a class is:", "options": ["created separately for every object", "shared by all objects of the class", "accessible only inside static methods", "deleted after each method call"], "ans": 1, "exp": "A static variable belongs to the class itself—only one copy exists and is shared across all instances."}, {"id": 224, "num": 13, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding the char data type in Java?\nI. char in Java is 8 bits wide, as in C.\nII. A char value cannot take part in arithmetic expressions.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 3, "exp": "Both are false: Java `char` is 16 bits (Unicode), and it can participate in arithmetic expressions (promoted to `int`)."}, {"id": 225, "num": 14, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "In Java exception handling, the ______ block is always executed, whether or not an exception occurs.", "options": ["try", "catch", "finally", "throws"], "ans": 2, "exp": "The `finally` block always executes after `try`/`catch` for cleanup operations such as closing files."}, {"id": 226, "num": 15, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "What is the size of the int data type in Java?", "options": ["32 bits", "16 bits", "64 bits", "8 bits"], "ans": 0, "exp": "In Java, `int` is always 32 bits (4 bytes) on every platform."}, {"id": 227, "num": 16, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding strings in Java:\nI. String objects in Java are mutable.\nII. StringBuilder is synchronised and thread-safe.", "options": ["Only I", "Only II", "Neither I nor II", "Both I and II"], "ans": 2, "exp": "String is immutable, and StringBuilder is unsynchronized (StringBuffer is synchronized) → Neither I nor II."}, {"id": 228, "num": 17, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding interfaces in Java:\nI. Variables declared in an interface are implicitly public, static, and final.\nII. An object of an interface can be created directly using new.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "Interface fields are implicitly `public static final` (I true), and interfaces cannot be instantiated directly (II false)."}, {"id": 229, "num": 18, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "In Java, a class inherits another class by using the keyword ______.", "options": ["implements", "inherits", "super", "extends"], "ans": 3, "exp": "In Java, `class B extends A` inherits class A; `implements` is used for interfaces."}]}, {"id": 13, "category": "Java", "code": "Java Mock 03", "title": "Java — Mock 03", "subtitle": "Core Java, JVM, Strings, Exceptions, Threads & APIs", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 230, "num": 1, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "In Java, which of the following is NOT a primitive data type?", "options": ["String", "int", "char", "boolean"], "ans": 0, "exp": "Java has 8 primitive types (byte, short, int, long, float, double, char, boolean). String is a reference class in java.lang."}, {"id": 231, "num": 2, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following statement(s) is/are correct regarding arrays in Java?\nI. The elements of an int array created with new hold garbage values until they are assigned.\nII. The size of an array is found using its length() method.", "options": ["Only I", "Only II", "Neither I nor II", "Both I and II"], "ans": 2, "exp": "Java initializes new int arrays to 0 (no garbage values), and array size is accessed via the `length` field (not `length()`). Thus neither statement is correct."}, {"id": 232, "num": 3, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which Java keyword, when used with a class, prevents that class from being inherited?", "options": ["static", "final", "abstract", "private"], "ans": 1, "exp": "A `final` class (e.g., `String`) cannot be subclassed/extended in Java."}, {"id": 233, "num": 4, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements regarding Java are correct?\nI. A Java class can extend more than one class at a time.\nII. Java source code is compiled into bytecode, which is executed by the JVM.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Java allows single class inheritance only (multiple inheritance via interfaces), and javac compiles source to JVM bytecode. Only II."}, {"id": 234, "num": 5, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "What is the output of the Java code?\ntry { int a = 5/0; System.out.print(\"T\"); }\ncatch (ArithmeticException e) { System.out.print(\"A\"); }\nfinally { System.out.print(\"F\"); }\nSystem.out.print(\"E\");", "options": ["TAFE", "AFE", "AF", "FAE"], "ans": 1, "exp": "5/0 throws ArithmeticException (skipping T) → catch prints A → finally prints F → execution continues and prints E ⇒ AFE."}, {"id": 235, "num": 6, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "What is the output of the Java statement?\n`System.out.println(\"Delhi\".substring(1, 3) + \"Delhi\".indexOf('h'));`", "options": ["el3", "elh3", "De2", "el4"], "ans": 0, "exp": "substring(1, 3) = \"el\"; indexOf('h') = 3 ⇒ \"el3\"."}, {"id": 236, "num": 7, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the Java statement?\n`System.out.println('A' + 1 + \"B\" + 'A' + 1);`", "options": ["A1BA1", "66BA1", "66B66", "B66A1"], "ans": 1, "exp": "Left-to-right: 'A' + 1 = 65 + 1 = 66; then 66 + \"B\" = \"66B\"; then + 'A' + 1 = \"66BA1\"."}, {"id": 237, "num": 8, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Class Counter has `static int c = 0; int d = 0; Counter() { c++; d++; }`. After creating 3 Counter objects x, y, z, what does `System.out.println(Counter.c + \" \" + z.d);` print?", "options": ["3 3", "3 1", "1 1", "1 3"], "ans": 1, "exp": "Static variable c is shared across all 3 instances (c = 3), whereas instance variable d is per-object (z.d = 1). Output: 3 1."}, {"id": 238, "num": 9, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the Java code?\nString s1 = \"Delhi\"; String s2 = \"Delhi\"; String s3 = new String(\"Delhi\");\nSystem.out.println((s1 == s2) + \" \" + (s1 == s3) + \" \" + s1.equals(s3));", "options": ["true true true", "true false true", "false false true", "true false false"], "ans": 1, "exp": "s1 and s2 share the same String Pool object (true); s3 is a distinct heap object (false); equals() compares contents (true). Output: true false true."}, {"id": 239, "num": 10, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the Java code?\nclass A { void show() { System.out.print(\"A\"); } }\nclass B extends A { void show() { System.out.print(\"B\"); super.show(); } }\n// main: A obj = new B(); obj.show();", "options": ["B", "AB", "A", "BA"], "ans": 3, "exp": "Dynamic method dispatch invokes B.show(), which prints 'B' and then calls super.show() printing 'A' ⇒ BA."}, {"id": 240, "num": 11, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Which statements about abstract classes and interfaces in Java (Java 8+) are correct?\nI. An interface can contain default methods with a body.\nII. An abstract class can have constructors.\nIII. A class can extend two abstract classes.", "options": ["I and II only", "II and III only", "I and III only", "I, II and III"], "ans": 0, "exp": "Java 8+ interfaces allow default/static methods and abstract classes can have constructors. Java supports single class inheritance only, so III is false."}, {"id": 241, "num": 12, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "What is the function of the javac command?", "options": ["Disassembles Java class files", "Runs the JVM", "Compiles Java source files into bytecode (.class files)", "Generates documentation from comments"], "ans": 2, "exp": "javac compiles .java source files into .class bytecode files."}, {"id": 242, "num": 13, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Correct regarding Java:\nI. An abstract class can have constructors.\nII. An abstract class can be instantiated using new.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "Abstract classes can define constructors (called by subclasses) but cannot be directly instantiated with 'new'."}, {"id": 243, "num": 14, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Output of Java code?\nString s = 9 + 9 + \"exam\" + 9 + 9;\nSystem.out.println(s);", "options": ["99exam18", "18exam99", "99exam99", "18exam18"], "ans": 1, "exp": "Left-to-right: 9+9=18 → 18+\"exam\"=\"18exam\" → \"18exam9\" → \"18exam99\"."}, {"id": 244, "num": 15, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) JVM converts bytecode to host machine code.\nii) Java is platform-dependent.\niii) JDK includes JRE and tools like javac.\niv) && returns true if at least one operand is true.", "options": ["i-True, ii-True, iii-True, iv-False", "i-True, ii-False, iii-True, iv-False", "i-False, ii-False, iii-True, iv-True", "i-True, ii-False, iii-False, iv-True"], "ans": 1, "exp": "Java is platform-independent (ii False) and && requires BOTH operands true (iv False) ⇒ i-True, ii-False, iii-True, iv-False."}, {"id": 245, "num": 16, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Which are procedural programming languages?\ni) C  ii) FORTRAN  iii) Pascal  iv) Smalltalk  v) Java", "options": ["i, ii, iii, iv and v", "Only i, ii and iii", "Only iv and v", "Only i and v"], "ans": 1, "exp": "C, FORTRAN and Pascal are procedural; Smalltalk and Java are object-oriented."}, {"id": 246, "num": 17, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Output of Java code?\nint a = 6, b = 3;\nSystem.out.println(\"a|b = \" + (a | b));", "options": ["a|b = 5", "a|b = 2", "a|b = 7", "a|b = 9"], "ans": 2, "exp": "6 (110₂) | 3 (011₂) = 111₂ = 7 ⇒ a|b = 7."}, {"id": 247, "num": 18, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Output of Java code?\nString s = \"PROGRAMMING\";\nSystem.out.println(s.lastIndexOf('G') - s.indexOf('G'));", "options": ["7", "3", "10", "0"], "ans": 0, "exp": "First 'G' is at index 3; last 'G' is at index 10. 10 − 3 = 7."}]}, {"id": 14, "category": "Java", "code": "Java Mock 04", "title": "Java — Mock 04", "subtitle": "Core Java, JVM, Strings, Exceptions, Threads & APIs", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 248, "num": 1, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which is/are correct about Java programming?\nI. Java programs are compiled into bytecode.\nII. Java supports multiple inheritance of classes.", "options": ["Only II", "Only I", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Java compiles to bytecode (.class) for the JVM, but does NOT support multiple inheritance of classes (only via interfaces)."}, {"id": 249, "num": 2, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the Java code?\nint m = 10, k = 50;\nwhile (m++ < k--);\nSystem.out.println(m);", "options": ["30", "29", "31", "50"], "ans": 2, "exp": "The empty loop runs until m == 30 and k == 30 (false), and the failing test still executes m++, leaving m = 31."}, {"id": 250, "num": 3, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the Java code?\nint a = 12, b = 7, c = 9;\nSystem.out.println(Math.max(a, Math.min(b, c)) - Math.min(a, Math.max(b, c)));", "options": ["5", "3", "0", "2"], "ans": 1, "exp": "Math.max(12, min(7,9)) = max(12,7) = 12; Math.min(12, max(7,9)) = min(12,9) = 9. Result: 12 − 9 = 3."}, {"id": 251, "num": 4, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "_____ loads the core Java classes (java.base module / rt.jar) and is the parent of all other class loaders.", "options": ["Bootstrap ClassLoader", "Extension (Platform) ClassLoader", "System (Application) ClassLoader", "Custom ClassLoader"], "ans": 0, "exp": "Hierarchy: Bootstrap → Extension/Platform → System/Application. Bootstrap loads core JDK library classes."}, {"id": 252, "num": 5, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Select the TRUE statement about try–catch blocks in Java:", "options": ["The finally block executes only when an exception occurs.", "A try block can have only one catch block.", "A try block must be followed by at least one catch block or a finally block.", "A catch block can be written before its try block."], "ans": 2, "exp": "In Java, a try block must be paired with at least one catch block, a finally block, or both."}, {"id": 253, "num": 6, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which is NOT a Java API for parsing XML?", "options": ["DOM", "SAX", "JDBC", "StAX"], "ans": 2, "exp": "JDBC connects Java to relational databases; DOM, SAX, and StAX parse XML."}, {"id": 254, "num": 7, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which statement is FALSE about interfaces in Java?", "options": ["A class can implement multiple interfaces.", "Abstract methods of an interface are public by default.", "Variables declared in an interface are public, static, and final.", "An interface can be instantiated directly using new."], "ans": 3, "exp": "Interfaces cannot be instantiated directly with 'new'; they are implemented by classes."}, {"id": 255, "num": 8, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "What is the output of the following Java snippet?", "options": ["J", "10J", "Throws Exception", "Compiler Error"], "ans": 1, "exp": "String and Integer are class names, not reserved keywords, so they compile as valid local variable names → Output: 10J."}, {"id": 256, "num": 9, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which statements are TRUE about JSP (Java Server Pages)?\n(i) JSP pages are translated into servlets by the web container.\n(ii) JSP allows Java code to be embedded in HTML pages.", "options": ["Only (i)", "Neither (i) nor (ii)", "Only (ii)", "Both (i) and (ii)"], "ans": 3, "exp": "Both are true: JSP embeds Java in HTML and the web container (e.g., Tomcat) translates JSP into a servlet on first request."}, {"id": 257, "num": 10, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Java was developed by _____ and first released in _____.", "options": ["Google; 1995", "Microsoft; 1995", "Sun Microsystems; 2002", "Sun Microsystems; 1995"], "ans": 3, "exp": "James Gosling's team at Sun Microsystems released Java in 1995 (Oracle acquired Sun in 2010)."}, {"id": 258, "num": 11, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "What is the output of the following Java program?", "options": ["10 10 10", "10 8 16", "Compilation error", "10 8 10"], "ans": 1, "exp": "10 (decimal) = 10; 010 (octal) = 8; 0x10 (hex) = 16. Output: 10 8 16."}, {"id": 259, "num": 12, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "What is the range of values of the byte data type in Java?", "options": ["−32,768 to 32,767", "0 to 255", "−127 to 128", "−128 to 127"], "ans": 3, "exp": "Java byte is 8-bit signed 2's complement: −2⁷ to 2⁷ − 1 = −128 to 127."}, {"id": 260, "num": 13, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What does 'Student s1 = new Student();' represent in Java?", "options": ["Declaring a new class named Student", "Creating an object s1 of the class Student", "Calling a method named Student", "Inheriting the class Student"], "ans": 1, "exp": "new allocates and instantiates a Student object referenced by s1."}, {"id": 261, "num": 14, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What does the 'this' keyword in Java refer to?", "options": ["The current object", "The parent class", "A static variable", "The current package"], "ans": 0, "exp": "'this' refers to the current invoking object instance."}, {"id": 262, "num": 15, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "check(120) throws new InvalidMarksException(\"Marks cannot exceed 100\") caught in main with \"Caught: \" + e.getMessage(). Output:", "options": ["Valid marks", "Compilation error", "Caught: Marks cannot exceed 100", "Valid marks Caught: Marks cannot exceed 100"], "ans": 2, "exp": "120 > 100 throws the custom exception before 'Valid marks'; catch prints 'Caught: Marks cannot exceed 100'."}, {"id": 263, "num": 16, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "What will be the output of the following Java code?", "options": ["p5", "Compilation error", "m5", "117"], "ans": 3, "exp": "charAt(3) = 'p' (ASCII 112), indexOf(\"ter\") = 5. char + int adds numerically: 112 + 5 = 117."}, {"id": 264, "num": 17, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Which statement about the keyword final in Java is correct?", "options": ["final makes a variable accessible from all classes", "A final variable, once assigned, cannot be given a new value", "A final method can be overridden in a subclass", "A final class can be extended by other classes"], "ans": 1, "exp": "final variable = constant (cannot reassign); final method = cannot override; final class = cannot extend."}, {"id": 265, "num": 18, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Java is called 'platform independent' mainly because:", "options": ["Java source code runs directly on the CPU", "The compiler produces bytecode, which runs on the Java Virtual Machine (JVM) available for each platform", "Java uses only interpreted machine code", "Java programs need no runtime environment"], "ans": 1, "exp": "javac compiles source to platform-neutral .class bytecode executed by each OS's JVM ('Write once, run anywhere')."}]}, {"id": 15, "category": "OOPS", "code": "OOPS Mock 01", "title": "OOPS — Mock 01", "subtitle": "Encapsulation, Inheritance, Polymorphism & Constructors", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 266, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding the copy constructor in C++?\nI. The copy constructor is called when a new object is created as a copy of an existing object.\nII. The copy constructor is called when an object is passed by value to a function.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both statements are correct: the copy constructor runs for copy initialisation (X b = a;) and when passing or returning objects by value."}, {"id": 267, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following statement(s) is/are correct?\nI. Function overriding requires the functions to have different parameter lists.\nII. Function overloading is an example of compile-time polymorphism.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Overriding requires the exact same parameter list (runtime polymorphism with virtual functions). Overloading uses different parameters and is resolved at compile time."}, {"id": 268, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding loops in C?\nI. continue skips the rest of the current iteration and goes on with the next iteration.\nII. break skips only the current iteration and continues the loop.", "options": ["Only II", "Both I and II", "Only I", "Neither I nor II"], "ans": 2, "exp": "I is true; II is false because `break` terminates the entire loop."}, {"id": 269, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "When class C inherits from class B and class B inherits from class A, the inheritance is called ______ inheritance.", "options": ["multiple", "hierarchical", "multilevel", "hybrid"], "ans": 2, "exp": "A → B → C forms multilevel inheritance."}, {"id": 270, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding constructors and destructors in C++ inheritance?\nI. When the object is destroyed, the base-class destructor is called before the derived-class destructor.\nII. When a derived-class object is created, the base-class constructor is called before the derived-class constructor.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Constructors run Base → Derived (II true); destructors run Derived → Base (I false)."}, {"id": 271, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding abstract classes in C++?\nI. A class that contains at least one pure virtual function is an abstract class.\nII. Objects of an abstract class can be created directly.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "I is true; II is false because abstract classes cannot be instantiated directly."}, {"id": 272, "num": 7, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Class T has: `static { print(\"S\"); }`, `{ print(\"I\"); }`, `T() { print(\"C\"); }`. Main runs `new T(); new T();`. What is printed?", "options": ["ICSIC", "SICSIC", "SICIC", "SCICI"], "ans": 2, "exp": "Static block runs once (S); each `new T()` runs instance block (I) then constructor (C) → `SICIC`."}, {"id": 273, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following is NOT true about the while loop in C?", "options": ["It is an entry-controlled loop", "Its body may not execute even once", "A semicolon written just after while (condition) makes the body of the loop empty", "It is always executed at least once"], "ans": 3, "exp": "`while` is entry-controlled and may execute zero times; `do-while` is the loop guaranteed to run at least once."}, {"id": 274, "num": 9, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Regarding C++:\nI. A constructor can be declared virtual.\nII. A base-class destructor should be declared virtual when derived objects are deleted through a base pointer.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Constructors cannot be virtual; base-class destructors should be virtual to ensure proper derived cleanup."}, {"id": 275, "num": 10, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding loop-control statements in C?\nI. break terminates the innermost loop or switch in which it appears.\nII. continue can be used inside a switch statement that is not inside any loop.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "I is correct. II is false because continue applies only to loops; using it in a standalone switch is a compile error."}, {"id": 276, "num": 11, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which C++ keyword is used to achieve run-time polymorphism through function overriding?", "options": ["virtual", "static", "inline", "friend"], "ans": 0, "exp": "Declaring a base-class member function `virtual` enables dynamic binding / run-time polymorphism."}, {"id": 277, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "In C++, members declared under which access specifier can be accessed only by the member functions (and friends) of the same class?", "options": ["public", "protected", "private", "global"], "ans": 2, "exp": "`private` members are accessible only within the same class and its friend functions/classes."}, {"id": 278, "num": 13, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "In C, the ______ loop is called an exit-controlled loop because its condition is tested after the body executes.", "options": ["for", "while", "do-while", "nested for"], "ans": 2, "exp": "`do-while` checks the condition at the end, guaranteeing at least one execution."}, {"id": 279, "num": 14, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which OOP feature allows the same method call, such as shape.draw(), to behave differently for objects of different classes?", "options": ["Abstraction", "Encapsulation", "Polymorphism", "Inheritance"], "ans": 2, "exp": "Polymorphism allows one interface/method call to exhibit multiple class-specific behaviors."}, {"id": 280, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "In a for loop, the ______ operator can be used to initialise or update two variables in the same expression, as in for (i = 0, j = 10; i < j; i++, j--).", "options": ["comma", "semicolon", "colon", "ternary"], "ans": 0, "exp": "The comma operator evaluates expressions left-to-right within one section of a for loop, while semicolons separate the three loop clauses."}]}, {"id": 16, "category": "OOPS", "code": "OOPS Mock 02", "title": "OOPS — Mock 02", "subtitle": "Encapsulation, Inheritance, Polymorphism & Constructors", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 281, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "In C, the ______ statement skips the remaining statements of the current iteration and transfers control to the next iteration of the loop.", "options": ["break", "continue", "goto", "return"], "ans": 1, "exp": "`continue` jumps to the next iteration of the enclosing loop (`break` exits the loop completely)."}, {"id": 282, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which loop in C always executes its body at least once, even if the condition is false at the start?", "options": ["for", "while", "do-while", "None of these"], "ans": 2, "exp": "A `do-while` loop is exit-controlled, checking the condition after running the loop body once."}, {"id": 283, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which statements about friend functions in C++ are correct?\nI. A friend function can access private and protected members of the class.\nII. A friend function is a member function called using an object.\nIII. Friendship is not inherited.", "options": ["I, II and III", "I and II only", "II and III only", "I and III only"], "ans": 3, "exp": "A friend function can access private/protected members and is not inherited, but it is NOT a member function (called directly without an object)."}, {"id": 284, "num": 4, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Class Test has overloaded methods `f(int x)` and `f(double x)`. What does `f('A');` print?", "options": ["char", "double", "int", "Compilation error"], "ans": 2, "exp": "Java chooses the closest widening primitive conversion: char widens to int before double ⇒ calls f(int) and prints 'int'."}, {"id": 285, "num": 5, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "A/An ________ is an instance of a class that occupies memory and has its own copy of data members.", "options": ["interface", "package", "method", "object"], "ans": 3, "exp": "An object is a concrete memory instance of a class."}, {"id": 286, "num": 6, "topic": "C, C++ & .NET", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) C# is an OOP language on .NET.\nii) C# compiles directly to native code without intermediate language.\niii) CTS lets different .NET langua on?", "options": ["tell()", "seek()", "read()", "flush()"], "ans": 1, "exp": "seek() repositions the file pointer; tell() returns its current offset."}, {"id": 312, "num": 3, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Output of the Python code?\nd = {'a': 1, 'b': 2}\nd['a'] += 10\nd['c'] = 3\nprint(len(d), d['a'])", "options": ["3 11", "2 11", "3 1", "3 10"], "ans": 0, "exp": "d becomes {'a': 11, 'b': 2, 'c': 3} ⇒ len(d) = 3 and d['a'] = 11 ⇒ 3 11."}, {"id": 313, "num": 4, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In pandas, ______ is used to read data from a CSV file into a DataFrame.", "options": ["pd.to_csv()", "pd.read_csv()", "pd.load()", "pd.open_csv()"], "ans": 1, "exp": "pd.read_csv('file.csv') reads a CSV into a DataFrame (df.to_csv() writes one)."}, {"id": 314, "num": 5, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In pandas, what does df.shape return for a DataFrame df?", "options": ["The first five rows", "A list of the column names", "The data type of each column", "A tuple (number of rows, number of columns)"], "ans": 3, "exp": "df.shape returns a tuple (rows, columns)."}, {"id": 315, "num": 6, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which is/are correct about 'import pandas as pd'?\nI. Imports pandas into the program.\nII. pd is an alias for pandas.\nIII. It installs pandas on the computer.", "options": ["Only I", "Only III", "I, II and III", "I and II only"], "ans": 3, "exp": "import loads an already-installed library with an alias; installation requires pip install."}, {"id": 316, "num": 7, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which DataFrame method returns the first n rows of the data (5 by default)?", "options": ["head()", "top()", "first()", "tail()"], "ans": 0, "exp": "df.head() returns the first 5 rows by default (df.tail() returns the last rows)."}, {"id": 317, "num": 8, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which of the following is a valid identifier in Python?", "options": ["2total", "total-marks", "total_marks", "class"], "ans": 2, "exp": "total_marks is valid (2total starts with a digit, total-marks has a hyphen, class is a reserved keyword)."}, {"id": 318, "num": 9, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which of the following is used to write a docstring (documentation string) in Python?", "options": ["\"\"\" … \"\"\"", "#", "//", "/* … */"], "ans": 0, "exp": "Python docstrings are enclosed in triple quotes (\"\"\" ... \"\"\")."}, {"id": 319, "num": 10, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which pandas function combines two DataFrames on a common column, like a database join?", "options": ["pd.sum()", "pd.merge()", "pd.groupby()", "pd.select()"], "ans": 1, "exp": "pd.merge() joins two DataFrames on common key columns."}, {"id": 320, "num": 11, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Files storing data as a sequence of bytes (like images and .dat files) are known as ______ in Python.", "options": ["binary files", "text files", "CSV files", "script files"], "ans": 0, "exp": "Binary files store raw bytes and are opened with modes like 'rb' and 'wb'."}, {"id": 321, "num": 12, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "What is the output of: print(-7 // 2, -7 % 2)", "options": ["-3 1", "-3 -1", "-4 -1", "-4 1"], "ans": 3, "exp": "Python floor division rounds toward −∞: -7 // 2 = -4, and -7 % 2 = -7 − 2(−4) = 1 ⇒ -4 1."}, {"id": 322, "num": 13, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Output of Python code?\n# print(\"Hello\")\nprint(\"World\")", "options": ["World", "Hello", "Hello World", "Error"], "ans": 0, "exp": "The first line is a comment (#) and ignored; only 'World' is printed."}, {"id": 323, "num": 14, "topic": "Python", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the Python code?\nfor i in range(10, 0, -3):\n    print(i, end=\" \")", "options": ["10 7 4 1 -2", "9 6 3", "10 7 4 1", "10 6 2"], "ans": 2, "exp": "range(10, 0, -3) starts at 10, steps by −3, and stops before 0 ⇒ 10 7 4 1."}]}]};

    const STORAGE_ANS = "prog_topic_dsssb_answers_v1";
    const STORAGE_SUB = "prog_topic_dsssb_submitted_v1";
    const STORAGE_THEME = "prog_topic_dsssb_theme_v1";

    function safeGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function safeSet(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    let answers = safeGet(STORAGE_ANS, {});
    let submittedMocks = safeGet(STORAGE_SUB, {});
    let activeCategory = "C";
    let activeMockId = DATA.mocks[0].id;
    let quizMode = "instant";
    let activeFilter = "all";

    const timerState = {};
    DATA.mocks.forEach((m) => {
      timerState[m.id] = { remaining: m.durationSec, running: false };
    });
    let tickInterval = null;

    function getActiveMock() {
      return DATA.mocks.find((m) => m.id === activeMockId);
    }

    function getCategoryMocks(catKey) {
      return DATA.mocks.filter((m) => m.category === catKey);
    }

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function isRevealed(mockId, qId) {
      if (quizMode === "instant") return answers[qId] !== undefined;
      return Boolean(submittedMocks[mockId]);
    }

    function computeMockStats(mock) {
      let attempted = 0, correct = 0, wrong = 0;
      const showTruth = quizMode === "instant" || Boolean(submittedMocks[mock.id]);
      mock.questions.forEach((q) => {
        if (answers[q.id] !== undefined) {
          attempted++;
          if (showTruth) {
            if (answers[q.id] === q.ans) correct++;
            else wrong++;
          }
        }
      });
      const marks = showTruth ? (correct * 1 - wrong * 0.25) : 0;
      const acc = showTruth && attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
      return { attempted, correct, wrong, marks, acc, showTruth, total: mock.questions.length };
    }

    function computeOverallStats() {
      let done = 0, correct = 0, wrong = 0, total = 0;
      DATA.mocks.forEach((m) => {
        const showTruth = quizMode === "instant" || Boolean(submittedMocks[m.id]);
        m.questions.forEach((q) => {
          total++;
          if (answers[q.id] !== undefined) {
            done++;
            if (showTruth) {
              if (answers[q.id] === q.ans) correct++;
              else wrong++;
            }
          }
        });
      });
      return { done, total, marks: (correct - wrong * 0.25).toFixed(2) };
    }

    function stopInterval() {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
    }

    function pauseAllTimers() {
      Object.keys(timerState).forEach((k) => { timerState[k].running = false; });
      stopInterval();
    }

    function startTimerForActive() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      if (st.remaining <= 0) st.remaining = mock.durationSec;
      pauseAllTimers();
      st.running = true;
      updateTimerUI();
      tickInterval = setInterval(() => {
        const cur = timerState[activeMockId];
        if (!cur.running) { stopInterval(); return; }
        cur.remaining = Math.max(0, cur.remaining - 1);
        updateTimerUI();
        if (cur.remaining === 0) {
          cur.running = false;
          stopInterval();
          showScorecardModal("⏱ Time's Up!");
        }
      }, 1000);
    }

    function toggleTimer() {
      const st = timerState[activeMockId];
      if (st.running) {
        st.running = false;
        stopInterval();
        updateTimerUI();
      } else {
        startTimerForActive();
      }
    }

    function resetTimer() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      st.running = false;
      st.remaining = mock.durationSec;
      stopInterval();
      updateTimerUI();
    }

    function updateTimerUI() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      const formatted = formatTime(st.remaining);
      document.getElementById("heroTimerText").textContent = formatted;
      document.getElementById("miniTimerText").textContent = formatted;
      document.getElementById("timerLabel").textContent = `${mock.timeLabel.toUpperCase()} TIMER`;
      document.getElementById("timerToggleBtn").textContent = st.running ? "Pause" : (st.remaining < mock.durationSec && st.remaining > 0 ? "Resume" : "Start");
      document.getElementById("timerStatusBadge").textContent = st.remaining === 0 ? "TIME UP" : (st.running ? "LIVE" : (st.remaining < mock.durationSec ? "PAUSED" : "READY"));

      const pct = Math.max(0, (st.remaining / mock.durationSec) * 100);
      const bar = document.getElementById("timerProgressBar");
      const miniPill = document.getElementById("miniTimerPill");
      bar.style.width = `${pct}%`;

      miniPill.classList.remove("timer-urgent", "bg-rose-100", "dark:bg-rose-950/60", "text-rose-700", "dark:text-rose-300", "border-rose-300", "bg-amber-100", "dark:bg-amber-950/60", "text-amber-700", "dark:text-amber-300", "border-amber-300");
      bar.classList.remove("bg-emerald-300", "bg-amber-300", "bg-rose-400");

      if (st.remaining <= 60) {
        bar.classList.add("bg-rose-400");
        miniPill.classList.add("bg-rose-100", "dark:bg-rose-950/60", "text-rose-700", "dark:text-rose-300", "border-rose-300");
        if (st.running) miniPill.classList.add("timer-urgent");
      } else if (st.remaining <= 150) {
        bar.classList.add("bg-amber-300");
        miniPill.classList.add("bg-amber-100", "dark:bg-amber-950/60", "text-amber-700", "dark:text-amber-300", "border-amber-300");
      } else {
        bar.classList.add("bg-emerald-300");
      }
    }

    function openModal(title, bodyHtml, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      buttons.forEach((b) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = b.label;
        btn.className = b.cls;
        btn.addEventListener("click", () => {
          closeModal();
          if (b.onClick) b.onClick();
        });
        actions.appendChild(btn);
      });
      document.getElementById("modalBackdrop").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.add("hidden");
    }

    function showScorecardModal(titlePrefix) {
      const mock = getActiveMock();
      submittedMocks[mock.id] = true;
      safeSet(STORAGE_SUB, submittedMocks);
      const st = computeMockStats(mock);
      renderAll();
      openModal(
        `${titlePrefix} — ${mock.code} Scorecard`,
        `
          <div class="grid grid-cols-2 gap-2.5 text-center">
            <div class="rounded-xl bg-indigo-50 dark:bg-indigo-500/15 p-3">
              <div class="text-xl font-black text-indigo-700 dark:text-indigo-300">${st.marks.toFixed(2)} / ${st.total}</div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">NET MARKS</div>
            </div>
            <div class="rounded-xl bg-emerald-50 dark:bg-emerald-500/15 p-3">
              <div class="text-xl font-black text-emerald-700 dark:text-emerald-300">${st.acc}%</div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">ACCURACY</div>
            </div>
            <div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-2.5 text-xs font-bold">Correct: <span class="text-emerald-600 dark:text-emerald-400">${st.correct}</span></div>
            <div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-2.5 text-xs font-bold">Wrong: <span class="text-rose-600 dark:text-rose-400">${st.wrong}</span> &bull; Left: ${st.total - st.attempted}</div>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400">All answers and explanations for ${escapeHtml(mock.code)} are now unlocked below.</p>
        `,
        [
          {
            label: "Review Wrong Only",
            cls: "px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer",
            onClick: () => { activeFilter = "wrong"; renderAll(); }
          },
          {
            label: "View All Solutions",
            cls: "px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold cursor-pointer"
          }
        ]
      );
    }

    function renderCategoryTabs() {
      const wrap = document.getElementById("categoryTabs");
      wrap.innerHTML = DATA.categories.map((c) => {
        const active = c.key === activeCategory;
        const catMocks = getCategoryMocks(c.key);
        const done = catMocks.reduce((acc, m) => acc + m.questions.filter((q) => answers[q.id] !== undefined).length, 0);
        const cls = active
          ? "bg-slate-900 dark:bg-indigo-600 text-white border-slate-900 dark:border-indigo-600 shadow-xs"
          : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-indigo-400";
        const badgeCls = active ? "bg-white/20 text-white" : "bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300";
        return `
          <button type="button" data-cat="${escapeHtml(c.key)}"
            class="cat-tab shrink-0 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border text-xs font-extrabold transition cursor-pointer ${cls}">
            <span>${escapeHtml(c.label)}</span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md tabular-nums ${badgeCls}">${c.mocks} Mocks &bull; ${done}/${c.count}</span>
          </button>
        `;
      }).join("");
    }

    function renderMockTabs() {
      const wrap = document.getElementById("mockTabs");
      const catMocks = getCategoryMocks(activeCategory);
      wrap.innerHTML = catMocks.map((m) => {
        const active = m.id === activeMockId;
        const done = m.questions.filter((q) => answers[q.id] !== undefined).length;
        const cls = active
          ? "bg-indigo-600 text-white border-indigo-600 shadow-xs"
          : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-indigo-700";
        const pillCls = active ? "bg-white/20 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400";
        return `
          <button type="button" data-mock-id="${m.id}"
            class="mock-tab shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-bold transition cursor-pointer ${cls}">
            <span>${escapeHtml(m.code)}</span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full tabular-nums ${pillCls}">${done}/${m.questions.length}</span>
          </button>
        `;
      }).join("");
    }

    function renderHeroAndStats() {
      const mock = getActiveMock();
      const st = computeMockStats(mock);
      const ov = computeOverallStats();

      document.getElementById("heroBadge").textContent = `${mock.category} Dedicated Mock`;
      document.getElementById("heroQCount").textContent = `${mock.questions.length} Questions · +1.00 / −0.25`;
      document.getElementById("heroTitle").textContent = mock.title;
      document.getElementById("heroSub").textContent = mock.subtitle;

      document.getElementById("statAttempted").textContent = `${st.attempted}/${st.total}`;
      document.getElementById("statMarks").textContent = st.showTruth ? st.marks.toFixed(2) : "—";
      document.getElementById("statAccuracy").textContent = st.showTruth ? `${st.acc}%` : "—";
      document.getElementById("overallScorePill").textContent = `${ov.done}/${ov.total} Done • ${ov.marks} Marks`;

      const instBtn = document.getElementById("modeInstantBtn");
      const examBtn = document.getElementById("modeExamBtn");
      const subBtn = document.getElementById("submitExamBtn");

      if (quizMode === "instant") {
        instBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white cursor-pointer";
        examBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer";
        subBtn.classList.add("hidden");
      } else {
        examBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white cursor-pointer";
        instBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer";
        if (!submittedMocks[mock.id]) subBtn.classList.remove("hidden");
        else subBtn.classList.add("hidden");
      }

      document.querySelectorAll("#filterGroup .flt-btn").forEach((btn) => {
        const active = btn.dataset.filter === activeFilter;
        btn.className = active
          ? "flt-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 cursor-pointer"
          : "flt-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer";
      });

      document.getElementById("prevMockBtn").disabled = activeMockId <= 1;
      document.getElementById("nextMockBtn").disabled = activeMockId >= DATA.mocks.length;
      updateTimerUI();
    }

    function renderPalette() {
      const mock = getActiveMock();
      const wrap = document.getElementById("questionPalette");
      document.getElementById("paletteTitle").textContent = `Question Palette (Jump to Q1–Q${mock.questions.length})`;
      const showTruth = quizMode === "instant" || Boolean(submittedMocks[mock.id]);
      wrap.innerHTML = mock.questions.map((q) => {
        const picked = answers[q.id];
        let cls = "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700";
        if (picked !== undefined) {
          if (!showTruth) cls = "bg-indigo-600 text-white border-indigo-600";
          else if (picked === q.ans) cls = "bg-emerald-600 text-white border-emerald-600";
          else cls = "bg-rose-600 text-white border-rose-600";
        }
        return `
          <button type="button" data-jump="qcard-${q.id}"
            class="pal-btn w-8 h-7 rounded-lg border text-[11px] font-bold tabular-nums hover:opacity-85 cursor-pointer ${cls}">
            ${q.num}
          </button>
        `;
      }).join("");
    }

    function renderQuestions() {
      const mock = getActiveMock();
      const list = document.getElementById("questionsList");
      const showTruthGlobal = quizMode === "instant" || Boolean(submittedMocks[mock.id]);

      const filtered = mock.questions.filter((q) => {
        const picked = answers[q.id];
        if (activeFilter === "unanswered") return picked === undefined;
        if (activeFilter === "wrong") {
          return showTruthGlobal && picked !== undefined && picked !== q.ans;
        }
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 text-center space-y-2">
            <p class="text-sm font-bold text-slate-700 dark:text-slate-200">No questions match the current filter.</p>
            <button type="button" id="clearFilterBtn" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Show All Questions</button>
          </div>
        `;
        const cf = document.getElementById("clearFilterBtn");
        if (cf) cf.addEventListener("click", () => { activeFilter = "all"; renderAll(); });
        return;
      }

      const letters = ["A", "B", "C", "D"];
      list.innerHTML = filtered.map((q) => {
        const picked = answers[q.id];
        const revealed = isRevealed(mock.id, q.id);

        const optsHtml = q.options.map((opt, idx) => {
          let btnCls = "border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40 hover:border-indigo-400 dark:hover:border-indigo-500 text-slate-800 dark:text-slate-100";
          let badgeCls = "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700";
          let mark = "";

          if (revealed) {
            if (idx === q.ans) {
              btnCls = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200";
              badgeCls = "bg-emerald-600 text-white border-emerald-600";
              mark = '<span class="ml-auto text-xs font-extrabold text-emerald-600 dark:text-emerald-400">✓ Correct</span>';
            } else if (picked === idx) {
              btnCls = "border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-900 dark:text-rose-200";
              badgeCls = "bg-rose-600 text-white border-rose-600";
              mark = '<span class="ml-auto text-xs font-extrabold text-rose-600 dark:text-rose-400">✗ Your Pick</span>';
            } else {
              btnCls = "border-slate-200/70 dark:border-slate-800/70 bg-white dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 opacity-75";
            }
          } else if (picked === idx) {
            btnCls = "border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-900 dark:text-indigo-200";
            badgeCls = "bg-indigo-600 text-white border-indigo-600";
            mark = '<span class="ml-auto text-xs font-bold text-indigo-600 dark:text-indigo-400">Selected</span>';
          }

          return `
            <button type="button" data-qid="${q.id}" data-opt="${idx}"
              class="opt-btn w-full text-left flex items-center gap-3 p-3 rounded-xl border text-xs sm:text-sm font-medium transition cursor-pointer ${btnCls}">
              <span class="w-6 h-6 rounded-lg border text-xs font-extrabold flex items-center justify-center shrink-0 ${badgeCls}">${letters[idx]}</span>
              <span class="flex-1 leading-snug font-mono sm:font-sans">${escapeHtml(opt)}</span>
              ${mark}
            </button>
          `;
        }).join("");

        const expHtml = revealed && q.exp ? `
          <div class="mt-3 rounded-xl bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-200/80 dark:border-indigo-800/60 p-3.5 text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
            <span class="font-extrabold text-indigo-700 dark:text-indigo-300">Explanation: </span>${escapeHtml(q.exp)}
          </div>
        ` : "";

        // Format code lines neatly if question contains multi-line code
        const lines = q.q.split("\n");
        let qBodyHtml = "";
        if (lines.length > 1) {
          qBodyHtml = `
            <p class="text-sm sm:text-base font-semibold text-slate-900 dark:text-white leading-relaxed mb-2.5">${escapeHtml(lines[0])}</p>
            <pre class="rounded-xl bg-slate-900 text-slate-100 p-3.5 text-xs sm:text-sm font-mono overflow-x-auto mb-3.5 leading-relaxed">${escapeHtml(lines.slice(1).join("\n"))}</pre>
          `;
        } else {
          qBodyHtml = `<p class="text-sm sm:text-base font-semibold text-slate-900 dark:text-white leading-relaxed mb-3.5">${escapeHtml(q.q)}</p>`;
        }

        return `
          <article id="qcard-${q.id}" class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5 shadow-xs scroll-mt-40">
            <div class="flex flex-wrap items-center gap-2 mb-2.5">
              <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-indigo-600 text-white">Q${q.num}</span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">${escapeHtml(mock.category)}</span>
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border text-sky-800 dark:text-sky-300 bg-sky-100 dark:bg-sky-900/40 border-sky-200 dark:border-sky-800">📘 ${escapeHtml(q.exam)}</span>
            </div>
            ${qBodyHtml}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${optsHtml}
            </div>
            ${expHtml}
          </article>
        `;
      }).join("");
    }

    function renderAll() {
      renderCategoryTabs();
      renderMockTabs();
      renderHeroAndStats();
      renderPalette();
      renderQuestions();
    }

    document.getElementById("categoryTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-tab");
      if (!btn) return;
      const nextCat = btn.dataset.cat;
      if (nextCat === activeCategory) return;
      pauseAllTimers();
      activeCategory = nextCat;
      const firstMock = getCategoryMocks(activeCategory)[0];
      if (firstMock) activeMockId = firstMock.id;
      activeFilter = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("mockTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".mock-tab");
      if (!btn) return;
      const nextId = Number(btn.dataset.mockId);
      if (nextId === activeMockId) return;
      pauseAllTimers();
      activeMockId = nextId;
      activeFilter = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("questionsList").addEventListener("click", (e) => {
      const btn = e.target.closest(".opt-btn");
      if (!btn) return;
      const qId = Number(btn.dataset.qid);
      const optIdx = Number(btn.dataset.opt);
      const mock = getActiveMock();

      const st = timerState[activeMockId];
      if (!st.running && st.remaining === mock.durationSec) {
        startTimerForActive();
      }

      if (quizMode === "instant") {
        if (answers[qId] !== undefined) return;
        answers[qId] = optIdx;
      } else {
        if (submittedMocks[mock.id]) return;
        answers[qId] = optIdx;
      }
      safeSet(STORAGE_ANS, answers);
      renderAll();
    });

    document.getElementById("questionPalette").addEventListener("click", (e) => {
      const btn = e.target.closest(".pal-btn");
      if (!btn) return;
      const target = document.getElementById(btn.dataset.jump);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      } else {
        activeFilter = "all";
        renderAll();
        setTimeout(() => {
          const el = document.getElementById(btn.dataset.jump);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 50);
      }
    });

    document.getElementById("filterGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".flt-btn");
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      renderAll();
    });

    document.getElementById("modeInstantBtn").addEventListener("click", () => { quizMode = "instant"; renderAll(); });
    document.getElementById("modeExamBtn").addEventListener("click", () => { quizMode = "exam"; renderAll(); });
    document.getElementById("submitExamBtn").addEventListener("click", () => { pauseAllTimers(); showScorecardModal("Mock Submitted"); });
    document.getElementById("timerToggleBtn").addEventListener("click", toggleTimer);
    document.getElementById("timerResetBtn").addEventListener("click", resetTimer);

    document.getElementById("resetMockBtn").addEventListener("click", () => {
      const mock = getActiveMock();
      openModal(
        `Reset ${mock.code}?`,
        `<p>This will clear all saved answers and reset the timer for <strong>${escapeHtml(mock.code)}</strong>.</p>`,
        [
          { label: "Cancel", cls: "px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer" },
          {
            label: "Reset Mock",
            cls: "px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold cursor-pointer",
            onClick: () => {
              mock.questions.forEach((q) => { delete answers[q.id]; });
              delete submittedMocks[mock.id];
              safeSet(STORAGE_ANS, answers);
              safeSet(STORAGE_SUB, submittedMocks);
              resetTimer();
              activeFilter = "all";
              renderAll();
            }
          }
        ]
      );
    });

    document.getElementById("prevMockBtn").addEventListener("click", () => {
      if (activeMockId > 1) {
        pauseAllTimers();
        activeMockId--;
        activeCategory = getActiveMock().category;
        activeFilter = "all";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("nextMockBtn").addEventListener("click", () => {
      if (activeMockId < DATA.mocks.length) {
        pauseAllTimers();
        activeMockId++;
        activeCategory = getActiveMock().category;
        activeFilter = "all";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("modalCloseX").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeModal(); });

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.classList.toggle("dark", isDark);
      document.getElementById("themeIcon").textContent = isDark ? "☀️" : "🌙";
    }
    applyTheme(safeGet(STORAGE_THEME, "light"));
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
      safeSet(STORAGE_THEME, next);
      applyTheme(next);
    });

    renderAll();
  </script>
</body>
</html>
