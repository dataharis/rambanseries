TER\";\nprintf(\"%c %s %d\", *(s + 3), s + 5, (int)strlen(s + 2));", "options": ["P TER 6", "M TER 6", "P UTER 6", "P TER 8"], "ans": 0, "exp": "*(s+3) = 'P'; s+5 = \"TER\"; strlen(\"MPUTER\") = 6 → `P TER 6`."}, {"id": 14, "num": 14, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "In C, the right-shift expression 8 >> 2 evaluates to ______.", "options": ["2", "4", "16", "32"], "ans": 0, "exp": "8 >> 2 = 8 ÷ 2² = 2."}, {"id": 15, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "How many elements can be stored in the C array declared as int a[3][4]?", "options": ["7", "12", "34", "16"], "ans": 1, "exp": "3 × 4 = 12 elements."}, {"id": 16, "num": 16, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following is NOT a valid character constant in C?", "options": ["'A'", "'\\n'", "'9'", "\"A\""], "ans": 3, "exp": "\"A\" in double quotes is a string literal, not a character constant."}, {"id": 17, "num": 17, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "The array `int a[5] = {1, 2, 3};` is declared in a C function. Which of the following is NOT true?", "options": ["The array has 5 elements", "a[0] holds the value 1", "a[3] and a[4] hold the value 0", "a[4] holds a garbage value"], "ans": 3, "exp": "Partially initialized arrays automatically initialize remaining elements to 0, so a[4] is 0, not garbage."}, {"id": 18, "num": 18, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "In which phase of a compiler is the error in `int x = \"hello\";` (assigning a string to an integer in C) detected?", "options": ["Lexical analysis", "Semantic analysis", "Syntax analysis", "Code optimisation"], "ans": 1, "exp": "Type checking occurs during Semantic analysis."}, {"id": 19, "num": 19, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "What is the output of the following C program?\nint i = 0, s = 0;\ndo {\n  if (i % 2) { i++; continue; }\n  s += i; i++;\n} while (i < 6);\nprintf(\"%d %d\", s, i);", "options": ["6 6", "9 6", "6 5", "15 6"], "ans": 0, "exp": "Even values added: 0 + 2 + 4 = 6; loop terminates when i reaches 6 → output `6 6`."}, {"id": 20, "num": 20, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding operators in C?\nI. The statement x += 5; is equivalent to x = x + 5;\nII. The assignment operator = has a higher precedence than the arithmetic operators.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "I is true. II is false because assignment `=` has much lower precedence than arithmetic operators."}, {"id": 21, "num": 21, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following is NOT a valid format specifier in the printf() function of C?", "options": ["%u", "%lf", "%x", "%k"], "ans": 3, "exp": "`%u`, `%lf`, and `%x` are valid printf specifiers; `%k` is not a valid C format specifier."}]}, {"id": 2, "category": "C", "code": "C Mock 02", "title": "C Language — Mock 02", "subtitle": "C Programming, Pointers, Arrays, Loops & Compilers", "durationSec": 720, "timeLabel": "12-Min", "questions": [{"id": 22, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "What is the output of the following C program?\nchar st[20] = \"TGT\";\nstrcat(st, \"CS\");\nprintf(\"%d %s\", strcmp(st, \"TGTCS\"), st + 2);", "options": ["0 GTCS", "1 TCS", "0 TCS", "-1 CS"], "ans": 2, "exp": "st becomes \"TGTCS\". strcmp returns 0 for equal strings, and st + 2 points to \"TCS\" → `0 TCS`."}, {"id": 23, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "What is the output of the following C statements?\nint z = 5;\nprintf(\"%d\", z > 3 ? z < 10 ? z * 2 : z : -z);", "options": ["-5", "5", "10", "Compilation error"], "ans": 2, "exp": "Right-associative grouping: `z > 3 ? (z < 10 ? z * 2 : z) : -z`. Since 5 > 3 and 5 < 10, result = 5 * 2 = 10."}, {"id": 24, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following is NOT true about enumerations (enum) in C?", "options": ["The first enumerator gets the value 0 if no value is given", "Each enumerator without a value is one more than the previous enumerator", "An enumerator can be given an explicit integer value", "Two enumerators in the same enum can never have the same value"], "ans": 3, "exp": "Two enumerators in the same enum CAN share the same integer value (e.g., `enum { X = 1, Y = 1 };`), so (d) is false."}, {"id": 25, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "In ASP.NET Web Forms, ______ preserves page control values across postbacks using a hidden field.", "options": ["Session state", "Application state", "ViewState", "Query string"], "ans": 2, "exp": "ViewState persists control states across postbacks via the `__VIEWSTATE` hidden field."}, {"id": 26, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Output of C:\nint a = 5, *p = &a, **q = &p;\n**q += *p * 2;\nprintf(\"%d %d\", a, *p);", "options": ["15 15", "15 5", "10 10", "25 25"], "ans": 0, "exp": "**q and *p both refer to a: a = 5 + (5 × 2) = 15 ⇒ 15 15."}, {"id": 27, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Output of C (4-byte int):\nint a[] = {10, 20, 30, 40}; int (*p)[4] = &a;\nprintf(\"%d %d %zu\", (*p)[2], *(*p + 1), sizeof(*p));", "options": ["20 30 16", "30 20 4", "30 20 16", "30 20 8"], "ans": 2, "exp": "(*p)[2] = 30; *(*p + 1) = 20; sizeof(*p) = 4×4 = 16 ⇒ 30 20 16."}, {"id": 28, "num": 7, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Output of C:\nprintf(\"%d\", printf(\"ABC\"));", "options": ["3", "3ABC", "ABC", "ABC3"], "ans": 3, "exp": "Inner printf prints 'ABC' and returns 3, which outer printf prints ⇒ ABC3."}, {"id": 29, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "What is the output?\nint a[] = {2, 4, 6, 8, 10}; int *p = a;\nprintf(\"%d \", *p++);\nprintf(\"%d \", (*p)++);\nprintf(\"%d \", *++p);\nprintf(\"%d\", a[1]);", "options": ["2 4 6 4", "2 4 6 5", "2 5 6 5", "4 5 8 5"], "ans": 1, "exp": "*p++ prints 2 (p→a[1]); (*p)++ prints 4 (a[1] becomes 5); *++p moves p→a[2] and prints 6; a[1] is 5 → 2 4 6 5."}, {"id": 30, "num": 9, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "What is the output?\nint x = 0x2C;\nprintf(\"%d %d %d\", x & -x, x & (x - 1), ~5);", "options": ["2 40 -6", "4 43 -5", "4 40 -6", "4 40 250"], "ans": 2, "exp": "x = 44 (0010 1100₂). x & −x = 4 (lowest set bit); x & (x−1) = 40 (clears lowest set bit); ~5 = −6."}, {"id": 31, "num": 10, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "What is the output?\nstruct P { int x, y; };\nstruct P arr[] = {{1,2},{3,4},{5,6}};\nstruct P *q = arr;\nint r1 = (++q)->x; int r2 = q++->y; int r3 = q->x;\nprintf(\"%d %d %d\", r1, r2, r3);", "options": ["1 4 5", "3 6 5", "3 4 5", "3 4 3"], "ans": 2, "exp": "(++q)->x moves q to arr[1] (r1=3); q++->y reads arr[1].y (r2=4) and moves q to arr[2]; q->x reads arr[2].x (r3=5) → 3 4 5."}, {"id": 32, "num": 11, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "What is the output (1-byte char)?\nchar s[][6] = {\"red\", \"green\", \"blue\"};\nprintf(\"%c %s %zu\", s[1][2], s[2] + 1, sizeof(s));", "options": ["e blue 15", "r lue 18", "e lue 18", "e lue 12"], "ans": 2, "exp": "s[1][2] = 'e'; s[2]+1 = \"lue\"; sizeof(s) = 3 × 6 = 18 bytes → e lue 18."}, {"id": 33, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Regarding arrays in C:\nI. a[i] is equivalent to *(a + i).\nII. i[a] is also valid and refers to the same element as a[i].", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both are valid because a[i] = *(a + i) = *(i + a) = i[a]."}, {"id": 34, "num": 13, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Regarding static in C:\nI. A static function in one source file can be called from any other source file.\nII. A static global variable is visible only within the source file where it is defined.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Both static functions and static globals have internal linkage (file scope only), so only Statement II is correct."}, {"id": 35, "num": 14, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Which of the following is NOT a bitwise operator in C?", "options": ["&", "^", "~", "&&"], "ans": 3, "exp": "&& is the logical AND operator, whereas &, ^, ~, |, <<, >> are bitwise operators."}, {"id": 36, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "In C#/.NET, converting a value-type variable (such as int) into an object (reference type) stored on the managed heap is called ______.", "options": ["casting", "boxing", "unboxing", "marshalling"], "ans": 1, "exp": "Boxing wraps a value type into a reference-type object on the managed heap; unboxing extracts it back."}, {"id": 37, "num": 16, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "What is the output of the following C program?\nint x = 3, y = 5;\nint z = x++ * 2 + --y;\nprintf(\"%d %d %d\", x, y, z);", "options": ["4 4 12", "4 4 10", "3 4 10", "4 5 11"], "ans": 1, "exp": "x++ uses old value 3 (then x becomes 4); --y decrements y to 4 first. z = 3 × 2 + 4 = 10. Output: 4 4 10."}, {"id": 38, "num": 17, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "A static or global variable in C that is not explicitly initialised gets the default value ______.", "options": ["garbage", "0", "1", "−1"], "ans": 1, "exp": "Static and global variables reside in the data/BSS segment and are automatically initialized to 0."}, {"id": 39, "num": 18, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "What is the value of the C expression 5 & 3?", "options": ["7", "1", "6", "8"], "ans": 1, "exp": "Bitwise AND: 5 (101) & 3 (011) = 001 = 1."}, {"id": 40, "num": 19, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "What is the output of the following C code?\nchar s[] = \"EXAMINATION\";\nprintf(\"%d %d\", (int)sizeof(s), (int)strlen(s + 3));", "options": ["12 9", "11 8", "12 8", "11 9"], "ans": 2, "exp": "'EXAMINATION' has 11 chars + '\\0' → sizeof(s) = 12. s + 3 points to 'MINATION' → strlen = 8."}, {"id": 41, "num": 20, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which is the correct way to define a symbolic constant PI with the C preprocessor?", "options": ["#const PI 3.14", "define PI = 3.14;", "#define PI 3.14", "#define PI = 3.14;"], "ans": 2, "exp": "Preprocessor macro syntax is `#define NAME value` with no '=' and no trailing semicolon."}, {"id": 42, "num": 21, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following is NOT a valid array declaration in C?", "options": ["int a[5];", "int a[] = {1, 2, 3};", "int a[2][3] = {{1, 2, 3}, {4, 5, 6}};", "int a[];"], "ans": 3, "exp": "Array size can be omitted only when an initializer list is provided. `int a[];` has neither size nor initializer, so it is invalid."}]}, {"id": 3, "category": "C", "code": "C Mock 03", "title": "C Language — Mock 03", "subtitle": "C Programming, Pointers, Arrays, Loops & Compilers", "durationSec": 720, "timeLabel": "12-Min", "questions": [{"id": 43, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding the switch statement in C?\nI. Two case labels in the same switch can have the same value.\nII. The default case is optional in a switch statement.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Duplicate case values are a compilation error (I is false). The `default` label is optional (II is true)."}, {"id": 44, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following is NOT a valid identifier in C?", "options": ["_total1", "total_1", "Total1", "1total"], "ans": 3, "exp": "C identifiers cannot begin with a digit, so `1total` is invalid."}, {"id": 45, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding integer constants in C:\nI. Leading 0 denotes octal.\nII. Leading 0x or 0X denotes hexadecimal.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both statements are correct: 017 = 15 (octal), 0x11 = 17 (hex)."}, {"id": 46, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Output of C code:\nchar *p = \"DSSSB\";\nprintf(\"%c%c\", *p, *(p + strlen(p) - 1));", "options": ["DS", "DB", "BD", "D"], "ans": 1, "exp": "*p = 'D' and *(p + 4) = 'B' ⇒ DB."}, {"id": 47, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding storage classes in C:\nI. A register variable is always stored in a CPU register.\nII. A static local variable keeps its value between function calls.", "options": ["Only II", "Both I and II", "Only I", "Neither I nor II"], "ans": 0, "exp": "`register` is merely a compiler hint; `static` local variables persist across calls (Only II)."}, {"id": 48, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Output of C:\nint s = 0, i;\nfor (i = 1; i <= 10; i++) { if (i % 3 == 0) continue; s += i; }\nprintf(\"%d\", s);", "options": ["18", "55", "37", "45"], "ans": 2, "exp": "Sum(1..10) = 55 minus multiples of 3 (3+6+9 = 18) = 37."}, {"id": 49, "num": 7, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding switch in C:\nI. Without break, control falls through to the next case.\nII. Case labels can be floating-point constants.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "Fall-through occurs without break (I true); case labels must be integer constants, never float (II false)."}, {"id": 50, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which of the following is NOT true about arrays in C?", "options": ["Array elements are stored in contiguous memory locations", "The index of the first element is 0", "The name of an array gives the address of its first element", "C checks automatically that an array index is within the bounds"], "ans": 3, "exp": "C does NOT perform automatic array bounds checking."}, {"id": 51, "num": 9, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Output of C:\nint x = 0;\nif (x = 5) printf(\"Yes %d\", x);\nelse printf(\"No\");", "options": ["No", "Yes 5", "Yes 0", "Compilation error"], "ans": 1, "exp": "`x = 5` assigns 5 (truthy) and prints `Yes 5`."}, {"id": 52, "num": 10, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Output of C:\nint x = 10;\nvoid f() { int x = 20; printf(\"%d \", x); }\nint main() { f(); printf(\"%d\", x); }", "options": ["10 10", "20 20", "20 10", "10 20"], "ans": 2, "exp": "f() prints its local x (20); main() prints global x (10) ⇒ 20 10."}, {"id": 53, "num": 11, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding the % operator in C:\nI. The result of a % b has the same sign as b.\nII. The % operator can be used only with integer operands.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Remainder takes the sign of `a` (I false), and `%` applies only to integers (II true)."}, {"id": 54, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which of the following is NOT a valid way to store the string \"Delhi\" in C?", "options": ["char s[] = \"Delhi\";", "char s[6] = \"Delhi\";", "char *s = \"Delhi\";", "char s[6]; s = \"Delhi\";"], "ans": 3, "exp": "Array names are non-modifiable lvalues; after declaration, use `strcpy(s, \"Delhi\")`."}, {"id": 55, "num": 13, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Output of C:\nint m = 75;\nprintf(\"%c\", m >= 90 ? 'A' : m >= 75 ? 'B' : 'C');", "options": ["C", "A", "B", "66"], "ans": 2, "exp": "75 >= 90 is false, 75 >= 75 is true ⇒ 'B'."}, {"id": 56, "num": 14, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "What does `fwrite(&rec, sizeof(rec), 1, fp);` do?", "options": ["Reads one record from fp into rec", "Writes one record of size sizeof(rec) from rec to the file fp", "Writes the address of rec to the file", "Writes sizeof(rec) records to the file"], "ans": 1, "exp": "fwrite(ptr, size, count, fp) writes `count` (1) item of `size` bytes from `ptr` to `fp`."}, {"id": 57, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding C preprocessor:\nI. #ifdef checks whether a macro has been defined.\nII. #include <file.h> searches the current directory first before system directories.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "`<file.h>` searches system directories; `\"file.h\"` searches the current directory first (Only I)."}, {"id": 58, "num": 16, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "The ______ function in C allocates memory for an array of elements and initialises all allocated bytes to zero.", "options": ["malloc()", "calloc()", "realloc()", "free()"], "ans": 1, "exp": "`calloc(n, size)` allocates and zero-initializes memory; `malloc()` leaves garbage values."}, {"id": 59, "num": 17, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which header file must be included in C to use strlen(), strcpy(), and strcmp()?", "options": ["stdio.h", "stdlib.h", "math.h", "string.h"], "ans": 3, "exp": "C string functions are declared in `<string.h>`."}, {"id": 60, "num": 18, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What will be the output of the following C code?\nchar str[] = \"Hello\";\nchar *p = str;\nwhile (*p) p++;\nprintf(\"%d\", (int)(p - str));", "options": ["5", "6", "4", "0"], "ans": 0, "exp": "p advances until it points to the null terminator '\\0' at index 5, so pointer difference p − str = 5."}, {"id": 61, "num": 19, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following statement(s) is/are correct regarding functions in C?\nI. By default, arguments are passed to a function by value.\nII. A function declared with return type void cannot return a value.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "C passes arguments by value by default, and a void function cannot return a value (only bare `return;` is allowed)."}, {"id": 62, "num": 20, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What will be the output of the following C code?\nint i, j;\nfor (i = 1; i <= 3; i++) {\n  for (j = 1; j <= 3; j++) {\n    if (j == 2) break;\n    printf(\"%d%d \", i, j);\n  }\n}", "options": ["11", "11 12 13", "11 21 31", "11 21 31 13"], "ans": 2, "exp": "break exits only the inner loop at j = 2. So j = 1 prints for each i = 1, 2, 3 → 11 21 31."}, {"id": 63, "num": 21, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "In the ASCII code, the uppercase letter 'A' has the decimal value 65 and the lowercase letter 'a' has the decimal value ______.", "options": ["91", "96", "97", "98"], "ans": 2, "exp": "ASCII values: 'A' = 65, 'Z' = 90, 'a' = 97, 'z' = 122 (lowercase − uppercase = 32)."}]}, {"id": 4, "category": "C", "code": "C Mock 04", "title": "C Language — Mock 04", "subtitle": "C Programming, Pointers, Arrays, Loops & Compilers", "durationSec": 720, "timeLabel": "12-Min", "questions": [{"id": 64, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following is NOT true about the strcmp() function in C?", "options": ["It returns 0 when the two strings are equal", "It compares the strings character by character", "It returns a negative value when the first string is smaller", "It returns 1 only when the two strings have the same length"], "ans": 3, "exp": "strcmp() compares character codes lexicographically (0 if equal, <0 if s1 < s2, >0 if s1 > s2); it does not depend on matching lengths to return 1."}, {"id": 65, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What will be the output of the following C code?\nint x = 5, y = 10;\nif (x > 3 || y++ > 5)\n  x = y;\nprintf(\"%d %d\", x, y);", "options": ["5 10", "11 11", "10 11", "10 10"], "ans": 3, "exp": "Because x > 3 is true, || short-circuits and skips y++ > 5, leaving y = 10. Then x = y sets x = 10 → 10 10."}, {"id": 66, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following statement(s) is/are correct regarding pointers in C?\nI. A pointer variable can store the address of any memory location without any data type.\nII. The * operator, when applied to a pointer, gives the value stored at the address the pointer holds.", "options": ["Only II", "Only I", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "Ordinary pointers in C require a data type (only void* is generic and needs casting before dereferencing). Statement II correctly defines dereferencing (*)."}, {"id": 67, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "In C, when both operands of the / operator are integers, the result is ______.", "options": ["rounded to the nearest integer", "a float value", "truncated towards zero", "always zero"], "ans": 2, "exp": "Integer division discards the fractional part (truncates towards zero), e.g., 7 / 2 = 3 and −7 / 2 = −3."}, {"id": 68, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "An array int a[5][6] is stored in row-major order starting at address 1000, and each int occupies 4 bytes. What is the address of a[3][4]?", "options": ["1088", "1076", "1092", "1100"], "ans": 0, "exp": "Row-major address = Base + (i × columns + j) × size = 1000 + (3 × 6 + 4) × 4 = 1000 + 88 = 1088."}, {"id": 69, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What does the function ftell(fp) return?", "options": ["The total size of the file", "The current position of the file pointer, in bytes from the beginning of the file", "The number of lines read so far", "The name of the file"], "ans": 1, "exp": "ftell(fp) returns the current file pointer offset in bytes from the start of the file."}, {"id": 70, "num": 7, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Defining two or more functions in the same scope with the same name but different parameter lists is called function ______.", "options": ["overriding", "overloading", "hiding", "binding"], "ans": 1, "exp": "Function overloading uses the same name with different parameter lists (compile-time polymorphism)."}, {"id": 71, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements regarding the `sizeof` operator in C are correct?\nI. sizeof is a compile-time operator for ordinary data types.\nII. sizeof(char) is always 1.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "For standard non-VLA types, sizeof is evaluated at compile time, and the C standard guarantees sizeof(char) == 1."}, {"id": 72, "num": 9, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "What is the output of the C code?\nint arr[5] = {1, 2, 3, 4, 5};\nint *p = arr + 4;\nprintf(\"%d %d\", *p - *arr, (int)(p - arr));", "options": ["1 4", "4 16", "5 4", "4 4"], "ans": 3, "exp": "*p = arr[4] = 5, *arr = arr[0] = 1 ⇒ 5 − 1 = 4. Pointer subtraction (p − arr) yields element difference = 4. Output: 4 4."}, {"id": 73, "num": 10, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements regarding recursion in C are correct?\nI. A recursive function always executes faster than its iterative version.\nII. A recursive function must have a terminating (base) condition.", "options": ["Both I and II", "Only I", "Only II", "Neither I nor II"], "ans": 2, "exp": "Recursion has stack-frame overhead (often slower than iteration), and it requires a base condition to prevent stack overflow. Hence Only II."}, {"id": 74, "num": 11, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "What is the output of the C code?\nint x = 3;\nswitch (x) {\n  default: printf(\"D \");\n  case 1: printf(\"1 \"); break;\n  case 3: printf(\"3 \");\n}", "options": ["D 1", "3", "D 3", "3 D 1"], "ans": 1, "exp": "The position of `default:` does not matter; it runs only if no case matches. Here `case 3` matches and prints `3`."}, {"id": 75, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which of the following is NOT a standard library function declared in `string.h`?", "options": ["strlen()", "strcmp()", "strcat()", "strsize()"], "ans": 3, "exp": "There is no `strsize()` function in standard C's `string.h` (strlen, strcmp, strcat, strcpy are standard)."}, {"id": 76, "num": 13, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements regarding logical operators in C are correct?\nI. In A && B, operand B is not evaluated if A is false.\nII. In A || B, operand B is not evaluated if A is true.", "options": ["Only I", "Only II", "Neither I nor II", "Both I and II"], "ans": 3, "exp": "C guarantees left-to-right short-circuit evaluation for both `&&` and `||`. Both I and II are correct."}, {"id": 77, "num": 14, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements regarding `float` in C are correct?\nI. A float variable normally occupies 4 bytes.\nII. A float variable can store every decimal fraction, such as 0.1, exactly.", "options": ["Only II", "Only I", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "IEEE 754 single-precision `float` is 4 bytes, but binary floating-point cannot represent 0.1 exactly (recurring binary fraction). Only I."}, {"id": 78, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "An `int` occupies 4 bytes, and `int *p` holds address 1000. What address does `p` hold after `p = p + 3;`?", "options": ["1012", "1003", "1006", "1024"], "ans": 0, "exp": "Pointer arithmetic scales by sizeof(int): 1000 + 3 × 4 = 1012."}, {"id": 79, "num": 16, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "What is the output of the C program?\nunsigned char c = 255; c = c + 1; printf(\"%d\", c);", "options": ["256", "0", "−1", "255"], "ans": 1, "exp": "8-bit unsigned char wraps modulo 256: 256 mod 256 = 0."}, {"id": 80, "num": 17, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "In C, the elements of a two-dimensional array are stored in memory in ______ order.", "options": ["column-major", "row-major", "diagonal", "random"], "ans": 1, "exp": "C stores 2D arrays in row-major order (all elements of row 0, then row 1, etc.)."}, {"id": 81, "num": 18, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which of the following is NOT true about structures in C?", "options": ["Members of a structure can be of different data types", "Structure members are accessed using the dot (.) operator", "A structure variable can be assigned to another variable of the same structure type", "All members of a structure share the same memory location"], "ans": 3, "exp": "Structure members occupy separate memory locations; sharing the same memory location is a property of a `union`."}, {"id": 82, "num": 19, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which correctly copies file `src` to `dst` one character at a time? (`ch` is `int`.)", "options": ["while ((ch = fgetc(src)) != NULL) fputc(ch, dst);", "while (fgetc(src) != EOF) fputc(fgetc(src), dst);", "while ((ch = fgetc(src)) != EOF) fputc(ch, dst);", "while (!feof(dst)) fputc(fgetc(src), dst);"], "ans": 2, "exp": "`while ((ch = fgetc(src)) != EOF) fputc(ch, dst);` reads once per iteration, checks EOF properly, and writes the character."}, {"id": 83, "num": 20, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements about dynamic memory allocation in C are correct?\nI. malloc() does not initialise allocated memory, whereas calloc() sets it to zero.\nII. realloc() can change the size of a previously allocated block.", "options": ["Both I and II", "Only I", "Only II", "Neither I nor II"], "ans": 0, "exp": "calloc() zero-initialises while malloc() leaves indeterminate values, and realloc() resizes existing heap blocks. Both are correct."}, {"id": 84, "num": 21, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Code whose execution is managed by the .NET Common Language Runtime (CLR) is called ______.", "options": ["Managed code", "Unmanaged code", "Native code", "Machine code"], "ans": 0, "exp": "Code targeting the .NET CLR (with GC, type safety, exception handling) is called Managed code."}]}, {"id": 5, "category": "C", "code": "C Mock 05", "title": "C Language — Mock 05", "subtitle": "C Programming, Pointers, Arrays, Loops & Compilers", "durationSec": 720, "timeLabel": "12-Min", "questions": [{"id": 85, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C program?\nint a = 3;\nprintf(\"%d %d\", a << 1 + 1, (a << 1) + 1);", "options": ["12 12", "7 7", "12 7", "7 12"], "ans": 2, "exp": "+ has higher precedence than <<: a << (1+1) = 3 << 2 = 12; (a << 1) + 1 = 6 + 1 = 7. Output: 12 7."}, {"id": 86, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nint x = 5, *p = &x, **q = &p;\n**q += 10;\nprintf(\"%d %d\", x, *p);", "options": ["15 15", "5 15", "15 5", "5 5"], "ans": 0, "exp": "**q aliases x directly, so **q += 10 updates x to 15. Both x and *p print 15 ⇒ 15 15."}, {"id": 87, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C program?\nint fun(int n) { if (n == 0) return 0; return n % 10 + fun(n / 10); }\nint main() { printf(\"%d\", fun(4096)); return 0; }", "options": ["15", "4096", "6904", "19"], "ans": 3, "exp": "fun() recursively computes the sum of digits: 6 + 9 + 0 + 4 = 19."}, {"id": 88, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nint i = 0, s = 0;\nwhile (i++ < 5) s += i;\nprintf(\"%d %d\", s, i);", "options": ["15 6", "10 5", "15 5", "10 6"], "ans": 0, "exp": "Post-increment compares old i then increments before body: body adds 1+2+3+4+5 = 15. Final failing test 5 < 5 still increments i to 6. Output: 15 6."}, {"id": 89, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nchar c = 'A' + 2;\nprintf(\"%c %d\", c, c + 1);", "options": ["B 67", "C 67", "C 68", "67 C"], "ans": 2, "exp": "'A' = 65 ⇒ c = 67 ('C'); c + 1 = 68. Output: C 68."}, {"id": 90, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nchar *s = \"PROGRAM\";\nprintf(\"%s\", s + 3);\nprintf(\" %c\", *(s + 5));", "options": ["GRAM A", "GRAM M", "OGRAM A", "GRAM R"], "ans": 0, "exp": "s + 3 points to 'G' ⇒ %s prints GRAM. *(s + 5) is index 5 = 'A'. Output: GRAM A."}, {"id": 91, "num": 7, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nint a = 2, b = 3, c;\nc = (a > b) ? a : b, a + b;\nprintf(\"%d\", c);", "options": ["5", "3", "2", "Compilation error"], "ans": 1, "exp": "Comma has lower precedence than =, so it parses as (c = (a > b ? a : b)), a + b; ⇒ c gets 3."}, {"id": 92, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nint i = 0;\ndo { i++; if (i == 3) continue; printf(\"%d \", i); } while (i < 5);", "options": ["1 2", "1 2 4 5", "1 2 3 4 5", "1 2 4"], "ans": 1, "exp": "When i == 3, continue skips printf and jumps to while(i < 5). Prints 1 2 4 5."}, {"id": 93, "num": 9, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C program?\nvoid swap(int a, int b) { int t = a; a = b; b = t; }\nint main() { int x = 1, y = 2; swap(x, y); printf(\"%d %d\", x, y); }", "options": ["2 2", "2 1", "1 2", "1 1"], "ans": 2, "exp": "C uses pass-by-value; swapping local copies a and b does not modify x and y in main() ⇒ 1 2."}, {"id": 94, "num": 10, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nunsigned int u = -1;\nprintf(\"%d\", u > 10);", "options": ["−1", "0", "1", "Compilation error"], "ans": 2, "exp": "Assigning −1 to unsigned int wraps to the maximum unsigned integer (all 1s), which is > 10 ⇒ prints 1."}, {"id": 95, "num": 11, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nenum color { RED, GREEN = 5, BLUE };\nprintf(\"%d %d\", RED, BLUE);", "options": ["1 6", "0 6", "0 2", "0 5"], "ans": 1, "exp": "RED defaults to 0; GREEN = 5; BLUE = GREEN + 1 = 6. Output: 0 6."}, {"id": 96, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the C code?\nchar names[3][10];\nprintf(\"%d %d\", (int)sizeof(names), (int)sizeof(names[0]));", "options": ["3 10", "30 10", "10 30", "30 3"], "ans": 1, "exp": "sizeof(names) = 3 × 10 = 30 bytes; sizeof(names[0]) = 10 bytes. Output: 30 10."}, {"id": 97, "num": 13, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which fopen() mode opens a file for both reading and writing, creating it if absent and erasing its contents if it exists?", "options": ["\"a+\"", "\"r+\"", "\"w+\"", "\"rw\""], "ans": 2, "exp": "\"w+\" opens for read & write, creates a new file if absent, and truncates (erases) existing contents."}, {"id": 98, "num": 14, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which statements are correct?\nI. An extern declaration of a variable does not allocate memory for it.\nII. The address of a register variable can be obtained using the & operator.", "options": ["Neither I nor II", "Only II", "Both I and II", "Only I"], "ans": 3, "exp": "extern only declares an external variable without allocating storage. Taking & of a register variable is illegal in C. Hence Only I."}, {"id": 99, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C program?\nint x = 10, y = 3;\nprintf(\"%d %d %d\", x / y, x % y, x / (float)y > 3);", "options": ["3 1 1", "3 1 0", "3.33 1 1", "3 1 3"], "ans": 0, "exp": "x/y = 3 (int division), x%y = 1, x/(float)y = 3.33… > 3 evaluates to true (1). Output: 3 1 1."}, {"id": 100, "num": 16, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C program?\nint a[] = {10, 20, 30, 40};\nint *p = a;\nprintf(\"%d \", *p++);\nprintf(\"%d \", *++p);\nprintf(\"%d\", ++*p);", "options": ["20 30 31", "10 20 21", "10 30 31", "10 30 30"], "ans": 2, "exp": "*p++ prints 10 and moves p to a[1]; *++p moves p to a[2] and prints 30; ++*p increments a[2] to 31 and prints 31. Output: 10 30 31."}, {"id": 101, "num": 17, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C program?\nvoid f() { static int c = 0; c += 2; printf(\"%d \", c); }\nint main() { f(); f(); f(); return 0; }", "options": ["6 6 6", "2 2 2", "0 2 4", "2 4 6"], "ans": 3, "exp": "static int c retains its value across function calls: 2, then 4, then 6. Output: 2 4 6."}, {"id": 102, "num": 18, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C program?\nint f(int n) { if (n <= 1) return 1; return n + f(n - 2); }\nint main() { printf(\"%d\", f(7)); return 0; }", "options": ["15", "28", "16", "13"], "ans": 2, "exp": "f(7) = 7 + 5 + 3 + f(1) = 7 + 5 + 3 + 1 = 16."}, {"id": 103, "num": 19, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C code?\nchar g = 'B';\nswitch (g) {\n  case 'A': printf(\"Excellent \");\n  case 'B': printf(\"Good \");\n  case 'C': printf(\"Fair \"); break;\n  default: printf(\"Fail\");\n}", "options": ["Good", "Good Fair", "Good Fair Fail", "Excellent Good Fair"], "ans": 1, "exp": "Control enters case 'B' (prints 'Good '), falls through without break to case 'C' (prints 'Fair '), then hits break. Output: Good Fair."}, {"id": 104, "num": 20, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C program?\nchar s[20] = \"DSSSB\";\nstrcat(s, \"2026\");\nprintf(\"%d %d\", (int)strlen(s), (int)sizeof(s));", "options": ["9 10", "9 20", "10 20", "9 9"], "ans": 1, "exp": "s becomes \"DSSSB2026\" ⇒ strlen(s) = 9 characters; sizeof(s) = total array size = 20 bytes. Output: 9 20."}]}, {"id": 6, "category": "C", "code": "C Mock 06", "title": "C Language — Mock 06", "subtitle": "C Programming, Pointers, Arrays, Loops & Compilers", "durationSec": 720, "timeLabel": "12-Min", "questions": [{"id": 105, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C program?\nint a = 12, b = 10;\nprintf(\"%d %d %d\", a & b, a ^ b, a << 2);", "options": ["8 6 48", "8 14 48", "14 6 24", "8 6 14"], "ans": 0, "exp": "a = 1100, b = 1010 ⇒ a & b = 1000 (8); a ^ b = 0110 (6); a << 2 = 12 × 4 = 48. Output: 8 6 48."}, {"id": 106, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C code?\nint i;\nfor (i = 0; i < 10; i += 3);\nprintf(\"%d\", i);", "options": ["0 3 6 9", "9", "10", "12"], "ans": 3, "exp": "The trailing semicolon makes the loop body empty. i takes 0, 3, 6, 9, then 12 (loop terminates), and printf prints 12."}, {"id": 107, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What does the declaration `int *(*fp)(int);` declare?", "options": ["fp is an array of pointers to int", "fp is a function that takes an int and returns a pointer to a pointer to int", "fp is a pointer to a function that takes an int and returns a pointer to int", "fp is a pointer to an int pointer"], "ans": 2, "exp": "Reading inside-out: (*fp) is a pointer → (int) to a function taking int → int * returning pointer to int."}, {"id": 108, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C code?\nint a = 5, b = 2;\nfloat c = a / b * 2.0;\nprintf(\"%.1f\", c);", "options": ["2.0", "5.0", "4.5", "4.0"], "ans": 3, "exp": "a / b is evaluated first as integer division (5 / 2 = 2), then 2 * 2.0 = 4.0."}, {"id": 109, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C program?\n#define SQ(x) x * x\nint main() { printf(\"%d\", SQ(3 + 2)); return 0; }", "options": ["11", "25", "10", "13"], "ans": 0, "exp": "Textual macro substitution gives 3 + 2 * 3 + 2 = 3 + 6 + 2 = 11."}, {"id": 110, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C code?\nint a[2][3] = {{1, 2, 3}, {4, 5, 6}};\nprintf(\"%d %d\", *(*(a + 1) + 2), **a + 1);", "options": ["6 2", "6 4", "5 2", "3 2"], "ans": 0, "exp": "*(*(a + 1) + 2) = a[1][2] = 6; **a = a[0][0] = 1 ⇒ **a + 1 = 2. Output: 6 2."}, {"id": 111, "num": 7, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What does the call `fseek(fp, -10, SEEK_END);` do?", "options": ["It deletes the last 10 bytes of the file", "It moves the file position 10 bytes after the end of the file", "It moves the file position to 10 bytes before the end of the file", "It moves the file position to the 10th byte from the beginning"], "ans": 2, "exp": "SEEK_END sets the origin to EOF, and offset -10 moves the file pointer 10 bytes backward before the end of the file."}, {"id": 112, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Which statements about a union in C are correct?\nI. All members of a union share the same memory location.\nII. The size of a union is the sum of the sizes of its members.", "options": ["Neither I nor II", "Only II", "Both I and II", "Only I"], "ans": 3, "exp": "All members of a union share the same memory location, and its size equals that of its largest member (plus padding), not the sum (which is for a struct)."}, {"id": 113, "num": 9, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "Which statement(s) is/are true about identifiers in C?\nI. A keyword can be used as an identifier.\nII. Identifiers are case-sensitive.", "options": ["Only I", "Neither I nor II", "Both I and II", "Only II"], "ans": 3, "exp": "Reserved keywords (like int, while) cannot be used as identifiers. C is case-sensitive, so total, Total, and TOTAL are distinct identifiers."}, {"id": 114, "num": 10, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "What is the output of the code written in C?\nvoid main() {\n  printf(\"%d \", 9 % -4);\n  printf(\"%d\", -9 % 4);\n}", "options": ["−1 −1", "−1 1", "1 1", "1 −1"], "ans": 3, "exp": "In C, the % operator takes the sign of the dividend (left operand): 9 % −4 = 9 − (−2)(−4) = 1; −9 % 4 = −9 − (−2)(4) = −1. Output: 1 −1."}, {"id": 115, "num": 11, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "Which statement in this code is unreachable?\nswitch(n) {\n  case 1: x = 5; break; y = 10;\n  case 2: z = 20;\n}", "options": ["x = 5;", "None of these", "z = 20;", "y = 10;"], "ans": 3, "exp": "Control exits the switch immediately upon executing 'break;'. Since 'y = 10;' has no case label, it can never be reached."}, {"id": 116, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "What is the full form of MSIL in the Microsoft .NET Framework?", "options": ["Microsoft Intermediate Language", "Managed System Interface Library", "Microsoft Standard Instruction Language", "Multi-System Integrated Language"], "ans": 0, "exp": ".NET compilers compile source code (C#, VB.NET) into MSIL (Microsoft Intermediate Language), which the CLR's JIT compiler converts into native code."}, {"id": 117, "num": 13, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Methods of passing arguments to a function:\nI. Call by value   II. Call by reference", "options": ["Only I", "Only II", "Neither I nor II", "Both I and II"], "ans": 3, "exp": "Functions accept arguments via Call by value (copy) or Call by reference (address)."}, {"id": 118, "num": 14, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Which function writes formatted output to a file in C?", "options": ["fscanf()", "printf()", "fprintf()", "fgets()"], "ans": 2, "exp": "fprintf(fp, ...) writes formatted output to a file stream."}, {"id": 119, "num": 15, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Output of C code?\nint k, v;\nk = (v = 5, v * 3);\nprintf(\"%d\", k);", "options": ["5", "15", "3", "Error"], "ans": 1, "exp": "The comma operator sets v = 5, then evaluates v * 3 = 15 and assigns 15 to k."}, {"id": 120, "num": 16, "topic": "C, C++ & .NET", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Compiling Intermediate Language to native machine code BEFORE the program runs is:\nI. Ahead-of-Time (AOT) compilation   II. Just-In-Time (JIT) compilation", "options": ["Both I and II", "Only II", "Only I", "Neither I nor II"], "ans": 2, "exp": "AOT compiles before execution; JIT compiles during execution."}, {"id": 121, "num": 17, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "A flowchart where steps repeat as long as a condition remains true represents a ______.", "options": ["Loop structure", "Decision structure", "Sequence structure", "Case structure"], "ans": 0, "exp": "Repeated execution controlled by a condition forms a loop structure."}, {"id": 122, "num": 18, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Output of C code?\nint a = 7, b = 3, *p1 = &a, *p2 = &b;\n*p1 = *p1 - *p2;\n*p2 = *p1 + *p2;\n*p1 = *p2 - *p1;\nprintf(\"a=%d b=%d\", a, b);", "options": ["a=7 b=3", "a=3 b=7", "a=4 b=7", "a=3 b=4"], "ans": 1, "exp": "Swaps a and b via pointers without a temp variable: a becomes 4, b becomes 7, a becomes 3 ⇒ a=3 b=7."}, {"id": 123, "num": 19, "topic": "C, C++ & .NET", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Which of the following is NOT a .NET language?", "options": ["VB.NET", "Perl", "F#", "C#"], "ans": 1, "exp": "VB.NET, C# and F# target the .NET CLR; Perl is an independent scripting language."}, {"id": 124, "num": 20, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) A variable's value can change during execution.\nii) A constant's value can be changed during execution.", "options": ["i-True, ii-True", "i-True, ii-False", "i-False, ii-True", "i-False, ii-False"], "ans": 1, "exp": "Variables can change; constants remain fixed throughout execution ⇒ i-True, ii-False."}]}, {"id": 7, "category": "C", "code": "C Mock 07", "title": "C Language — Mock 07", "subtitle": "C Programming, Pointers, Arrays, Loops & Compilers", "durationSec": 720, "timeLabel": "12-Min", "questions": [{"id": 125, "num": 1, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Output of the C code?\nint a[] = {5, 10, 15, 20, 25};\nint *p = a + 3;\nprintf(\"%d %d\", *(p - 1), *p + 1);", "options": ["15 21", "20 21", "15 20", "10 26"], "ans": 0, "exp": "p points to a[3] = 20. *(p−1) = a[2] = 15; *p + 1 = 20 + 1 = 21 ⇒ Output: 15 21."}, {"id": 126, "num": 2, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Output of the C code?\nint n = 91, i;\nfor (i = 2; i < n; i++) if (n % i == 0) break;\nprintf(\"%d %d\", i, n / i);", "options": ["2 45", "7 13", "13 7", "91 1"], "ans": 1, "exp": "Smallest divisor of 91 (>1) is 7, so loop breaks at i = 7 and n/i = 13 ⇒ Output: 7 13."}, {"id": 127, "num": 3, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which statement(s) is/are correct about C strings?\nI. Terminated by null character '\\0'.\nII. strlen(\"DELHI\") returns 6.", "options": ["Both I and II", "Only II", "Only I", "Neither I nor II"], "ans": 2, "exp": "C strings end with '\\0' (I is true), and strlen(\"DELHI\") returns 5 (excluding '\\0', so II is false)."}, {"id": 128, "num": 4, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which phase of the compiler groups characters of the source program into tokens?", "options": ["Code optimisation", "Syntax analysis", "Semantic analysis", "Lexical analysis"], "ans": 3, "exp": "The lexical analyser (scanner) converts character streams into tokens (keywords, identifiers, operators)."}, {"id": 129, "num": 5, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Output of C code?\nint n = 25;\nprintf(\"%s\", n%3==0 ? (n%5==0 ? \"FizzBuzz\" : \"Fizz\") : (n%5==0 ? \"Buzz\" : \"None\"));", "options": ["Buzz", "Fizz", "FizzBuzz", "None"], "ans": 0, "exp": "25 % 3 == 0 is false, so it evaluates (25 % 5 == 0 ? 'Buzz' : 'None') → true ⇒ Buzz."}, {"id": 130, "num": 6, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which of the following is/are features of low-level programming languages?\nI. Machine dependence\nII. Fast execution", "options": ["Only I", "Both I and II", "Only II", "Neither I nor II"], "ans": 1, "exp": "Machine and assembly languages are processor-specific (machine dependent) and execute very fast directly on hardware."}, {"id": 131, "num": 7, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which of the following is NOT a reserved word (keyword) in C?", "options": ["volatile", "main", "register", "goto"], "ans": 1, "exp": "'main' is a user-defined function identifier (entry point), not one of the 32 C89 keywords. volatile, register and goto are keywords."}, {"id": 132, "num": 8, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the C code?\nvoid main() {\n  int a = 5, b;\n  b = a++ + 10;\n  printf(\"%d %d\", a, b);\n}", "options": ["5 15", "6 16", "6 15", "5 16"], "ans": 2, "exp": "Post-increment uses a = 5 in b = 5 + 10 = 15, then increments a to 6 ⇒ Output: 6 15."}, {"id": 133, "num": 9, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Assume '#' has higher precedence than '@'. '#' is left associative (a # b = a × b) and '@' is right associative (a @ b = a − b). Evaluate: 2 @ 3 # 2 @ 1", "options": ["5", "−5", "3", "−3"], "ans": 3, "exp": "First 3 # 2 = 6 → 2 @ 6 @ 1. Right associative '@' evaluates 6 @ 1 = 5 first, then 2 @ 5 = 2 − 5 = −3."}, {"id": 134, "num": 10, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the C code?\nint a = 1, b;\nb = (a++, a + 5);\nprintf(\"%d %d\", a, b);", "options": ["2 7", "1 6", "2 6", "1 7"], "ans": 0, "exp": "The comma operator evaluates a++ (making a = 2) and discards its value, then evaluates a + 5 = 7 and assigns 7 to b ⇒ Output: 2 7."}, {"id": 135, "num": 11, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the C code?\nint a = 0, b = 1, c, i;\nfor (i = 0; i < 6; i++) { c = a + b; a = b; b = c; }\nprintf(\"%d\", a);", "options": ["5", "8", "13", "6"], "ans": 1, "exp": "Tracing a after each iteration: i=0→1, i=1→1, i=2→2, i=3→3, i=4→5, i=5→8. Output is 8."}, {"id": 136, "num": 12, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What will be the output of the C code?\nint n = printf(\"DSSSB\");\nprintf(\" %d\", n);", "options": ["DSSSB 5", "DSSSB 6", "DSSSB 0", "5 DSSSB"], "ans": 0, "exp": "printf() returns the number of characters printed: 'DSSSB' has 5 characters, so n = 5 ⇒ Output: DSSSB 5."}, {"id": 137, "num": 13, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the C code?\nfloat x = 7.9, y = -7.9;\nprintf(\"%d %d\", (int)x, (int)y);", "options": ["8 -8", "7 -8", "7 -7", "8 -7"], "ans": 2, "exp": "Casting float to int truncates toward zero (drops the fractional part without rounding): 7.9 → 7 and −7.9 → −7."}, {"id": 138, "num": 14, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "______ is the run-time environment of the .NET Framework that manages the execution of programs.", "options": ["Common Language Runtime (CLR)", "Common Type System (CTS)", "Framework Class Library (FCL)", "Intermediate Language (IL)"], "ans": 0, "exp": "CLR loads code, JIT-compiles IL to native code, and manages garbage collection, security and exceptions."}, {"id": 139, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "_____ compiles MSIL (CIL) code into native machine code at run time in .NET.", "options": ["JIT compiler", "FCL", "DLL", "CTS"], "ans": 0, "exp": "The Just-In-Time (JIT) compiler inside CLR translates MSIL to native machine instructions at runtime."}, {"id": 140, "num": 16, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which is NOT one of the four divisions of a COBOL program?", "options": ["IDENTIFICATION DIVISION", "EXECUTION DIVISION", "ENVIRONMENT DIVISION", "PROCEDURE DIVISION"], "ans": 1, "exp": "COBOL's 4 divisions are IDENTIFICATION, ENVIRONMENT, DATA, and PROCEDURE (no EXECUTION division)."}, {"id": 141, "num": 17, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which component of the .NET Framework defines the common set of data types used by all .NET languages?", "options": ["Framework Class Library (FCL)", "Just-In-Time compiler (JIT)", "Common Language Runtime (CLR)", "Common Type System (CTS)"], "ans": 3, "exp": "CTS unifies data types across .NET languages (e.g., C# int and VB.NET Integer both map to System.Int32)."}, {"id": 142, "num": 18, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which ADO.NET object provides fast, forward-only, read-only access to data from a database?", "options": ["DataSet", "DataTable", "DataAdapter", "DataReader"], "ans": 3, "exp": "DataReader streams rows forward-only while connected (DataSet is disconnected in-memory)."}, {"id": 143, "num": 19, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which of the following is a logical operator in C?", "options": ["&&", "!=", ">=", "%"], "ans": 0, "exp": "Logical operators in C are &&, ||, and !. (!= and >= are relational; % is arithmetic.)"}, {"id": 144, "num": 20, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "What is the output of the following C program?", "options": ["Compilation error", "30", "Runtime error", "25"], "ans": 3, "exp": "*y = 5, so 5 × 5 + 5 − 5 = 25."}]}, {"id": 8, "category": "C", "code": "C Mock 08", "title": "C Language — Mock 08", "subtitle": "C Programming, Pointers, Arrays, Loops & Compilers", "durationSec": 720, "timeLabel": "12-Min", "questions": [{"id": 145, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which of the following C operators has the LOWEST precedence?", "options": ["&&", "+", "*", "=="], "ans": 0, "exp": "Precedence order (high → low): * > + > == > &&."}, {"id": 146, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which VB.NET control lets a user select MORE than one option from a group of choices?", "options": ["RadioButton", "CheckBox", "Label", "TextBox"], "ans": 1, "exp": "CheckBox controls allow multiple independent selections; RadioButtons are mutually exclusive."}, {"id": 147, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which of the following is a value that cannot be changed during program execution?", "options": ["Variable", "Constant", "Pointer", "Array"], "ans": 1, "exp": "A Constant retains a fixed value throughout execution (e.g. const float PI = 3.14)."}, {"id": 148, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What is the value of c after: int a, b, c; a = b = c = 8; c = c * 2 + a;", "options": ["16", "Undefined", "8", "24"], "ans": 3, "exp": "a = b = c = 8 ⇒ c = 8 × 2 + 8 = 24."}, {"id": 149, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What is the output of the following C code?", "options": ["Prints '10 DSSSB'", "Prints '9 DSSSB 2026'", "Prints '10 DSSSB 2026'", "Prints '4 2026'"], "ans": 2, "exp": "\"DSSSB 2026\" has 10 characters (5 + 1 + 4), so sprintf returns 10 → Output: 10 DSSSB 2026."}, {"id": 150, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which statement is TRUE about the default case in a C switch statement?", "options": ["It is compulsory in every switch statement.", "It is optional and can be placed anywhere inside the switch.", "It must always be the last label.", "It cannot contain a break statement."], "ans": 1, "exp": "default is optional and may appear anywhere inside switch (with break if not last)."}, {"id": 151, "num": 7, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "How many times does printf execute?", "options": ["16 times", "10 times", "8 times", "6 times"], "ans": 1, "exp": "Iterations for i = 0, 1, 2, 3 are 4 + 3 + 2 + 1 = 10 times."}, {"id": 152, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which operator has the LOWEST precedence in C?", "options": ["=", ",", "||", "?:"], "ans": 1, "exp": "The comma operator (,) has the lowest precedence of all C operators."}, {"id": 153, "num": 9, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What is the output of the following C snippet?", "options": ["undefined behavior", "False", "True", "compile time error"], "ans": 2, "exp": "(5 < 3) = 0; then (0 < 2) = 1 (true) → prints True."}, {"id": 154, "num": 10, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which technique modifies the caller's actual variable passed to a function in C?", "options": ["Pass a copy of the variable", "Pass the address of the variable and change it through a pointer", "Declare a local variable with the same name", "It is not possible in C"], "ans": 1, "exp": "Pass &x to a pointer parameter int *p and modify *p."}, {"id": 155, "num": 11, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "In 'int marks[30][5];' storing 30 students in 5 subjects, what do the dimensions represent?", "options": ["First dimension = 30 students (rows); second = 5 subjects (columns)", "First = subjects; second = students", "Stores 35 elements in all", "First = maximum marks"], "ans": 0, "exp": "Row-first indexing: 30 rows (students) × 5 columns (subjects) = 150 elements."}, {"id": 156, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "func() returns static int arr[5] = {2, 4, 6, 8, 10}; main prints ptr[i] for i = 0, 2, 4. Output:", "options": ["2 4 6", "4 8", "2 2 2", "2 6 10"], "ans": 3, "exp": "static arr persists after func() returns; ptr[0]=2, ptr[2]=6, ptr[4]=10 → Output: 2 6 10."}, {"id": 157, "num": 13, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which statement is INCORRECT about C storage classes?", "options": ["Default storage class of a local variable is auto.", "A static local variable retains its value between calls.", "The address of a register variable can be taken using the & operator.", "An extern variable can be shared across files."], "ans": 2, "exp": "register variables may live in CPU registers without memory addresses, so '&' is illegal on them in C."}, {"id": 158, "num": 14, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which statement is correct about formal parameters in C?", "options": ["Must have the same names as actual parameters", "Are the values passed when calling a function", "Are always global variables", "Are the variables declared in the function definition that receive the values of actual arguments"], "ans": 3, "exp": "Formal parameters are local variables in the function header receiving actual argument values."}, {"id": 159, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which is NOT a valid way of declaring and initializing a character array in C?", "options": ["char str[10]; str = \"India\";", "char str[] = \"India\";", "char str[10] = {'I','n','d','i','a','\\0'};", "char str[10] = \"India\";"], "ans": 0, "exp": "An array name is a non-modifiable address; after declaration you must use strcpy(str, \"India\")."}, {"id": 160, "num": 16, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What is the output of: int a = 6, b = 3; printf(\"%d\", a & b);", "options": ["2", "7", "5", "1"], "ans": 0, "exp": "Bitwise AND: 110₂ & 011₂ = 010₂ = 2."}, {"id": 161, "num": 17, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which C statement skips the remaining statements of the current iteration and moves to the next iteration?", "options": ["continue", "break", "exit", "goto"], "ans": 0, "exp": "continue jumps directly to the next loop iteration (break exits the loop)."}, {"id": 162, "num": 18, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What is the output of: for(i=0; i<5; i++) a[i] = 2*i*i - i; printed for i = 0..4?", "options": ["0 1 6 15 28", "0 1 4 9 16", "0 2 6 15 28", "1 1 6 15 28"], "ans": 0, "exp": "i=0→0, i=1→1, i=2→6, i=3→15, i=4→28. Output: 0 1 6 15 28."}, {"id": 163, "num": 19, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "What will be the output of the following C code?", "options": ["5 2", "2 5", "1 4", "5 4"], "ans": 0, "exp": "Two-pointer swap reverses the array to {5, 4, 3, 2, 1}. a[0] = 5 and a[3] = 2 → Output: 5 2."}, {"id": 164, "num": 20, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "What will be the output of the following C statement?", "options": ["32", "8", "64", "35"], "ans": 3, "exp": "'<<' has higher precedence than '|': (1 << 5) = 32; 32 | 3 = 35."}]}, {"id": 9, "category": "C++", "code": "C++ Mock 01", "title": "C++ — Mock 01", "subtitle": "C++ Syntax, STL, Dynamic Memory & Core Features", "durationSec": 540, "timeLabel": "9-Min", "questions": [{"id": 165, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding a local variable declared inside a function in C without any storage-class keyword?\nI. Its storage class is auto by default.\nII. It keeps its value between successive calls of the function.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "Default storage class for local variables is auto, and auto variables are destroyed when the block exits (only static locals retain values across calls)."}, {"id": 166, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following is NOT used for dynamic memory management in C or C++?", "options": ["new", "delete", "malloc()", "sizeof"], "ans": 3, "exp": "new/delete and malloc()/free() manage dynamic heap memory. sizeof is an operator that merely computes byte size."}, {"id": 167, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding reference variables in C++?\nI. A reference can be declared without being initialised and bound to a variable later.\nII. A reference is another name (alias) for an existing variable.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "I is false (references must be initialized at declaration). II is true."}, {"id": 168, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Class A has non-virtual `f()` printing \"Af\" and `virtual g()` printing \"Ag\". Derived class B defines `f()` (\"Bf\") and `g()` (\"Bg\"). With `A* p = new B; p->f(); p->g();`, what is printed?", "options": ["BfBg", "AfBg", "AfAg", "BfAg"], "ans": 1, "exp": "Non-virtual `f()` binds statically to A* (`Af`); virtual `g()` binds dynamically to B (`Bg`) → `AfBg`."}, {"id": 169, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding exception handling in C++?\nI. An exception is raised using the throw keyword.\nII. catch(...) can catch an exception of any type.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both statements are correct."}, {"id": 170, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "In C++, the keyword ______ allows a data member of a class to be modified even inside a const member function.", "options": ["const", "mutable", "volatile", "static"], "ans": 1, "exp": "`mutable` permits modifying a class member inside a `const` member function."}, {"id": 171, "num": 7, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding static data members in C++?\nI. A static data member is created only when the first object of the class is created.\nII. Only one copy of a static data member exists, and it is shared by all objects of the class.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "I is false (static data members exist for the entire program lifetime even before any object is created). II is true."}, {"id": 172, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following operators can NOT be overloaded in C++?", "options": ["+", "==", "[]", "::"], "ans": 3, "exp": "Scope resolution `::` (along with `.`, `.*`, `?:`, `sizeof`) cannot be overloaded in C++."}, {"id": 173, "num": 9, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "C++: Bs() calls virtual show() ('B'), Dv : Bs has Dv() calling show() ('D'), and d.call() calls show(). Output of `Dv d; d.call();`?", "options": ["DDD", "BDD", "BDB", "BBD"], "ans": 1, "exp": "Base ctor calls Bs::show() ('B'); Dv ctor calls Dv::show() ('D'); d.call() dispatches virtually to Dv::show() ('D') ⇒ BDD."}, {"id": 174, "num": 10, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "C++: Base has virtual print() ('Base'), Der overrides ('Derived'). show1(Base b) takes by value, show2(Base &b) by reference. Output of `Der x; show1(x); show2(x);`?", "options": ["Base Base", "Derived Derived", "Base Derived", "Derived Base"], "ans": 2, "exp": "show1 slices Der to Base ('Base'); show2 preserves polymorphism via reference ('Derived') → Base Derived."}, {"id": 175, "num": 11, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Output of C++:\ntry { throw 'a'; } catch(int){...} catch(char){cout<<\"char\";} catch(...){...}\ntry { throw 10; } catch(double){cout<<\"D\";} catch(...){cout<<\"A\";}", "options": ["char D", "int D", "char A", "int A"], "ans": 2, "exp": "C++ exception matching forbids arithmetic conversions: 'a' matches catch(char) and 10 falls to catch(...) ⇒ char A."}, {"id": 176, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "In C++, class X prints \"D\" in default ctor, \"C\" in copy ctor, \"A\" in copy assignment. Output of:\nX a; X b = a; X c; c = a;", "options": ["DCDC", "DDDA", "DCDA", "DADA"], "ans": 2, "exp": "X a (D), X b = a (copy ctor C), X c (D), c = a (copy assignment A) → DCDA."}, {"id": 177, "num": 13, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding pointer arithmetic in C?\nI. Two pointers can be added together to get a new address.\nII. If p is an int pointer, p + 1 points to the next int, not to the next byte.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Adding two pointers is illegal in C (only subtraction within the same array is allowed). p + 1 advances by sizeof(int) bytes to the next int. Only II is correct."}, {"id": 178, "num": 14, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "In C++, the ______ is called automatically when an object goes out of scope or is deleted.", "options": ["constructor", "copy constructor", "destructor", "friend function"], "ans": 2, "exp": "The destructor (`~ClassName()`) is invoked automatically to release resources when an object is destroyed."}, {"id": 179, "num": 15, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which operator is used in C++ to access a member of a class through a pointer to an object?", "options": [".", "::", "->", "&"], "ans": 2, "exp": "The arrow operator `->` accesses class members through an object pointer (`p->show()`)."}]}, {"id": 10, "category": "C++", "code": "C++ Mock 02", "title": "C++ — Mock 02", "subtitle": "C++ Syntax, STL, Dynamic Memory & Core Features", "durationSec": 540, "timeLabel": "9-Min", "questions": [{"id": 180, "num": 1, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which of the following is NOT true about default arguments in C++?", "options": ["Default values are used when omitted in a call", "Default arguments must be given from rightmost parameter towards left", "A function can have more than one default argument", "A default argument can be given to a parameter on the left while the parameter on its right has none"], "ans": 3, "exp": "Default arguments cannot have trailing non-default parameters to their right."}, {"id": 181, "num": 2, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What will be the output of the following C code?\nunsigned char c = 255;\nc++;\nprintf(\"%d\", c);", "options": ["0", "256", "−1", "255"], "ans": 0, "exp": "An 8-bit unsigned char holds 0..255 and wraps modulo 256, so 255 + 1 becomes 0."}, {"id": 182, "num": 3, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following statements about structures in C is/are correct?\nI. typedef can be used to give a new name to an existing type, including a structure.\nII. A structure can contain a pointer to a structure of its own type.\nIII. A structure can contain a member that is a variable of its own type.", "options": ["I, II and III", "I and III only", "II and III only", "I and II only"], "ans": 3, "exp": "I and II are valid (self-referential pointers build linked lists). III is illegal because containing an instance of itself would require infinite memory."}, {"id": 183, "num": 4, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What will be the output of the following C++ program?\nclass A { public: A() { cout << \"A\"; } ~A() { cout << \"a\"; } };\nclass B : public A { public: B() { cout << \"B\"; } ~B() { cout << \"b\"; } };\nint main() { B obj; return 0; }", "options": ["ABba", "BAab", "ABab", "BAba"], "ans": 0, "exp": "Constructors run base-to-derived (A then B) and destructors run derived-to-base (b then a), producing ABba."}, {"id": 184, "num": 5, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "A member function declared in a base class and redefined in a derived class, whose call is decided by the object's type at run time, is called a ______ function.", "options": ["inline", "friend", "virtual", "static"], "ans": 2, "exp": "A `virtual` function enables runtime polymorphism (dynamic binding) through base-class pointers/references."}, {"id": 185, "num": 6, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What is the output of the C++ program?\ntemplate <class T> T maxOf(T a, T b) { return a > b ? a : b; }\nint main() { cout << maxOf(3, 7) << maxOf('a', 'b'); return 0; }", "options": ["798", "7b", "3a", "Compilation error"], "ans": 1, "exp": "maxOf(3, 7) instantiates T=int returning 7; maxOf('a', 'b') instantiates T=char returning 'b'. Output: 7b."}, {"id": 186, "num": 7, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "Which of the following correctly declares a wide-character string in C++?", "options": ["char s[] = L\"Hello\";", "wchar_t s[] = L\"Hello\";", "wchar_t s[] = W\"Hello\";", "wchar_t s[] = 'Hello';"], "ans": 1, "exp": "A wide-character string literal uses the prefix L (L\"Hello\") and must be stored in a wchar_t array: wchar_t s[] = L\"Hello\";."}, {"id": 187, "num": 8, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "Which of the following statement(s) is/are true about the pre-processor in C/C++?\nI. It replaces each #include directive with the contents of the named file.\nII. It checks the whole program for syntax errors.\nIII. It processes macro definitions and expands macro calls.", "options": ["I and III only", "I and II only", "II and III only", "I, II and III"], "ans": 0, "exp": "The pre-processor handles #include inclusion, #define macro expansion, conditional compilation (#ifdef), and comment removal. Syntax checking is performed later by the compiler."}, {"id": 188, "num": 9, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "In C++, the operator << used with cout is known as the ______ operator.", "options": ["scope resolution", "extraction", "indirection", "insertion"], "ans": 3, "exp": "<< is the stream insertion operator (>> with cin is the extraction operator)."}, {"id": 189, "num": 10, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the C++ code?\nint f(int x) { return x * 2; }\ndouble f(double x) { return x / 2; }\nint main() { cout << f(5) << \" \" << f(5.0); }", "options": ["10 2.5", "10 10", "2.5 2.5", "2 2.5"], "ans": 0, "exp": "Function overloading calls f(int) for 5 (→ 10) and f(double) for 5.0 (→ 2.5) ⇒ Output: 10 2.5."}, {"id": 190, "num": 11, "topic": "C & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the output of the C++ code?\nstring s = \"TGT\";\ns.append(\"-CS\");\ncout << s.length() << \" \" << s[3];", "options": ["3 T", "6 C", "6 -", "5 -"], "ans": 2, "exp": "s becomes \"TGT-CS\" (length 6). 0-indexed s[3] is '-' ⇒ Output: 6 -."}, {"id": 191, "num": 12, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "In C++, the manipulator setw(n) is used to _____.", "options": ["skip n characters of input", "set n digits after the decimal point", "set the field width of the next output to n characters", "insert n new lines"], "ans": 2, "exp": "setw(n) (from <iomanip>) sets the minimum field width for the next output item."}, {"id": 192, "num": 13, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "In C++, a function declared with the keyword 'virtual' in the base class supports _____.", "options": ["compile-time polymorphism", "multiple inheritance", "data hiding", "run-time polymorphism"], "ans": 3, "exp": "Virtual functions enable dynamic dispatch / run-time polymorphism via base-class pointers or references."}, {"id": 193, "num": 14, "topic": "C, C++ & Programming Basics", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which of the following is NOT a storage class specifier in C?", "options": ["static", "volatile", "register", "extern"], "ans": 1, "exp": "C's 4 storage classes are auto, register, static, and extern. 'volatile' is a type qualifier."}]}, {"id": 11, "category": "Java", "code": "Java Mock 01", "title": "Java — Mock 01", "subtitle": "Core Java, JVM, Strings, Exceptions, Threads & APIs", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 194, "num": 1, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "What is the output of the following Java program?\nclass C { static int s; int i; C() { s++; i++; } }\npublic class Main {\n  public static void main(String[] args) {\n    C c1 = new C(), c2 = new C(), c3 = new C();\n    System.out.println(c3.s + \" \" + c3.i);\n  }\n}", "options": ["3 1", "3 3", "1 1", "1 3"], "ans": 0, "exp": "static int s is shared by all 3 objects → increments 3 times to 3. Instance variable i is separate per object → c3.i is 1. Output: 3 1."}, {"id": 195, "num": 2, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "What is the output of the following Java code?\nString a = new String(\"hi\");\nString b = \"hi\";\nSystem.out.println((a == b) + \" \" + a.equals(b) + \" \" + (a.hashCode() == b.hashCode()));", "options": ["false true false", "true true true", "false true true", "false false true"], "ans": 2, "exp": "a == b is false (different references); a.equals(b) is true (same characters); equal strings must have equal hashCodes → true. Output: false true true."}, {"id": 196, "num": 3, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following is NOT a feature of Java?", "options": ["Platform independence", "Automatic garbage collection", "Explicit pointer arithmetic", "Object-oriented programming"], "ans": 2, "exp": "Java deliberately omits explicit pointers and pointer arithmetic for memory safety."}, {"id": 197, "num": 4, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "What is the default value of a boolean instance variable in Java?", "options": ["true", "null", "0", "false"], "ans": 3, "exp": "In Java, default field values are: boolean → false, int → 0, double → 0.0, object reference → null."}, {"id": 198, "num": 5, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "What will be the output of the following Java code?\nint x = 5;\nint y = x++;\nSystem.out.println(x + \" \" + y);", "options": ["5 5", "6 6", "6 5", "5 6"], "ans": 2, "exp": "Post-increment x++ assigns 5 to y first, then increments x to 6 → prints 6 5."}, {"id": 199, "num": 6, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "A Java class uses the keyword ______ to implement an interface.", "options": ["extends", "inherits", "implements", "interface"], "ans": 2, "exp": "A class extends another class and implements one or more interfaces (e.g., class Car implements Vehicle)."}, {"id": 200, "num": 7, "topic": "Java & OOP", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding the super keyword in Java?\nI. super() is used to call the constructor of the parent class.\nII. A call to super() can be written anywhere in the body of a constructor.", "options"
