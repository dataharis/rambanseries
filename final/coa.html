", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which addressing mode is most convenient for stepping through the elements of an array one after another, because the register is updated automatically after each access?", "options": ["Direct mode", "Immediate mode", "Autoincrement mode", "Register mode"], "ans": 2, "exp": "Autoincrement mode accesses the address in the register and automatically increments the register by the element size."}, {"id": 5, "num": 5, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which type of ROM can be erased and reprogrammed electrically, one byte at a time, while it remains in the circuit?", "options": ["EPROM", "Mask ROM", "PROM", "EEPROM"], "ans": 3, "exp": "EEPROM (Electrically Erasable Programmable ROM) allows byte-by-byte electrical erasure and reprogramming in-circuit (EPROM uses UV light)."}, {"id": 6, "num": 6, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "A processor has 16 address lines. What is the maximum memory it can address (byte-addressable)?", "options": ["16 KB", "32 KB", "64 KB", "1 MB"], "ans": 2, "exp": "2¹⁶ bytes = 65,536 bytes = 64 KB."}, {"id": 7, "num": 7, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following is free and open-source software?", "options": ["Adobe Photoshop", "Microsoft Office", "LibreOffice", "Microsoft Windows"], "ans": 2, "exp": "LibreOffice is free and open-source (Mozilla Public Licence); Photoshop, MS Office, and Windows are proprietary."}, {"id": 8, "num": 8, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which bus of a computer system is bidirectional?", "options": ["Address bus", "Data bus", "Both the address bus and the data bus", "Neither the address bus nor the data bus"], "ans": 1, "exp": "The data bus carries data both ways (CPU ↔ memory/I/O); the address bus is unidirectional (CPU → memory/I/O)."}, {"id": 9, "num": 9, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which flag of the processor's status register is set when the result of an arithmetic or logical operation is zero?", "options": ["Carry flag", "Overflow flag", "Sign flag", "Zero flag"], "ans": 3, "exp": "The Zero (Z) flag is set to 1 whenever an ALU operation produces 0."}, {"id": 10, "num": 10, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following memories must be refreshed periodically to retain its data?", "options": ["SRAM", "DRAM", "EEPROM", "Flash memory"], "ans": 1, "exp": "DRAM stores bits as charges on tiny capacitors that leak over time, requiring periodic refreshing every few milliseconds."}, {"id": 11, "num": 11, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding a microprogrammed control unit?\nI. It is easier to modify than a hardwired control unit.\nII. It is generally faster than a hardwired control unit.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "Microprogrammed CUs store control signals in control memory, making them flexible and easy to modify (I is true), but slower than hardwired logic circuits (II is false)."}, {"id": 12, "num": 12, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "What is the main advantage of using a TLB in a paging system?", "options": ["It increases the size of main memory", "It reduces the time needed to translate logical addresses into physical addresses", "It removes the need for a page table", "It prevents page faults completely"], "ans": 1, "exp": "TLB caches recent page-table entries to speed up logical-to-physical address translation."}, {"id": 13, "num": 13, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding cache mapping?\nI. In direct mapping, a block of main memory can be placed in any line of the cache.\nII. In fully associative mapping, each block of main memory can be placed in only one particular line of the cache.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 3, "exp": "The two descriptions are reversed, so neither statement is correct."}, {"id": 14, "num": 14, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding pipeline hazards?\nI. A structural hazard occurs when an instruction needs the result of a previous instruction that has not yet completed.\nII. A control hazard is caused by branch instructions, when the address of the next instruction is not yet known.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "I describes a data hazard (not structural). II is true."}, {"id": 15, "num": 15, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "In a daisy-chained interrupt system, which device has the highest priority?", "options": ["All devices have equal priority", "The device farthest from the CPU", "The device with the lowest vector address", "The device electrically closest to the CPU in the chain"], "ans": 3, "exp": "In daisy chaining, the device electrically closest to the CPU receives the interrupt acknowledge first and has highest priority."}, {"id": 16, "num": 16, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Caches load a whole block of neighbouring words from memory on a miss rather than only the requested word. Which property does this exploit?", "options": ["Thrashing", "Temporal locality", "Sequential consistency", "Spatial locality"], "ans": 3, "exp": "Spatial locality predicts that addresses near a recently accessed address will be accessed soon."}, {"id": 17, "num": 17, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "A computer that uses a stack to hold operands, so that instructions like ADD need no address fields, is called a:", "options": ["one-address machine", "zero-address machine", "two-address machine", "three-address machine"], "ans": 1, "exp": "Stack-based architectures are zero-address machines."}, {"id": 18, "num": 18, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which system program combines several object modules into one executable and resolves external references between them?", "options": ["Compiler", "Loader", "Assembler", "Linker"], "ans": 3, "exp": "The Linker links object files/libraries and resolves external symbol references."}, {"id": 19, "num": 19, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "A 4-bit shift-left register holds 1011. The serial input is 0. What does the register hold after 2 clock pulses?", "options": ["0010", "1100", "1110", "0110"], "ans": 1, "exp": "Pulse 1: 1011 → 0110; Pulse 2: 0110 → 1100."}, {"id": 20, "num": 20, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following is a utility program?", "options": ["Disk defragmenter", "Word processor", "Web browser", "Library management application"], "ans": 0, "exp": "Disk defragmenter is a system utility; the others are application software."}]}, {"id": 2, "category": "COA", "code": "COA Mock 02", "title": "COA & Fundamentals — Mock 02", "subtitle": "Cache, Pipelining, Addressing Modes, Memory Hierarchy, Buses & IEEE 754", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 21, "num": 1, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "When a computer is switched on, which program stored in ROM runs first to test the hardware and start loading the operating system?", "options": ["The OS kernel", "BIOS (with POST)", "The device manager", "The command interpreter (shell)"], "ans": 1, "exp": "BIOS firmware in ROM executes POST and invokes the bootloader."}, {"id": 22, "num": 2, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "A program of 4 × 10⁹ instructions runs on a 2 GHz processor with an average CPI of 1.5. What is its execution time?", "options": ["1.33 s", "2 s", "3 s", "12 s"], "ans": 2, "exp": "CPU time = (4×10⁹ × 1.5) / (2×10⁹) = 3 s."}, {"id": 23, "num": 3, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following memories is the fastest?", "options": ["Hard disk", "Main memory (RAM)", "Cache memory", "Optical disc"], "ans": 2, "exp": "Memory speed hierarchy: Registers > Cache > RAM > Disk > Optical."}, {"id": 24, "num": 4, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "In the instruction cycle, which step comes immediately after fetching an instruction?", "options": ["Decode", "Store", "Interrupt", "Fetch the next instruction"], "ans": 0, "exp": "Instruction cycle order: Fetch → Decode → Execute → Store."}, {"id": 25, "num": 5, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "What is the range of numbers that can be stored in an 8-bit unsigned integer?", "options": ["0 to 255", "−128 to 127", "0 to 256", "−127 to 127"], "ans": 0, "exp": "Unsigned n-bit range: 0 to 2ⁿ − 1 = 0 to 255."}, {"id": 26, "num": 6, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "The ______ unit of the CPU generates the timing and control signals that direct the ALU, registers, memory and I/O devices.", "options": ["arithmetic logic", "control", "memory", "input/output"], "ans": 1, "exp": "The Control Unit (CU) generates timing and control signals."}, {"id": 27, "num": 7, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following RAID levels does NOT provide any redundancy (fault tolerance)?", "options": ["RAID 0", "RAID 1", "RAID 5", "RAID 6"], "ans": 0, "exp": "RAID 0 performs pure striping with zero redundancy or parity."}, {"id": 28, "num": 8, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "What does CPI stand for when measuring processor performance?", "options": ["Cycles Per Interval", "Clocks Per Interrupt", "Cycles Per Instruction", "Calls Per Instruction"], "ans": 2, "exp": "CPI = Clock Cycles Per Instruction."}, {"id": 29, "num": 9, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "How many characters can be represented by standard 7-bit ASCII?", "options": ["127", "128", "256", "65,536"], "ans": 1, "exp": "2⁷ = 128 characters (codes 0 to 127)."}, {"id": 30, "num": 10, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which type of interrupt cannot be disabled or ignored by the CPU?", "options": ["Maskable interrupt", "Non-maskable interrupt", "Software interrupt", "Vectored interrupt"], "ans": 1, "exp": "Non-maskable interrupts (NMI, e.g., TRAP in 8085) cannot be disabled by software."}, {"id": 31, "num": 11, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "The I/O technique in which the CPU repeatedly checks the status flag of a device until the device is ready is called ______.", "options": ["interrupt-driven I/O", "direct memory access (DMA)", "programmed I/O (polling)", "I/O processor (channel)"], "ans": 2, "exp": "Programmed I/O uses busy-wait polling of the device status flag."}, {"id": 32, "num": 12, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "40% of the execution time of a program can be made 4 times faster, and the rest cannot be improved. According to Amdahl's law, what is the overall speedup?", "options": ["About 1.43", "1.6", "2.5", "4"], "ans": 0, "exp": "Speedup = 1 / [(1 − 0.4) + 0.4/4] = 1 / 0.7 ≈ 1.43."}, {"id": 33, "num": 13, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "As we move down the memory hierarchy from CPU registers towards magnetic disk, which of the following increases?", "options": ["Cost per bit", "Speed of access", "Storage capacity", "Frequency of access by the CPU"], "ans": 2, "exp": "Storage capacity (and access time) increases down the hierarchy, while cost/bit and speed decrease."}, {"id": 34, "num": 14, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "In a paging system, the page offset field of an address has 12 bits. What is the page size?", "options": ["1 KB", "2 KB", "4 KB", "12 KB"], "ans": 2, "exp": "Page size = 2^(offset bits) = 2¹² = 4096 bytes = 4 KB."}, {"id": 35, "num": 15, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following is a low-level programming language?", "options": ["C++", "Java", "SQL", "Assembly language"], "ans": 3, "exp": "Machine code and Assembly language are low-level languages close to hardware."}, {"id": 36, "num": 16, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding cache memory?\nI. The hit ratio is the number of hits divided by the number of misses.\nII. A cache hit occurs when the data requested by the CPU is found in the cache.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "I is false (hit ratio = hits / total accesses). II is true."}, {"id": 37, "num": 17, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "The time taken by the read/write head of a hard disk to move to the required track is called ______.", "options": ["seek time", "rotational latency", "transfer time", "access time"], "ans": 0, "exp": "Seek time is the time to position the R/W head over the target track."}, {"id": 38, "num": 18, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "What is −37 in 8-bit 2's complement representation?", "options": ["10100101", "11011010", "11011011", "01011011"], "ans": 2, "exp": "+37 = 0010 0101 → 1's comp = 1101 1010 → +1 = 1101 1011."}, {"id": 39, "num": 19, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "The ______ holds the address of the next instruction to be fetched and executed.", "options": ["Memory Address Register (MAR)", "Instruction Register (IR)", "Program Counter (PC)", "Accumulator (AC)"], "ans": 2, "exp": "The Program Counter (PC) stores the address of the next instruction to fetch."}, {"id": 40, "num": 20, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "In which computer architecture are programs (instructions) and data stored in the same memory?", "options": ["Von Neumann architecture", "Harvard architecture", "Dataflow architecture", "Systolic architecture"], "ans": 0, "exp": "Von Neumann architecture shares one memory and bus for both instructions and data (Harvard uses separate ones)."}]}, {"id": 3, "category": "COA", "code": "COA Mock 03", "title": "COA & Fundamentals — Mock 03", "subtitle": "Cache, Pipelining, Addressing Modes, Memory Hierarchy, Buses & IEEE 754", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 41, "num": 1, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "In a 32-bit processor, a word is normally how many bytes long?", "options": ["2", "4", "8", "32"], "ans": 1, "exp": "32 bits ÷ 8 = 4 bytes."}, {"id": 42, "num": 2, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which CPU register holds the instruction that is currently being decoded and executed?", "options": ["Memory Address Register (MAR)", "Memory Data Register (MDR)", "Program Counter (PC)", "Instruction Register (IR)"], "ans": 3, "exp": "The Instruction Register (IR) holds the currently fetched instruction during decoding and execution."}, {"id": 43, "num": 3, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "A cache has a hit time of 2 ns, a miss rate of 5% and a miss penalty of 100 ns. What is the average memory access time?", "options": ["5 ns", "9.6 ns", "102 ns", "7 ns"], "ans": 3, "exp": "AMAT = Hit time + Miss rate × Miss penalty = 2 + 0.05 × 100 = 7 ns."}, {"id": 44, "num": 4, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding RISC processors?\nI. RISC processors generally use fixed-length instructions.\nII. RISC processors provide a large number of complex addressing modes.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "I is true (fixed-length instructions simplify pipelining). II is false (complex addressing modes belong to CISC)."}, {"id": 45, "num": 5, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Cache access = 10 ns (hit ratio 0.9), main memory = 100 ns, hierarchical access. Average memory access time?", "options": ["110 ns", "19 ns", "11 ns", "20 ns"], "ans": 3, "exp": "Hierarchical AMAT = 0.9×10 + 0.1×(10 + 100) = 9 + 11 = 20 ns."}, {"id": 46, "num": 6, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "A 4-way set-associative cache has 128 sets. To which set is main memory block 2050 mapped?", "options": ["Set 1", "Set 512", "Set 16", "Set 2"], "ans": 3, "exp": "Set = 2050 mod 128 = 2050 − 2048 = Set 2."}, {"id": 47, "num": 7, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "A byte-addressable 2 MB memory uses 32-bit words (one word per access). Sizes of MAR and MDR?", "options": ["MAR 16 bits, MDR 32 bits", "MAR 19 bits, MDR 32 bits", "MAR 21 bits, MDR 8 bits", "MAR 21 bits, MDR 32 bits"], "ans": 3, "exp": "2 MB = 2²¹ bytes ⇒ MAR = 21 bits; 32-bit word transfer ⇒ MDR = 32 bits."}, {"id": 48, "num": 8, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "A RAID 5 array is built from 5 disks of 2 TB each. What is its usable capacity?", "options": ["10 TB", "8 TB", "6 TB", "4 TB"], "ans": 1, "exp": "RAID 5 usable capacity = (n − 1) × disk size = 4 × 2 TB = 8 TB."}, {"id": 49, "num": 9, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "A 5-stage pipeline executes 100 instructions with no stalls (1 cycle/stage). Speedup over a non-pipelined 5-cycle processor?", "options": ["Exactly 5", "About 4.81", "About 4.95", "About 4.00"], "ans": 1, "exp": "Speedup = (5 × 100) / (5 + 100 − 1) = 500 / 104 ≈ 4.81."}, {"id": 50, "num": 10, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Instructions: 40% type X (1 cycle), 40% type Y (2 cycles), 20% type Z (4 cycles) on a 2 GHz CPU. Rating in MIPS?", "options": ["500 MIPS", "2000 MIPS", "1000 MIPS", "800 MIPS"], "ans": 2, "exp": "Avg CPI = 0.4(1)+0.4(2)+0.2(4) = 2.0. MIPS = (2×10⁹) / (2 × 10⁶) = 1000 MIPS."}, {"id": 51, "num": 11, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "How many instructions does a stack (zero-address) machine need to compute X = (A + B) × C using PUSH, POP, ADD, MUL?", "options": ["4", "5", "6", "7"], "ans": 2, "exp": "PUSH A, PUSH B, ADD, PUSH C, MUL, POP X → 6 instructions."}, {"id": 52, "num": 12, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Regarding cache misses:\nI. A compulsory (cold) miss occurs on the very first access to a block.\nII. Increasing associativity of a same-size cache tends to reduce conflict misses.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both statements accurately describe compulsory and conflict cache misses."}, {"id": 53, "num": 13, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Which of the following is NOT a category in Flynn's classification of computer architectures?", "options": ["SISD", "MISD", "MIMD", "SIMM (single instruction, multiple memory)"], "ans": 3, "exp": "Flynn's 4 classes are SISD, SIMD, MISD, and MIMD; SIMM is a memory module."}, {"id": 54, "num": 14, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "A direct-mapped cache of 64 KB has 32-byte blocks. For 32-bit byte addresses, how many bits are used for tag, index, and block offset?", "options": ["Tag 16, index 10, offset 6", "Tag 11, index 16, offset 5", "Tag 16, index 11, offset 5", "Tag 21, index 6, offset 5"], "ans": 2, "exp": "Offset = log₂ 32 = 5 bits; Lines = 64 KB / 32 B = 2¹¹ ⇒ Index = 11 bits; Tag = 32 − 11 − 5 = 16 bits."}, {"id": 55, "num": 15, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "40% of a program's execution time can be made 10 times faster. By Amdahl's law, what is the overall speedup?", "options": ["2.50", "4.00", "1.67", "1.56"], "ans": 3, "exp": "Speedup = 1 / ((1 − 0.4) + 0.4/10) = 1 / 0.64 ≈ 1.56."}, {"id": 56, "num": 16, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "A 32-bit ISA has 45 opcodes and 64 registers. One format has opcode + 2 register fields + signed 2's-complement immediate. What is the immediate value range?", "options": ["−8192 to +8191", "−16384 to +16383", "0 to 16383", "−8191 to +8191"], "ans": 0, "exp": "Opcode = ⌈log₂ 45⌉ = 6 bits; 2 regs = 2×6 = 12 bits; Immediate = 32 − 18 = 14 bits ⇒ −2¹³ to 2¹³−1 = −8192 to +8191."}, {"id": 57, "num": 17, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "A system uses a TLB (10 ns, 90% hit ratio) and a two-level page table (memory access = 100 ns, page table not cached). What is the effective memory access time?", "options": ["130 ns", "120 ns", "140 ns", "121 ns"], "ans": 0, "exp": "Hit = 10 + 100 = 110 ns; Miss = 10 + 3×100 = 310 ns (2 page-table levels + data). EAT = 0.9×110 + 0.1×310 = 99 + 31 = 130 ns."}, {"id": 58, "num": 18, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "In IEEE 754 single precision, what does 0 11111111 00000000000000000000000 represent?", "options": ["Positive infinity", "NaN (not a number)", "The largest finite number", "Zero"], "ans": 0, "exp": "Sign = 0 (+), exponent = all 1s, mantissa = all 0s represents +∞ (Positive infinity)."}, {"id": 59, "num": 19, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "How many address lines does a 32K × 8 RAM chip need, and how many such chips are needed to build a 128K × 16 memory?", "options": ["15 address lines and 16 chips", "15 address lines and 8 chips", "17 address lines and 8 chips", "16 address lines and 8 chips"], "ans": 1, "exp": "32K = 2¹⁵ ⇒ 15 address lines per chip. Chips = (128K/32K) × (16/8) = 4 × 2 = 8 chips."}, {"id": 60, "num": 20, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "An instruction at addresses 200–201 has address field 500. After fetch, PC = 202, R1 = 400, Mem[500] = 800. Under PC-relative addressing, what is the effective address?", "options": ["700", "702", "900", "800"], "ans": 1, "exp": "PC-relative adds address field to the updated PC after fetch: EA = 202 + 500 = 702."}]}, {"id": 4, "category": "COA", "code": "COA Mock 04", "title": "COA & Fundamentals — Mock 04", "subtitle": "Cache, Pipelining, Addressing Modes, Memory Hierarchy, Buses & IEEE 754", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 61, "num": 1, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "A program executes 10⁹ instructions: 50% ALU (CPI 1), 30% load/store (CPI 3), 20% branches (CPI 2) on a 2 GHz clock. What is the execution time?", "options": ["0.9 s", "1.8 s", "0.5 s", "1.11 s"], "ans": 0, "exp": "Avg CPI = 0.5(1) + 0.3(3) + 0.2(2) = 1.8. Time = (10⁹ × 1.8) / (2 × 10⁹) = 0.9 s."}, {"id": 62, "num": 2, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Regarding Booth's multiplication algorithm:\nI. It multiplies signed binary numbers in 2's complement form.\nII. When (Q₀, Q₋₁) = (1, 0), the multiplicand is subtracted from the partial product.\nIII. It can be used only when both numbers are positive.", "options": ["I and II only", "II and III only", "I and III only", "I, II and III"], "ans": 0, "exp": "Booth's algorithm is specifically designed for signed 2's complement numbers (III is false); I and II are true."}, {"id": 63, "num": 3, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding the Translation Lookaside Buffer (TLB)?\nI. The TLB is a small, fast associative cache of recently used page-table entries.\nII. On a TLB miss, the page table in main memory has to be accessed.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both statements are correct: TLB caches recent page→frame mappings in associative memory, and a TLB miss requires accessing the page table in RAM."}, {"id": 64, "num": 4, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "What is the 1's complement of the binary number 10110?", "options": ["01001", "01010", "10111", "11001"], "ans": 0, "exp": "Invert every bit (0↔1): 10110 → 01001. (Adding 1 gives the 2's complement 01010.)"}, {"id": 65, "num": 5, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "A ______ translates the entire high-level program into machine code at once and reports all the errors together after compilation.", "options": ["interpreter", "compiler", "assembler", "loader"], "ans": 1, "exp": "A compiler translates the whole high-level program at once into object/machine code and lists errors together."}, {"id": 66, "num": 6, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Cache memory is placed between:", "options": ["the CPU and main memory", "main memory and the hard disk", "the CPU and the registers", "main memory and the I/O devices"], "ans": 0, "exp": "Cache is a small, high-speed memory placed between the CPU and main memory (RAM) to reduce average memory access time."}, {"id": 67, "num": 7, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Instruction pipelining in a processor mainly improves:", "options": ["the time taken to execute a single instruction", "the instruction throughput (instructions completed per unit time)", "the number of instructions in the program", "the access time of main memory"], "ans": 1, "exp": "Pipelining overlaps stages of multiple instructions, increasing overall instruction throughput rather than reducing a single instruction's latency."}, {"id": 68, "num": 8, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "The instruction LOAD R1, 8(R2) loads into R1 the word stored at the address (contents of R2) + 8. Which addressing mode is used for the source operand?", "options": ["Register indirect addressing", "Base (displacement) addressing", "Indexed addressing with auto-increment", "Immediate addressing"], "ans": 1, "exp": "Effective address EA = [R2] + 8 adds a constant offset (displacement) to a base register value → Base (displacement) addressing."}, {"id": 69, "num": 9, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "1 KB of memory is equal to how many bytes?", "options": ["1024", "1000", "512", "2048"], "ans": 0, "exp": "In computer memory, 1 KB = 2¹⁰ = 1024 bytes."}, {"id": 70, "num": 10, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following statements about DMA is correct?", "options": ["During a DMA transfer the CPU is not involved in moving each word, though it may lose some bus cycles", "DMA transfers data only between two I/O devices", "The CPU executes an interrupt routine for every word transferred by DMA", "DMA is slower than programmed I/O for large blocks"], "ans": 0, "exp": "In DMA, the CPU initializes the transfer and the DMA controller moves the entire block directly between I/O and memory (using cycle stealing) before interrupting once at the end."}, {"id": 71, "num": 11, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "A processor has a clock rate of 2 GHz. How many clock cycles does it complete in one second?", "options": ["2 × 10⁶", "2 × 10⁹", "2 × 10³", "2 × 10¹²"], "ans": 1, "exp": "1 GHz = 10⁹ cycles per second, so 2 GHz = 2 × 10⁹ clock cycles per second."}, {"id": 72, "num": 12, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "What is the result of (101101)₂ − (1110)₂?", "options": ["(10111)₂", "(11101)₂", "(11111)₂", "(100011)₂"], "ans": 2, "exp": "45 − 14 = 31 = (11111)₂."}, {"id": 73, "num": 13, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "The ______ bus carries the address of the memory location that the CPU wants to read from or write to.", "options": ["data", "control", "address", "expansion"], "ans": 2, "exp": "The unidirectional address bus carries memory/I/O addresses from the CPU."}, {"id": 74, "num": 14, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which of the following is a non-volatile memory?", "options": ["ROM", "DRAM", "SRAM", "Cache memory"], "ans": 0, "exp": "ROM retains its contents without power; DRAM, SRAM, and cache are volatile."}, {"id": 75, "num": 15, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which unit of storage is equal to 2⁴⁰ bytes?", "options": ["1 petabyte", "1 gigabyte", "1 terabyte", "1 exabyte"], "ans": 2, "exp": "KB=2¹⁰, MB=2²⁰, GB=2³⁰, TB=2⁴⁰, PB=2⁵⁰."}, {"id": 76, "num": 16, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "In MS PowerPoint, which shortcut starts the slide show from the currently selected slide?", "options": ["F5", "Shift + F5", "Ctrl + F5", "Alt + F5"], "ans": 1, "exp": "`Shift + F5` starts from the current slide (`F5` starts from the first slide)."}, {"id": 77, "num": 17, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What is the 2's complement of the 4-bit binary number 0101?", "options": ["1010", "0110", "1011", "1101"], "ans": 2, "exp": "1's complement of 0101 is 1010; adding 1 gives 1011 (representing −5)."}, {"id": 78, "num": 18, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following is NOT a component of the CPU?", "options": ["Arithmetic Logic Unit", "Control Unit", "Registers", "Hard disk"], "ans": 3, "exp": "The CPU consists of the ALU, Control Unit, and registers (plus on-chip cache). The hard disk is external secondary storage."}, {"id": 79, "num": 19, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following memories is volatile?", "options": ["Flash memory", "EEPROM", "SRAM", "Mask ROM"], "ans": 2, "exp": "SRAM (and DRAM) lose stored data when power is turned off (volatile). Flash, EEPROM, and Mask ROM are non-volatile."}, {"id": 80, "num": 20, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What even-parity bit should be attached to the 7-bit data 1011001?", "options": ["2", "1", "0", "4"], "ans": 2, "exp": "1011001 already has four 1s (an even count), so the even-parity bit is 0."}]}, {"id": 5, "category": "COA", "code": "COA Mock 05", "title": "COA & Fundamentals — Mock 05", "subtitle": "Cache, Pipelining, Addressing Modes, Memory Hierarchy, Buses & IEEE 754", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 81, "num": 1, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What is the purpose of the Mail Merge feature in MS Word?", "options": ["To create personalised letters, labels or envelopes for many recipients from one main document and a data source", "To merge two documents into one", "To send a document as an e-mail attachment", "To combine several e-mail accounts"], "ans": 0, "exp": "Mail Merge combines a single template document with a data source (Excel/Access/Contacts) to produce personalised copies for each recipient."}, {"id": 82, "num": 2, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "A 32-bit instruction has an 8-bit opcode and two 5-bit register fields. How many bits remain for the immediate operand?", "options": ["12", "16", "14", "18"], "ans": 2, "exp": "32 − 8 − 5 − 5 = 14 bits."}, {"id": 83, "num": 3, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements are correct?\nI. In memory-mapped I/O, I/O devices share the memory address space.\nII. In isolated I/O, separate instructions such as IN and OUT access devices.", "options": ["Neither I nor II", "Only I", "Only II", "Both I and II"], "ans": 3, "exp": "Memory-mapped I/O shares memory addresses/instructions; isolated I/O uses a separate I/O space with IN/OUT instructions. Both are correct."}, {"id": 84, "num": 4, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "A hard disk has 8 surfaces, 1000 tracks/surface, 64 sectors/track, and 512 bytes/sector. What is its capacity?", "options": ["3,27,68,000 bytes", "26,21,44,000 bytes", "52,42,88,000 bytes", "2,56,000 bytes"], "ans": 1, "exp": "8 × 1000 × 64 × 512 = 26,21,44,000 bytes."}, {"id": 85, "num": 5, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "How many bytes does UTF-8 use to encode a Devanagari character such as 'क'?", "options": ["2", "3", "1", "4"], "ans": 1, "exp": "Devanagari (U+0900–U+097F) falls in U+0800–U+FFFF, which UTF-8 encodes in 3 bytes."}, {"id": 86, "num": 6, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "In a spreadsheet, the cell reference `$A1` is an example of a ______ reference.", "options": ["Absolute", "Mixed", "Relative", "Circular"], "ans": 1, "exp": "`$A1` fixes column A while allowing row 1 to change — a Mixed cell reference."}, {"id": 87, "num": 7, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the size of 1 minute of uncompressed stereo audio sampled at 44.1 kHz with 16 bits/sample? (1 MB = 10⁶ bytes.)", "options": ["About 5.29 MB", "About 10.58 MB", "About 21.17 MB", "About 84.67 MB"], "ans": 1, "exp": "44,100 × 2 bytes × 2 channels × 60 s = 10,584,000 bytes ≈ 10.58 MB."}, {"id": 88, "num": 8, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "A 5-stage instruction pipeline has 1 cycle per stage. Ignoring hazards, how many clock cycles are needed for 100 instructions?", "options": ["100", "500", "104", "105"], "ans": 2, "exp": "Cycles = k + (n − 1) = 5 + 99 = 104 cycles."}, {"id": 89, "num": 9, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which is the highest-priority interrupt of the Intel 8085 microprocessor?", "options": ["INTR", "RST 7.5", "RST 6.5", "TRAP"], "ans": 3, "exp": "Priority order: TRAP > RST 7.5 > RST 6.5 > RST 5.5 > INTR. TRAP is non-maskable."}, {"id": 90, "num": 10, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "How many 1K × 4 RAM chips are needed to build an 8K × 8 memory?", "options": ["16", "8", "32", "4"], "ans": 0, "exp": "Chips = (8K × 8) / (1K × 4) = 8 × 2 = 16 chips."}, {"id": 91, "num": 11, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Cells A1:A6 contain 45, 60, 50, 75, 80, 30. What value does `=COUNTIF(A1:A6, \">50\")` return?", "options": ["3", "4", "2", "6"], "ans": 0, "exp": "Values strictly greater than 50 are 60, 75, and 80 (50 is excluded) ⇒ 3."}, {"id": 92, "num": 12, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "A 64 KB byte-addressable main memory uses a 1 KB direct-mapped cache with 16-byte blocks. How many bits are in the TAG, LINE, and WORD fields?", "options": ["Tag 6, Line 6, Word 4", "Tag 4, Line 6, Word 6", "Tag 6, Line 4, Word 6", "Tag 8, Line 4, Word 4"], "ans": 0, "exp": "Address = 16 bits; Word = log₂(16) = 4 bits; Lines = 1024/16 = 64 ⇒ Line = 6 bits; Tag = 16 − 6 − 4 = 6 bits."}, {"id": 93, "num": 13, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "An instruction uses PC-relative addressing. After fetch, PC = 500 and the address field is −20. What is the effective address?", "options": ["480", "520", "500", "−20"], "ans": 0, "exp": "Effective Address = PC + offset = 500 + (−20) = 480."}, {"id": 94, "num": 14, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What value does the spreadsheet formula `=ROUND(2.567, 1) + INT(-3.2)` return?", "options": ["−1.4", "−0.4", "−0.6", "5.8"], "ans": 0, "exp": "ROUND(2.567, 1) = 2.6; INT(−3.2) rounds down toward −∞ to −4. Sum = 2.6 + (−4) = −1.4."}, {"id": 95, "num": 15, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "10⁻¹² second = ______.", "options": ["1 nanosecond", "1 attosecond", "1 femtosecond", "1 picosecond"], "ans": 3, "exp": "ms = 10⁻³, µs = 10⁻⁶, ns = 10⁻⁹, ps (picosecond) = 10⁻¹², fs = 10⁻¹⁵, as = 10⁻¹⁸ second."}, {"id": 96, "num": 16, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "What is the full form of UNIVAC, the first commercially produced computer in the USA?", "options": ["Universal Automatic Computer", "Universal Analog Calculator", "Unique Numerical Integrator Automatic Computer", "Universal Numeric Automatic Calculator"], "ans": 0, "exp": "UNIVAC (Universal Automatic Computer) I (1951) was designed by J. Presper Eckert and John Mauchly, who had earlier built ENIAC."}, {"id": 97, "num": 17, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "What is the full form of ASCII?", "options": ["American Standard Code for Information Interchange", "American Standard Code for Integrated Information", "Automatic Standard Code for Information Interchange", "American System Code for Information Interchange"], "ans": 0, "exp": "ASCII stands for American Standard Code for Information Interchange (7-bit standard = 128 characters; extended 8-bit = 256 characters)."}, {"id": 98, "num": 18, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "______ converts an assembly language program into machine code.", "options": ["Loader", "Compiler", "Interpreter", "Assembler"], "ans": 3, "exp": "An Assembler converts assembly language into machine code. Compilers and interpreters translate high-level languages."}, {"id": 99, "num": 19, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "Which shortcut key opens a new incognito window in Google Chrome on Windows?", "options": ["Ctrl + N", "Ctrl + Shift + N", "Ctrl + Shift + I", "Ctrl + Alt + N"], "ans": 1, "exp": "In Chrome on Windows: Ctrl+N = new window, Ctrl+T = new tab, Ctrl+Shift+N = new incognito window, Ctrl+Shift+I = DevTools."}, {"id": 100, "num": 20, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "The time taken for the desired sector to rotate under the read/write head of a disk is known as ______.", "options": ["rotational latency", "seek time", "transfer time", "access time"], "ans": 0, "exp": "Rotational latency is the wait time for the target sector to spin under the head. Seek time moves the head to the track; Access time = Seek + Rotational latency + Transfer."}]}, {"id": 6, "category": "COA", "code": "COA Mock 06", "title": "COA & Fundamentals — Mock 06", "subtitle": "Cache, Pipelining, Addressing Modes, Memory Hierarchy, Buses & IEEE 754", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 101, "num": 1, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Which shortcut key redoes the last undone action in MS Word?", "options": ["Ctrl + Y", "Ctrl + J", "Ctrl + I", "Ctrl + K"], "ans": 0, "exp": "Ctrl + Y redoes/repeats the last action (Ctrl + Z = Undo)."}, {"id": 102, "num": 2, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Which of the following is an output device?", "options": ["Scanner", "Plotter", "Joystick", "Microphone"], "ans": 1, "exp": "A plotter outputs vector graphics/maps; scanner, joystick and microphone are input devices."}, {"id": 103, "num": 3, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "In the ASCII collating sequence, which order is correct?", "options": ["Digits < Lower-case < Upper-case", "Upper-case < Lower-case < Digits", "Lower-case < Upper-case < Digits", "Digits < Upper-case letters < Lower-case letters"], "ans": 3, "exp": "ASCII codes: Digits (48–57) < Upper-case A–Z (65–90) < Lower-case a–z (97–122)."}, {"id": 104, "num": 4, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "How many address lines and data lines are needed for a 4K × 8 memory unit?", "options": ["10 address, 8 data", "12 address, 8 data", "12 address, 4 data", "8 address, 12 data"], "ans": 1, "exp": "4K = 2¹² ⇒ 12 address lines; 8-bit word ⇒ 8 data lines."}, {"id": 105, "num": 5, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "If A = 10110010 and B = 01101100, what is A after A ← A ⊕ B?", "options": ["11011110", "00100000", "11111110", "00100001"], "ans": 0, "exp": "Bitwise XOR: 10110010 ⊕ 01101100 = 11011110."}, {"id": 106, "num": 6, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Assembler directives (pseudo-instructions) like ORG and END are processed by the ______.", "options": ["compiler", "linker", "loader", "assembler"], "ans": 3, "exp": "Pseudo-instructions guide the assembler and generate no machine code."}, {"id": 107, "num": 7, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Second-generation computers used:\nI. Transistors\nII. Assembly language and early high-level languages (FORTRAN, COBOL)", "options": ["Only I", "Both I and II", "Only II", "Neither I nor II"], "ans": 1, "exp": "2nd-generation computers (1956–63) used transistors along with assembly, FORTRAN and COBOL."}, {"id": 108, "num": 8, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "A hard disk platter surface is divided into concentric circles called ______, further divided into ______.", "options": ["sectors; tracks", "tracks; sectors", "cylinders; tracks", "clusters; tracks"], "ans": 1, "exp": "Concentric circles = tracks; pie-slice subdivisions = sectors."}, {"id": 109, "num": 9, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Which statement(s) is/are NOT correct?\nI. A tightly coupled multiprocessor shares common memory.\nII. A distributed system is loosely coupled.", "options": ["Neither I nor II", "Only II", "Both I and II", "Only I"], "ans": 0, "exp": "Both I and II are TRUE, so neither is 'NOT correct'."}, {"id": 110, "num": 10, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "A step-by-step procedure written in plain language to solve a problem is an ______.", "options": ["compiler", "flowchart", "algorithm", "loader"], "ans": 2, "exp": "An algorithm is a finite step-by-step procedure in plain language."}, {"id": 111, "num": 11, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) Assembler translates assembly to machine code.\nii) Linker combines object files & libraries into an executable.\niii) Interpreter produces a complete object file before execution.\niv) Loader places program in main memory.", "options": ["i-True, ii-True, iii-False, iv-True", "i-True, ii-True, iii-True, iv-True", "i-True, ii-False, iii-False, iv-True", "i-False, ii-True, iii-True, iv-True"], "ans": 0, "exp": "An interpreter executes line-by-line and produces NO object file (iii is False); i, ii and iv are True."}, {"id": 112, "num": 12, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "In a ________ shift register, data enters one bit at a time and all stored bits are available at the outputs simultaneously.", "options": ["Parallel-In Parallel-Out", "Serial-In Parallel-Out", "Serial-In Serial-Out", "Parallel-In Serial-Out"], "ans": 1, "exp": "SIPO (Serial-In Parallel-Out) shifts bits in serially and outputs all bits simultaneously."}, {"id": 113, "num": 13, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) Cache memory is faster than main memory.\nii) ROM is a volatile memory.", "options": ["i-True, ii-False", "i-True, ii-True", "i-False, ii-True", "i-False, ii-False"], "ans": 0, "exp": "Cache (SRAM) is faster than main memory (DRAM); ROM is non-volatile ⇒ i-True, ii-False."}, {"id": 114, "num": 14, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "What is the full form of WCF with respect to .NET?", "options": ["Windows Common Format", "Web Control Framework", "Windows Communication Foundation", "Web Communication Facility"], "ans": 2, "exp": "WCF = Windows Communication Foundation (WPF = Presentation, WF = Workflow)."}, {"id": 115, "num": 15, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) CLR garbage collector frees unreferenced objects.\nii) MSIL runs directly on the processor without CLR.\niii) A .NET assembly contains MSIL, metadata and a manifest.", "options": ["i-True, ii-False, iii-True", "i-True, ii-True, iii-False", "i-False, ii-False, iii-True", "i-True, ii-True, iii-True"], "ans": 0, "exp": "MSIL requires the CLR's JIT compiler to produce native code (ii False) ⇒ i-True, ii-False, iii-True."}, {"id": 116, "num": 16, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) Interpreter executes one statement at a time.\nii) Computer organisation refers to programmer-visible attributes like ISA.\niii) RISC aims at ~1 instruction/cycle.\niv) ALU runs arithmetic/logic under CU.", "options": ["i-True, ii-False, iii-True, iv-True", "i-True, ii-True, iii-True, iv-True", "i-False, ii-False, iii-True, iv-True", "i-True, ii-True, iii-False, iv-False"], "ans": 0, "exp": "Programmer-visible attributes define Computer Architecture, not Organisation (ii False) ⇒ i-True, ii-False, iii-True, iv-True."}, {"id": 117, "num": 17, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Which hardware component is specialised for processing graphics and rendering images for display?", "options": ["GPU", "ALU", "NIC", "PSU"], "ans": 0, "exp": "The GPU (Graphics Processing Unit) handles parallel pixel processing and image rendering."}, {"id": 118, "num": 18, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which input device reads characters printed with special magnetic ink, as on bank cheques?", "options": ["OMR", "Magnetic Ink Character Recognition (MICR)", "OCR", "Light pen"], "ans": 1, "exp": "MICR reads magnetic-ink characters printed at the bottom of bank cheques."}, {"id": 119, "num": 19, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which part of the CPU temporarily holds data, instructions and intermediate results during processing?", "options": ["Hard disk", "Registers", "ROM", "Optical disk"], "ans": 1, "exp": "CPU registers (accumulator, PC, IR, etc.) are the fastest temporary storage inside the CPU."}, {"id": 120, "num": 20, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which is a characteristic of a CISC processor?", "options": ["Variable-length instructions with many addressing modes", "Fixed-length, simple instructions", "Mostly register-to-register operations", "Execution of almost every instruction in one clock cycle"], "ans": 0, "exp": "CISC (e.g., x86) features complex variable-length instructions and rich addressing modes; the other three describe RISC."}]}, {"id": 7, "category": "COA", "code": "COA Mock 07", "title": "COA & Fundamentals — Mock 07", "subtitle": "Cache, Pipelining, Addressing Modes, Memory Hierarchy, Buses & IEEE 754", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 121, "num": 1, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In which addressing mode does the instruction contain the address of a memory location which holds the address of the operand?", "options": ["Register indirect mode", "Immediate mode", "Direct addressing mode", "Indirect addressing mode"], "ans": 3, "exp": "Indirect addressing requires two memory accesses: Instruction → Memory[A] → Operand."}, {"id": 122, "num": 2, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which statement(s) is/are correct regarding machine language?\nI. Consists of binary codes (0s and 1s) executed directly by the CPU.\nII. Programs written in it are easily portable to other processors.", "options": ["Both I and II", "Only II", "Only I", "Neither I nor II"], "ans": 2, "exp": "Machine language executes directly in binary (I is true), but is CPU-specific and NOT portable (II is false)."}, {"id": 123, "num": 3, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which instruction format uses a stack and needs no address field for most operations?", "options": ["One-address", "Two-address", "Zero-address instructions", "Three-address"], "ans": 2, "exp": "Stack-organized machines use zero-address instructions (e.g., ADD pops top two elements and pushes result)."}, {"id": 124, "num": 4, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In an accumulator-based machine, which CPU register stores the result of arithmetic and logic operations?", "options": ["Program Counter", "Accumulator", "Instruction Register", "Memory Address Register"], "ans": 1, "exp": "The Accumulator (AC) serves as the implicit operand and destination for ALU operations."}, {"id": 125, "num": 5, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which of the following printers is a non-impact printer?", "options": ["Dot matrix", "Daisy wheel", "Line printer", "Laser"], "ans": 3, "exp": "Laser (and inkjet/thermal) printers are non-impact; dot matrix, daisy wheel and line printers are impact."}, {"id": 126, "num": 6, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In the cycle-stealing mode of DMA, the DMA controller ______.", "options": ["never uses the system bus", "transfers a whole block of data in one continuous burst", "transfers one data word at a time and then returns control of the bus to the CPU", "stops the CPU permanently"], "ans": 2, "exp": "Cycle-stealing steals one memory cycle to transfer one word and immediately releases the bus back to the CPU."}, {"id": 127, "num": 7, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In 7-bit ASCII, 'a' is 97. What is the 7-bit binary code of 'g'?", "options": ["1101000", "1100110", "1000111", "1100111"], "ans": 3, "exp": "'g' = 97 + 6 = 103 = 64 + 32 + 4 + 2 + 1 = 1100111₂."}, {"id": 128, "num": 8, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "______ is a variable-length Unicode encoding using 1 to 4 bytes per character and backward compatible with ASCII.", "options": ["ISCII", "UTF-32", "UTF-8", "EBCDIC"], "ans": 2, "exp": "UTF-8 encodes ASCII in 1 byte and other Unicode characters in 2–4 bytes."}, {"id": 129, "num": 9, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which spreadsheet function counts all non-empty cells in a range (whether numbers or text)?", "options": ["COUNT", "COUNTA", "COUNTBLANK", "COUNTIF"], "ans": 1, "exp": "COUNTA counts all non-empty cells; COUNT counts only numeric cells."}, {"id": 130, "num": 10, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In UTF-16, each code unit is of ______ bits.", "options": ["8", "7", "32", "16"], "ans": 3, "exp": "UTF-16 uses 16-bit code units (UTF-8 uses 8-bit; UTF-32 uses 32-bit)."}, {"id": 131, "num": 11, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which of the following is a shortcut key to centre-align a paragraph in MS-Word?", "options": ["Ctrl + L", "Ctrl + R", "Ctrl + E", "Ctrl + J"], "ans": 2, "exp": "Ctrl + E centre-aligns a paragraph (Ctrl + L = Left, Ctrl + R = Right, Ctrl + J = Justify)."}, {"id": 132, "num": 12, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the function of Ctrl + M in MS Word?", "options": ["Indent the paragraph from the left (increase indent)", "Undo the last action", "Redo the last action", "Justify paragraph alignment"], "ans": 0, "exp": "Ctrl + M indents the paragraph from the left (Ctrl + Shift + M removes it)."}, {"id": 133, "num": 13, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Software that is designed to damage, disrupt or gain unauthorised access to a computer system is known as ______.", "options": ["utility software", "malware", "firmware", "freeware"], "ans": 1, "exp": "Malware (malicious software) includes viruses, worms, Trojans, ransomware and spyware."}, {"id": 134, "num": 14, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What will be the quotient when (110110)₂ is divided by (110)₂?", "options": ["(1011)₂", "(1010)₂", "(111)₂", "(1001)₂"], "ans": 3, "exp": "(110110)₂ = 54 and (110)₂ = 6. 54 ÷ 6 = 9 = (1001)₂."}, {"id": 135, "num": 15, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "What is the full form of 'ENIAC', the first generation computer?", "options": ["Electronic Numeric Integrated Calculator", "Electronic Numerical Integrator and Computer", "Electrical Numerical Integrator and Calculator", "Electronic Network Integrator and Computer"], "ans": 1, "exp": "ENIAC stands for Electronic Numerical Integrator and Computer (built in 1946 by Eckert and Mauchly)."}, {"id": 136, "num": 16, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which generation of computers used integrated circuits (ICs)?", "options": ["First", "Second", "Fourth", "Third"], "ans": 3, "exp": "1st: Vacuum tubes, 2nd: Transistors, 3rd: Integrated Circuits (ICs), 4th: Microprocessors (VLSI), 5th: ULSI/AI."}, {"id": 137, "num": 17, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which statement(s) is/are true about the ALU?\nI. It performs arithmetic and logical operations.\nII. It controls and coordinates all the units of the computer.", "options": ["Neither I nor II", "Only II", "Both I and II", "Only I"], "ans": 3, "exp": "ALU performs arithmetic and logical operations (I is true). Controlling and coordinating all units is the Control Unit's role (II is false)."}, {"id": 138, "num": 18, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Micro-operations in digital computers are classified into four types. Which of the following is NOT one of them?", "options": ["Register transfer micro-operations", "Compile micro-operations", "Logic micro-operations", "Arithmetic micro-operations"], "ans": 1, "exp": "The four types are Register Transfer, Arithmetic, Logic and Shift micro-operations. 'Compile' is not one."}, {"id": 139, "num": 19, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "The time taken by the read/write head to move to the desired track is known as ______.", "options": ["Transfer time", "Rotational delay", "Seek time", "Access time"], "ans": 2, "exp": "Seek time is the time to move the disk head to the target track (Rotational latency waits for the sector)."}]}, {"id": 8, "category": "COA", "code": "COA Mock 08", "title": "COA & Fundamentals — Mock 08", "subtitle": "Cache, Pipelining, Addressing Modes, Memory Hierarchy, Buses & IEEE 754", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 140, "num": 1, "topic": "Computer Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "______ holds the address of the memory location that is to be read or written.", "options": ["MAR", "MDR", "PC", "IR"], "ans": 0, "exp": "Memory Address Register (MAR) holds the target memory address; MDR holds the data."}, {"id": 141, "num": 2, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which computer architecture uses separate memories and separate buses for instructions and data?", "options": ["Harvard architecture", "Von Neumann architecture", "Micro architecture", "Instruction Set Architecture"], "ans": 0, "exp": "Harvard architecture separates instruction and data memory/buses for simultaneous access (used in DSPs/microcontrollers)."}, {"id": 142, "num": 3, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "A 2-way set-associative cache has capacity 16 KB, block size 64 B, byte-addressable 32-bit physical address. Number of TAG bits:", "options": ["18", "19", "20", "21"], "ans": 1, "exp": "Blocks = 16KB/64B = 256; Sets = 256/2 = 128 = 2⁷ (7 bits); Offset = log₂ 64 = 6 bits ⇒ TAG = 32 − 7 − 6 = 19 bits."}, {"id": 143, "num": 4, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which translates an entire high-level program into machine code before execution?", "options": ["Interpreter", "Assembler", "Compiler", "Loader"], "ans": 2, "exp": "A compiler translates the whole program into object/machine code before execution."}, {"id": 144, "num": 5, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which statement is NOT true?", "options": ["4 kilobytes is equal to 4,000 bytes", "3 kilobytes is equal to 6,144 nibbles", "2 kilobytes is equal to 16,384 bits", "1 megabyte is equal to 1,024 kilobytes"], "ans": 0, "exp": "In binary memory sizing, 1 KB = 1024 bytes, so 4 KB = 4,096 bytes (not 4,000)."}, {"id": 145, "num": 6, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which statement is NOT true about software?", "options": ["A compiler is application software.", "Application software runs on top of the OS.", "Device drivers are system software.", "The OS manages hardware resources."], "ans": 0, "exp": "A compiler is system software (language translator), not application software."}, {"id": 146, "num": 7, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Who founded Flipkart?", "options": ["Kunal Bahl and Rohit Bansal", "Sachin Bansal and Binny Bansal", "Jeff Bezos", "Vijay Shekhar Sharma"], "ans": 1, "exp": "Flipkart was founded in 2007 in Bengaluru by Sachin Bansal and Binny Bansal."}, {"id": 147, "num": 8, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which addressing mode is used in the instruction MOV R1, #25?", "options": ["Direct", "Register", "Immediate", "Register indirect"], "ans": 2, "exp": "#25 embeds the constant operand directly in the instruction → Immediate addressing."}, {"id": 148, "num": 9, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which small, very fast memory is placed between the CPU and main memory?", "options": ["Cache memory", "Virtual memory", "Hard disk", "Optical disk"], "ans": 0, "exp": "Cache memory holds frequently accessed instructions/data between CPU and RAM to reduce latency."}, {"id": 149, "num": 10, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "A DRAM chip has 8192 rows refreshed once every 64 ms. Under distributed refresh, what is the interval between two successive row refreshes?", "options": ["8.192 µs", "15.625 µs", "64 µs", "7.8125 µs"], "ans": 3, "exp": "Interval = 64 ms / 8192 = 64,000 µs / 8192 = 7.8125 µs."}, {"id": 150, "num": 11, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which software tool is used by developers to track and manage changes in source code?", "options": ["Image editor", "Version control system such as Git", "Spreadsheet", "Antivirus software"], "ans": 1, "exp": "Version control systems (Git, SVN) track code history, enable collaboration, and allow reverting changes."}, {"id": 151, "num": 12, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which term refers to raw facts and figures that have not yet been processed?", "options": ["Knowledge", "Information", "Data", "Wisdom"], "ans": 2, "exp": "Data = raw unprocessed facts; processed data becomes Information."}, {"id": 152, "num": 13, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Static RAM (SRAM) stores each bit of information in a/an _____.", "options": ["capacitor", "resistor", "diode", "flip-flop"], "ans": 3, "exp": "SRAM uses flip-flop latches (4–6 transistors), requiring no periodic refresh unlike DRAM (capacitors)."}, {"id": 153, "num": 14, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which key combination opens the Task Manager directly in Windows?", "options": ["Ctrl + Shift + Esc", "Ctrl + Alt + Tab", "Alt + F4", "Windows + D"], "ans": 0, "exp": "Ctrl + Shift + Esc launches Task Manager directly."}, {"id": 154, "num": 15, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What is the 8-bit 2's complement representation of −75?", "options": ["01001011", "10110100", "11001011", "10110101"], "ans": 3, "exp": "+75 = 01001011 → 1's = 10110100 → 2's = 10110101."}, {"id": 155, "num": 16, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which sequence of micro-operations performs the instruction fetch phase?", "options": ["T0: MAR ← PC; T1: MBR ← M[MAR], PC ← PC + 1; T2: IR ← MBR", "T0: IR ← PC; T1: MAR ← IR; T2: PC ← PC + 1", "T0: MBR ← PC; T1: MAR ← MBR; T2: IR ← M[MAR]", "T0: PC ← MAR; T1: MBR ← M[PC]; T2: IR ← PC + 1"], "ans": 0, "exp": "MAR ← PC, then fetch memory word into MBR while incrementing PC, then load IR ← MBR."}, {"id": 156, "num": 17, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which is a characteristic of RISC architecture?", "options": ["A large number of complex instructions", "Simple, fixed-length instructions that mostly execute in one clock cycle", "Many complex addressing modes", "Mainly microprogrammed control"], "ans": 1, "exp": "RISC (ARM, MIPS) uses simple fixed-length instructions and hardwired control for ~1-cycle execution."}, {"id": 157, "num": 18, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Select the INCORRECT option among the components of a CPU:", "options": ["Monitor", "Control Unit", "Registers", "ALU"], "ans": 0, "exp": "Monitor is an external output device; CPU contains ALU, Control Unit, and Registers."}, {"id": 158, "num": 19, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which ROM type can be erased electrically, byte by byte?", "options": ["EPROM", "PROM", "EEPROM", "Mask ROM"], "ans": 2, "exp": "EEPROM is electrically erasable byte-by-byte (EPROM uses UV light; Flash erases block-by-block)."}]}, {"id": 9, "category": "COA", "code": "COA Mock 09", "title": "COA & Fundamentals — Mock 09", "subtitle": "Cache, Pipelining, Addressing Modes, Memory Hierarchy, Buses & IEEE 754", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 159, "num": 1, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Google was founded by _____.", "options": ["Steve Jobs and Steve Wozniak", "Bill Gates and Paul Allen", "Jan Koum and Brian Acton", "Larry Page and Sergey Brin"], "ans": 3, "exp": "Founded in 1998 by Larry Page and Sergey Brin."}, {"id": 160, "num": 2, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Dividing main memory into modules so consecutive addresses lie in different modules for parallel access is called:", "options": ["Memory compaction", "Memory mapping", "Paging", "Memory interleaving"], "ans": 3, "exp": "Memory interleaving spreads consecutive addresses across multiple memory banks to increase memory bandwidth."}, {"id": 161, "num": 3, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Keeping copies of the same memory location consistent across private caches of a multicore processor is called:", "options": ["Cache flushing", "Cache replacement", "Cache mapping", "Cache coherence"], "ans": 3, "exp": "Cache coherence protocols (like MESI/snooping) ensure all cores see consistent values for shared memory locations."}, {"id": 162, "num": 4, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Two 8-bit unsigned numbers, 200 and 100, are added by a processor. Which status flag is set?", "options": ["Carry flag", "No flag", "Zero flag", "Sign flag only"], "ans": 0, "exp": "200 + 100 = 300 > 255 (max 8-bit unsigned), generating a 9th carry bit → Carry flag is set."}, {"id": 163, "num": 5, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "A program makes 1,200 memory references, of which 960 are found in the cache. What is the cache hit ratio?", "options": ["0.96", "0.8", "0.2", "0.75"], "ans": 1, "exp": "Hit ratio = 960 / 1200 = 0.8 (80%)."}, {"id": 164, "num": 6, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "A processor runs at 2.5 GHz. What is the duration of one clock cycle?", "options": ["4 ns", "0.25 ns", "2.5 ns", "0.4 ns"], "ans": 3, "exp": "T = 1 / (2.5 × 10⁹ Hz) = 0.4 × 10⁻⁹ s = 0.4 ns."}, {"id": 165, "num": 7, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "A 64-bit data bus transfers data once per clock cycle at 100 MHz. What is its maximum data-transfer rate?", "options": ["100 MB/s", "64 MB/s", "6.4 GB/s", "800 MB/s"], "ans": 3, "exp": "64 bits = 8 bytes × 100 × 10⁶ cycles/s = 800 MB/s."}, {"id": 166, "num": 8, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "In associative (content-addressable) memory, such as a TLB:", "options": ["Data is located by comparing its content with a search key in all locations in parallel", "Data is stored only on magnetic tape", "Each word must be read sequentially", "Data is located by address only"], "ans": 0, "exp": "Associative memory (CAM) compares the search key against every stored word in parallel for single-step lookup."}, {"id": 167, "num": 9, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "The observation that the number of transistors on an IC chip doubles roughly every two years is known as:", "options": ["Ohm's law", "Metcalfe's law", "Amdahl's law", "Moore's law"], "ans": 3, "exp": "Gordon Moore's Law (1965/1975) states transistor density on ICs doubles approximately every two years."}, {"id": 168, "num": 10, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Restarting a computer that is already switched on (via Restart or Ctrl + Alt + Del) is called:", "options": ["Shutting down", "Hibernation", "Warm booting", "Cold booting"], "ans": 2, "exp": "Warm booting restarts an already powered-on system; cold booting starts from power-off."}, {"id": 169, "num": 11, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "The 32-bit value 0x12345678 is stored starting at address 100 on a little-endian machine. Which byte is at address 100?", "options": ["0x78", "0x34", "0x56", "0x12"], "ans": 0, "exp": "Little-endian stores the least significant byte first: 100→0x78, 101→0x56, 102→0x34, 103→0x12."}, {"id": 170, "num": 12, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "In the system bus, which group of lines carries signals such as Memory Read, Memory Write, and Interrupt Request?", "options": ["Address bus", "Power bus", "Data bus", "Control bus"], "ans": 3, "exp": "The control bus carries timing and command signals (Memory Read/Write, I/O Read/Write, IRQ, clock, reset)."}, {"id": 171, "num": 13, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Which hardware unit translates virtual (logical) addresses generated by the CPU into physical memory addresses?", "options": ["MMU (Memory Management Unit)", "ALU", "Program counter", "DMA controller"], "ans": 0, "exp": "The MMU uses the page table and TLB to convert virtual addresses to physical addresses and triggers page faults when needed."}, {"id": 172, "num": 14, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Compared with a hard disk drive (HDD), a solid-state drive (SSD):", "options": ["Is a type of optical storage", "Has no moving parts and gives much faster random access", "Loses its data when power is switched off", "Uses spinning magnetic platters and a moving read/write head"], "ans": 1, "exp": "SSDs use non-volatile NAND flash with no moving parts, eliminating seek time and rotational delay for much faster random access."}, {"id": 173, "num": 15, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Which statement about USB (Universal Serial Bus) is correct?", "options": ["It is used only for printers", "It transfers data in parallel over 32 lines", "It supports hot plugging, so devices can be connected and removed while the computer is running", "It can connect only one device to a computer"], "ans": 2, "exp": "USB is a serial bus supporting hot plugging, plug-and-play, power delivery, and up to 127 devices via hubs."}, {"id": 174, "num": 16, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Software permanently stored in a ROM/flash chip that controls basic hardware operation (like BIOS) is called:", "options": ["Freeware", "Shareware", "Middleware", "Firmware"], "ans": 3, "exp": "Firmware (e.g., BIOS/UEFI, router OS) is stored permanently in non-volatile ROM/EEPROM/flash memory."}, {"id": 175, "num": 17, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Which arrangement lists memory types in order of decreasing speed (fastest first)?", "options": ["Registers, cache, main memory, hard disk", "Cache, registers, main memory, hard disk", "Main memory, registers, cache, hard disk", "Registers, main memory, cache, hard disk"], "ans": 0, "exp": "Memory hierarchy from fastest to slowest: CPU Registers → Cache (L1/L2/L3) → Main Memory (RAM) → Secondary Storage (SSD/HDD)."}, {"id": 176, "num": 18, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A process has a virtual address space of 2 MB and page size 4 KB. How many pages does it have?", "options": ["512", "256", "2048", "1024"], "ans": 0, "exp": "Pages = 2 MB / 4 KB = 2²¹ / 2¹² = 2⁹ = 512."}, {"id": 177, "num": 19, "topic": "Computer Organisation & Fundamentals", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Integrated circuits (ICs) were the main electronic component of which generation of computers?", "options": ["Third generation", "Fourth generation", "First generation", "Second generation"], "ans": 0, "exp": "1st: Vacuum tubes; 2nd: Transistors; 3rd: Integrated Circuits (ICs); 4th: Microprocessors (VLSI); 5th: AI/ULSI."}]}, {"id": 10, "category": "Digital", "code": "DIG Mock 01", "title": "Digital Electronics — Mock 01", "subtitle": "Number Systems, Boolean Algebra, K-Maps, Flip-Flops, Counters & Decoders", "durationSec": 660, "timeLabel": "11-Min", "questions": [{"id": 178, "num": 1, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "The truth table of a Boolean function of 3 variables has ______ rows.", "options": ["3", "6", "8", "9"], "ans": 2, "exp": "An n-variable truth table has 2ⁿ rows; for n = 3, 2³ = 8 rows."}, {"id": 179, "num": 2, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "In a half subtractor that computes A − B, the difference is given by ______.", "options": ["A · B", "A + B", "A ⊕ B", "A′ · B"], "ans": 2, "exp": "Half subtractor outputs: Difference = A ⊕ B (XOR) and Borrow = A′ · B."}, {"id": 180, "num": 3, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "A decade (mod-10) counter goes through ______ distinct states before it repeats.", "options": ["8", "9", "10", "16"], "ans": 2, "exp": "A mod-N counter has N distinct states; a decade (mod-10) counter cycles through 10 states (0 to 9)."}, {"id": 181, "num": 4, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "Which of the following statement(s) is/are correct?\nI. An ADC converts a digital signal into an analog signal.\nII. A DAC converts a digital signal into an analog signal.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "ADC converts analog → digital; DAC (digital-to-analog converter) converts digital → analog. So only Statement II is correct."}, {"id": 182, "num": 5, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "What is the octal number (7654)₈ in hexadecimal?", "options": ["EAC", "FCA", "FAC", "1FAC"], "ans": 2, "exp": "(7654)₈ = 111 110 101 100₂; regrouping into 4-bit nibbles from right: 1111 1010 1100 = FAC₁₆."}, {"id": 183, "num": 6, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "How many 2-to-4 decoders (each with an enable input) are needed to build a 4-to-16 decoder?", "options": ["5", "4", "8", "6"], "ans": 0, "exp": "Four 2-to-4 decoders generate the 16 outputs, and one additional 2-to-4 decoder decodes the 2 high-order bits to enable one of the four → 4 + 1 = 5."}, {"id": 184, "num": 7, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "By the absorption law, the Boolean expression A + AB simplifies to ______.", "options": ["AB", "A + B", "A", "B"], "ans": 2, "exp": "A + AB = A(1 + B) = A."}, {"id": 185, "num": 8, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding an SR flip-flop built with NOR gates?\nI. S = 0, R = 0 resets the output to 0.\nII. S = 1, R = 1 is the invalid (forbidden) input condition.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "I is false (S=0, R=0 holds state). II is true."}, {"id": 186, "num": 9, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "The 2's complement of the binary number 0110 is ______.", "options": ["1010", "1001", "1011", "0111"], "ans": 0, "exp": "1's complement of 0110 is 1001; adding 1 gives 1010."}, {"id": 187, "num": 10, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following statement(s) is/are correct?\nI. An encoder converts 2ⁿ input lines into an n-bit binary code.\nII. A decoder converts an n-bit binary code into one of 2ⁿ output lines.", "options": ["Only I", "Only II", "Neither I nor II", "Both I and II"], "ans": 3, "exp": "Both statements are correct."}, {"id": 188, "num": 11, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "For which base x is (121)ₓ = (49)₁₀?", "options": ["5", "7", "8", "6"], "ans": 3, "exp": "x² + 2x + 1 = (x + 1)² = 49 ⇒ x + 1 = 7 ⇒ x = 6."}, {"id": 189, "num": 12, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following codes is self-complementing (code for 9 − d is obtained by inverting every bit of d)?", "options": ["Excess-3", "BCD (8421)", "Gray code", "ASCII"], "ans": 0, "exp": "Excess-3 is a self-complementing code."}, {"id": 190, "num": 13, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "What is the minimum number of 2-input NAND gates needed to implement a 2-input XOR gate?", "options": ["3", "5", "4", "6"], "ans": 2, "exp": "Minimum 2-input NAND gates for XOR = 4 (sharing G1 = (AB)')."}, {"id": 191, "num": 14, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "A multiplexer with 2 select lines can select one of ______ data inputs.", "options": ["2", "3", "4", "8"], "ans": 2, "exp": "2 select lines choose among 2² = 4 inputs."}, {"id": 192, "num": 15, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "The BCD numbers 0111 and 1001 are added. What is the correct BCD result?", "options": ["0001 0110", "0001 0000", "1 0000", "0000 1111"], "ans": 0, "exp": "0111 + 1001 = 10000 (>9); add 6 (0110) → 0001 0110 (BCD 16)."}, {"id": 193, "num": 16, "topic": "Digital Electronics & Number Systems", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "A 4-bit ring counter is initialised to 1000, and on each clock pulse its contents rotate one place to the right. What d
