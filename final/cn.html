    const STORAGE_ANS = "net_web_cyber_dsssb_answers_v1";
    const STORAGE_SUB = "net_web_cyber_dsssb_submitted_v1";
    const STORAGE_THEME = "net_web_cyber_dsssb_theme_v1";

    function safeGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function safeSet(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    let answers = safeGet(STORAGE_ANS, {});
    let submittedMocks = safeGet(STORAGE_SUB, {});
    let activeCategory = "Networks";
    let activeMockId = DATA.mocks[0].id;
    let quizMode = "instant";
    let activeFilter = "all";

    const timerState = {};
    DATA.mocks.forEach((m) => {
      timerState[m.id] = { remaining: m.durationSec, running: false };
    });
    let tickInterval = null;

    function getActiveMock() {
      return DATA.mocks.find((m) => m.id === activeMockId);
    }

    function getCategoryMocks(catKey) {
      return DATA.mocks.filter((m) => m.category === catKey);
    }

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function isRevealed(mockId, qId) {
      if (quizMode === "instant") return answers[qId] !== undefined;
      return Boolean(submittedMocks[mockId]);
    }

    function computeMockStats(mock) {
      let attempted = 0, correct = 0, wrong = 0;
      const showTruth = quizMode === "instant" || Boolean(submittedMocks[mock.id]);
      mock.questions.forEach((q) => {
        if (answers[q.id] !== undefined) {
          attempted++;
          if (showTruth) {
            if (answers[q.id] === q.ans) correct++;
            else wrong++;
          }
        }
      });
      const marks = showTruth ? (correct * 1 - wrong * 0.25) : 0;
      const acc = showTruth && attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
      return { attempted, correct, wrong, marks, acc, showTruth, total: mock.questions.length };
    }

    function computeOverallStats() {
      let done = 0, correct = 0, wrong = 0, total = 0;
      DATA.mocks.forEach((m) => {
        const showTruth = quizMode === "instant" || Boolean(submittedMocks[m.id]);
        m.questions.forEach((q) => {
          total++;
          if (answers[q.id] !== undefined) {
            done++;
            if (showTruth) {
              if (answers[q.id] === q.ans) correct++;
              else wrong++;
            }
          }
        });
      });
      return { done, total, marks: (correct - wrong * 0.25).toFixed(2) };
    }

    function stopInterval() {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
    }

    function pauseAllTimers() {
      Object.keys(timerState).forEach((k) => { timerState[k].running = false; });
      stopInterval();
    }

    function startTimerForActive() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      if (st.remaining <= 0) st.remaining = mock.durationSec;
      pauseAllTimers();
      st.running = true;
      updateTimerUI();
      tickInterval = setInterval(() => {
        const cur = timerState[activeMockId];
        if (!cur.running) { stopInterval(); return; }
        cur.remaining = Math.max(0, cur.remaining - 1);
        updateTimerUI();
        if (cur.remaining === 0) {
          cur.running = false;
          stopInterval();
          showScorecardModal("⏱ Time's Up!");
        }
      }, 1000);
    }

    function toggleTimer() {
      const st = timerState[activeMockId];
      if (st.running) {
        st.running = false;
        stopInterval();
        updateTimerUI();
      } else {
        startTimerForActive();
      }
    }

    function resetTimer() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      st.running = false;
      st.remaining = mock.durationSec;
      stopInterval();
      updateTimerUI();
    }

    function updateTimerUI() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      const formatted = formatTime(st.remaining);
      document.getElementById("heroTimerText").textContent = formatted;
      document.getElementById("miniTimerText").textContent = formatted;
      document.getElementById("timerLabel").textContent = `${mock.timeLabel.toUpperCase()} TIMER`;
      document.getElementById("timerToggleBtn").textContent = st.running ? "Pause" : (st.remaining < mock.durationSec && st.remaining > 0 ? "Resume" : "Start");
      document.getElementById("timerStatusBadge").textContent = st.remaining === 0 ? "TIME UP" : (st.running ? "LIVE" : (st.remaining < mock.durationSec ? "PAUSED" : "READY"));

      const pct = Math.max(0, (st.remaining / mock.durationSec) * 100);
      const bar = document.getElementById("timerProgressBar");
      const miniPill = document.getElementById("miniTimerPill");
      bar.style.width = `${pct}%`;

      miniPill.classList.remove("timer-urgent", "bg-rose-100", "dark:bg-rose-950/60", "text-rose-700", "dark:text-rose-300", "border-rose-300", "bg-amber-100", "dark:bg-amber-950/60", "text-amber-700", "dark:text-amber-300", "border-amber-300");
      bar.classList.remove("bg-emerald-300", "bg-amber-300", "bg-rose-400");

      if (st.remaining <= 60) {
        bar.classList.add("bg-rose-400");
        miniPill.classList.add("bg-rose-100", "dark:bg-rose-950/60", "text-rose-700", "dark:text-rose-300", "border-rose-300");
        if (st.running) miniPill.classList.add("timer-urgent");
      } else if (st.remaining <= 150) {
        bar.classList.add("bg-amber-300");
        miniPill.classList.add("bg-amber-100", "dark:bg-amber-950/60", "text-amber-700", "dark:text-amber-300", "border-amber-300");
      } else {
        bar.classList.add("bg-emerald-300");
      }
    }

    function openModal(title, bodyHtml, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      buttons.forEach((b) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = b.label;
        btn.className = b.cls;
        btn.addEventListener("click", () => {
          closeModal();
          if (b.onClick) b.onClick();
        });
        actions.appendChild(btn);
      });
      document.getElementById("modalBackdrop").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.add("hidden");
    }

    function showScorecardModal(titlePrefix) {
      const mock = getActiveMock();
      submittedMocks[mock.id] = true;
      safeSet(STORAGE_SUB, submittedMocks);
      const st = computeMockStats(mock);
      renderAll();
      openModal(
        `${titlePrefix} — ${mock.code} Scorecard`,
        `
          <div class="grid grid-cols-2 gap-2.5 text-center">
            <div class="rounded-xl bg-indigo-50 dark:bg-indigo-500/15 p-3">
              <div class="text-xl font-black text-indigo-700 dark:text-indigo-300">${st.marks.toFixed(2)} / ${st.total}</div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">NET MARKS</div>
            </div>
            <div class="rounded-xl bg-emerald-50 dark:bg-emerald-500/15 p-3">
              <div class="text-xl font-black text-emerald-700 dark:text-emerald-300">${st.acc}%</div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">ACCURACY</div>
            </div>
            <div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-2.5 text-xs font-bold">Correct: <span class="text-emerald-600 dark:text-emerald-400">${st.correct}</span></div>
            <div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-2.5 text-xs font-bold">Wrong: <span class="text-rose-600 dark:text-rose-400">${st.wrong}</span> &bull; Left: ${st.total - st.attempted}</div>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400">All answers and explanations for ${escapeHtml(mock.code)} are now unlocked below.</p>
        `,
        [
          {
            label: "Review Wrong Only",
            cls: "px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer",
            onClick: () => { activeFilter = "wrong"; renderAll(); }
          },
          {
            label: "View All Solutions",
            cls: "px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold cursor-pointer"
          }
        ]
      );
    }

    function renderCategoryTabs() {
      const wrap = document.getElementById("categoryTabs");
      wrap.innerHTML = DATA.categories.map((c) => {
        const active = c.key === activeCategory;
        const catMocks = getCategoryMocks(c.key);
        const done = catMocks.reduce((acc, m) => acc + m.questions.filter((q) => answers[q.id] !== undefined).length, 0);
        const cls = active
          ? "bg-slate-900 dark:bg-indigo-600 text-white border-slate-900 dark:border-indigo-600 shadow-xs"
          : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-indigo-400";
        const badgeCls = active ? "bg-white/20 text-white" : "bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300";
        return `
          <button type="button" data-cat="${escapeHtml(c.key)}"
            class="cat-tab shrink-0 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border text-xs font-extrabold transition cursor-pointer ${cls}">
            <span>${escapeHtml(c.label)}</span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md tabular-nums ${badgeCls}">${c.mocks} Mocks &bull; ${done}/${c.count}</span>
          </button>
        `;
      }).join("");
    }

    function renderMockTabs() {
      const wrap = document.getElementById("mockTabs");
      const catMocks = getCategoryMocks(activeCategory);
      wrap.innerHTML = catMocks.map((m) => {
        const active = m.id === activeMockId;
        const done = m.questions.filter((q) => answers[q.id] !== undefined).length;
        const cls = active
          ? "bg-indigo-600 text-white border-indigo-600 shadow-xs"
          : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-indigo-700";
        const pillCls = active ? "bg-white/20 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400";
        return `
          <button type="button" data-mock-id="${m.id}"
            class="mock-tab shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-bold transition cursor-pointer ${cls}">
            <span>${escapeHtml(m.code)}</span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full tabular-nums ${pillCls}">${done}/${m.questions.length}</span>
          </button>
        `;
      }).join("");
    }

    function renderHeroAndStats() {
      const mock = getActiveMock();
      const st = computeMockStats(mock);
      const ov = computeOverallStats();

      document.getElementById("heroBadge").textContent = `${mock.category} Dedicated Mock`;
      document.getElementById("heroQCount").textContent = `${mock.questions.length} Questions · +1.00 / −0.25`;
      document.getElementById("heroTitle").textContent = mock.title;
      document.getElementById("heroSub").textContent = mock.subtitle;

      document.getElementById("statAttempted").textContent = `${st.attempted}/${st.total}`;
      document.getElementById("statMarks").textContent = st.showTruth ? st.marks.toFixed(2) : "—";
      document.getElementById("statAccuracy").textContent = st.showTruth ? `${st.acc}%` : "—";
      document.getElementById("overallScorePill").textContent = `${ov.done}/${ov.total} Done • ${ov.marks} Marks`;

      const instBtn = document.getElementById("modeInstantBtn");
      const examBtn = document.getElementById("modeExamBtn");
      const subBtn = document.getElementById("submitExamBtn");

      if (quizMode === "instant") {
        instBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white cursor-pointer";
        examBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer";
        subBtn.classList.add("hidden");
      } else {
        examBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white cursor-pointer";
        instBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer";
        if (!submittedMocks[mock.id]) subBtn.classList.remove("hidden");
        else subBtn.classList.add("hidden");
      }

      document.querySelectorAll("#filterGroup .flt-btn").forEach((btn) => {
        const active = btn.dataset.filter === activeFilter;
        btn.className = active
          ? "flt-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 cursor-pointer"
          : "flt-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer";
      });

      document.getElementById("prevMockBtn").disabled = activeMockId <= 1;
      document.getElementById("nextMockBtn").disabled = activeMockId >= DATA.mocks.length;
      updateTimerUI();
    }

    function renderPalette() {
      const mock = getActiveMock();
      const wrap = document.getElementById("questionPalette");
      document.getElementById("paletteTitle").textContent = `Question Palette (Jump to Q1–Q${mock.questions.length})`;
      const showTruth = quizMode === "instant" || Boolean(submittedMocks[mock.id]);
      wrap.innerHTML = mock.questions.map((q) => {
        const picked = answers[q.id];
        let cls = "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700";
        if (picked !== undefined) {
          if (!showTruth) cls = "bg-indigo-600 text-white border-indigo-600";
          else if (picked === q.ans) cls = "bg-emerald-600 text-white border-emerald-600";
          else cls = "bg-rose-600 text-white border-rose-600";
        }
        return `
          <button type="button" data-jump="qcard-${q.id}"
            class="pal-btn w-8 h-7 rounded-lg border text-[11px] font-bold tabular-nums hover:opacity-85 cursor-pointer ${cls}">
            ${q.num}
          </button>
        `;
      }).join("");
    }

    function renderQuestions() {
      const mock = getActiveMock();
      const list = document.getElementById("questionsList");
      const showTruthGlobal = quizMode === "instant" || Boolean(submittedMocks[mock.id]);

      const filtered = mock.questions.filter((q) => {
        const picked = answers[q.id];
        if (activeFilter === "unanswered") return picked === undefined;
        if (activeFilter === "wrong") {
          return showTruthGlobal && picked !== undefined && picked !== q.ans;
        }
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 text-center space-y-2">
            <p class="text-sm font-bold text-slate-700 dark:text-slate-200">No questions match the current filter.</p>
            <button type="button" id="clearFilterBtn" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Show All Questions</button>
          </div>
        `;
        const cf = document.getElementById("clearFilterBtn");
        if (cf) cf.addEventListener("click", () => { activeFilter = "all"; renderAll(); });
        return;
      }

      const letters = ["A", "B", "C", "D"];
      list.innerHTML = filtered.map((q) => {
        const picked = answers[q.id];
        const revealed = isRevealed(mock.id, q.id);

        const optsHtml = q.options.map((opt, idx) => {
          let btnCls = "border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40 hover:border-indigo-400 dark:hover:border-indigo-500 text-slate-800 dark:text-slate-100";
          let badgeCls = "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700";
          let mark = "";

          if (revealed) {
            if (idx === q.ans) {
              btnCls = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200";
              badgeCls = "bg-emerald-600 text-white border-emerald-600";
              mark = '<span class="ml-auto text-xs font-extrabold text-emerald-600 dark:text-emerald-400">✓ Correct</span>';
            } else if (picked === idx) {
              btnCls = "border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-900 dark:text-rose-200";
              badgeCls = "bg-rose-600 text-white border-rose-600";
              mark = '<span class="ml-auto text-xs font-extrabold text-rose-600 dark:text-rose-400">✗ Your Pick</span>';
            } else {
              btnCls = "border-slate-200/70 dark:border-slate-800/70 bg-white dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 opacity-75";
            }
          } else if (picked === idx) {
            btnCls = "border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-900 dark:text-indigo-200";
            badgeCls = "bg-indigo-600 text-white border-indigo-600";
            mark = '<span class="ml-auto text-xs font-bold text-indigo-600 dark:text-indigo-400">Selected</span>';
          }

          return `
            <button type="button" data-qid="${q.id}" data-opt="${idx}"
              class="opt-btn w-full text-left flex items-center gap-3 p-3 rounded-xl border text-xs sm:text-sm font-medium transition cursor-pointer ${btnCls}">
              <span class="w-6 h-6 rounded-lg border text-xs font-extrabold flex items-center justify-center shrink-0 ${badgeCls}">${letters[idx]}</span>
              <span class="flex-1 leading-snug font-mono sm:font-sans">${escapeHtml(opt)}</span>
              ${mark}
            </button>
          `;
        }).join("");

        const expHtml = revealed && q.exp ? `
          <div class="mt-3 rounded-xl bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-200/80 dark:border-indigo-800/60 p-3.5 text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
            <span class="font-extrabold text-indigo-700 dark:text-indigo-300">Explanation: </span>${escapeHtml(q.exp)}
          </div>
        ` : "";

        // Format code lines neatly if question contains multi-line code
        const lines = q.q.split("\n");
        let qBodyHtml = "";
        if (lines.length > 1) {
          qBodyHtml = `
            <p class="text-sm sm:text-base font-semibold text-slate-900 dark:text-white leading-relaxed mb-2.5">${escapeHtml(lines[0])}</p>
            <pre class="rounded-xl bg-slate-900 text-slate-100 p-3.5 text-xs sm:text-sm font-mono overflow-x-auto mb-3.5 leading-relaxed">${escapeHtml(lines.slice(1).join("\n"))}</pre>
          `;
        } else {
          qBodyHtml = `<p class="text-sm sm:text-base font-semibold text-slate-900 dark:text-white leading-relaxed mb-3.5">${escapeHtml(q.q)}</p>`;
        }

        return `
          <article id="qcard-${q.id}" class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5 shadow-xs scroll-mt-40">
            <div class="flex flex-wrap items-center gap-2 mb-2.5">
              <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-indigo-600 text-white">Q${q.num}</span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">${escapeHtml(mock.category)}</span>
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border text-sky-800 dark:text-sky-300 bg-sky-100 dark:bg-sky-900/40 border-sky-200 dark:border-sky-800">📘 ${escapeHtml(q.exam)}</span>
            </div>
            ${qBodyHtml}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${optsHtml}
            </div>
            ${expHtml}
          </article>
        `;
      }).join("");
    }

    function renderAll() {
      renderCategoryTabs();
      renderMockTabs();
      renderHeroAndStats();
      renderPalette();
      renderQuestions();
    }

    document.getElementById("categoryTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-tab");
      if (!btn) return;
      const nextCat = btn.dataset.cat;
      if (nextCat === activeCategory) return;
      pauseAllTimers();
      activeCategory = nextCat;
      const firstMock = getCategoryMocks(activeCategory)[0];
      if (firstMock) activeMockId = firstMock.id;
      activeFilter = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("mockTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".mock-tab");
      if (!btn) return;
      const nextId = Number(btn.dataset.mockId);
      if (nextId === activeMockId) return;
      pauseAllTimers();
      activeMockId = nextId;
      activeFilter = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("questionsList").addEventListener("click", (e) => {
      const btn = e.target.closest(".opt-btn");
      if (!btn) return;
      const qId = Number(btn.dataset.qid);
      const optIdx = Number(btn.dataset.opt);
      const mock = getActiveMock();

      const st = timerState[activeMockId];
      if (!st.running && st.remaining === mock.durationSec) {
        startTimerForActive();
      }

      if (quizMode === "instant") {
        if (answers[qId] !== undefined) return;
        answers[qId] = optIdx;
      } else {
        if (submittedMocks[mock.id]) return;
        answers[qId] = optIdx;
      }
      safeSet(STORAGE_ANS, answers);
      renderAll();
    });

    document.getElementById("questionPalette").addEventListener("click", (e) => {
      const btn = e.target.closest(".pal-btn");
      if (!btn) return;
      const target = document.getElementById(btn.dataset.jump);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      } else {
        activeFilter = "all";
        renderAll();
        setTimeout(() => {
          const el = document.getElementById(btn.dataset.jump);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 50);
      }
    });

    document.getElementById("filterGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".flt-btn");
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      renderAll();
    });

    document.getElementById("modeInstantBtn").addEventListener("click", () => { quizMode = "instant"; renderAll(); });
    document.getElementById("modeExamBtn").addEventListener("click", () => { quizMode = "exam"; renderAll(); });
    document.getElementById("submitExamBtn").addEventListener("click", () => { pauseAllTimers(); showScorecardModal("Mock Submitted"); });
    document.getElementById("timerToggleBtn").addEventListener("click", toggleTimer);
    document.getElementById("timerResetBtn").addEventListener("click", resetTimer);

    document.getElementById("resetMockBtn").addEventListener("click", () => {
      const mock = getActiveMock();
      openModal(
        `Reset ${mock.code}?`,
        `<p>This will clear all saved answers and reset the timer for <strong>${escapeHtml(mock.code)}</strong>.</p>`,
        [
          { label: "Cancel", cls: "px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer" },
          {
            label: "Reset Mock",
            cls: "px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold cursor-pointer",
            onClick: () => {
              mock.questions.forEach((q) => { delete answers[q.id]; });
              delete submittedMocks[mock.id];
              safeSet(STORAGE_ANS, answers);
              safeSet(STORAGE_SUB, submittedMocks);
              resetTimer();
              activeFilter = "all";
              renderAll();
            }
          }
        ]
      );
    });

    document.getElementById("prevMockBtn").addEventListener("click", () => {
      if (activeMockId > 1) {
        pauseAllTimers();
        activeMockId--;
        activeCategory = getActiveMock().category;
        activeFilter = "all";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("nextMockBtn").addEventListener("click", () => {
      if (activeMockId < DATA.mocks.length) {
        pauseAllTimers();
        activeMockId++;
        activeCategory = getActiveMock().category;
        activeFilter = "all";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("modalCloseX").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeModal(); });

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.classList.toggle("dark", isDark);
      document.getElementById("themeIcon").textContent = isDark ? "☀️" : "🌙";
    }
    applyTheme(safeGet(STORAGE_THEME, "light"));
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
      safeSet(STORAGE_THEME, next);
      applyTheme(next);
    });

    renderAll();
  </script>
</body>
</html>
