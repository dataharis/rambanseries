, "exp": "An absolutely positioned element is placed relative to its nearest positioned (non-static) ancestor."}, {"id": 183, "num": 7, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "What does `console.log(1 + \"2\" + 3, 1 + 2 + \"3\", \"5\" - 2 + 1);` print?", "options": ["123 123 4", "6 33 4", "123 33 4", "123 33 \"321\""], "ans": 2, "exp": "1+\"2\"+3 = \"123\"; 1+2+\"3\" = \"33\"; \"5\"-2+1 = 4 → `123 33 4`."}, {"id": 184, "num": 8, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which of the following is NOT a valid way to declare a variable in JavaScript?", "options": ["var x = 5;", "let x = 5;", "const x = 5;", "int x = 5;"], "ans": 3, "exp": "JavaScript uses `var`, `let`, or `const`; `int x = 5;` is a SyntaxError."}, {"id": 185, "num": 9, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Which cookie attribute prevents client-side JavaScript (`document.cookie`) from reading the cookie, reducing XSS damage?", "options": ["SameSite", "Secure", "HttpOnly", "Domain"], "ans": 2, "exp": "`HttpOnly` makes cookies inaccessible to client-side JavaScript."}, {"id": 186, "num": 10, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "What is the colour of the paragraph's text?\n<style> #x { color: red; } .y { color: green !important; } <\/style>\n<p id=\"x\" class=\"y\" style=\"color: blue;\">Text<\/p>", "options": ["Black (the default)", "Blue", "Red", "Green"], "ans": 3, "exp": "An `!important` declaration overrides normal inline styles and higher-specificity normal selectors → Green."}, {"id": 187, "num": 11, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding the typeof operator in JavaScript?\nI. typeof [1, 2, 3] returns \"array\".\nII. typeof null returns \"object\".", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "I is false (`typeof [1,2,3]` is \"object\"). II is true (`typeof null` returns \"object\")."}, {"id": 188, "num": 12, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "What is the marker shown for the first item of the list <ol type=\"i\" start=\"4\">?", "options": ["iii", "4", "d", "iv"], "ans": 3, "exp": "`type=\"i\"` uses lowercase Roman numerals; 4 in lowercase Roman is `iv`."}, {"id": 189, "num": 13, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "In JavaScript, the array method ______ creates a new array by applying a given function to every element of the original array.", "options": ["forEach()", "filter()", "reduce()", "map()"], "ans": 3, "exp": "`map()` transforms every element and returns a new array of the same length."}, {"id": 190, "num": 14, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "In AJAX, an XMLHttpRequest object's readyState property has the value 4. What does this mean?", "options": ["The response body is being received", "The operation is complete", "The response headers have been received", "The request was successful (HTTP 200)"], "ans": 1, "exp": "`readyState === 4` (DONE) indicates the operation is complete (HTTP status is checked separately)."}, {"id": 191, "num": 15, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following HTTP methods is NOT idempotent?", "options": ["GET", "PUT", "DELETE", "POST"], "ans": 3, "exp": "GET, PUT, and DELETE are idempotent; POST may create duplicate resources on repeat requests."}, {"id": 192, "num": 16, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "A div has CSS rules: width: 200px; padding: 10px; border: 5px solid; margin: 20px; with default box-sizing. What is the width of its visible box (outer edge of left border to outer edge of right border)?", "options": ["230px", "200px", "270px", "250px"], "ans": 0, "exp": "Default `content-box`: visible width = 200 + 2(10) + 2(5) = 230px. Margin is outside the visible box."}, {"id": 193, "num": 17, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "What does the === operator check in JavaScript?", "options": ["Only whether two values are equal after type conversion", "Whether two values are equal in both value and type, without type conversion", "Whether a variable is declared", "Whether two objects have the same number of properties"], "ans": 1, "exp": "`===` (strict equality) checks both value and data type without performing type coercion."}, {"id": 194, "num": 18, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Match the HTTP status codes with their meanings:\nP. 301  Q. 304  R. 403  S. 503\n1. Not Modified  2. Service Unavailable  3. Moved Permanently  4. Forbidden", "options": ["P-3, Q-1, R-4, S-2", "P-1, Q-3, R-4, S-2", "P-3, Q-1, R-2, S-4", "P-3, Q-4, R-1, S-2"], "ans": 0, "exp": "301 = Moved Permanently (3), 304 = Not Modified (1), 403 = Forbidden (4), 503 = Service Unavailable (2)."}, {"id": 195, "num": 19, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding a well-formed XML document?\nI. It must have exactly one root element.\nII. XML tags are not case-sensitive.\nIII. Every start tag must have a matching end tag.", "options": ["I and II only", "II and III only", "I and III only", "I, II and III"], "ans": 2, "exp": "I and III are true. II is false because XML tags are strictly case-sensitive."}, {"id": 196, "num": 20, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which protocol does a web browser use to request web pages from a web server?", "options": ["FTP", "SMTP", "HTTP", "SNMP"], "ans": 2, "exp": "Web browsers use HTTP (or HTTPS) to request and retrieve web pages from servers."}]}, {"id": 11, "category": "WebTech", "code": "WEB Mock 02", "title": "Web Technologies — Mock 02", "subtitle": "HTML5, CSS Selectors, JavaScript, DOM, XML & Web Standards", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 197, "num": 1, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "A page has 1 base HTML file and 10 small images on the same server. Using non-persistent HTTP without parallel connections, how many RTTs are needed?", "options": ["11", "22", "12", "3"], "ans": 1, "exp": "Each of the 11 objects requires 1 RTT for TCP handshake + 1 RTT for HTTP request/response = 22 RTT."}, {"id": 198, "num": 2, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Output of JavaScript:\nvar x = 1; function f() { console.log(x); var x = 2; } f();", "options": ["1", "undefined", "2", "ReferenceError"], "ans": 1, "exp": "Local `var x` is hoisted to the top of `f()` shadowing global `x` before assignment, printing `undefined`."}, {"id": 199, "num": 3, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "In JavaScript, fetch() returns a ______ that resolves to a Response object.", "options": ["String", "XMLDocument", "Boolean", "Promise"], "ans": 3, "exp": "fetch() initiates an async request and immediately returns a Promise."}, {"id": 200, "num": 4, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "A DTD declares <!ELEMENT book (title, author+, price?)>. Which book element is valid?", "options": ["<book><author/><title/><price/><\/book>", "<book><title/><price/><\/book>", "<book><title/><author/><author/><\/book>", "<book><title/><author/><price/><price/><\/book>"], "ans": 2, "exp": "Order must be 1 title, 1+ authors (+), and 0–1 price (?). Only option (c) satisfies all constraints."}, {"id": 201, "num": 5, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "What is printed by the following JavaScript code?\nfor (var i = 0; i < 3; i++) { setTimeout(() => console.log(i), 0); }", "options": ["0 0 0", "0 1 2", "3 3 3", "2 2 2"], "ans": 2, "exp": "`var` is function-scoped and shared by all callbacks; after the loop finishes, i = 3, so all three print 3 → 3 3 3."}, {"id": 202, "num": 6, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Regarding HTML5 web storage:\nI. Data in sessionStorage is shared across all tabs and windows of the same site.\nII. Data in localStorage has no expiry date and persists after the browser closes.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "sessionStorage is scoped to a single tab (I false); localStorage persists across browser restarts (II true)."}, {"id": 203, "num": 7, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Consider the markup and CSS rules (in order): What is the colour of 'Hello'?\n<div id=\"main\" class=\"text\"><p class=\"note\">Hello<\/p><\/div>\n#main p { color: red; }\n.text p.note { color: blue; }\ndiv p { color: green; }", "options": ["Blue", "Red", "Green", "Black, because the rules conflict"], "ans": 1, "exp": "Specificities: #main p = (1,0,1), .text p.note = (0,2,1), div p = (0,0,2). One ID beats any number of classes, so Red wins."}, {"id": 204, "num": 8, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following statements about the HTTP GET and POST methods is correct?", "options": ["A browser never caches a GET response", "GET data is encrypted in the URL, while POST data is sent as plain text", "GET can send unlimited data, while POST is limited to 2 KB", "GET is meant to be safe and idempotent, while POST may change data on the server"], "ans": 3, "exp": "GET is designed for safe, idempotent reads (cacheable); POST submits data that may create or modify resources on the server."}, {"id": 205, "num": 9, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding the + operator in JavaScript?\nI. If either operand of + is a string, the other operand is converted to a string and the two are joined.\nII. The − operator also joins strings in the same way as +.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "+ performs string concatenation if either operand is a string ('5' + 2 = '52'). The − operator always converts operands to numbers ('5' − 2 = 3)."}, {"id": 206, "num": 10, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which JavaScript method shows a message in a dialog box with only an OK button?", "options": ["prompt()", "confirm()", "alert()", "console.log()"], "ans": 2, "exp": "`alert()` displays a message dialog with only an OK button. `confirm()` has OK/Cancel; `prompt()` takes text input."}, {"id": 207, "num": 11, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following is a valid XML element name?", "options": ["first name", "2price", "_price", "xmlData"], "ans": 2, "exp": "XML names may start with a letter or underscore (`_price`), cannot contain spaces, cannot start with a digit, and cannot begin with 'xml'."}, {"id": 208, "num": 12, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding the GET method of an HTML form:\nI. Form data is appended to the URL as a query string.\nII. It is the preferred method for sending passwords and large amounts of data.", "options": ["Both I and II", "Only II", "Only I", "Neither I nor II"], "ans": 2, "exp": "GET appends data to the URL (I true), so POST is preferred for passwords and large payloads (II false)."}, {"id": 209, "num": 13, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "The CSS z-index property has effect on an element only when ______.", "options": ["The element is positioned (relative, absolute, fixed or sticky)", "The element has a border", "The element is an inline element", "The element has a background colour"], "ans": 0, "exp": "`z-index` applies to positioned elements (non-static) as well as flex/grid items."}, {"id": 210, "num": 14, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Regarding JavaScript comparison:\nI. == converts operand types before comparing.\nII. === returns true only when both value and type match.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "`==` performs type coercion; `===` enforces strict equality without coercion."}, {"id": 211, "num": 15, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "What does XML stand for?", "options": ["Extra Markup Language", "eXtensible Markup Language", "Executable Multiple Language", "eXtended Machine Language"], "ans": 1, "exp": "XML = eXtensible Markup Language."}, {"id": 212, "num": 16, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "In a JavaScript event handler, which property refers to the element on which the event actually occurred, even when handled on an ancestor?", "options": ["event.type", "event.currentTarget", "event.target", "this.parentNode"], "ans": 2, "exp": "`event.target` is the originating element; `event.currentTarget` is the element whose listener is executing."}, {"id": 213, "num": 17, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which HTTP method is normally used to submit form data in the request body (e.g., creating a new record)?", "options": ["POST", "GET", "HEAD", "TRACE"], "ans": 0, "exp": "POST sends payload data in the HTTP request body."}, {"id": 214, "num": 18, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following statements is/are correct?\nI. HTTP is a stateless protocol.\nII. Cookies are used to maintain state, such as login sessions, between HTTP requests.", "options": ["Only II", "Only I", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "HTTP handles every request independently (stateless); cookies and sessions are used to maintain user state across requests."}, {"id": 215, "num": 19, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which HTML5 element embeds a sound file with the browser's play, pause and volume controls?", "options": ["<music src=\"song.mp3\" play>", "<sound src=\"song.mp3\">", "<audio src=\"song.mp3\" controls>", "<embed audio=\"song.mp3\">"], "ans": 2, "exp": "HTML5 uses `<audio src=\"song.mp3\" controls>` to embed audio with built-in playback controls."}, {"id": 216, "num": 20, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which CSS selector selects all <p> elements that are direct children of a <div>?", "options": ["div ~ p", "div p", "div + p", "div > p"], "ans": 3, "exp": "`div > p` is the child combinator (direct children only). `div p` selects any descendant; `div + p` adjacent sibling; `div ~ p` general sibling."}]}, {"id": 12, "category": "WebTech", "code": "WEB Mock 03", "title": "Web Technologies — Mock 03", "subtitle": "HTML5, CSS Selectors, JavaScript, DOM, XML & Web Standards", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 217, "num": 1, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which JavaScript keyword declares a block-scoped variable whose value cannot be reassigned?", "options": ["var", "let", "const", "static"], "ans": 2, "exp": "`const` declares a block-scoped binding that cannot be reassigned after initialization."}, {"id": 218, "num": 2, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Why are namespaces used in XML?", "options": ["To compress the document", "To define the data types of elements", "To link a style sheet to the document", "To avoid conflicts between elements of the same name taken from different vocabularies"], "ans": 3, "exp": "XML namespaces bind prefixes to unique URIs so identically named elements (e.g., `h:table` and `f:table`) do not collide."}, {"id": 219, "num": 3, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What does the DOM method document.querySelectorAll(\".item\") return?", "options": ["A NodeList of all the elements having the class item", "Only the first element having the class item", "The element whose id is item", "An array of the text of all the elements"], "ans": 0, "exp": "`document.querySelectorAll(\".item\")` returns a static NodeList containing all elements matching the `.item` selector."}, {"id": 220, "num": 4, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "The root (html) element has a font size of 16px. What is the computed font size of an element with font-size: 1.5rem?", "options": ["32px", "16px", "1.5px", "24px"], "ans": 3, "exp": "`rem` is relative to the root `<html>` font size: 1.5 × 16px = 24px."}, {"id": 221, "num": 5, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which HTML5 element represents a self-contained piece of content, such as a blog post or news story, that could be distributed independently?", "options": ["<section>", "<article>", "<aside>", "<div>"], "ans": 1, "exp": "`<article>` represents independent, self-contained content."}, {"id": 222, "num": 6, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "In a CSS flex container, what does `justify-content: space-between` do?", "options": ["Stretches items vertically", "Puts equal space on both sides of every item", "Packs all items at the centre", "Places the first item at the start, the last at the end, and spreads equal space between items"], "ans": 3, "exp": "`space-between` aligns the first and last items flush with the container edges and distributes equal gaps between items."}, {"id": 223, "num": 7, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements regarding JavaScript are correct?\nI. JavaScript is not case-sensitive, so total and Total are the same variable.\nII. A variable declared with `var` is block-scoped.", "options": ["Only I", "Both I and II", "Only II", "Neither I nor II"], "ans": 3, "exp": "JavaScript IS case-sensitive, and `var` is function-scoped (let/const are block-scoped). Hence Neither I nor II."}, {"id": 224, "num": 8, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "What is XSLT mainly used for?", "options": ["Compressing XML documents", "Defining legal elements of an XML document", "Parsing XML documents event by event", "Transforming XML documents into other formats such as HTML"], "ans": 3, "exp": "XSLT (eXtensible Stylesheet Language Transformations) transforms XML into HTML, text, or another XML structure."}, {"id": 225, "num": 9, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which attribute of the HTML `<img>` tag specifies alternative text shown when the image cannot be displayed?", "options": ["title", "href", "src", "alt"], "ans": 3, "exp": "The `alt` attribute provides fallback text and accessibility descriptions for screen readers."}, {"id": 226, "num": 10, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which HTTP status code is returned when the requested resource does not exist on the server?", "options": ["404", "200", "500", "301"], "ans": 0, "exp": "404 = Not Found (200 = OK, 301 = Moved Permanently, 500 = Internal Server Error)."}, {"id": 227, "num": 11, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which HTML tag is used to group related options inside a drop-down list created with <select>?", "options": ["<datalist>", "<group>", "<fieldset>", "<optgroup>"], "ans": 3, "exp": "<optgroup label='...'> groups related <option> elements inside a <select> dropdown."}, {"id": 228, "num": 12, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which value of the CSS `position` property keeps an element at the same place in the browser window even when scrolled?", "options": ["relative", "absolute", "fixed", "static"], "ans": 2, "exp": "`position: fixed` positions an element relative to the browser viewport so it stays put during scrolling."}, {"id": 229, "num": 13, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "What is the output of the JavaScript code?\n`console.log(a); var a = 10;`", "options": ["undefined", "10", "ReferenceError", "null"], "ans": 0, "exp": "`var` declarations are hoisted to the top of their scope initialized to `undefined` until assignment runs."}, {"id": 230, "num": 14, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "In a DTD, what does `<!ELEMENT book (title, author+, price?)>` mean?", "options": ["A book contains one title, then one or more authors, then an optional price", "A book contains any number of titles, authors and prices in any order", "A book contains one title, then zero or more authors, then exactly one price", "A book contains one title or one author or one price"], "ans": 0, "exp": "Commas enforce sequence; no symbol = exactly once, '+' = one or more, '?' = zero or one (optional)."}, {"id": 231, "num": 15, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which JavaScript event occurs when an input element loses focus?", "options": ["onselect", "onfocus", "onchange", "onblur"], "ans": 3, "exp": "`onblur` fires when an element loses focus (`onfocus` fires when it gains focus)."}, {"id": 232, "num": 16, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which statements about `@media (max-width: 600px) { … }` are correct?\nI. Applies when viewport width is 600 px or less.\nII. Used to build responsive web pages for small screens.", "options": ["Neither I nor II", "Only I", "Only II", "Both I and II"], "ans": 3, "exp": "Media queries with `max-width: 600px` apply styles on viewports ≤ 600 px to enable responsive mobile layouts. Both I and II are correct."}, {"id": 233, "num": 17, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which file of an ASP.NET application contains handlers for application-level events like Application_Start and Session_Start?", "options": ["Global.asax", "Web.config", "Machine.config", "Default.aspx"], "ans": 0, "exp": "`Global.asax` holds application-level and session-level event handlers (`Web.config` stores configuration settings)."}, {"id": 234, "num": 18, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Which attribute of an HTML <input> element makes the field mandatory so the browser blocks empty form submission?", "options": ["validate", "mandatory", "required", "notnull"], "ans": 2, "exp": "The HTML5 boolean attribute `required` enforces that an input field cannot be submitted empty."}, {"id": 235, "num": 19, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Given CSS rules `p.note { color: red; }`, `#main p { color: blue; }`, and `p { color: green; }`, what colour is the text in `<div id=\"main\"><p class=\"note\">Hi<\/p><\/div>`?", "options": ["Blue", "Red", "Green", "Black (browser default)"], "ans": 0, "exp": "Specificity: #main p = (1,0,1) > p.note = (0,1,1) > p = (0,0,1). ID selector wins ⇒ Blue."}]}, {"id": 13, "category": "WebTech", "code": "WEB Mock 04", "title": "Web Technologies — Mock 04", "subtitle": "HTML5, CSS Selectors, JavaScript, DOM, XML & Web Standards", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 236, "num": 1, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "What will be the output of the JavaScript code?\n`console.log(typeof null, typeof [], 2 + \"2\" - 1);`", "options": ["object object 21", "null array 21", "object array 3", "object object 3"], "ans": 0, "exp": "typeof null is 'object', typeof [] is 'object', and 2 + '2' = '22', then '22' - 1 = 21. Output: object object 21."}, {"id": 237, "num": 2, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Which of the following XML fragments is NOT well-formed?", "options": ["<a id=\"1\"><b>Text<\/b><\/a>", "<a><b>Text<\/b><\/a>", "<a><b/><\/a>", "<a><b>Text<\/a><\/b>"], "ans": 3, "exp": "In `<a><b>Text<\/a><\/b>`, tags overlap improperly (<b> is opened inside <a> but closed outside it), violating XML nesting rules."}, {"id": 238, "num": 3, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "In the W3C DOM event model, in which order does an event pass through the phases of event flow?", "options": ["Capturing phase → Target phase → Bubbling phase", "Bubbling phase → Target phase → Capturing phase", "Target phase → Capturing phase → Bubbling phase", "Capturing phase → Bubbling phase → Target phase"], "ans": 0, "exp": "DOM events travel down from window to target (Capturing), fire at the target (Target), and propagate back up (Bubbling)."}, {"id": 239, "num": 4, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "An element has width: 200px; padding: 10px; border: 5px solid; margin: 20px; with box-sizing: content-box. What total horizontal space does it occupy?", "options": ["230px", "270px", "250px", "200px"], "ans": 1, "exp": "Total horizontal space = 200 + 2×(10 + 5 + 20) = 200 + 70 = 270px."}, {"id": 240, "num": 5, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "Which HTML tag is used to display another web page inside the current page in an inline frame?", "options": ["<frame>", "<iframe>", "<link>", "<meta>"], "ans": 1, "exp": "<iframe> embeds another HTML document inside the current page. <frame> is obsolete in HTML5."}, {"id": 241, "num": 6, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "______ is the person responsible for the visual layout, colours and overall look of a website.", "options": ["System analyst", "Web master", "Database administrator", "Web designer"], "ans": 3, "exp": "A Web designer creates the visual layout, colours, and UX. A Web master maintains the server, uptime, and security."}, {"id": 242, "num": 7, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Which CSS property is used to make text italic?", "options": ["font-style", "font-weight", "font-family", "text-transform"], "ans": 0, "exp": "font-style: italic; sets italic text (font-weight controls boldness)."}, {"id": 243, "num": 8, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Which CSS shorthand property sets all four margins of an element at once?", "options": ["margin-all", "margin", "padding", "border-margin"], "ans": 1, "exp": "margin: top right bottom left; sets all four margins."}, {"id": 244, "num": 9, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "A ______ shows all the pages of a website and how they are linked hierarchically.", "options": ["storyboard", "wireframe", "mock-up", "sitemap"], "ans": 3, "exp": "A sitemap outlines the complete page hierarchy of a website."}, {"id": 245, "num": 10, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Which of the following is NOT a back-end (server-side or database) technology?", "options": ["PHP", "PL/SQL", "Node.js", "HTML"], "ans": 3, "exp": "HTML is a front-end markup language rendered by the browser (PHP, Node.js, PL/SQL are back-end)."}, {"id": 246, "num": 11, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Match JavaScript Events:\na) onclick  b) onload  c) onmouseover  d) onchange\ni) Page finishes loading  ii) User clicks element  iii) Input value changes  iv) Mouse pointer moves onto element", "options": ["a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iv, d-iii", "a-ii, b-iv, c-i, d-iii", "a-iii, b-i, c-iv, d-ii"], "ans": 1, "exp": "onclick→ii, onload→i, onmouseover→iv, onchange→iii ⇒ a-ii, b-i, c-iv, d-iii."}, {"id": 247, "num": 12, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) HTML id must be unique per page.\nii) HTML is used for server-side form processing.\niii) Same class can apply to many elements, and one element can have multiple classes.", "options": ["i-True, ii-False, iii-True", "i-True, ii-True, iii-False", "i-False, ii-False, iii-True", "i-True, ii-True, iii-True"], "ans": 0, "exp": "HTML is client-side markup, not server-side processing (ii False) ⇒ i-True, ii-False, iii-True."}, {"id": 248, "num": 13, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Truthfulness:\ni) XML Schema is written in XML syntax & supports data types.\nii) DTD supports integer and date data types.\niii) XML element names can begin with a digit.", "options": ["i-False, ii-False, iii-True", "i-True, ii-True, iii-False", "i-True, ii-False, iii-False", "i-True, ii-False, iii-True"], "ans": 2, "exp": "Only XML Schema (XSD) supports rich data types (DTD does not), and XML names cannot start with digits ⇒ i-True, ii-False, iii-False."}, {"id": 249, "num": 14, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Match HTML list tags:\nA. <ol>  B. <ul>  C. <dl>  D. <li>\n1. List item  2. Ordered list  3. Unordered list  4. Description list", "options": ["A-2, B-3, C-1, D-4", "A-3, B-2, C-4, D-1", "A-2, B-3, C-4, D-1", "A-4, B-3, C-2, D-1"], "ans": 2, "exp": "<ol>→2, <ul>→3, <dl>→4, <li>→1 ⇒ A-2, B-3, C-4, D-1."}, {"id": 250, "num": 15, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Purpose(s) of the Document Object Model (DOM):\ni) Let scripts access and change content, structure and style of a web page.\nii) Compile JavaScript into machine code.", "options": ["Only (i)", "Both (i) and (ii)", "Only (ii)", "Neither (i) nor (ii)"], "ans": 0, "exp": "DOM exposes the document as an object tree for scripts to manipulate; it does not compile JS."}, {"id": 251, "num": 16, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "In ASP.NET, ________ connects a control (such as GridView) to a data source so it displays and updates data automatically.", "options": ["data marshalling", "data mining", "data hiding", "data binding"], "ans": 3, "exp": "Data binding links UI controls directly to data sources."}, {"id": 252, "num": 17, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Which of the following is the correct XML declaration?", "options": ["<xml version=\"1.0\">", "<?xml version=\"1.0\" encoding=\"UTF-8\"?>", "<!xml version=\"1.0\"!>", "<?XML-version 1.0?>"], "ans": 1, "exp": "A valid XML declaration starts with <?xml ... ?> in lowercase."}, {"id": 253, "num": 18, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In the HTML <body> tag, which attribute specifies the colour of hyperlinks that have NOT yet been visited?", "options": ["LINK", "ALINK", "VLINK", "TEXT"], "ans": 0, "exp": "LINK = unvisited links, VLINK = visited links, ALINK = active link, TEXT = body text."}, {"id": 254, "num": 19, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which is NOT a valid attribute of the HTML <img> tag?", "options": ["href", "alt", "width", "src"], "ans": 0, "exp": "href belongs to <a> and <link>, not <img> (which uses src, alt, width, height)."}]}, {"id": 14, "category": "WebTech", "code": "WEB Mock 05", "title": "Web Technologies — Mock 05", "subtitle": "HTML5, CSS Selectors, JavaScript, DOM, XML & Web Standards", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 255, "num": 1, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which HTML tag defines the title shown on the browser's title bar or tab?", "options": ["<title>", "<head>", "<meta>", "<header>"], "ans": 0, "exp": "<title> (placed inside <head>) sets the browser tab/window title."}, {"id": 256, "num": 2, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which is the correct way to write a comment in CSS?", "options": ["/* This is a comment */", "// This is a comment", "<!-- This is a comment -->", "# This is a comment"], "ans": 0, "exp": "CSS uses /* ... */ comments (HTML uses <!-- -->; Python uses #)."}, {"id": 257, "num": 3, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which rule must be followed while naming XML elements?", "options": ["Element names can start with a digit.", "Element names can start with 'xml' freely.", "Element names can contain spaces.", "Element names are case-sensitive."], "ans": 3, "exp": "XML element names are case-sensitive, cannot start with a digit or 'xml', and cannot contain spaces."}, {"id": 258, "num": 4, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In HTML, what marker is displayed before the first item of <ol type=\"I\" start=\"4\">?", "options": ["D", "4", "IV", "iv"], "ans": 2, "exp": "type=\"I\" uses uppercase Roman numerals and start=\"4\" starts at 4 ⇒ IV."}, {"id": 259, "num": 5, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which statement(s) is/are true about the sitemap of a website?\nI. It lists the pages of the website.\nII. It helps search engines to crawl the website.", "options": ["Only I", "Both I and II", "Only II", "Neither I nor II"], "ans": 1, "exp": "A sitemap (e.g., sitemap.xml) lists the pages of a website and helps search engines discover and crawl them."}, {"id": 260, "num": 6, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "______ is an HTML5 feature that lets web pages store data locally in the user's browser.", "options": ["Canvas", "Geolocation", "Web Storage", "Web Workers"], "ans": 2, "exp": "HTML5 Web Storage (localStorage and sessionStorage) stores key-value data locally in the browser."}, {"id": 261, "num": 7, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "______ URL scheme is used to place a telephone call from a web page on a mobile device.", "options": ["phone:", "mailto:", "call:", "tel:"], "ans": 3, "exp": "<a href=\"tel:+91...\"> initiates a phone call (while mailto: opens an email client)."}, {"id": 262, "num": 8, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which attribute must be added to an HTML element to make it a server control in ASP.NET?", "options": ["runin=\"server\"", "runas=\"server\"", "runat=\"server\"", "server=\"true\""], "ans": 2, "exp": "Adding runat=\"server\" makes an HTML element programmable on the ASP.NET server."}, {"id": 263, "num": 9, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which value of the HTML target attribute opens the linked document in a new window or tab?", "options": ["_self", "_blank", "_parent", "_top"], "ans": 1, "exp": "target=\"_blank\" opens the link in a new tab or window."}, {"id": 264, "num": 10, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which is the correct syntax for internal CSS?", "options": ["<link style=\"p { color: blue; }\">", "<css> p { color: blue; } <\/css>", "<style> p { color: blue; } <\/style> placed inside the <head> section", "<script> p { color: blue; } <\/script>"], "ans": 2, "exp": "Internal CSS is written inside a <style> element within <head>."}, {"id": 265, "num": 11, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which jQuery method gradually hides selected elements by fading them out?", "options": ["slideUp()", "fadeOut()", "hideFade()", "dim()"], "ans": 1, "exp": "fadeOut() animates opacity to 0 and hides the element."}, {"id": 266, "num": 12, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "How is an internal DTD declared in an XML document?", "options": ["<!DOCTYPE root-element SYSTEM \"file.dtd\">", "<!DOCTYPE SYSTEM [element-declarations]>", "<!DTD root-element [element-declarations]>", "<!DOCTYPE root-element [element-declarations]>"], "ans": 3, "exp": "Internal DTD wraps declarations inside square brackets after the root element name."}, {"id": 267, "num": 13, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which AngularJS directive defines the root element of an AngularJS application?", "options": ["ng-init", "ng-app", "ng-model", "ng-start"], "ans": 1, "exp": "ng-app marks the root element and bootstraps an AngularJS application."}, {"id": 268, "num": 14, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "In CSS, which feature allows an element to change gradually from one style to another through a series of keyframes?", "options": ["Masking", "Animations", "Web Fonts", "Media queries"], "ans": 1, "exp": "CSS Animations use @keyframes rules to define multi-step style progressions."}, {"id": 269, "num": 15, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which is a valid syntax to declare an attribute in an XML DTD?", "options": ["<!ELEMENT element-name category>", "<!ATTLIST element-name attribute-name attribute-type attribute-value>", "<!ATTRIBUTE element-name attribute-name attribute-type>", "<!#ATTLIST element-name attribute-name>"], "ans": 1, "exp": "DTD attributes use <!ATTLIST element-name attribute-name attribute-type attribute-value>."}, {"id": 270, "num": 16, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which of the following is a server-side scripting language used in back-end web development?", "options": ["HTML", "CSS", "PHP", "jQuery"], "ans": 2, "exp": "PHP executes on the web server to generate HTML; HTML, CSS, and jQuery run on the client browser."}, {"id": 271, "num": 17, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which ASP.NET control ensures that a user has entered a value in a mandatory input field?", "options": ["CompareValidator", "RangeValidator", "RequiredFieldValidator", "RegularExpressionValidator"], "ans": 2, "exp": "RequiredFieldValidator prevents a mandatory field from being left blank."}, {"id": 272, "num": 18, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which of the following is NOT a back-end technology?", "options": ["CSS", "PHP", "Django", "Node.js"], "ans": 0, "exp": "CSS styles web pages in the browser (front-end); PHP, Django, and Node.js run on the server."}, {"id": 273, "num": 19, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which XML parser reads sequentially and raises events as it encounters elements without building an in-memory tree?", "options": ["DOM", "XSLT", "DTD", "SAX"], "ans": 3, "exp": "SAX (Simple API for XML) is event-driven and forward-only, using minimal memory compared to DOM."}]}, {"id": 15, "category": "WebTech", "code": "WEB Mock 06", "title": "Web Technologies — Mock 06", "subtitle": "HTML5, CSS Selectors, JavaScript, DOM, XML & Web Standards", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 274, "num": 1, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which front-end tool is a popular CSS framework for building responsive web pages?", "options": ["Bootstrap", "Git", "MySQL", "Apache"], "ans": 0, "exp": "Bootstrap provides a responsive grid and pre-styled UI components."}, {"id": 275, "num": 2, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "In Internet Explorer DHTML, which feature applies visual effects like blur, shadow, or glow through CSS?", "options": ["Frames", "Cookies", "Applets", "Filters"], "ans": 3, "exp": "DHTML Filters (e.g., filter: blur(strength=5)) were IE CSS extensions for visual effects."}, {"id": 276, "num": 3, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What is the primary function of a search engine?", "options": ["To find and list web pages that match the keywords entered", "To send and receive e-mails", "To create websites", "To store personal data"], "ans": 0, "exp": "Search engines crawl, index, and rank matching web pages for user queries."}, {"id": 277, "num": 4, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which JavaScript statement hides an HTML element with id 'menu' dynamically?", "options": ["document.hide(\"menu\");", "document.getElementById(\"menu\").style.display = \"none\";", "window.menu.visible = false;", "document.getElementById(\"menu\").setHidden();"], "ans": 1, "exp": "Setting style.display = \"none\" removes the element dynamically."}, {"id": 278, "num": 5, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which object is traditionally used by AJAX to exchange data asynchronously with a server?", "options": ["XMLHttpRequest", "document.write", "window.alert", "Math"], "ans": 0, "exp": "XMLHttpRequest (XHR) is the traditional AJAX transport object."}, {"id": 279, "num": 6, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which JavaScript method opens a new browser window?", "options": ["window.create()", "document.newWindow()", "window.open()", "browser.open()"], "ans": 2, "exp": "window.open(url, target, features) opens a new window or tab."}, {"id": 280, "num": 7, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which PHP function sorts an associative array in ascending order by KEY?", "options": ["sort()", "asort()", "rsort()", "ksort()"], "ans": 3, "exp": "ksort() sorts by key ascending (asort = value ascending keeping keys; krsort = key descending)."}, {"id": 281, "num": 8, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "What is the output of: let x = \"5\"; let y = 5; console.log(x == y, x === y);", "options": ["false true", "true true", "false false", "true false"], "ans": 3, "exp": "== coerces types (true); === checks strict value + type (false). Output: true false."}, {"id": 282, "num": 9, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Which HTML5 element provides a drawing area on which graphics, charts, and animations are drawn using JavaScript?", "options": ["<svg-draw>", "<canvas>", "<frame>", "<graphic>"], "ans": 1, "exp": "<canvas> provides a pixel-based raster drawing surface controlled via the JavaScript Canvas API."}, {"id": 283, "num": 10, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "In a URL, the space in 'toppers choice' is usually percent-encoded as:", "options": ["&nbsp;", "%20", "\\s", "#20"], "ans": 1, "exp": "ASCII space = 32 = 0x20 → percent-encoded as %20."}, {"id": 284, "num": 11, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "What will be the output of the following JavaScript code?", "options": ["\"12px1\" NaN", "13 NaN", "NaN NaN", "13 12"], "ans": 1, "exp": "parseInt(\"12px\") parses leading digits → 12 (+1 = 13); Number(\"12px\") rejects trailing chars → NaN. Output: 13 NaN."}, {"id": 285, "num": 12, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "WordPress and Joomla, which let users create and manage website content via a dashboard without writing HTML, are:", "options": ["Web servers", "Search engines", "Web browsers", "Content Management Systems (CMS)"], "ans": 3, "exp": "WordPress and Joomla are Content Management Systems (CMS) using databases and themes."}, {"id": 286, "num": 13, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "To display the text 'a < b' correctly in HTML, the character '<' should be written as:", "options": ["&lt;", "&amp;", "&quot;", "&gt;"], "ans": 0, "exp": "'<' starts an HTML tag, so use entity &lt; (less than)."}, {"id": 287, "num": 14, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "How is a favicon (small browser tab icon) usually added to a web page?", "options": ["<img src=\"icon.png\" type=\"tab\"> in the body", "<title icon=\"favicon.ico\">", "<link rel=\"icon\" href=\"favicon.ico\"> inside <head>", "<meta name=\"icon\" content=\"favicon.ico\"> in the body"], "ans": 2, "exp": "Place <link rel=\"icon\" href=\"favicon.ico\"> inside the <head> section."}, {"id": 288, "num": 15, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Which of the following is valid JSON?", "options": ["{\"name\": \"Asha\", \"age\": 25,}", "{'name': 'Asha', 'age': 25}", "{\"name\": \"Asha\", \"age\": 25}", "{name: \"Asha\", age: 25}"], "ans": 2, "exp": "JSON requires double-quoted keys and string values, and forbids trailing commas. Only option (c) is valid."}, {"id": 289, "num": 16, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "What is the main purpose of the alt attribute of the <img> tag?", "options": ["It specifies the image file path", "It adds a tooltip border around the image", "It gives alternative text shown if the image fails to load and read aloud by screen readers", "It sets the alignment of the image"], "ans": 2, "exp": "The alt attribute provides accessible fallback text for screen readers, broken images, and search engines. (src specifies the file path.)"}, {"id": 290, "num": 17, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A container has CSS: display: flex; flex-direction: column;. How are its child elements arranged?", "options": ["Side by side in a single row", "Stacked one below another, from top to bottom", "In a grid of equal-sized cells", "In reverse order from right to left"], "ans": 1, "exp": "flex-direction: column sets the main axis vertically, stacking flex children from top to bottom."}, {"id": 291, "num": 18, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Which HTML5 input element displays a calendar-style picker for selecting a date?", "options": ["<input type=\"calendar\">", "<input type=\"date\">", "<input type=\"datetime-picker\">", "<date>"], "ans": 1, "exp": "<input type=\"date\"> renders a native date picker and submits values in yyyy-mm-dd format."}, {"id": 292, "num": 19, "topic": "Web Technologies", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "How many columns does the following HTML table have?", "options": ["4", "5", "2", "3"], "ans": 3, "exp": "Row 1 has 3 cells (A, B, C). Cell A spans into Row 2 Col 1, while D and E occupy Col 2 and Col 3 → 3 columns total."}]}, {"id": 16, "category": "CyberSec", "code": "SEC Mock 01", "title": "Cyber Security & IPR — Mock 01", "subtitle": "Malware, Cryptography, Firewalls, E-Commerce, IT Act & IPR", "durationSec": 540, "timeLabel": "9-Min", "questions": [{"id": 293, "num": 1, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 20 · Real Exam", "q": "A malicious program copies itself from one computer to another across a network on its own, without needing to attach itself to a host file or any user action. It is a:", "options": ["Virus", "Logic bomb", "Trojan horse", "Worm"], "ans": 3, "exp": "A worm is a standalone self-replicating malware that propagates over networks without needing a host file or user action."}, {"id": 294, "num": 2, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Under the IT Act, 2000, which section provides for compensation (civil liability) for unauthorised computer access, data downloading, or introducing a virus?", "options": ["Section 72", "Section 66", "Section 65", "Section 43"], "ans": 3, "exp": "Section 43 provides civil liability/compensation for unauthorized access, damage, or virus introduction."}, {"id": 295, "num": 3, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 19 · Real Exam", "q": "Using the Caesar cipher with a shift of 3, what is the encrypted form of the word CAT?", "options": ["FDW", "DBU", "ZXQ", "FAT"], "ans": 0, "exp": "C+3=F, A+3=D, T+3=W → FDW."}, {"id": 296, "num": 4, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Attackers poison a DNS server's cache so that users who type their bank's correct web address are taken to a fake site that looks identical. This attack is called:", "options": ["Phishing", "Pharming", "Vishing", "Smishing"], "ans": 1, "exp": "Redirecting legitimate URLs via DNS cache poisoning or hosts-file tampering is Pharming."}, {"id": 297, "num": 5, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 18 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding public-key cryptography?\nI. In a digital signature, the sender signs the message with his own public key.\nII. A message encrypted with the receiver's public key can be decrypted only with the receiver's private key.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "I is false (sender signs with private key). II is true."}, {"id": 298, "num": 6, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Under the Information Technology Act, 2000, the fraudulent or dishonest use of another person's electronic signature, password or other unique identification feature is punishable under:", "options": ["Section 66D", "Section 66C", "Section 66E", "Section 67"], "ans": 1, "exp": "Section 66C punishes identity theft (misuse of password/e-signature). 66D is cheating by personation."}, {"id": 299, "num": 7, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following provides non-repudiation, so that the sender cannot later deny having sent a message?", "options": ["Symmetric-key encryption", "Message authentication code (MAC)", "Cryptographic hash such as SHA-256", "Digital signature"], "ans": 3, "exp": "A digital signature is created with the sender's unique private key and verified with the public key, ensuring non-repudiation."}, {"id": 300, "num": 8, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "In online marketplaces, a trusted third party that holds buyer payment until satisfactory delivery is confirmed is called a(n) ______ service.", "options": ["escrow", "payment gateway", "digital wallet", "cash-on-delivery"], "ans": 0, "exp": "An escrow service safeguards payment until agreed delivery conditions are met."}, {"id": 301, "num": 9, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "In Diffie–Hellman with p = 11 and g = 2, User A chooses secret a = 3 and User B chooses secret b = 4. What is the shared secret key?", "options": ["4", "8", "5", "1"], "ans": 0, "exp": "Shared key = g^(ab) mod p = 2¹² mod 11 = 4096 mod 11 = 4 (A sends 8, B sends 5; 5³ mod 11 = 4)."}, {"id": 302, "num": 10, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Which of the following is NOT a property of a cryptographic hash function such as SHA-256?", "options": ["Pre-image resistance", "Collision resistance", "Fixed-length output for any input size", "Reversibility – the message can be recovered from its hash"], "ans": 3, "exp": "Cryptographic hashes are strictly one-way (irreversible); reversibility belongs to encryption."}, {"id": 303, "num": 11, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Which of the following is NOT a function of a payment gateway in e-commerce?", "options": ["Encrypting card details sent from the shopping website", "Forwarding the transaction to the card issuer's bank for authorisation", "Sending the approval or decline message back to the merchant's website", "Designing the product catalogue of the online store"], "ans": 3, "exp": "Designing the product catalogue is handled by the online store platform, not the payment gateway."}, {"id": 304, "num": 12, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Which of the following is NOT a symmetric-key encryption algorithm?", "options": ["AES", "DES", "RSA", "Blowfish"], "ans": 2, "exp": "AES, DES, and Blowfish are symmetric-key algorithms. RSA is an asymmetric (public-key) algorithm."}, {"id": 305, "num": 13, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Under the Information Technology Act, 2000, which section deals with cyber terrorism?", "options": ["Section 67A", "Section 66E", "Section 66F", "Section 43A"], "ans": 2, "exp": "Section 66F deals with cyber terrorism (punishable up to life imprisonment). 43A = data protection, 66E = privacy violation, 67A = sexually explicit material."}, {"id": 306, "num": 14, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "What is the size of the message digest produced by the MD5 hash function?", "options": ["128 bits", "160 bits", "256 bits", "512 bits"], "ans": 0, "exp": "MD5 = 128 bits (SHA-1 = 160, SHA-256 = 256, SHA-512 = 512)."}, {"id": 307, "num": 15, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Two-factor authentication (2FA) combines two different factor types. Which pair is a valid example?", "options": ["Two different passwords", "A password and a security question", "A password (something you know) and an OTP sent to your phone (something you have)", "A user name and a password"], "ans": 2, "exp": "2FA requires two distinct categories (knowledge + possession/inherence)."}, {"id": 308, "num": 16, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "What is the block size of the AES (Advanced Encryption Standard) algorithm?", "options": ["64 bits", "128 bits", "56 bits", "256 bits"], "ans": 1, "exp": "AES always operates on a 128-bit block size (with key sizes of 128, 192, or 256 bits), whereas DES/3DES use 64-bit blocks."}, {"id": 309, "num": 17, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "A program that appears to be useful but secretly performs harmful actions, such as opening a back door, is called a ______.", "options": ["Spam", "Worm", "Trojan horse", "Firewall"], "ans": 2, "exp": "A Trojan horse disguises malicious activity inside legitimate-looking software and does not self-replicate like viruses or worms."}, {"id": 310, "num": 18, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which of the following is an asymmetric (public-key) encryption algorithm?", "options": ["RSA", "DES", "AES", "3DES"], "ans": 0, "exp": "RSA uses a public/private key pair (asymmetric). DES, 3DES, and AES are symmetric key ciphers."}]}, {"id": 17, "category": "CyberSec", "code": "SEC Mock 02", "title": "Cyber Security & IPR — Mock 02", "subtitle": "Malware, Cryptography, Firewalls, E-Commerce, IT Act & IPR", "durationSec": 540, "timeLabel": "9-Min", "questions": [{"id": 311, "num": 1, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which of the following does a digital signature provide?\nI. Integrity of the message\nII. Confidentiality of the message", "options": ["Neither I nor II", "Only II", "Both I and II", "Only I"], "ans": 3, "exp": "A digital signature provides authentication, integrity, and non-repudiation — NOT confidentiality (which requires message encryption)."}, {"id": 312, "num": 2, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Malicious software that encrypts the victim's files and demands payment for the decryption key is called ______.", "options": ["Spyware", "Ransomware", "Adware", "Rootkit"], "ans": 1, "exp": "Ransomware (e.g., WannaCry) encrypts victim files and demands ransom for the decryption key."}, {"id": 313, "num": 3, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Using the Caesar cipher with a shift of 3, what is the encryption of DSSSB?", "options": ["AVVVY", "GVVVE", "GSSSE", "GVVVB"], "ans": 1, "exp": "Shifting +3: D→G, S→V, S→V, S→V, B→E ⇒ GVVVE."}, {"id": 314, "num": 4, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "A fraud in which a criminal sends SMS text messages to trick people into revealing bank details is called ______.", "options": ["Vishing", "Smishing", "Pharming", "Spoofing"], "ans": 1, "exp": "Smishing = SMS phishing (Vishing = voice calls; Pharming = DNS poisoning)."}, {"id": 315, "num": 5, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "In RSA, primes are p = 3 and q = 11, and public exponent e = 7. What is the private key d?", "options": ["17", "7", "13", "3"], "ans": 3, "exp": "φ(n) = (3−1)(11−1) = 20. We need 7d ≡ 1 (mod 20). Since 7 × 3 = 21 ≡ 1 (mod 20), d = 3."}, {"id": 316, "num": 6, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Which protocol was developed jointly by Visa and MasterCard to secure credit-card transactions over the internet?", "options": ["SSH (Secure Shell)", "SSL (Secure Sockets Layer)", "SET (Secure Electronic Transaction)", "PGP (Pretty Good Privacy)"], "ans": 2, "exp": "SET (Secure Electronic Transaction) was created by Visa & MasterCard using digital certificates and dual signatures so merchants never see card details."}, {"id": 317, "num": 7, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Which section of the Information Technology Act, 2000 deals with cyber terrorism?", "options": ["Section 67", "Section 66C", "Section 66F", "Section 43"], "ans": 2, "exp": "Section 66F deals with cyber terrorism (punishable up to life imprisonment). 66C = identity theft, 67 = obscene electronic material, 43 = system damage."}, {"id": 318, "num": 8, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "______ is the international standard for Elect ptions": ["Accepting friend requests from strangers", "Sharing live location publicly at all times", "Reviewing privacy settings and limiting who can see personal posts", "Using the same password for every account"], "ans": 2, "exp": "Regularly reviewing privacy settings and restricting audience visibility protects personal data."}, {"id": 327, "num": 17, "topic": "Cyber Security", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Under the Digital Personal Data Protection (DPDP) Act, 2023, the individual to whom the personal data relates is called the:", "options": ["Data Principal", "Data Fiduciary", "Data Processor", "Consent Manager"], "ans": 0, "exp": "Data Principal = the individual whose data is processed; Data Fiduciary = entity deciding purpose/means."}, {"id": 328, "num": 18, "topic": "IPR & Society", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "______ protects original literary, artistic and musical works, including computer software.", "options": ["Copyright", "Patent", "Trademark", "Geographical Indication"], "ans": 0, "exp": "Copyright protects books, music, films and software code."}]}, {"id": 18, "category": "CyberSec", "code": "SEC Mock 03", "title": "Cyber Security & IPR — Mock 03", "subtitle": "Malware, Cryptography, Firewalls, E-Commerce, IT Act & IPR", "durationSec": 540, "timeLabel": "9-Min", "questions": [{"id": 329, "num": 1, "topic": "E-Waste & Society", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Most of the e-waste in India is handled by the ______ sector, where unsafe recycling like open burning and acid baths are often used.", "options": ["banking", "defence", "informal", "aviation"], "ans": 2, "exp": "India's informal sector handles the majority of e-waste dismantling, posing health and pollution hazards."}, {"id": 330, "num": 2, "topic": "E-Waste & Society", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Under E-Waste Rules, which is/are producer responsibilities under Extended Producer Responsibility (EPR)?\nI. Collecting end-of-lif ng and selling goods between two individuals, as on OLX, is which e-commerce model?", "options": ["B2B", "B2C", "C2C", "C2B"], "ans": 2, "exp": "OLX and eBay facilitate Consumer-to-Consumer (C2C) transactions."}, {"id": 341, "num": 13, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which entity issues digital certificates (X.509)?", "options": ["Web browser", "DNS server", "Router", "Certificate Authority (CA)"], "ans": 3, "exp": "A Certificate Authority (CA) verifies identity and signs digital certificates binding identity to public keys."}, {"id": 342, "num": 14, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "In a group of 10 users, each pair needs a separate secret key for symmetric encryption. Total keys required:", "options": ["45", "20", "90", "10"], "ans": 0, "exp": "n(n − 1)/2 = 10 × 9 / 2 = 45 keys."}, {"id": 343, "num": 15, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "A login form builds a raw SQL query from user input. An attacker types ' OR '1'='1 in the password box and logs in without a password. This attack is:", "options": ["SQL injection", "Cross-site scripting (XSS)", "Denial of service", "Brute-force attack"], "ans": 0, "exp": "Injecting ' OR '1'='1 alters the SQL logic to always evaluate true — classic SQL Injection (prevented by parameterised queries / prepared statements)."}, {"id": 344, "num": 16, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "A network of thousands of secretly infected computers controlled remotely to flood a website with traffic is called a:", "options": ["Firewall", "Botnet", "Honeypot", "Intranet"], "ans": 1, "exp": "A botnet is a network of compromised 'zombie' devices controlled via a C&C server for DDoS/spam."}, {"id": 345, "num": 17, "topic": "Cyber Security & E-Commerce", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A phishing attack aimed specifically at a
