during teaching", "options": ["Both I and II", "Neither I nor II", "Only I", "Only II"], "ans": 0, "exp": "A good lesson plan has clear measurable objectives and remains flexible to classroom responses."}, {"id": 156, "num": 14, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "According to David Kolb, the experiential learning cycle begins with which stage?", "options": ["Rote memorisation", "Abstract conceptualisation", "Active experimentation", "Concrete experience"], "ans": 3, "exp": "Kolb's cycle: 1. Concrete Experience → 2. Reflective Observation → 3. Abstract Conceptualisation → 4. Active Experimentation."}, {"id": 157, "num": 15, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "A child's understanding that the amount of water remains the same when poured into a taller, narrower glass is called _____.", "options": ["conservation", "centration", "animism", "egocentrism"], "ans": 0, "exp": "Conservation (acquired in Piaget's Concrete Operational stage) is knowing quantity stays invariant despite shape change."}, {"id": 158, "num": 16, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "The Dalton Plan of teaching was introduced by _____.", "options": ["John Dewey", "H. E. Armstrong", "Helen Parkhurst", "Maria Montessori"], "ans": 2, "exp": "Helen Parkhurst introduced the Dalton Plan (1920), emphasising self-paced monthly assignments in subject labs."}, {"id": 159, "num": 17, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which statements are correct regarding newborn babies?\nI. Newborns can recognise their mother's voice soon after birth.\nII. Newborns have fully developed, adult-like vision.", "options": ["Both I and II", "Only II", "Only I", "Neither I nor II"], "ans": 2, "exp": "Hearing is well developed at birth (recognise mother's voice), whereas vision is the least developed sense."}, {"id": 160, "num": 18, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which parenting style (Baumrind) is correctly matched?", "options": ["Authoritarian — high warmth and low control", "Authoritative — high warmth and high control", "Permissive — low warmth and high control", "Neglectful — high warmth and high control"], "ans": 1, "exp": "Baumrind: Authoritative = High warmth + High control; Authoritarian = Low warmth + High control; Permissive = High warmth + Low control."}, {"id": 161, "num": 19, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Broca's area of the brain is mainly concerned with _____.\nI. production of speech   II. comprehension of speech", "options": ["Only II", "Only I", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Broca's area (left frontal lobe) controls speech production; Wernicke's area (left temporal lobe) handles comprehension."}, {"id": 162, "num": 20, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Who is associated with the psychosocial theory of development?\nI. Erik Erikson   II. Sigmund Freud", "options": ["Only II", "Only I", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "Erik Erikson proposed the 8-stage psychosocial theory; Freud proposed the 5-stage psychosexual theory."}]}, {"id": 9, "category": "Pedagogy", "code": "PED Mock 09", "title": "Pedagogy & NEP 2020 — Mock 09", "subtitle": "Bloom's Taxonomy, Piaget, Vygotsky, Erikson, Kohlberg, Assessment, Inclusive Ed & NEP 2020", "durationSec": 540, "timeLabel": "9-Min", "questions": [{"id": 163, "num": 1, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which help a teacher build strong school–community relations?\nI. Inviting parents to school functions\nII. Taking part in community awareness programmes", "options": ["Neither I nor II", "Only I", "Both I and II", "Only II"], "ans": 2, "exp": "Both inviting parents and participating in community initiatives strengthen school–community trust."}, {"id": 164, "num": 2, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Under Samagra Shiksha for inclusive education, which provision is correct?\nI. Aids and appliances for children with special needs\nII. Separate special schools for all children with disabilities instead of regular schools", "options": ["Neither I nor II", "Only II", "Both I and II", "Only I"], "ans": 3, "exp": "Samagra Shiksha promotes inclusion in regular schools with aids, Braille/large-print books, and resource teachers — not segregation."}, {"id": 165, "num": 3, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which is an example of negative reinforcement?", "options": ["Giving a star for good work", "Removing extra homework when a student completes class work on time", "Scolding a student for being late", "Detaining a student after school"], "ans": 1, "exp": "Negative reinforcement removes an unpleasant stimulus (extra homework) to strengthen/increase desired behaviour."}, {"id": 166, "num": 4, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which of the following is a higher form of writing?", "options": ["Copy writing", "Essay writing", "Dictation", "Tracing of letters"], "ans": 1, "exp": "Essay writing is free, independent composition where learners organise original ideas (others are controlled/early writing)."}, {"id": 167, "num": 5, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which statement is correct regarding Vygotsky's view of play?", "options": ["Play creates a zone of proximal development for the child.", "Play has no role in a child's development.", "Play is meant only for physical exercise.", "Children always play alone."], "ans": 0, "exp": "Vygotsky held that in make-believe play 'a child behaves beyond his average age', creating a Zone of Proximal Development (ZPD)."}, {"id": 168, "num": 6, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which helps children expand their vocabulary?\nI. Reading story books\nII. Rote copying of word lists without context", "options": ["Neither I nor II", "Only II", "Both I and II", "Only I"], "ans": 3, "exp": "Meaningful context (storybooks) builds lasting vocabulary; decontextualised rote copying does not."}, {"id": 169, "num": 7, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "In which teaching method does the teacher perform an activity/experiment in front of the class while students observe?", "options": ["Project method", "Heuristic method", "Demonstration method", "Excursion method"], "ans": 2, "exp": "In the Demonstration method, the teacher demonstrates a process while explaining and students observe and question."}, {"id": 170, "num": 8, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Under the RTE Act, 2009, free and compulsory education is the right of children in the age group of _____.", "options": ["6–14 years", "3–10 years", "5–15 years", "6–18 years"], "ans": 0, "exp": "RTE Act 2009 (effective 1 April 2010, Article 21A) guarantees elementary education for ages 6–14 years."}, {"id": 171, "num": 9, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Parent and family involvement increases students' _____.\nI. Achievement   II. Attendance", "options": ["Only I", "Neither I nor II", "Both I and II", "Only II"], "ans": 2, "exp": "Active family involvement improves both student attendance and academic achievement."}, {"id": 172, "num": 10, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Conservation, Reversibility, and Logical thinking about concrete objects characterise which of Piaget's stages?", "options": ["Sensorimotor stage", "Formal operational stage", "Pre-operational stage", "Concrete operational stage"], "ans": 3, "exp": "In Piaget's Concrete Operational stage (7–11 years), children master conservation, reversibility, and concrete logical reasoning."}, {"id": 173, "num": 11, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "_____ is the specific short-term device or trick used by a teacher to carry out a method in the classroom.", "options": ["Teaching approach", "Curriculum", "Teaching strategy", "Teaching technique"], "ans": 3, "exp": "Approach (broadest philosophy) > Method (overall plan) > Technique (immediate classroom trick)."}, {"id": 174, "num": 12, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Aesthetic sense in children is best developed through:", "options": ["rote learning of definitions", "experiencing and creating art, music and the beauty of nature", "frequent examinations", "speed drills"], "ans": 1, "exp": "Direct engagement in observing and creating art, music, and nature nurtures aesthetic sensibility."}, {"id": 175, "num": 13, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Gender stereotyping in classrooms refers to:", "options": ["assigning roles and expectations to children on the basis of their gender", "biological differences between boys and girls", "equal participation", "uniform policy"], "ans": 0, "exp": "Gender stereotyping imposes rigid gender-based expectations that restrict learners' choices."}, {"id": 176, "num": 14, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "According to NEP 2020, the medium of instruction until at least Class 5 should, wherever possible, be:", "options": ["English", "Hindi only", "Sanskrit", "the home language / mother tongue / local language"], "ans": 3, "exp": "NEP 2020 recommends home language / mother tongue / local language till at least Grade 5 (preferably Grade 8)."}, {"id": 177, "num": 15, "topic": "Pedagogy & Education rom a central idea using branches and keywords."}, {"id": 186, "num": 4, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "A student practising typing improves quickly, then shows no progress for weeks despite practice, before improving again. The flat stage is called a:", "options": ["Ceiling effect", "Peak", "Dip of forgetting", "Plateau"], "ans": 3, "exp": "A learning plateau is a temporary flat stage in a learning curve caused by fatigue, low motivation, or needing a new strategy."}, {"id": 187, "num": 5, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "A student who learnt loops in Scratch finds it easier to learn loops in Python. This is:", "options": ["Positive transfer of learning", "Retroactive inhibition", "Negative transfer of learning", "Zero transfer of learning"], "ans": 0, "exp": "Positive transfer occurs when prior learning facilitates acquiring a new related skill."}, {"id": 188, "num": 6, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Dividing a long programming lesson into 10–15 minute segments followed by quick activities is supported by which cognitive psychology principle?", "options": ["Students learn only by listening", "Longer lectures always improve memory", "Students have a limited attention span and working-memory capacity, so information is better learnt in small chunks", "Activities waste class time"], "ans": 2, "exp": "Working memory is limited (Miller's 7±2); chunking content into short active segments reduces cognitive load and boosts retention."}, {"id": 189, "num": 7, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Screen-reading software used by a visually impaired student in a computer class is an example of:", "options": ["Assistive technology", "Firmware", "Spreadsheet software", "Malware"], "ans": 0, "exp": "Assistive technology (NVDA, JAWS, magnifiers, Braille displays) enables inclusive education under RPwD Act 2016 and NEP 2020."}, {"id": 190, "num": 8, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "An online platform like Moodle or Google Classroom for posting assignments, submissions, grading, and feedback is called a:", "options": ["Operating system", "Learning Management System (LMS)", "Database Management System", "Search engine"], "ans": 1, "exp": "A Learning Management System (LMS) manages courses, assignments, assessments, and progress online."}, {"id": 191, "num": 9, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Under NEP 2020, the three-month play-based school preparation module for children entering Grade 1 is called:", "options": ["Vidya Pravesh", "NISHTHA", "PM SHRI", "PARAKH"], "ans": 0, "exp": "Vidya Pravesh = 3-month Grade 1 play-based module. (NISHTHA = teacher training; PM SHRI = model schools; PARAKH = assessment centre.)"}, {"id": 192, "num": 10, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Presenting a real situation (a shop losing sales records) and asking students to analyse it and propose a database solution is the:", "options": ["Drill method", "Lecture method", "Case study method", "Dictation method"], "ans": 2, "exp": "The Case Study method develops analytical thinking and decision-making by applying theory to realistic scenarios."}, {"id": 193, "num": 11, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A computer science teacher combines knowledge of programming concepts, how to teach them, and classroom technology. This framework is called:", "options": ["Bloom's taxonomy", "ADDIE", "SAMR", "TPACK"], "ans": 3, "exp": "TPACK (Mishra & Koehler) = Technological Pedagogical Content Knowledge — the intersection of Technology, Pedagogy, and Content."}, {"id": 194, "num": 12, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "The instructional design model ADDIE consists of five phases in which correct order?", "options": ["Analysis, Design, Development, Implementation, Evaluation", "Analysis, Development, Design, Implementation, Evaluation", "Assessment, Design, Delivery, Instruction, Evaluation", "Aim, Design, Discussion, Instruction, Examination"], "ans": 0, "exp": "ADDIE stands for Analysis → Design → Development → Implementation → Evaluation."}, {"id": 195, "num": 13, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "According to Robert Gagné's nine events of instruction, what should a teacher do FIRST in a lesson?", "options": ["Gain the attention of the learners", "Provide feedback", "Present the content", "Assess performance"], "ans": 0, "exp": "Gagné's 1st event is 'Gain attention' (followed by informing objectives, stimulating prior recall, presenting content, guidance, practice, feedback, assessment, retention/transfer)."}, {"id": 196, "num": 14, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "After solving a programming problem, a student reflects: 'Which strategy did I use, where did I get stuck, and how will I approach the next problem?' This is:", "options": ["Metacognition", "Rote learning", "Classical conditioning", "Programmed instruction"], "ans": 0, "exp": "Metacognition (John Flavell) is 'thinking about one's own thinking' — planning, monitoring, and evaluating one's learning strategies."}, {"id": 197, "num": 15, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Awarding points, badges, and a class leaderboard when students complete coding challenges is known as:", "options": ["Programmed learning", "Team teaching", "Mastery learning", "Gamification"], "ans": 3, "exp": "Gamification applies game elements (points, badges, leaderboards) in non-game educational settings to boost motivation and engagement."}, {"id": 198, "num": 16, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A student who mastered Python loops helps a struggling classmate under teacher guidance. This strategy is:", "options": ["Programmed instruction", "Lecture method", "Norm-referenced testing", "Peer tutoring"], "ans": 3, "exp": "Peer tutoring pairs a stronger student with a classmate — helping the learner while reinforcing the tutor's mastery (protégé effect)."}, {"id": 199, "num": 17, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Teaching the idea of an algorithm by having students sort number cards using written steps without any computer is known as:", "options": ["Blended learning", "CS Unplugged", "Computer-assisted instruction", "Drill and practice"], "ans": 1, "exp": "CS Unplugged teaches core CS concepts (algorithms, binary, sorting, error detection) via hands-on games and activities without computers."}, {"id": 200, "num": 18, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A student submits a program copied from a website without citing the source. As a teacher, this should be treated mainly as:", "options": ["Peer tutoring", "Cyber terrorism", "Plagiarism, and the student should be taught to cite sources and write his own code", "Creativity, because the program works"], "ans": 2, "exp": "Presenting someone else's code as one's own without credit is plagiarism. Teachers should educate students on academic integrity, proper attribution, and original work."}, {"id": 201, "num": 19, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A student reports that classmates are posting insulting messages about him in an online group. What is the teacher's most appropriate FIRST step?", "options": ["Ban the student from using the Internet", "Listen to the student, keep a record (screenshots) of the messages, and report it to school authorities per the cyberbullying policy", "Ignore it because it happens outside the classroom", "Ask the student to reply with insulting messages"], "ans": 1, "exp": "In cyberbullying cases, support the student, preserve evidence (screenshots), and escalate via the school's cyberbullying policy (authorities, parents, counsellor)."}, {"id": 202, "num": 20, "topic": "Pedagogy & Education Policy", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "According to Hermann Ebbinghaus's forgetting curve, which practice best helps students retain programming syntax long-term?", "options": ["Studying everything once the night before the exam", "Avoiding revision so memory is not overloaded", "Learning only by listening to lectures", "Reviewing the material at increasing intervals (spaced repetition)"], "ans": 3, "exp": "Spaced repetition (reviewing after 1 day, a few days, a week, etc.) interrupts Ebbinghaus's forgetting curve and consolidates knowledge into long-term memory."}]}]};

    const STORAGE_ANS = "pedagogy_dsssb_answers_v1";
    const STORAGE_SUB = "pedagogy_dsssb_submitted_v1";
    const STORAGE_THEME = "pedagogy_dsssb_theme_v1";

    function safeGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function safeSet(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    let answers = safeGet(STORAGE_ANS, {});
    let submittedMocks = safeGet(STORAGE_SUB, {});
    let activeCategory = "Pedagogy";
    let activeMockId = DATA.mocks[0].id;
    let quizMode = "instant";
    let activeFilter = "all";

    const timerState = {};
    DATA.mocks.forEach((m) => {
      timerState[m.id] = { remaining: m.durationSec, running: false };
    });
    let tickInterval = null;

    function getActiveMock() {
      return DATA.mocks.find((m) => m.id === activeMockId);
    }

    function getCategoryMocks(catKey) {
      return DATA.mocks.filter((m) => m.category === catKey);
    }

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function isRevealed(mockId, qId) {
      if (quizMode === "instant") return answers[qId] !== undefined;
      return Boolean(submittedMocks[mockId]);
    }

    function computeMockStats(mock) {
      let attempted = 0, correct = 0, wrong = 0;
      const showTruth = quizMode === "instant" || Boolean(submittedMocks[mock.id]);
      mock.questions.forEach((q) => {
        if (answers[q.id] !== undefined) {
          attempted++;
          if (showTruth) {
            if (answers[q.id] === q.ans) correct++;
            else wrong++;
          }
        }
      });
      const marks = showTruth ? (correct * 1 - wrong * 0.25) : 0;
      const acc = showTruth && attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
      return { attempted, correct, wrong, marks, acc, showTruth, total: mock.questions.length };
    }

    function computeOverallStats() {
      let done = 0, correct = 0, wrong = 0, total = 0;
      DATA.mocks.forEach((m) => {
        const showTruth = quizMode === "instant" || Boolean(submittedMocks[m.id]);
        m.questions.forEach((q) => {
          total++;
          if (answers[q.id] !== undefined) {
            done++;
            if (showTruth) {
              if (answers[q.id] === q.ans) correct++;
              else wrong++;
            }
          }
        });
      });
      return { done, total, marks: (correct - wrong * 0.25).toFixed(2) };
    }

    function stopInterval() {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
    }

    function pauseAllTimers() {
      Object.keys(timerState).forEach((k) => { timerState[k].running = false; });
      stopInterval();
    }

    function startTimerForActive() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      if (st.remaining <= 0) st.remaining = mock.durationSec;
      pauseAllTimers();
      st.running = true;
      updateTimerUI();
      tickInterval = setInterval(() => {
        const cur = timerState[activeMockId];
        if (!cur.running) { stopInterval(); return; }
        cur.remaining = Math.max(0, cur.remaining - 1);
        updateTimerUI();
        if (cur.remaining === 0) {
          cur.running = false;
          stopInterval();
          showScorecardModal("⏱ Time's Up!");
        }
      }, 1000);
    }

    function toggleTimer() {
      const st = timerState[activeMockId];
      if (st.running) {
        st.running = false;
        stopInterval();
        updateTimerUI();
      } else {
        startTimerForActive();
      }
    }

    function resetTimer() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      st.running = false;
      st.remaining = mock.durationSec;
      stopInterval();
      updateTimerUI();
    }

    function updateTimerUI() {
      const mock = getActiveMock();
      const st = timerState[activeMockId];
      const formatted = formatTime(st.remaining);
      document.getElementById("heroTimerText").textContent = formatted;
      document.getElementById("miniTimerText").textContent = formatted;
      document.getElementById("timerLabel").textContent = `${mock.timeLabel.toUpperCase()} TIMER`;
      document.getElementById("timerToggleBtn").textContent = st.running ? "Pause" : (st.remaining < mock.durationSec && st.remaining > 0 ? "Resume" : "Start");
      document.getElementById("timerStatusBadge").textContent = st.remaining === 0 ? "TIME UP" : (st.running ? "LIVE" : (st.remaining < mock.durationSec ? "PAUSED" : "READY"));

      const pct = Math.max(0, (st.remaining / mock.durationSec) * 100);
      const bar = document.getElementById("timerProgressBar");
      const miniPill = document.getElementById("miniTimerPill");
      bar.style.width = `${pct}%`;

      miniPill.classList.remove("timer-urgent", "bg-rose-100", "dark:bg-rose-950/60", "text-rose-700", "dark:text-rose-300", "border-rose-300", "bg-amber-100", "dark:bg-amber-950/60", "text-amber-700", "dark:text-amber-300", "border-amber-300");
      bar.classList.remove("bg-emerald-300", "bg-amber-300", "bg-rose-400");

      if (st.remaining <= 60) {
        bar.classList.add("bg-rose-400");
        miniPill.classList.add("bg-rose-100", "dark:bg-rose-950/60", "text-rose-700", "dark:text-rose-300", "border-rose-300");
        if (st.running) miniPill.classList.add("timer-urgent");
      } else if (st.remaining <= 150) {
        bar.classList.add("bg-amber-300");
        miniPill.classList.add("bg-amber-100", "dark:bg-amber-950/60", "text-amber-700", "dark:text-amber-300", "border-amber-300");
      } else {
        bar.classList.add("bg-emerald-300");
      }
    }

    function openModal(title, bodyHtml, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      buttons.forEach((b) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = b.label;
        btn.className = b.cls;
        btn.addEventListener("click", () => {
          closeModal();
          if (b.onClick) b.onClick();
        });
        actions.appendChild(btn);
      });
      document.getElementById("modalBackdrop").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.add("hidden");
    }

    function showScorecardModal(titlePrefix) {
      const mock = getActiveMock();
      submittedMocks[mock.id] = true;
      safeSet(STORAGE_SUB, submittedMocks);
      const st = computeMockStats(mock);
      renderAll();
      openModal(
        `${titlePrefix} — ${mock.code} Scorecard`,
        `
          <div class="grid grid-cols-2 gap-2.5 text-center">
            <div class="rounded-xl bg-indigo-50 dark:bg-indigo-500/15 p-3">
              <div class="text-xl font-black text-indigo-700 dark:text-indigo-300">${st.marks.toFixed(2)} / ${st.total}</div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">NET MARKS</div>
            </div>
            <div class="rounded-xl bg-emerald-50 dark:bg-emerald-500/15 p-3">
              <div class="text-xl font-black text-emerald-700 dark:text-emerald-300">${st.acc}%</div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">ACCURACY</div>
            </div>
            <div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-2.5 text-xs font-bold">Correct: <span class="text-emerald-600 dark:text-emerald-400">${st.correct}</span></div>
            <div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-2.5 text-xs font-bold">Wrong: <span class="text-rose-600 dark:text-rose-400">${st.wrong}</span> &bull; Left: ${st.total - st.attempted}</div>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400">All answers and explanations for ${escapeHtml(mock.code)} are now unlocked below.</p>
        `,
        [
          {
            label: "Review Wrong Only",
            cls: "px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer",
            onClick: () => { activeFilter = "wrong"; renderAll(); }
          },
          {
            label: "View All Solutions",
            cls: "px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold cursor-pointer"
          }
        ]
      );
    }

    function renderCategoryTabs() {
      const wrap = document.getElementById("categoryTabs");
      wrap.innerHTML = DATA.categories.map((c) => {
        const active = c.key === activeCategory;
        const catMocks = getCategoryMocks(c.key);
        const done = catMocks.reduce((acc, m) => acc + m.questions.filter((q) => answers[q.id] !== undefined).length, 0);
        const cls = active
          ? "bg-slate-900 dark:bg-indigo-600 text-white border-slate-900 dark:border-indigo-600 shadow-xs"
          : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-indigo-400";
        const badgeCls = active ? "bg-white/20 text-white" : "bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300";
        return `
          <button type="button" data-cat="${escapeHtml(c.key)}"
            class="cat-tab shrink-0 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border text-xs font-extrabold transition cursor-pointer ${cls}">
            <span>${escapeHtml(c.label)}</span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md tabular-nums ${badgeCls}">${c.mocks} Mocks &bull; ${done}/${c.count}</span>
          </button>
        `;
      }).join("");
    }

    function renderMockTabs() {
      const wrap = document.getElementById("mockTabs");
      const catMocks = getCategoryMocks(activeCategory);
      wrap.innerHTML = catMocks.map((m) => {
        const active = m.id === activeMockId;
        const done = m.questions.filter((q) => answers[q.id] !== undefined).length;
        const cls = active
          ? "bg-indigo-600 text-white border-indigo-600 shadow-xs"
          : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-indigo-700";
        const pillCls = active ? "bg-white/20 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400";
        return `
          <button type="button" data-mock-id="${m.id}"
            class="mock-tab shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-bold transition cursor-pointer ${cls}">
            <span>${escapeHtml(m.code)}</span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full tabular-nums ${pillCls}">${done}/${m.questions.length}</span>
          </button>
        `;
      }).join("");
    }

    function renderHeroAndStats() {
      const mock = getActiveMock();
      const st = computeMockStats(mock);
      const ov = computeOverallStats();

      document.getElementById("heroBadge").textContent = `${mock.category} Dedicated Mock`;
      document.getElementById("heroQCount").textContent = `${mock.questions.length} Questions · +1.00 / −0.25`;
      document.getElementById("heroTitle").textContent = mock.title;
      document.getElementById("heroSub").textContent = mock.subtitle;

      document.getElementById("statAttempted").textContent = `${st.attempted}/${st.total}`;
      document.getElementById("statMarks").textContent = st.showTruth ? st.marks.toFixed(2) : "—";
      document.getElementById("statAccuracy").textContent = st.showTruth ? `${st.acc}%` : "—";
      document.getElementById("overallScorePill").textContent = `${ov.done}/${ov.total} Done • ${ov.marks} Marks`;

      const instBtn = document.getElementById("modeInstantBtn");
      const examBtn = document.getElementById("modeExamBtn");
      const subBtn = document.getElementById("submitExamBtn");

      if (quizMode === "instant") {
        instBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white cursor-pointer";
        examBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer";
        subBtn.classList.add("hidden");
      } else {
        examBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white cursor-pointer";
        instBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer";
        if (!submittedMocks[mock.id]) subBtn.classList.remove("hidden");
        else subBtn.classList.add("hidden");
      }

      document.querySelectorAll("#filterGroup .flt-btn").forEach((btn) => {
        const active = btn.dataset.filter === activeFilter;
        btn.className = active
          ? "flt-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 cursor-pointer"
          : "flt-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer";
      });

      document.getElementById("prevMockBtn").disabled = activeMockId <= 1;
      document.getElementById("nextMockBtn").disabled = activeMockId >= DATA.mocks.length;
      updateTimerUI();
    }

    function renderPalette() {
      const mock = getActiveMock();
      const wrap = document.getElementById("questionPalette");
      document.getElementById("paletteTitle").textContent = `Question Palette (Jump to Q1–Q${mock.questions.length})`;
      const showTruth = quizMode === "instant" || Boolean(submittedMocks[mock.id]);
      wrap.innerHTML = mock.questions.map((q) => {
        const picked = answers[q.id];
        let cls = "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700";
        if (picked !== undefined) {
          if (!showTruth) cls = "bg-indigo-600 text-white border-indigo-600";
          else if (picked === q.ans) cls = "bg-emerald-600 text-white border-emerald-600";
          else cls = "bg-rose-600 text-white border-rose-600";
        }
        return `
          <button type="button" data-jump="qcard-${q.id}"
            class="pal-btn w-8 h-7 rounded-lg border text-[11px] font-bold tabular-nums hover:opacity-85 cursor-pointer ${cls}">
            ${q.num}
          </button>
        `;
      }).join("");
    }

    function renderQuestions() {
      const mock = getActiveMock();
      const list = document.getElementById("questionsList");
      const showTruthGlobal = quizMode === "instant" || Boolean(submittedMocks[mock.id]);

      const filtered = mock.questions.filter((q) => {
        const picked = answers[q.id];
        if (activeFilter === "unanswered") return picked === undefined;
        if (activeFilter === "wrong") {
          return showTruthGlobal && picked !== undefined && picked !== q.ans;
        }
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 text-center space-y-2">
            <p class="text-sm font-bold text-slate-700 dark:text-slate-200">No questions match the current filter.</p>
            <button type="button" id="clearFilterBtn" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Show All Questions</button>
          </div>
        `;
        const cf = document.getElementById("clearFilterBtn");
        if (cf) cf.addEventListener("click", () => { activeFilter = "all"; renderAll(); });
        return;
      }

      const letters = ["A", "B", "C", "D"];
      list.innerHTML = filtered.map((q) => {
        const picked = answers[q.id];
        const revealed = isRevealed(mock.id, q.id);

        const optsHtml = q.options.map((opt, idx) => {
          let btnCls = "border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40 hover:border-indigo-400 dark:hover:border-indigo-500 text-slate-800 dark:text-slate-100";
          let badgeCls = "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700";
          let mark = "";

          if (revealed) {
            if (idx === q.ans) {
              btnCls = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200";
              badgeCls = "bg-emerald-600 text-white border-emerald-600";
              mark = '<span class="ml-auto text-xs font-extrabold text-emerald-600 dark:text-emerald-400">✓ Correct</span>';
            } else if (picked === idx) {
              btnCls = "border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-900 dark:text-rose-200";
              badgeCls = "bg-rose-600 text-white border-rose-600";
              mark = '<span class="ml-auto text-xs font-extrabold text-rose-600 dark:text-rose-400">✗ Your Pick</span>';
            } else {
              btnCls = "border-slate-200/70 dark:border-slate-800/70 bg-white dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 opacity-75";
            }
          } else if (picked === idx) {
            btnCls = "border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-900 dark:text-indigo-200";
            badgeCls = "bg-indigo-600 text-white border-indigo-600";
            mark = '<span class="ml-auto text-xs font-bold text-indigo-600 dark:text-indigo-400">Selected</span>';
          }

          return `
            <button type="button" data-qid="${q.id}" data-opt="${idx}"
              class="opt-btn w-full text-left flex items-center gap-3 p-3 rounded-xl border text-xs sm:text-sm font-medium transition cursor-pointer ${btnCls}">
              <span class="w-6 h-6 rounded-lg border text-xs font-extrabold flex items-center justify-center shrink-0 ${badgeCls}">${letters[idx]}</span>
              <span class="flex-1 leading-snug font-mono sm:font-sans">${escapeHtml(opt)}</span>
              ${mark}
            </button>
          `;
        }).join("");

        const expHtml = revealed && q.exp ? `
          <div class="mt-3 rounded-xl bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-200/80 dark:border-indigo-800/60 p-3.5 text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
            <span class="font-extrabold text-indigo-700 dark:text-indigo-300">Explanation: </span>${escapeHtml(q.exp)}
          </div>
        ` : "";

        const qBodyHtml = `<p class="text-sm sm:text-base font-semibold text-slate-900 dark:text-white leading-relaxed whitespace-pre-line mb-3.5">${escapeHtml(q.q)}</p>`;

        return `
          <article id="qcard-${q.id}" class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5 shadow-xs scroll-mt-40">
            <div class="flex flex-wrap items-center gap-2 mb-2.5">
              <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-indigo-600 text-white">Q${q.num}</span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">${escapeHtml(mock.category)}</span>
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border text-sky-800 dark:text-sky-300 bg-sky-100 dark:bg-sky-900/40 border-sky-200 dark:border-sky-800">📘 ${escapeHtml(q.exam)}</span>
            </div>
            ${qBodyHtml}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${optsHtml}
            </div>
            ${expHtml}
          </article>
        `;
      }).join("");
    }

    function renderAll() {
      renderCategoryTabs();
      renderMockTabs();
      renderHeroAndStats();
      renderPalette();
      renderQuestions();
    }

    document.getElementById("categoryTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-tab");
      if (!btn) return;
      const nextCat = btn.dataset.cat;
      if (nextCat === activeCategory) return;
      pauseAllTimers();
      activeCategory = nextCat;
      const firstMock = getCategoryMocks(activeCategory)[0];
      if (firstMock) activeMockId = firstMock.id;
      activeFilter = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("mockTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".mock-tab");
      if (!btn) return;
      const nextId = Number(btn.dataset.mockId);
      if (nextId === activeMockId) return;
      pauseAllTimers();
      activeMockId = nextId;
      activeFilter = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("questionsList").addEventListener("click", (e) => {
      const btn = e.target.closest(".opt-btn");
      if (!btn) return;
      const qId = Number(btn.dataset.qid);
      const optIdx = Number(btn.dataset.opt);
      const mock = getActiveMock();

      const st = timerState[activeMockId];
      if (!st.running && st.remaining === mock.durationSec) {
        startTimerForActive();
      }

      if (quizMode === "instant") {
        if (answers[qId] !== undefined) return;
        answers[qId] = optIdx;
      } else {
        if (submittedMocks[mock.id]) return;
        answers[qId] = optIdx;
      }
      safeSet(STORAGE_ANS, answers);
      renderAll();
    });

    document.getElementById("questionPalette").addEventListener("click", (e) => {
      const btn = e.target.closest(".pal-btn");
      if (!btn) return;
      const target = document.getElementById(btn.dataset.jump);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      } else {
        activeFilter = "all";
        renderAll();
        setTimeout(() => {
          const el = document.getElementById(btn.dataset.jump);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 50);
      }
    });

    document.getElementById("filterGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".flt-btn");
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      renderAll();
    });

    document.getElementById("modeInstantBtn").addEventListener("click", () => { quizMode = "instant"; renderAll(); });
    document.getElementById("modeExamBtn").addEventListener("click", () => { quizMode = "exam"; renderAll(); });
    document.getElementById("submitExamBtn").addEventListener("click", () => { pauseAllTimers(); showScorecardModal("Mock Submitted"); });
    document.getElementById("timerToggleBtn").addEventListener("click", toggleTimer);
    document.getElementById("timerResetBtn").addEventListener("click", resetTimer);

    document.getElementById("resetMockBtn").addEventListener("click", () => {
      const mock = getActiveMock();
      openModal(
        `Reset ${mock.code}?`,
        `<p>This will clear all saved answers and reset the timer for <strong>${escapeHtml(mock.code)}</strong>.</p>`,
        [
          { label: "Cancel", cls: "px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer" },
          {
            label: "Reset Mock",
            cls: "px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold cursor-pointer",
            onClick: () => {
              mock.questions.forEach((q) => { delete answers[q.id]; });
              delete submittedMocks[mock.id];
              safeSet(STORAGE_ANS, answers);
              safeSet(STORAGE_SUB, submittedMocks);
              resetTimer();
              activeFilter = "all";
              renderAll();
            }
          }
        ]
      );
    });

    document.getElementById("prevMockBtn").addEventListener("click", () => {
      if (activeMockId > 1) {
        pauseAllTimers();
        activeMockId--;
        activeCategory = getActiveMock().category;
        activeFilter = "all";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("nextMockBtn").addEventListener("click", () => {
      if (activeMockId < DATA.mocks.length) {
        pauseAllTimers();
        activeMockId++;
        activeCategory = getActiveMock().category;
        activeFilter = "all";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("modalCloseX").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeModal(); });

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.classList.toggle("dark", isDark);
      document.getElementById("themeIcon").textContent = isDark ? "☀️" : "🌙";
    }
    applyTheme(safeGet(STORAGE_THEME, "light"));
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
      safeSet(STORAGE_THEME, next);
      applyTheme(next);
    });

    renderAll();
  </script>
</body>
</html>
