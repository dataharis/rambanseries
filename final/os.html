B TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following statement(s) is/are correct regarding a B+ tree?\nI. In a B+ tree, all the data records (or pointers to them) are stored in the leaf nodes.\nII. The leaf nodes of a B+ tree are linked together, which makes range queries efficient.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 2, "exp": "Both statements are true—leaf nodes store all record pointers and form a sorted linked list for fast range scans."}, {"id": 179, "num": 8, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "According to W. H. Inmon, a data warehouse is subject-oriented, integrated, time-variant and non-volatile. Which property is NOT part of this definition?", "options": ["Volatile, updated record by record", "Subject-oriented", "Time-variant", "Integrated"], "ans": 0, "exp": "A data warehouse is non-volatile (loaded in bulk and read-only); record-by-record volatility describes OLTP databases."}, {"id": 180, "num": 9, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Employee(eid, salary) has no NULL salaries. Which query returns the second highest distinct salary?", "options": ["SELECT MAX(salary) FROM Employee WHERE salary < (SELECT MAX(salary) FROM Employee);", "SELECT MAX(salary) FROM Employee WHERE salary <> MAX(salary);", "SELECT salary FROM Employee ORDER BY salary DESC LIMIT 2;", "SELECT MAX(salary) FROM Employee WHERE salary <= (SELECT MAX(salary) FROM Employee);"], "ans": 0, "exp": "Taking MAX(salary) strictly less than the overall MAX(salary) always yields the second highest distinct salary."}, {"id": 181, "num": 10, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 17 · Real Exam", "q": "Which of the following is NOT a concurrency-control technique in a DBMS?", "options": ["Two-phase locking", "Timestamp ordering", "Validation (optimistic) technique", "Normalisation"], "ans": 3, "exp": "Normalisation is a database schema design method to reduce redundancy, not a concurrency-control protocol."}, {"id": 182, "num": 11, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "R(A, B, C, D, E) has FDs AB → C, C → D, D → A. Which statement is correct?", "options": ["R is in 1NF but not in 2NF", "R is in BCNF", "R is in 2NF but not in 3NF", "R is in 3NF but not in BCNF"], "ans": 3, "exp": "Candidate keys are ABE, BCE, BDE — every attribute is prime, so R is in 3NF; C → D violates BCNF because C is not a superkey."}, {"id": 183, "num": 12, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "R(A, B, C, D) has FDs A → B and C → D. Which decomposition is lossless?", "options": ["{AB, BCD}", "{AB, CD}", "{AB, CD, AC}", "{ABD, CD}"], "ans": 2, "exp": "AB ⋈ AC on A (A→B key of AB) gives ABC losslessly; ABC ⋈ CD on C (C→D key of CD) gives ABCD losslessly."}, {"id": 184, "num": 13, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Under basic timestamp ordering, T1 (TS = 5) attempts W1(X) when RTS(X) = 7 and WTS(X) = 3. What happens?", "options": ["The write is ignored using Thomas' write rule", "T1 is rolled back", "The write is performed and WTS(X) becomes 5", "T1 waits until transaction 7 commits"], "ans": 1, "exp": "Because TS(T1) = 5 < RTS(X) = 7, a younger transaction already read X, so T1 must be rolled back."}, {"id": 185, "num": 14, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Consider schedule S: R1(A), W2(A), W1(A), W3(A). Which statement is correct?", "options": ["S is neither view nor conflict serializable", "S is conflict serializable", "S is view serializable but not conflict serializable", "S is conflict serializable but not view serializable"], "ans": 2, "exp": "Cycle T1↔T2 breaks conflict serializability, but blind writes W2(A) and W3(A) make S view-equivalent to T1 → T2 → T3."}, {"id": 186, "num": 15, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "A B+-tree internal node fits in a 1024-byte block with 10-byte keys and 6-byte block pointers. Maximum order p (child pointers)?", "options": ["65", "63", "64", "102"], "ans": 2, "exp": "6p + 10(p − 1) ≤ 1024 ⇒ 16p ≤ 1034 ⇒ p = 64."}, {"id": 187, "num": 16, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "R(A, B, C, D) has exactly one candidate key, A. How many super keys does R have?", "options": ["8", "16", "7", "15"], "ans": 0, "exp": "Every superkey must include A plus any subset of {B, C, D} ⇒ 2³ = 8."}, {"id": 188, "num": 17, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "S(x) has {1, 2, 3}; T(y) has {2, NULL}. What does `SELECT x FROM S WHERE x NOT IN (SELECT y FROM T);` return?", "options": ["No rows", "1 and 3", "1, 3 and NULL", "3 only"], "ans": 0, "exp": "`x NOT IN (2, NULL)` evaluates `x <> 2 AND x <> NULL`, yielding UNKNOWN for 1 and 3 and FALSE for 2 ⇒ No rows returned."}, {"id": 189, "num": 18, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Regarding Write-Ahead Logging (WAL):\nI. A log record describing an update must reach stable storage before the modified data page is written to disk.\nII. WAL is required only for read-only transactions.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "WAL applies to modifying transactions (II false) and requires log records on stable storage before data pages (I true)."}, {"id": 190, "num": 19, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "Which of the following is NOT one of the three basic Armstrong's axioms for functional dependencies?", "options": ["Reflexivity: if Y ⊆ X, then X → Y", "Augmentation: if X → Y, then XZ → YZ", "Transitivity: if X → Y and Y → Z, then X → Z", "Union: if X → Y and X → Z, then X → YZ"], "ans": 3, "exp": "The three basic axioms are Reflexivity, Augmentation, and Transitivity; Union is a derived rule."}]}, {"id": 11, "category": "DBMS", "code": "SQL Mock 03", "title": "DBMS & SQL — Mock 03", "subtitle": "Keys, Normalization (1NF–BCNF), SQL Queries, Transactions, ACID & Recovery", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 191, "num": 1, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "q": "In an ER diagram, total participation of an entity set in a relationship set is shown by ______.", "options": ["a dashed line", "a diamond", "an arrow", "a double line"], "ans": 3, "exp": "Total participation is drawn as a double line connecting the entity set to the relationship."}, {"id": 192, "num": 2, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Relation R(A, B, C, D, E) has FDs AB → C, C → D, D → E. What is the highest normal form of R?", "options": ["2NF", "1NF", "3NF", "BCNF"], "ans": 0, "exp": "Only candidate key is AB. No partial dependency exists (in 2NF), but C → D and D → E are transitive dependencies on non-prime attributes, so not in 3NF."}, {"id": 193, "num": 3, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Consider the schedule: W1(A), R2(A), W2(B), C2, C1 (C = commit). Which statement is correct?", "options": ["The schedule is not recoverable", "The schedule is recoverable but not cascadeless", "The schedule is cascadeless", "The schedule is strict"], "ans": 0, "exp": "T2 reads A written by T1 and commits (C2) before T1 commits (C1), making the schedule unrecoverable."}, {"id": 194, "num": 4, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "A sorted file has 30,000 records (100 B each) in 1024 B unspanned blocks. Primary index entries are 15 B. How many block accesses are needed to find a record using binary search on the index?", "options": ["6", "12", "7", "46"], "ans": 2, "exp": "Records/block = 10 ⇒ 3,000 data blocks. Index entries/block = ⌊1024/15⌋ = 68 ⇒ ⌈3000/68⌉ = 45 index blocks. Binary search = ⌈log₂ 45⌉ = 6 + 1 data block = 7."}, {"id": 195, "num": 5, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "R(A, B, C) with A → B and B → C is decomposed into R1(A, B) and R2(A, C). Which statement is correct?", "options": ["The decomposition is lossless but not dependency preserving", "The decomposition is lossless and dependency preserving", "The decomposition is lossy but dependency preserving", "The decomposition is lossy and not dependency preserving"], "ans": 0, "exp": "R1 ∩ R2 = {A} and A → B (key of R1), so lossless. However, B → C cannot be enforced without joining R1 and R2, so it is not dependency preserving."}, {"id": 196, "num": 6, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Teach(course, teacher, book) stores independent multi-valued teachers and books per course (every teacher uses every book). Which normal form removes this redundancy?", "options": ["BCNF", "Fourth normal form (4NF)", "Third normal form (3NF)", "Second normal form (2NF)"], "ans": 1, "exp": "Independent multivalued dependencies (course →→ teacher, course →→ book) are eliminated by 4NF."}, {"id": 197, "num": 7, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Enrolled(student, course) and Course(course) are relations. Which relational algebra operator directly gives students enrolled in EVERY course?", "options": ["Set difference (Enrolled − Course)", "Natural join (Enrolled ⋈ Course)", "Cartesian product (Enrolled × Course)", "Division (Enrolled ÷ Course)"], "ans": 3, "exp": "The Division operator (÷) handles universal quantification ('for all') queries directly."}, {"id": 198, "num": 8, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Under the wound-wait deadlock prevention scheme, T1 (timestamp 10) requests a lock held by T2 (timestamp 20). What happens?", "options": ["T1 is rolled back", "T1 waits for T2", "T2 is rolled back (wounded), and T1 gets the lock", "Both wait"], "ans": 2, "exp": "T1 (TS 10) is older than T2 (TS 20). In wound-wait, an older transaction wounds (aborts/rolls back) the younger transaction and takes the lock."}, {"id": 199, "num": 9, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "Which of the following statement(s) is/are correct?\nI. Every relation in BCNF is also in 3NF.\nII. Every relation in 3NF is also in BCNF.", "options": ["Only I", "Only II", "Both I and II", "Neither I nor II"], "ans": 0, "exp": "BCNF is strictly stronger than 3NF, so BCNF ⇒ 3NF, but a 3NF relation need not be in BCNF."}, {"id": 200, "num": 10, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "q": "In SQL, a ______ is a named block of statements that the DBMS executes automatically when a specified INSERT, UPDATE or DELETE occurs on a table.", "options": ["view", "cursor", "trigger", "stored procedure"], "ans": 2, "exp": "A trigger executes automatically upon specified DML events (INSERT/UPDATE/DELETE) on a table."}, {"id": 201, "num": 11, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "A relation is in Third Normal Form (3NF) if it is in 2NF and it has no ______ dependency.", "options": ["partial", "transitive", "multivalued", "trivial"], "ans": 1, "exp": "3NF = 2NF + no transitive dependency (no non-key attribute depending on another non-key attribute)."}, {"id": 202, "num": 12, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Student(sid, dept) has rows (1, CS), (2, IT), (3, NULL), (4, CS). Dept(dname, hod) has rows (CS, Rao), (ME, Jain). What does this query return?\nSELECT COUNT(*), COUNT(d.hod) FROM Student s LEFT JOIN Dept d ON s.dept = d.dname;", "options": ["4 and 4", "2 and 2", "4 and 2", "5 and 2"], "ans": 2, "exp": "LEFT JOIN keeps all 4 Student rows: (1,CS,Rao), (2,IT,NULL), (3,NULL,NULL), (4,CS,Rao). COUNT(*) = 4, while COUNT(d.hod) ignores NULLs and returns 2."}, {"id": 203, "num": 13, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "The ACID property that ensures the changes of a committed transaction survive a later system crash is called ______.", "options": ["atomicity", "consistency", "isolation", "durability"], "ans": 3, "exp": "Durability guarantees that once a transaction commits, its changes persist permanently even after a crash or power failure."}, {"id": 204, "num": 14, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "A key that consists of two or more attributes taken together is called a ______ key.", "options": ["candidate", "composite", "foreign", "surrogate"], "ans": 1, "exp": "A composite key combines two or more columns to uniquely identify a row (e.g., RollNo + SubjectCode)."}, {"id": 205, "num": 15, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Under the two-phase locking (2PL) protocol, a transaction may acquire new locks only during its ______ phase.", "options": ["shrinking", "growing", "commit", "validation"], "ans": 1, "exp": "In 2PL, a transaction may acquire locks only during the growing phase; once it releases a lock (shrinking phase), no new locks can be acquired."}, {"id": 206, "num": 16, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 16 · Real Exam", "q": "Emp(name, dept, sal) has rows (A, IT, 30), (B, IT, 50), (C, HR, 40), (D, HR, 20), (E, HR, 60) and (F, FIN, 70). What is the result of the query?\nSELECT dept, COUNT(*) FROM Emp WHERE sal > 25 GROUP BY dept HAVING COUNT(*) >= 2;", "options": ["(IT, 2) and (HR, 3)", "(IT, 2) and (HR, 2)", "(HR, 3) only", "(IT, 2), (HR, 2) and (FIN, 1)"], "ans": 1, "exp": "WHERE sal > 25 removes D(HR,20). Remaining counts: IT=2, HR=2, FIN=1. HAVING COUNT(*) >= 2 keeps (IT, 2) and (HR, 2)."}, {"id": 207, "num": 17, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "The SQL command ______ removes all the rows of a table but keeps the table structure for future use.", "options": ["DROP", "DELETE TABLE", "TRUNCATE", "ALTER"], "ans": 2, "exp": "TRUNCATE (DDL) quickly removes all rows while preserving the table schema."}, {"id": 208, "num": 18, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "What does `SELECT Name FROM Emp E WHERE Salary > (SELECT AVG(Salary) FROM Emp WHERE Dept = E.Dept);` return?", "options": ["Employees of the department with the highest salary", "Employees who earn more than the company average", "The department with the highest average salary", "Employees who earn more than the average salary of their own department"], "ans": 3, "exp": "This correlated subquery computes each employee's own department average and compares their salary against it."}, {"id": 209, "num": 19, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "The Marks column contains 10, NULL, 20 and 30. What does `SELECT AVG(Marks) FROM Result;` return?", "options": ["15", "20", "NULL", "Error"], "ans": 1, "exp": "SQL AVG() ignores NULL values: (10 + 20 + 30) / 3 = 20."}]}, {"id": 12, "category": "DBMS", "code": "SQL Mock 04", "title": "DBMS & SQL — Mock 04", "subtitle": "Keys, Normalization (1NF–BCNF), SQL Queries, Transactions, ACID & Recovery", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 210, "num": 1, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Name column contains Ravi, Aman, Kavya and Sita. How many rows are returned by `SELECT * FROM Student WHERE Name LIKE '_a%';`?", "options": ["1", "2", "3", "4"], "ans": 1, "exp": "'_a%' matches any string whose 2nd character is 'a': Ravi and Kavya → 2 rows."}, {"id": 211, "num": 2, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "In an E-R diagram, a relationship set is represented by a ______.", "options": ["rectangle", "ellipse", "diamond", "double rectangle"], "ans": 2, "exp": "Rectangle = entity set, Ellipse = attribute, Diamond = relationship set, Double rectangle = weak entity set."}, {"id": 212, "num": 3, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "In SQL, the ______ clause is used to filter the groups formed by GROUP BY.", "options": ["WHERE", "HAVING", "ORDER BY", "DISTINCT"], "ans": 1, "exp": "HAVING filters grouped rows and supports aggregate conditions."}, {"id": 213, "num": 4, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 15", "q": "Which of the following is a DML (Data Manipulation Language) command?", "options": ["CREATE", "ALTER", "UPDATE", "DROP"], "ans": 2, "exp": "UPDATE is DML; CREATE, ALTER, and DROP are DDL."}, {"id": 214, "num": 5, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "The SQL command ______ makes all the changes of the current transaction permanent in the database.", "options": ["ROLLBACK", "SAVEPOINT", "COMMIT", "GRANT"], "ans": 2, "exp": "COMMIT ends the current transaction and permanently saves all changes; ROLLBACK undoes uncommitted changes; SAVEPOINT sets a rollback marker."}, {"id": 215, "num": 6, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "The table Emp(Dept, Salary) contains (IT, 40000), (IT, 35000), (HR, 32000), (HR, 25000), (Sales, 50000) and (IT, 20000). What is the first row returned by:\nSELECT Dept, COUNT(*) FROM Emp WHERE Salary > 30000 GROUP BY Dept ORDER BY COUNT(*) DESC;", "options": ["(IT, 3)", "(IT, 2)", "(HR, 2)", "(Sales, 1)"], "ans": 1, "exp": "WHERE drops (HR, 25000) and (IT, 20000). Remaining counts: IT = 2, HR = 1, Sales = 1. ORDER BY COUNT(*) DESC returns (IT, 2) first."}, {"id": 216, "num": 7, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "In which logical order are the clauses of a SELECT statement processed?", "options": ["FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY", "SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY", "FROM → GROUP BY → WHERE → HAVING → SELECT → ORDER BY", "WHERE → FROM → SELECT → GROUP BY → ORDER BY → HAVING"], "ans": 0, "exp": "SQL evaluates FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY, which is why SELECT aliases work in ORDER BY but not in WHERE."}, {"id": 217, "num": 8, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following statements about SQL constraints is/are correct?\nI. A PRIMARY KEY column cannot contain NULL values.\nII. A table can have several UNIQUE constraints.\nIII. A FOREIGN KEY must refer to a PRIMARY KEY or UNIQUE column of the parent table.", "options": ["I, II and III", "I and II only", "II and III only", "I and III only"], "ans": 0, "exp": "All three statements are true: PRIMARY KEY enforces UNIQUE + NOT NULL, a table may have multiple UNIQUE constraints, and FOREIGN KEY must reference a PRIMARY KEY or UNIQUE column."}, {"id": 218, "num": 9, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "A table is in Second Normal Form (2NF) if it is in 1NF and it has no ______ dependency.", "options": ["transitive", "partial", "multivalued", "join"], "ans": 1, "exp": "2NF = 1NF with no partial dependency (every non-key attribute depends on the whole primary key). 3NF removes transitive dependencies."}, {"id": 219, "num": 10, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "When an ER diagram is converted to tables, how is a many-to-many (M : N) relationship represented?", "options": ["By a separate table containing the primary keys of both entity sets as foreign keys", "By adding the key of one entity to the table of the other", "By merging the two entity tables into one", "It cannot be represented in the relational model"], "ans": 0, "exp": "An M:N relationship requires a new junction table holding the primary keys of both entities as foreign keys (forming a composite primary key)."}, {"id": 220, "num": 11, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 14", "q": "Which of the following is NOT a type of key in a relational database?", "options": ["Candidate key", "Foreign key", "Alternate key", "Index key"], "ans": 3, "exp": "Relational key types include super, candidate, primary, alternate, foreign, and composite keys. 'Index key' is not a relational key type."}, {"id": 221, "num": 12, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which property of a database transaction ensures that either all of its operations are completed or none of them is carried out?", "options": ["Consistency", "Isolation", "Durability", "Atomicity"], "ans": 3, "exp": "Atomicity guarantees 'all or nothing' execution — any failure rolls back the entire transaction."}, {"id": 222, "num": 13, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "What does the SQL query return?\n`SELECT Name FROM Emp WHERE Salary > ALL (SELECT Salary FROM Emp WHERE Dept = 'HR');`", "options": ["Employees who earn more than every employee of the HR department", "Employees who earn more than at least one HR employee", "All the employees of the HR department", "The highest-paid employee of the HR department only"], "ans": 0, "exp": "`> ALL` means strictly greater than every value (i.e., greater than the maximum salary) in the HR department."}, {"id": 223, "num": 14, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Table A has 4 rows and Table B has 3 rows with identical schemas, and 2 rows are common. How many rows do `A UNION B` and `A UNION ALL B` return respectively?", "options": ["5 and 7", "7 and 5", "5 and 5", "2 and 7"], "ans": 0, "exp": "UNION eliminates duplicates: 4 + 3 − 2 = 5. UNION ALL keeps duplicates: 4 + 3 = 7."}, {"id": 224, "num": 15, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which statements are correct?\nI. GRANT and REVOKE are Data Control Language (DCL) commands.\nII. COMMIT is a Data Definition Language (DDL) command.", "options": ["Only II", "Only I", "Both I and II", "Neither I nor II"], "ans": 1, "exp": "GRANT and REVOKE are DCL commands, whereas COMMIT is a TCL (Transaction Control Language) command, not DDL."}, {"id": 225, "num": 16, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "A relation is said to be in First Normal Form (1NF) if all its attributes contain only ______ values.", "options": ["atomic", "composite", "multivalued", "derived"], "ans": 0, "exp": "1NF requires every column value to be single and indivisible (atomic), with no repeating groups."}, {"id": 226, "num": 17, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "The primary key of a weak entity set is formed by ______.", "options": ["The primary key of the owner entity set alone", "Its partial key alone", "All of its attributes", "Its partial key (discriminator) together with the primary key of its identifying (owner) entity set"], "ans": 3, "exp": "A weak entity combines its own discriminator (partial key) with the primary key of its identifying owner entity."}, {"id": 227, "num": 18, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 13", "q": "Which SQL command is used to create an index on a column of a table?", "options": ["ADD INDEX", "MAKE INDEX", "CREATE INDEX", "SET INDEX"], "ans": 2, "exp": "Standard SQL uses `CREATE INDEX idx_name ON Table(Col);`."}, {"id": 228, "num": 19, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which component of a DBMS is mainly responsible for ensuring the Isolation property of transactions?", "options": ["Storage manager", "Recovery manager", "Query optimiser", "Concurrency-control manager"], "ans": 3, "exp": "The Concurrency-control manager (via locking/timestamps) ensures Isolation; Recovery manager handles Atomicity and Durability."}]}, {"id": 13, "category": "DBMS", "code": "SQL Mock 05", "title": "DBMS & SQL — Mock 05", "subtitle": "Keys, Normalization (1NF–BCNF), SQL Queries, Transactions, ACID & Recovery", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 229, "num": 1, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Table Student has 5 rows (Id = 1..5). Table Marks has 4 rows (Id = 1, 1, 2, 4). How many rows are returned by `SELECT * FROM Student LEFT JOIN Marks ON Student.Id = Marks.Id;`?", "options": ["9", "4", "5", "6"], "ans": 3, "exp": "Id=1 gives 2 rows, Id=2 gives 1, Id=3 gives 1 (NULL), Id=4 gives 1, Id=5 gives 1 (NULL) ⇒ Total = 6 rows."}, {"id": 230, "num": 2, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "The City column contains Delhi, Mumbai, NULL, Delhi, Pune. What is returned by `SELECT COUNT(DISTINCT City) FROM Customer;`?", "options": ["3", "4", "5", "2"], "ans": 0, "exp": "DISTINCT eliminates duplicate 'Delhi' and COUNT(col) ignores NULL ⇒ Delhi, Mumbai, Pune = 3."}, {"id": 231, "num": 3, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Which statements are correct?\nI. A view can be updated in some cases (e.g., single table without aggregates).\nII. A foreign key column may contain NULL values.\nIII. A table can have more than one primary key.", "options": ["I, II and III", "II and III only", "I and III only", "I and II only"], "ans": 3, "exp": "A table can have only ONE primary key (though it may be composite). Statements I and II are correct."}, {"id": 232, "num": 4, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Relation R(A, B, C, D, E) has FDs AB → C, C → D, D → E and E → A. How many candidate keys does R have?", "options": ["4", "1", "2", "3"], "ans": 0, "exp": "B never appears on RHS so every key must contain B. Checking closures: (AB)⁺, (BC)⁺, (BD)⁺, (BE)⁺ all equal ABCDE ⇒ 4 candidate keys."}, {"id": 233, "num": 5, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 12", "q": "Table Student has 10 rows; 4 have Marks > 60, and 2 of those 4 share the same name. How many tuples are returned by π_Name(σ_{Marks > 60}(Student)) in relational algebra?", "options": ["2", "4", "10", "3"], "ans": 3, "exp": "σ selects 4 rows; relational algebra projection π returns a mathematical set (removing duplicates) ⇒ 4 − 1 = 3 tuples."}, {"id": 234, "num": 6, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Transaction T2 reads a value written by transaction T1, and T1 later aborts. This problem is known as ______.", "options": ["Lost update", "Dirty read", "Unrepeatable read", "Phantom read"], "ans": 1, "exp": "Reading uncommitted data that is subsequently rolled back is a Dirty Read (uncommitted dependency)."}, {"id": 235, "num": 7, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Table Emp(Dept, Salary) has rows (IT, 50000), (IT, 60000), (HR, 40000), (HR, 30000), (Sales, 70000). What is the result of:\nSELECT Dept, AVG(Salary) FROM Emp GROUP BY Dept HAVING COUNT(*) > 1 AND AVG(Salary) > 40000;", "options": ["Only (IT, 55000)", "(IT, 55000) and (Sales, 70000)", "(IT, 55000) and (HR, 35000)", "Error, because HAVING cannot use COUNT(*)"], "ans": 0, "exp": "IT: count=2, avg=55000 (passes both). HR: count=2, avg=35000 (fails avg). Sales: count=1 (fails count). Output: Only (IT, 55000)."}, {"id": 236, "num": 8, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Column Bonus of a 5-row table contains 500, NULL, 700, NULL, NULL. What is the output of SELECT COUNT(Bonus), COUNT(*) FROM Emp;?", "options": ["3 5", "5 5", "2 2", "2 5"], "ans": 3, "exp": "COUNT(Bonus) ignores NULLs ⇒ 2. COUNT(*) counts every row including NULLs ⇒ 5. Output: 2 5."}, {"id": 237, "num": 9, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Which of the following statements is/are correct?\nI. TRUNCATE is a DDL command that removes all rows but keeps the table structure.\nII. DELETE without a WHERE clause also removes the table structure.\nIII. DROP TABLE removes both the data and the structure.", "options": ["I, II and III", "I and II only", "II and III only", "I and III only"], "ans": 3, "exp": "TRUNCATE (DDL) and DELETE (DML) both preserve the table structure; DROP TABLE (DDL) removes both data and schema. Hence I and III only."}, {"id": 238, "num": 10, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Relation R(A, B, C, D) has functional dependencies A → B, B → C and C → D. What is the highest normal form R satisfies?", "options": ["1NF", "2NF", "3NF", "BCNF"], "ans": 1, "exp": "Candidate key is A (single attribute ⇒ no partial dependency ⇒ in 2NF). Because B→C and C→D are transitive dependencies among non-key attributes, it fails 3NF. Highest = 2NF."}, {"id": 239, "num": 11, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "A relation is in Boyce–Codd Normal Form (BCNF) if, for every non-trivial functional dependency X → Y, ______.", "options": ["X is a super key", "Y is a prime attribute", "X is a prime attribute", "Y is part of a candidate key"], "ans": 0, "exp": "BCNF requires that for every non-trivial FD X → Y, the left-hand side (determinant X) must be a super key."}, {"id": 240, "num": 12, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Relation R(A, B) has tuples (1, x), (2, y), (3, x) and S(B, C) has tuples (x, p), (x, q), (z, r). How many tuples are in the natural join R ⋈ S?", "options": ["2", "4", "3", "9"], "ans": 1, "exp": "Common attribute is B. Only B = x matches: 2 tuples in R × 2 tuples in S = 4 tuples."}, {"id": 241, "num": 13, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 11", "q": "Which method of the ADO.NET Command object returns only the value in the first column of the first row of the result?", "options": ["ExecuteReader()", "ExecuteScalar()", "ExecuteNonQuery()", "Fill()"], "ans": 1, "exp": "ExecuteScalar() returns a single value (e.g., SELECT COUNT(*)); ExecuteReader() streams rows; ExecuteNonQuery() returns affected row count."}, {"id": 242, "num": 14, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "What is the full form of VSAM in file organisation?", "options": ["Vector Storage Access Method", "Variable Sequential Access Method", "Virtual Sequential Access Mode", "Virtual Storage Access Method"], "ans": 3, "exp": "VSAM (Virtual Storage Access Method) is IBM's file access method that replaced ISAM, supporting key-sequenced, entry-sequenced, and relative-record files."}, {"id": 243, "num": 15, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "An index that has an index entry for every search-key value in the file is called a ______ index.", "options": ["sparse", "dense", "clustering", "multilevel"], "ans": 1, "exp": "A dense index contains an index entry for every search-key value in the data file, whereas a sparse index stores entries for only some values (e.g., one per block)."}, {"id": 244, "num": 16, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "Which data model uses facts and logical rules to derive new information from the stored data?", "options": ["Deductive model", "Hierarchical model", "Network model", "Relational model"], "ans": 0, "exp": "A deductive database model combines relational tables with logic programming (e.g., Datalog rules) to infer new facts from stored data."}, {"id": 245, "num": 17, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "______ is a repository that contains metadata — the description of the data in the database, such as table names, attributes, data types and constraints.", "options": ["Data mart", "Data warehouse", "Data dictionary", "Data lake"], "ans": 2, "exp": "The Data Dictionary (system catalog) stores 'data about data' (metadata) used by both the DBMS and the DBA."}, {"id": 246, "num": 18, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 10", "q": "Which of the following statement(s) is/are correct regarding a relation in third normal form (3NF)?\nI. It is in second normal form.\nII. No non-key attribute is transitively dependent on the primary key.", "options": ["Only I", "Only II", "Neither I nor II", "Both I and II"], "ans": 3, "exp": "A relation is in 3NF if and only if it is in 2NF and has no transitive dependency of any non-prime attribute on a primary/candidate key."}, {"id": 247, "num": 19, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Which database model represents data as a collection of tables?", "options": ["Relational", "Network", "Hierarchical", "Object-oriented"], "ans": 0, "exp": "E. F. Codd's Relational model represents data as tables (relations)."}]}, {"id": 14, "category": "DBMS", "code": "SQL Mock 06", "title": "DBMS & SQL — Mock 06", "subtitle": "Keys, Normalization (1NF–BCNF), SQL Queries, Transactions, ACID & Recovery", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 248, "num": 1, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "What is the full form of DBA in database management?", "options": ["Data Bank Access", "Database Administrator", "Database Algorithm", "Distributed Base Architecture"], "ans": 1, "exp": "DBA stands for Database Administrator."}, {"id": 249, "num": 2, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "A key that consists of two or more attributes is known as a ______ key.", "options": ["foreign", "composite", "alternate", "surrogate"], "ans": 1, "exp": "A composite key combines two or more attributes to uniquely identify tuples."}, {"id": 250, "num": 3, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "A functional dependency X → Y is called ______ if Y is a subset of X.", "options": ["transitive", "partial", "trivial", "multivalued"], "ans": 2, "exp": "If Y ⊆ X, then X → Y always holds and is called a trivial functional dependency."}, {"id": 251, "num": 4, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "______ occurs when an ER model suggests a relationship between entity types, but the pathway between certain occurrences is ambiguous.", "options": ["Chasm trap", "Fan trap", "Group trap", "Data trap"], "ans": 1, "exp": "A fan trap arises when two 1:N relationships fan out from one entity, making the pathway ambiguous."}, {"id": 252, "num": 5, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "Which symbol represents a derived attribute in an ER diagram?", "options": ["Diamond", "Double ellipse", "Double rectangle", "Dashed ellipse"], "ans": 3, "exp": "A derived attribute (e.g., Age from DOB) is drawn as a dashed ellipse."}, {"id": 253, "num": 6, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 09", "q": "______ is a log record marking a point where all modified buffers have been written to disk so recovery need not look further back.", "options": ["Shadow point", "Savepoint", "Commit point", "Checkpoint"], "ans": 3, "exp": "A checkpoint flushes dirty buffers to disk and limits crash-recovery log scanning."}, {"id": 254, "num": 7, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Which DBMS is open source and maintained by Oracle Corporation?", "options": ["SQL Server", "DB2", "MySQL", "MS Access"], "ans": 2, "exp": "MySQL is open source and maintained by Oracle Corporation."}, {"id": 255, "num": 8, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 08", "q": "Which language is used to define and manipulate data in relational databases?", "options": ["HTML", "CSS", "SQL", "XML"], "ans": 2, "exp": "SQL (DDL, DML, DCL, TCL) defines and manipulates relational databases."}, {"id": 256, "num": 9, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which SQL function returns the number of characters in a string?", "options": ["LENGTH()", "COUNT()", "SIZE()", "CHARS()"], "ans": 0, "exp": "LENGTH('DSSSB') returns 5 (COUNT() counts rows)."}, {"id": 257, "num": 10, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "A ______ index provides a secondary means of accessing a file and is defined on a non-ordering field.", "options": ["Primary", "Clustering", "Dense-primary", "Secondary"], "ans": 3, "exp": "A secondary index is defined on any non-ordering field (Primary = ordering key; Clustering = ordering non-key)."}, {"id": 258, "num": 11, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which is/are correct for SQL GROUP BY?\nI. Groups rows with same values in specified columns.\nII. Often used with aggregate functions like COUNT() and SUM().", "options": ["Only I", "Only II", "Neither I nor II", "Both I and II"], "ans": 3, "exp": "GROUP BY groups rows sharing column values and is commonly paired with COUNT(), SUM(), AVG(), etc."}, {"id": 259, "num": 12, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which ER diagram notation represents a 'multivalued attribute'?", "options": ["Single ellipse", "Double rectangle", "Dashed ellipse", "Double ellipse"], "ans": 3, "exp": "Double ellipse = multivalued attribute (Dashed ellipse = derived; Double rectangle = weak entity)."}, {"id": 260, "num": 13, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which normal form requires that every non-prime attribute be fully functionally dependent on every candidate key (no partial dependency)?", "options": ["2NF", "1NF", "3NF", "BCNF"], "ans": 0, "exp": "2NF eliminates partial dependencies on part of a candidate key (1NF = atomic; 3NF = transitive; BCNF = superkey determinants)."}, {"id": 261, "num": 14, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which SQL function returns the largest integer less than or equal to a given number?", "options": ["FLOOR", "CEILING", "ROUND", "ABS"], "ans": 0, "exp": "FLOOR(7.8) = 7 and FLOOR(−2.3) = −3."}, {"id": 262, "num": 15, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which wildcard character with SQL LIKE represents exactly one character?", "options": ["%", "_", "*", "#"], "ans": 1, "exp": "Underscore (_) matches exactly one character; % matches zero or more characters."}, {"id": 263, "num": 16, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which relational algebra operation selects tuples (rows) satisfying a given condition?", "options": ["Projection (π)", "Union (∪)", "Selection (σ)", "Cartesian product (×)"], "ans": 2, "exp": "Selection (σ) filters rows by a predicate; Projection (π) chooses columns."}, {"id": 264, "num": 17, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which SQL aggregate function counts all rows of a table, including rows with NULL values?", "options": ["SUM(column)", "COUNT(column)", "COUNT(*)", "AVG(column)"], "ans": 2, "exp": "COUNT(*) counts every row including NULLs, whereas COUNT(column) skips NULLs."}, {"id": 265, "num": 18, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Relation R has 3 attributes & 4 tuples; S has 2 attributes & 5 tuples. What are the degree and cardinality of R × S?", "options": ["Degree 6, cardinality 9", "Degree 5, cardinality 20", "Degree 5, cardinality 9", "Degree 6, cardinality 20"], "ans": 1, "exp": "Degree = 3 + 2 = 5; Cardinality = 4 × 5 = 20."}]}, {"id": 15, "category": "DBMS", "code": "SQL Mock 07", "title": "DBMS & SQL — Mock 07", "subtitle": "Keys, Normalization (1NF–BCNF), SQL Queries, Transactions, ACID & Recovery", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 266, "num": 1, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "When a 1:N relationship is converted to the relational model, the primary key of the '1' side is included in the 'N' side as a ______.", "options": ["candidate key", "foreign key", "super key", "composite attribute"], "ans": 1, "exp": "The primary key of the '1' side becomes a foreign key in the 'N' side relation."}, {"id": 267, "num": 2, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which integrity constraint states that no primary key value can be NULL?", "options": ["Key constraint", "Referential integrity", "Domain constraint", "Entity integrity constraint"], "ans": 3, "exp": "Entity integrity mandates that primary key attributes cannot contain NULL values."}, {"id": 268, "num": 3, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which SQL operator tests whether a value lies within a range of values?", "options": ["IN", "LIKE", "BETWEEN", "EXISTS"], "ans": 2, "exp": "BETWEEN checks whether a value falls within an inclusive range (e.g., BETWEEN 30000 AND 50000)."}, {"id": 269, "num": 4, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "Which SQL query finds all students whose names start with 'A'?", "options": ["SELECT * FROM Student WHERE Name LIKE 'A%';", "SELECT * FROM Student WHERE Name LIKE '%A';", "SELECT * FROM Student WHERE Name = 'A%';", "SELECT * FROM Student WHERE Name LIKE 'A_';"], "ans": 0, "exp": "LIKE 'A%' matches 'A' followed by any number of characters."}, {"id": 270, "num": 5, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 07", "q": "In SQL, which option of DROP SCHEMA removes the schema along with all its tables and elements?", "options": ["PURGE", "RESTRICT", "ALL", "CASCADE"], "ans": 3, "exp": "DROP SCHEMA name CASCADE removes the schema and all contained objects (RESTRICT fails if non-empty)."}, {"id": 271, "num": 6, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "In shadow paging recovery, which page table is used to restore the database after a crash?", "options": ["Current page table", "Shadow page table", "Inverted page table", "Hashed page table"], "ans": 1, "exp": "The shadow page table stays unmodified during a transaction and is used to restore the pre-transaction state after a crash."}, {"id": 272, "num": 7, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Match ER diagram symbols:\nList-I: 1. Rectangle  2. Diamond  3. Ellipse\nList-II: i. Attribute  ii. Entity set  iii. Relationship set", "options": ["1-iii, 2-i, 3-ii", "1-i, 2-ii, 3-iii", "1-ii, 2-iii, 3-i", "1-ii, 2-i, 3-iii"], "ans": 2, "exp": "Rectangle → Entity set (ii), Diamond → Relationship set (iii), Ellipse → Attribute (i)."}, {"id": 273, "num": 8, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "______ is a situation in which two or more transactions wait indefinitely for each other to release locks.", "options": ["Spoofing", "Starvation", "Timestamp", "Deadlock"], "ans": 3, "exp": "Deadlock occurs when transactions form a circular wait for locks held by one another."}, {"id": 274, "num": 9, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which of the following is NOT a type of lock used in concurrency control?", "options": ["Shared lock", "Exclusive lock", "Primary lock", "Intention lock"], "ans": 2, "exp": "Shared (S), Exclusive (X), and Intention locks (IS, IX, SIX) are standard concurrency locks; 'Primary lock' is not."}, {"id": 275, "num": 10, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "______ is the process of keeping copies of the same data at more than one site in a distributed database system.", "options": ["Data fragmentation", "Data allocation", "Data mining", "Data replication"], "ans": 3, "exp": "Data replication stores copies of data at multiple sites to improve availability and read speed."}, {"id": 276, "num": 11, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "______ fragmentation divides a relation by selecting subsets of rows (tuples) in a distributed database system.", "options": ["Vertical", "Derived", "Mixed", "Horizontal"], "ans": 3, "exp": "Horizontal fragmentation splits a relation into subsets of rows (tuples) via selection (σ); vertical splits columns (π)."}, {"id": 277, "num": 12, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which of the following is a logical operator in Structured Query Language?", "options": ["AND", ">=", "=", "+"], "ans": 0, "exp": "AND, OR and NOT are SQL logical operators (= and >= are comparison; + is arithmetic)."}, {"id": 278, "num": 13, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 06", "q": "Which statement(s) is/are correct regarding OLAP (On-Line Analytical Processing)?\nI. Used for complex analysis of historical data.\nII. Mainly used for day-to-day transaction processing.\nIII. Works on multidimensional data (data cubes).", "options": ["I and II", "II and III", "I and III", "I, II and III"], "ans": 2, "exp": "OLAP analyses historical multidimensional data cubes (I and III). Day-to-day transactions are OLTP (II is false)."}, {"id": 279, "num": 14, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Given schedules:\nS1: R1(A); W1(A); R2(A); W2(A); R1(B); W1(B)\nS2: R1(A); R2(A); W2(A); W1(A)\nWhich is conflict serializable?", "options": ["S1 is conflict serializable but S2 is not.", "S2 is conflict serializable but S1 is not.", "Both S1 and S2 are conflict serializable.", "Neither S1 nor S2 is conflict serializable."], "ans": 0, "exp": "S1 precedence graph has only T1 → T2 (acyclic → serializable). S2 has T1 → T2 and T2 → T1 (cycle → not serializable)."}, {"id": 280, "num": 15, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "For R(ABCDEF) with F = {A→B, B→C, CD→E, E→F}, find the closure (AD)+.", "options": ["ABCD", "ABCDE", "ABCDF", "ABCDEF"], "ans": 3, "exp": "AD → ABD (A→B) → ABCD (B→C) → ABCDE (CD→E) → ABCDEF (E→F)."}, {"id": 281, "num": 16, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "A weak entity set is represented in an ER diagram by a _____.", "options": ["ellipse", "double rectangle", "dashed ellipse", "diamond"], "ans": 1, "exp": "Weak entity = Double rectangle; Identifying relationship = Double diamond."}, {"id": 282, "num": 17, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 05", "q": "Which is an example of a fourth-generation language (4GL)?", "options": ["SQL", "C", "Assembly language", "Machine language"], "ans": 0, "exp": "1GL=Machine, 2GL=Assembly, 3GL=C/Java, 4GL=SQL/report generators, 5GL=Prolog."}, {"id": 283, "num": 18, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "The 'CHECK constraint' of SQL will _____.", "options": ["ensure a column cannot have a NULL value", "ensure all values in a column are different", "ensure that all the values in a column satisfy a specified condition", "provide a default value for a column"], "ans": 2, "exp": "CHECK enforces a Boolean predicate on column values (e.g., CHECK (Age >= 18))."}]}, {"id": 16, "category": "DBMS", "code": "SQL Mock 08", "title": "DBMS & SQL — Mock 08", "subtitle": "Keys, Normalization (1NF–BCNF), SQL Queries, Transactions, ACID & Recovery", "durationSec": 600, "timeLabel": "10-Min", "questions": [{"id": 284, "num": 1, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 04", "q": "Which of the following is a property or characteristic of an entity in the ER model?", "options": ["Relationship", "Attribute", "Instance", "Key"], "ans": 1, "exp": "An Attribute (drawn as an ellipse) describes a property of an entity."}, {"id": 285, "num": 2, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which statement about NULL is correct according to SQL-99?", "options": ["NULL = NULL returns UNKNOWN", "5 > NULL returns FALSE", "NULL IS NOT NULL returns TRUE", "NULL = NULL returns TRUE"], "ans": 0, "exp": "Any comparison operator with NULL evaluates to UNKNOWN; use IS NULL / IS NOT NULL for Boolean TRUE/FALSE."}, {"id": 286, "num": 3, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "The collection of data stored in a database at a particular moment is called:", "options": ["Schema", "Data model", "Instance", "Table"], "ans": 2, "exp": "Instance = snapshot of actual data at a moment; Schema = overall structure/design."}, {"id": 287, "num": 4, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "_____ is NOT allowed in the WHERE clause of an SQL query.", "options": ["A comparison operator", "An aggregate function such as SUM()", "The LIKE operator", "The IN operator"], "ans": 1, "exp": "WHERE filters rows before grouping; aggregate conditions belong in HAVING."}, {"id": 288, "num": 5, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Select the correct SQL statement to insert only RollNo, Name, and City into Student:", "options": ["INSERT Student SET RollNo=1, Name='Ravi', City='Delhi';", "ADD INTO Student (RollNo, Name, City) VALUES (1, 'Ravi', 'Delhi');", "INSERT INTO Student VALUES (RollNo=1, Name='Ravi', City='Delhi');", "INSERT INTO Student (RollNo, Name, City) VALUES (1, 'Ravi', 'Delhi');"], "ans": 3, "exp": "Standard SQL: INSERT INTO table (col1, col2, ...) VALUES (val1, val2, ...);"}, {"id": 289, "num": 6, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 03", "q": "Which SQL statement removes a table along with its structure from the database?", "options": ["DELETE", "REMOVE", "DROP TABLE", "TRUNCATE"], "ans": 2, "exp": "DROP TABLE deletes data, schema, indexes, and constraints (TRUNCATE/DELETE keep structure)."}, {"id": 290, "num": 7, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Table Emp(Sal, Bonus) has rows (100, 10), (200, NULL), (300, 30). What are the outputs of Q1 and Q2?", "options": ["640 and 640", "440 and 640", "NULL and 640", "640 and 440"], "ans": 1, "exp": "Q1: (200 + NULL) = NULL (ignored by SUM) ⇒ 110 + 330 = 440.\nQ2: SUM(Sal) = 600, SUM(Bonus) = 40 ⇒ 600 + 40 = 640."}, {"id": 291, "num": 8, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "What is the result of the following SQL expression?", "options": ["NULL", "Delhi", "Mumbai", "Error"], "ans": 1, "exp": "COALESCE() returns the first non-NULL argument in the list → 'Delhi'."}, {"id": 292, "num": 9, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Table Employee(EmpID, Name, ManagerID) stores each employee and their manager (who is also in the same table). Which join lists each employee with their manager's name?", "options": ["Natural join with another table", "Cross join", "Full outer join with a second table", "Self join"], "ans": 3, "exp": "A self join joins the Employee table to itself using two aliases (E and M) on E.ManagerID = M.EmpID."}, {"id": 293, "num": 10, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "Foreign key DeptID in Emp has REFERENCES Dept(DeptID) ON DELETE CASCADE. What happens when DeptID 10 is deleted from Dept?", "options": ["Deletion is rejected", "DeptID of those employees is set to NULL", "Nothing happens to Emp", "All rows in Emp with DeptID = 10 are also deleted automatically"], "ans": 3, "exp": "ON DELETE CASCADE automatically deletes matching child rows when the referenced parent row is deleted."}, {"id": 294, "num": 11, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "T1 holds a shared (S) lock on A. Then T2 requests an S lock on A, and T3 requests an exclusive (X) lock on A. What happens?", "options": ["T3 is granted its lock, T2 must wait", "Both T2 and T3 must wait", "Both are granted immediately", "T2 is granted its lock, but T3 must wait"], "ans": 3, "exp": "Shared (S) locks are compatible with other S locks, so T2 gets S immediately; X conflicts with S, so T3 waits."}, {"id": 295, "num": 12, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 02", "q": "MongoDB stores JSON-like documents in collections without a fixed table schema. It is an example of a:", "options": ["Hierarchical file system", "Relational (SQL) database", "Spreadsheet program", "NoSQL document database"], "ans": 3, "exp": "MongoDB (like CouchDB) is a NoSQL document database. (Redis = key-value, Cassandra = column-family, Neo4j = graph.)"}, {"id": 296, "num": 13, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Table Marks(Roll, Sub, Score) has rows: (1,M,80), (1,S,75), (2,M,60), (2,S,90), (3,M,75). What is the output?", "options": ["Only Roll 1", "No row is returned", "Only Roll 2", "Roll 1 and Roll 2"], "ans": 0, "exp": "Sums by Roll: Roll 1 = 155 (>150 ✓), Roll 2 = 150 (not strictly >150 ✗), Roll 3 = 75 (✗). Output: Only Roll 1."}, {"id": 297, "num": 14, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A relation is in 4NF, but can still be split into smaller relations that join back losslessly only through three or more of them. Which normal form removes such join dependencies?", "options": ["5NF (Project-Join Normal Form)", "3NF", "2NF", "BCNF"], "ans": 0, "exp": "5NF (Project-Join Normal Form / PJNF) eliminates join dependencies not implied by candidate keys."}, {"id": 298, "num": 15, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "A DBMS detects deadlocks using a wait-for graph (edge Ti → Tj means Ti waits for Tj). A deadlock exists if and only if:", "options": ["The graph contains a cycle", "The graph has more edges than nodes", "Every transaction has at least one incoming edge", "The graph has a node with no outgoing edge"], "ans": 0, "exp": "A cycle (e.g., T1 → T2 → T3 → T1) means every transaction in the cycle waits on another, causing deadlock. The DBMS resolves it by rolling back a victim transaction."}, {"id": 299, "num": 16, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "In extendible hashing, what happens when a record must be inserted into a full bucket whose local depth equals the global depth?", "options": ["The record is stored in an overflow chain only", "The directory is doubled (global depth increases by 1) and the full bucket is split", "The insertion is rejected", "The whole file is rehashed with a new hash function"], "ans": 1, "exp": "When local depth = global depth on overflow, the directory size doubles (2^d → 2^(d+1)), global depth increments by 1, and only the overflowing bucket is split."}, {"id": 300, "num": 17, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "Which RAID level stores an exact copy of every disk on a second disk (mirroring) so data survives if one disk fails?", "options": ["RAID 5", "RAID 3", "RAID 1", "RAID 0"], "ans": 2, "exp": "RAID 1 uses mirroring (50% usable capacity, survives 1 disk failure). RAID 0 = striping only; RAID 3 = byte striping + dedicated parity; RAID 5 = block striping + distributed parity."}, {"id": 301, "num": 18, "topic": "DBMS & SQL", "exam": "DSSSB TGT CS · Ramban Mock 01", "q": "What is the main advantage of a stored procedure in a database?", "options": ["It automatically runs whenever a row is inserted into a table", "It is a precompiled set of SQL statements kept in the database that can be called by name, reducing network traffic and allowing reuse", "It is a virtual table created from a query", "It stores table data permanently in a separate file"], "ans": 1, "exp": "A stored procedure is precompiled and stored on the DB server, called by name (reducing network traffic and enabling reuse/permissions). Automatic execution on DML is a trigger; a virtual table is a view."}]}]};

    function safeGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function safeSet(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
