  <script>
    const DATA = {"mocks": [{"id": 1, "code": "Mock 01", "title": "Reasoning Mock 01", "subtitle": "DSSSB PYQ Shifts · Set 1", "badge": "PYQ Shifts", "durationSec": 1080, "questions": [{"id": 1, "num": 1, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "What should come in place of '?' in the given series?\n64  73  91  118  154  ?", "options": ["189", "206", "199", "203"], "ans": 2, "exp": "Differences form the table of 9: +9, +18, +27, +36 → next difference = +45. 154 + 45 = 199."}, {"id": 2, "num": 2, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "What should come in place of the '?' in the given series?\n14  23  41  77  149  ?", "options": ["293", "296", "288", "291"], "ans": 0, "exp": "Differences double each step: +9, +18, +36, +72, +144 (or term × 2 − 5). 149 + 144 = 293."}, {"id": 3, "num": 3, "topic": "Letter / Alphanumeric Series", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Which of the following letter clusters will replace the question mark (?) in the given series?\nAJF  TEZ  MZT  FUN  ?", "options": ["WEQ", "YUT", "CXZ", "YPH"], "ans": 3, "exp": "1st letter: −7 (A→T→M→F→Y); 2nd letter: −5 (J→E→Z→U→P); 3rd letter: −6 (F→Z→T→N→H) → YPH."}, {"id": 4, "num": 4, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "If 'A' stands for '+', 'E' stands for '÷', 'J' stands for '×' and 'U' stands for '−', what will come in place of '?'?\n11 A 32 J 14 U 156 E 52 = ?", "options": ["346", "380", "456", "446"], "ans": 2, "exp": "11 + 32 × 14 − 156 ÷ 52 = 11 + 448 − 3 = 456."}, {"id": 5, "num": 5, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "What will come in place of '?' if '+' and '−' are interchanged and '×' and '÷' are interchanged?\n15 ÷ 11 + 44 × 2 − 36 = ?", "options": ["104", "128", "179", "151"], "ans": 2, "exp": "15 × 11 − 44 ÷ 2 + 36 = 165 − 22 + 36 = 179."}, {"id": 6, "num": 6, "topic": "Seating Arrangement", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Six people, D, E, F, G, H and O, are sitting in a row facing the north. No one sits to the left of F. Only three people sit between F and O. Only three people sit to the right of D. F sits to the immediate left of H. G is not an immediate neighbour of D. How many people sit between G and D?", "options": ["One / एक", "Two / दो", "Three / तीन", "Four / चार"], "ans": 1, "exp": "Positions 1–6: F(1), H(2), D(3), E(4), O(5), G(6). Between G(6) and D(3) sit E and O → Two."}, {"id": 7, "num": 7, "topic": "Puzzle", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "A, B, C, D, E and F live on six floors (1 lowest to 6 topmost). D lives on a prime-numbered floor. The product of floors of D and A is 8. C lives immediately above B. The sum of floors of A and F is 7. How many people live below F?", "options": ["3", "2", "4", "1"], "ans": 1, "exp": "D prime and D×A=8 ⇒ D=2, A=4. A+F=7 ⇒ F=3. C immediately above B ⇒ B=5, C=6; E=1. Below F(3) live D(2) and E(1) → 2."}, {"id": 8, "num": 8, "topic": "Ranking & Order", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Seven boxes A, B, C, D, G, H, and K are stacked one above the other. B is kept immediately above H. C is kept immediately above D. Only A is kept above K. Only two boxes are kept above B. C is not kept in the third position from the bottom. How many boxes are kept between G and A?", "options": ["Three / तीन", "Four / चार", "Two / दो", "One / एक"], "ans": 0, "exp": "Top(1) to Bottom(7): A(1), K(2), B(3), H(4), G(5), C(6), D(7). Between G(5) and A(1) are K, B, H → Three."}, {"id": 9, "num": 9, "topic": "Letter-Symbol Sequence", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Refer to the letter series:\n(Left) G H O L P U Y T H B G T R F V C D E X D R G V B H N J M K O L P U M N H Y N J M K (Right)\nHow many letters are there in the English alphabetical order between the letter which is sixth from the right end and sixth from the left end?", "options": ["13", "11", "12", "15"], "ans": 2, "exp": "6th from left = U (21); 6th from right = H (8). Letters between H and U = 21 − 8 − 1 = 12."}, {"id": 10, "num": 10, "topic": "Alphabet Test", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Each vowel in the word LATEXIN is changed to the next letter and each consonant to the previous letter in the English alphabetical order. Which letter will be third from the left in the new group?", "options": ["B", "S", "F", "J"], "ans": 1, "exp": "LATEXIN → KBSFWJM. The 3rd letter (T, a consonant) changes to S."}, {"id": 11, "num": 11, "topic": "Alphabet Test", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "The position(s) of how many letters will remain unchanged if each letter in the word FRAMING is arranged in alphabetical order?", "options": ["Three / तीन", "Two / दो", "None / एक भी नहीं", "One / एक"], "ans": 3, "exp": "FRAMING vs AFGIMNR: only N (6th position) stays unchanged → One."}, {"id": 12, "num": 12, "topic": "Analogy", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "13 is related to 39 following a certain logic. Following the same logic, 34 is related to 102. To which of the following is 47 related? (Operate on whole numbers without breaking digits.)", "options": ["141", "142", "140", "143"], "ans": 0, "exp": "Rule: × 3 (13×3=39, 34×3=102). So 47 × 3 = 141."}, {"id": 13, "num": 13, "topic": "Analogy", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Which letter-clusters should replace # and % so that the pattern on both sides of :: is the same?\n# : MGX :: WQH : %", "options": ["# = ICT, % = AUK", "# = ICT, % = AUL", "# = ICT, % = BUL", "# = LCT, % = AUL"], "ans": 1, "exp": "Every letter shifts +4: ICT → MGX (I+4=M, C+4=G, T+4=X) and WQH → AUL (W+4=A, Q+4=U, H+4=L)."}, {"id": 14, "num": 14, "topic": "Coding–Decoding", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "In a certain code language, 'drive run fast' is 'ax py nl', 'drive fast please' is 'py nl ct', and 'he please drive' is 'ct py mg'. What does 'py' stand for?", "options": ["please", "drive", "fast", "run"], "ans": 1, "exp": "'drive' is the only word in all three sentences and 'py' is the only code in all three → py = drive."}, {"id": 15, "num": 15, "topic": "Coding–Decoding", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "In a certain code language, 'water or air' is 't5 h5 j5', 'air is flowing' is 'j5 p5 n5', and 'water is hot' is 'p5 h5 x5'. What is the code for 'or'?", "options": ["p5", "j5", "t5", "h5"], "ans": 2, "exp": "air = j5 (common to 1 & 2); water = h5 (common to 1 & 3); leftover in sentence 1: or = t5."}, {"id": 16, "num": 16, "topic": "Syllogism", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Statements: All black are red. All blue are red.\nConclusion (I): All black are blue.\nConclusion (II): All blue are black.", "options": ["Only conclusion (II) follows / केवल निष्कर्ष (II) अनुसरण करता है", "Neither conclusion (I) nor (II) follows / न तो निष्कर्ष (I) और न ही निष्कर्ष (II) अनुसरण करता है", "Both conclusions (I) and (II) follow / निष्कर्ष (I) और निष्कर्ष (II) दोनों अनुसरण करते हैं", "Only conclusion (I) follows / केवल निष्कर्ष (I) अनुसरण करता है"], "ans": 1, "exp": "Both Black and Blue lie inside Red with no definite link between them, so neither conclusion follows."}, {"id": 17, "num": 17, "topic": "Blood Relations", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "A is the daughter of H. H is the father of J. J is the brother of M. M is the daughter of P. P is the ____ of A.", "options": ["Son / पुत्र", "Mother / माता", "Brother / भाई", "Husband / पति"], "ans": 1, "exp": "A, J, and M are children of father H; since M is also daughter of P, P is the mother of A."}, {"id": 18, "num": 18, "topic": "Direction & Distance", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Mayank starts from Point A and drives 10 km west, turns left (7 km), turns right (5 km), turns right (7 km), turns left (6 km) and stops at Point P. How far and in which direction should he drive to reach Point A again?", "options": ["19 km towards the south / 19 km, दक्षिण की ओर", "20 km towards the north / 20 km, उत्तर की ओर", "21 km towards the west / 21 km, पश्चिम की ओर", "21 km towards the east / 21 km, पूर्व की ओर"], "ans": 3, "exp": "South 7 km and North 7 km cancel out. Net West = 10 + 5 + 6 = 21 km. To return to A, drive 21 km towards the east."}, {"id": 19, "num": 19, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "If 'A' stands for '÷', 'B' stands for '×', 'C' stands for '+' and 'D' stands for '−', what will come in place of '?'?\n144 A 32 B 54 C 69 D 81 = ?", "options": ["208", "203", "231", "230"], "ans": 2, "exp": "144 ÷ 32 × 54 + 69 − 81 = 4.5 × 54 + 69 − 81 = 243 + 69 − 81 = 231."}, {"id": 20, "num": 20, "topic": "Data Sufficiency", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Among 5 sticks H, L, G, O and D of different heights, which stick is the tallest?\n(I) L is taller than D. D is shorter than only one stick.\n(II) H is shorter than G but taller than O.", "options": ["Data in both statements I and II together are NOT sufficient", "Data in statement I alone is sufficient while statement II alone is not", "Data in both statements I and II together are sufficient", "Data in statement II alone is sufficient while statement I alone is not"], "ans": 1, "exp": "From (I), D is 2nd tallest and L > D ⇒ L is the tallest (sufficient alone). (II) gives no info about L or D."}]}, {"id": 2, "code": "Mock 02", "title": "Reasoning Mock 02", "subtitle": "DSSSB PYQ Shifts · Set 2", "badge": "PYQ Shifts", "durationSec": 1080, "questions": [{"id": 21, "num": 1, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "What should come in place of '?' in the given series?\n5  6  16  57  ?  1245", "options": ["284", "298", "244", "268"], "ans": 2, "exp": "Rule: prev × n + n² (n=1,2,3,4,5): 5×1+1=6, 6×2+4=16, 16×3+9=57, 57×4+16 = 244 (check: 244×5+25 = 1245)."}, {"id": 22, "num": 2, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "What should come in place of the '?' in the given series?\n107  114  128  149  177  ?", "options": ["212", "210", "214", "216"], "ans": 0, "exp": "Differences are multiples of 7: +7, +14, +21, +28 → next +35. 177 + 35 = 212."}, {"id": 23, "num": 3, "topic": "Letter / Alphanumeric Series", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "What should come in place of '?' in the following series?\nBDF  EHK  HLP  KPU  ?", "options": ["SXY", "NTZ", "TVX", "NQV"], "ans": 1, "exp": "First letter +3 each (B→E→H→K→N); internal gaps grow +2, +3, +4, +5, +6: N(14) + 6 = T(20) + 6 = Z(26) → NTZ."}, {"id": 24, "num": 4, "topic": "Ranking & Order", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Seven boxes G, H, I, L, M, N and O are kept one over the other. Only three boxes are kept below H. O is immediately above H. I is immediately above N. Only G is above L. M is not at the lowermost position. How many boxes are kept between M and G?", "options": ["Zero / शून्य", "Three / तीन", "Two / दो", "One / एक"], "ans": 1, "exp": "Top(1) to Bottom(7): G(1), L(2), O(3), H(4), M(5), I(6), N(7). Between M(5) and G(1) are L, O, H → Three."}, {"id": 25, "num": 5, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "If + means −, − means ×, × means ÷ and ÷ means +, what will come in place of '?'?\n47 − 7 ÷ 54 + 48 × 2 = ?", "options": ["329", "334", "323", "359"], "ans": 3, "exp": "47 × 7 + 54 − 48 ÷ 2 = 329 + 54 − 24 = 359."}, {"id": 26, "num": 6, "topic": "Seating Arrangement", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Six people H, I, K, L, M and S sit in a row facing north. Only two sit to the right of H. Only two sit between H and K. Only two sit between L and M. M sits immediately left of H. L sits immediately right of I. Who sits third from the left end?", "options": ["L", "I", "S", "M"], "ans": 3, "exp": "Row 1–6: K(1), S(2), M(3), H(4), I(5), L(6). Third from left = M."}, {"id": 27, "num": 7, "topic": "Puzzle", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "B, C, D, K, L and M live on floors 1 (lowest) to 6 (topmost). Only two live between C and B. Only two live between K and L. Only one lives between M and L. M lives on floor 1. C lives above L. How many people live between D and K?", "options": ["One / एक", "Two / दो", "Four / चार", "Three / तीन"], "ans": 0, "exp": "Floors 1–6: M(1), B(2), L(3), D(4), C(5), K(6). Between D(4) and K(6) is only C → One."}, {"id": 28, "num": 8, "topic": "Letter-Symbol Sequence", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Refer to the letter series (Left to Right):\nE N E W S V L U T S D A D D Z A A V V I O H\nHow many consonants are immediately preceded by a vowel and immediately followed by a vowel?", "options": ["One / एक", "Two / दो", "Three / तीन", "None / एक भी नहीं"], "ans": 0, "exp": "Only E-N-E matches Vowel–Consonant–Vowel → One."}, {"id": 29, "num": 9, "topic": "Letter-Symbol Sequence", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Refer to the letter-symbol series (Left to Right):\nE Z X M D + O C C Y Z \\ M V M U * U B B P\nHow many letters are immediately preceded by a symbol and immediately followed by a letter?", "options": ["One / एक", "Two / दो", "Three / तीन", "None / एक भी नहीं"], "ans": 2, "exp": "Pattern Symbol–LETTER–Letter matches +OC, \\MV, and *UB → Three."}, {"id": 30, "num": 10, "topic": "Alphabet Test", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Words: FAN  OUT  UAN  LOP. Each vowel is changed to the next letter and each consonant to the previous letter. In how many clusters formed will NO vowel appear?", "options": ["Three / तीन", "Two / दो", "One / एक", "Four / चार"], "ans": 1, "exp": "FAN→EBM (has E), OUT→PVS (no vowel), UAN→VBM (no vowel), LOP→KPO (has O). Count = Two."}, {"id": 31, "num": 11, "topic": "Alphabet Test", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Three of the following four letter-cluster pairs are alike based on English alphabetical order. Which one does NOT belong?", "options": ["OS−WA", "BF−JN", "TX−AH", "ZD−HL"], "ans": 2, "exp": "OS−WA, BF−JN, and ZD−HL all follow (+4 internal gap, +8 start-to-start). TX−AH has T→A (+7) and A→H (+7), breaking the rule."}, {"id": 32, "num": 12, "topic": "Analogy", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "20 is related to 32 following a certain logic. Following the same logic, 42 is related to 54. To which of the following is 2 related? (Operate on whole numbers.)", "options": ["18", "12", "16", "14"], "ans": 3, "exp": "Rule: add 12 (20+12=32, 42+12=54). So 2 + 12 = 14."}, {"id": 33, "num": 13, "topic": "Analogy", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Which letter-clusters should replace # and % so that the relationship on both sides of :: is the same?\n# : NJA :: QMD : %", "options": ["# = TFW, % = UQH", "# = JFW, % = UQO", "# = JFW, % = UQH", "# = JBW, % = UQH"], "ans": 2, "exp": "Each letter shifts +4: JFW → NJA and QMD → UQH."}, {"id": 34, "num": 14, "topic": "Coding–Decoding", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "In a code language, 'gold autumn leaf' is 'qw wr tu', 'and autumn gold' is 'wr sd tu', and 'autumn and brown' is 'sd wr gj'. What is the code for 'autumn'?", "options": ["sd", "gj", "qw", "wr"], "ans": 3, "exp": "'autumn' is the only word in all three sentences and 'wr' is the only code in all three → wr."}, {"id": 35, "num": 15, "topic": "Syllogism", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Statements: All almonds are cashews. Some fruits are raisins. All raisins are cashews.\nConclusion (I): All fruits are cashews.\nConclusion (II): Some almonds are raisins.", "options": ["Both conclusions (I) and (II) follow", "Neither conclusion (I) nor (II) follows", "Only conclusion (II) follows", "Only conclusion (I) follows"], "ans": 1, "exp": "Only some fruits are guaranteed to be cashews (not all), and almonds & raisins have no definite overlap → Neither follows."}, {"id": 36, "num": 16, "topic": "Syllogism", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Statements: Some weddings are biscuits. Some biscuits are plates.\nConclusions: (I) Some weddings are plates. (II) All plates are biscuits.", "options": ["Only conclusion (II) follows", "Both conclusions (I) and (II) follow", "Only conclusion (I) follows", "Neither conclusion (I) nor (II) follows"], "ans": 3, "exp": "Two 'Some' statements give no definite link between weddings and plates, nor can 'All plates are biscuits' follow → Neither."}, {"id": 37, "num": 17, "topic": "Blood Relations", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "F is the daughter of I. I is the father of K. K is the brother of V. V is the daughter of W. W is the ____ of F.", "options": ["Mother / माता", "Wife / पत्नी", "Daughter / पुत्री", "Sister / बहन"], "ans": 0, "exp": "I is the father of F, K, and V; V is also daughter of W → W is the mother of F."}, {"id": 38, "num": 18, "topic": "Direction & Distance", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Om starts from Point A and drives 16 km West, turns right (26 km), turns right (32 km), turns right (35 km), turns right (16 km) and stops at Point P. How far and in which direction should he drive to reach A again?", "options": ["6 km to the North / 6 km, उत्तर की ओर", "7 km to the North / 7 km, उत्तर की ओर", "9 km to the North / 9 km, उत्तर की ओर", "8 km to the North / 8 km, उत्तर की ओर"], "ans": 2, "exp": "Net E–W = −16 + 32 − 16 = 0; Net N–S = +26 − 35 = −9 (9 km South of A). Drive 9 km to the North."}, {"id": 39, "num": 19, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "If 'A' stands for '÷', 'B' stands for '×', 'C' stands for '+' and 'D' stands for '−', what is:\n4 B 8 C 16 D 9 A 3 = ?", "options": ["29", "21", "37", "45"], "ans": 3, "exp": "4 × 8 + 16 − 9 ÷ 3 = 32 + 16 − 3 = 45."}, {"id": 40, "num": 20, "topic": "Data Sufficiency", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Among 5 students R, S, T, U and K of different heights, who is the shortest?\n(I) S is taller than only two students. T is shorter than S and U is shorter than T.\n(II) R is taller than K.", "options": ["Statements I and II together are not sufficient", "Statements I and II together are sufficient", "Statement I alone is sufficient while statement II alone is not", "Statement II alone is sufficient while statement I alone is not"], "ans": 2, "exp": "From (I), only T and U are shorter than S, and U < T ⇒ U is the shortest (sufficient alone)."}]}, {"id": 3, "code": "Mock 03", "title": "Reasoning Mock 03", "subtitle": "DSSSB PYQ Shifts · Set 3", "badge": "PYQ Shifts", "durationSec": 1080, "questions": [{"id": 41, "num": 1, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "What should come in place of '?' in the given series?\n18  27  45  72  108  ?", "options": ["153", "151", "162", "157"], "ans": 0, "exp": "Differences are multiples of 9: +9, +18, +27, +36 → next +45. 108 + 45 = 153."}, {"id": 42, "num": 2, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "What should come in place of the '?' in the given series?\n710  718  734  758  790  ?", "options": ["830", "828", "820", "824"], "ans": 0, "exp": "Differences are multiples of 8: +8, +16, +24, +32 → next +40. 790 + 40 = 830."}, {"id": 43, "num": 3, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Five three-digit numbers: 821  837  869  241  249.\nWhat will be the resultant if the third digit of the highest number is added to the second digit of the lowest number?", "options": ["11", "10", "12", "13"], "ans": 3, "exp": "Highest = 869 (3rd digit = 9); Lowest = 241 (2nd digit = 4). 9 + 4 = 13."}, {"id": 44, "num": 4, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "What will come in place of '?' if '+' and '−' are interchanged and '×' and '÷' are interchanged?\n18 ÷ 7 + 84 × 4 − 41 = ?", "options": ["146", "133", "139", "126"], "ans": 0, "exp": "18 × 7 − 84 ÷ 4 + 41 = 126 − 21 + 41 = 146."}, {"id": 45, "num": 5, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "If 'A' stands for '+', 'B' stands for '−', 'C' stands for '×', and 'D' stands for '÷', evaluate:\n31 B 4 C 6 A 48 D 8 = ?", "options": ["17", "11", "13", "15"], "ans": 2, "exp": "31 − 4 × 6 + 48 ÷ 8 = 31 − 24 + 6 = 13."}, {"id": 46, "num": 6, "topic": "Seating Arrangement", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "P, Q, R, S, X, Y and Z sit in a straight line facing north. Only two sit to the left of R. Only three sit between R and Y. Only one sits between Y and Z. Q sits immediately left of S. X is not an immediate neighbour of Y. How many people sit to the right of P?", "options": ["Two / दो", "Three / तीन", "Four / चार", "One / एक"], "ans": 3, "exp": "Row 1–7: Q(1), S(2), R(3), X(4), Z(5), P(6), Y(7). Only Y sits to the right of P → One."}, {"id": 47, "num": 7, "topic": "Puzzle", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "M, N, O, P, Q and R live on floors 1 (lowest) to 6 (topmost). P lives on an odd floor but not 3. Only two live between P and R. R does not live on floor 2. M lives below R. Only Q lives between R and N. O lives below M. Who lives on the topmost floor?", "options": ["Q", "N", "O", "R"], "ans": 1, "exp": "Floors 1–6: P(1), O(2), M(3), R(4), Q(5), N(6). Topmost floor = N."}, {"id": 48, "num": 8, "topic": "Ranking & Order", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Seven boxes I, J, K, L, Q, R and S are stacked. Only K is above R. Only S is between R and I. Only J is below L. How many boxes are kept between Q and R?", "options": ["Four / चार", "Two / दो", "One / एक", "Three / तीन"], "ans": 1, "exp": "Top(1) to Bottom(7): K(1), R(2), S(3), I(4), Q(5), L(6), J(7). Between Q(5) and R(2) are S and I → Two."}, {"id": 49, "num": 9, "topic": "Letter-Symbol Sequence", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Refer to the series (Left to Right):\n@ E % V W © X $ & © R € $ L © E € X © * I %\nHow many letters are immediately preceded by a letter and immediately followed by a symbol?", "options": ["Two / दो", "Three / तीन", "None / एक भी नहीं", "One / एक"], "ans": 3, "exp": "Pattern Letter–LETTER–Symbol occurs only at V-W-© → One."}, {"id": 50, "num": 10, "topic": "Alphabet Test", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Words: COY  TAB  AGE  ANT. Each vowel is changed to the 2nd letter preceding it, and each consonant to the next letter. In how many resulting clusters will NO vowel appear?", "options": ["One / एक", "Three / तीन", "Two / दो", "Four / चार"], "ans": 2, "exp": "COY→DMZ (no vowel), TAB→UYC (U), AGE→YHC (no vowel), ANT→YOU (O,U). Count = Two."}, {"id": 51, "num": 11, "topic": "Analogy", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "11 is related to 120 following a certain logic. Following the same logic, 16 is related to 255. To which of the following is 17 related?", "options": ["289", "288", "286", "290"], "ans": 1, "exp": "Rule: n² − 1 (11²−1=120, 16²−1=255). So 17² − 1 = 289 − 1 = 288."}, {"id": 52, "num": 12, "topic": "Analogy", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Which letter-clusters should replace # and %?\n# : IDW :: KFY : %", "options": ["# = EZS, % = YJC", "# = EZS, % = OJC", "# = EFS, % = OJC", "# = EZS, % = OJJ"], "ans": 1, "exp": "Each letter shifts +4: EZS → IDW and KFY → OJC."}, {"id": 53, "num": 13, "topic": "Coding–Decoding", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "'she is beautiful' = 'dy ph mt', 'roses are beautiful' = 'lp ph st', 'she has roses' = 'st bq dy'. What is the code for 'roses'?", "options": ["Ph", "st", "dy", "bq"], "ans": 1, "exp": "'roses' is common to sentences 2 and 3; the common code is 'st'."}, {"id": 54, "num": 14, "topic": "Syllogism", "exam": "DSSSB IT Assistant Grade A · 18 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Statements: All clocks are fans. Some fans are televisions.\nConclusion (I): All clocks are televisions.\nConclusion (II): No fan is a clock.", "options": ["Only conclusion (II) follows", "Neither conclusion (I) nor (II) follows", "Both conclusions (I) and (II) follow", "Only conclusion (I) follows"], "ans": 1, "exp": "Clocks and TVs have no definite link, and 'All clocks are fans' implies 'Some fans are clocks', refuting II → Neither follows."}, {"id": 55, "num": 15, "topic": "Blood Relations", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Rakesh is the father of Pooja. Pooja is the wife of Nitin. Nitin is the son of Suresh. Suresh is the father of Kavita. How is Rakesh related to Kavita?", "options": ["Brother's wife's mother / भाई की पत्नी की माता", "Brother's wife's brother / भाई की पत्नी का भाई", "Brother's wife's sister / भाई की पत्नी की बहन", "Brother's wife's father / भाई की पत्नी के पिता"], "ans": 3, "exp": "Nitin is Kavita's brother, Pooja is Nitin's wife, and Rakesh is Pooja's father → Brother's wife's father."}, {"id": 56, "num": 16, "topic": "Blood Relations", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Harish is the son of Dinesh. Dinesh is the father of Chetan. Chetan is the brother of Riya. Riya is the mother of Aman. How is Harish related to Aman?", "options": ["Mother's father / माता के पिता", "Mother's brother / माता का भाई", "Mother's sister / माता की बहन", "Brother's father / भाई के पिता"], "ans": 1, "exp": "Harish, Chetan, and Riya are siblings; Riya is Aman's mother → Harish is Aman's mother's brother."}, {"id": 57, "num": 17, "topic": "Direction & Distance", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Kedar starts from Point A and drives 10 km North, turns right (14 km), turns right (25 km), turns right (28 km), turns right (15 km) and stops at Point P. How far and in which direction should he drive to reach A again?", "options": ["13 km west / 13 km पश्चिम", "14 km east / 14 km पूर्व", "11 km north / 11 km उत्तर", "12 km south / 12 km दक्षिण"], "ans": 1, "exp": "Net N–S = 10 − 25 + 15 = 0; Net E–W = 14 − 28 = −14 (14 km West of A). Drive 14 km east."}, {"id": 58, "num": 18, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "If 'A' = '÷', 'B' = '×', 'C' = '+' and 'D' = '−', evaluate:\n26 B 4 D 37 A 37 C 34 = ?", "options": ["137", "135", "139", "138"], "ans": 0, "exp": "26 × 4 − 37 ÷ 37 + 34 = 104 − 1 + 34 = 137."}, {"id": 59, "num": 19, "topic": "Alphabet Test", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "How many letters' positions will remain unchanged if each letter in MELOIDS is arranged in English alphabetical order?", "options": ["Four / चार", "Three / तीन", "One / एक", "Two / दो"], "ans": 3, "exp": "MELOIDS vs DEILMOS: E (2nd) and S (7th) stay in the same positions → Two."}, {"id": 60, "num": 20, "topic": "Data Sufficiency", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Among 5 sticks D, Q, G, I and Z of different heights, which stick is the tallest?\n(I) D is shorter than Q but taller than G.\n(II) G is taller than I but shorter than Z.", "options": ["Both statements I and II together are NOT sufficient", "Both statements I and II together are sufficient", "Statement I alone is sufficient", "Statement II alone is sufficient"], "ans": 0, "exp": "Together we know Q > D > G > I and Z > G, but Q vs Z is unknown, so both together are NOT sufficient."}]}, {"id": 4, "code": "Mock 04", "title": "Reasoning Mock 04", "subtitle": "DSSSB PYQ Shifts · Set 4", "badge": "PYQ Shifts", "durationSec": 1080, "questions": [{"id": 61, "num": 1, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "What should come in place of the ‘?’ in the given series?\n777  770  756  735  707  ?", "options": ["670", "674", "672", "676"], "ans": 2, "exp": "Consecutive differences are decreasing multiples of 7: −7, −14, −21, −28, −35. So 707 − 35 = 672."}, {"id": 62, "num": 2, "topic": "Letter / Alphanumeric Series", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Which of the following letter clusters will replace the question mark (?) in the given series to make it logically complete?\nYXY  VUV  SRS  POP  ?", "options": ["MKL", "MML", "MNP", "MLM"], "ans": 3, "exp": "1st and 3rd letters decrease by 3 each step: Y → V → S → P → M. The middle letter is one step before the 1st letter: M − 1 = L → MLM."}, {"id": 63, "num": 3, "topic": "Number Series", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Based on the five 3-digit numbers: (Left) 294  465  184  946  666 (Right).\nWhat will be the resultant if the third digit of the highest number is subtracted from the second digit of the lowest number?", "options": ["2", "4", "3", "1"], "ans": 0, "exp": "Highest number = 946 (3rd digit = 6); lowest number = 184 (2nd digit = 8). Resultant = 8 − 6 = 2."}, {"id": 64, "num": 4, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "What will come in place of ‘?’ if ‘+’ and ‘×’ are interchanged and ‘−’ and ‘÷’ are interchanged?\n7 + 4 ÷ 52 − 2 × 14 = ?", "options": ["13", "9", "16", "4"], "ans": 2, "exp": "After interchanging: 7 × 4 − 52 ÷ 2 + 14 = 28 − 26 + 14 = 16."}, {"id": 65, "num": 5, "topic": "Seating Arrangement", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Seven friends D, E, F, W, X, Y and Z sit in a straight line facing north. Only five people sit between Y and Z. W sits to the immediate left of Z. Only one person sits between W and E. F sits at some place to the left of D but to the right of X. How many people sit to the left of F?", "options": ["One / एक", "Two / दो", "None / एक भी नहीं", "Three / तीन"], "ans": 1, "exp": "Order from left (1) to right (7): Y, X, F, E, D, W, Z. Two people (Y and X) sit to the left of F."}, {"id": 66, "num": 6, "topic": "Puzzle", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "A, B, C, Q, R and S live on six different floors (1 = bottom to 6 = top). C lives immediately above R. Only two people live between B and R. B lives on an odd-numbered floor. S lives immediately below Q. How many people live between A and Q?", "options": ["Three / तीन", "One / एक", "Two / दो", "Four / चार"], "ans": 2, "exp": "Floors bottom to top: 1-B, 2-S, 3-Q, 4-R, 5-C, 6-A. Between A (6) and Q (3) live C and R → Two."}, {"id": 67, "num": 7, "topic": "Ranking & Order", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Seven boxes G, H, I, L, M, N and O are kept one over another. Only three boxes are above G. Only one box is between M and G (M below G). Three boxes are between M and N. L is immediately above G. O is above H. I is not immediately above or below M. How many boxes are between H and I?", "options": ["Five / पाँच", "Three / तीन", "Four / चार", "Two / दो"], "ans": 0, "exp": "Top (1) to bottom (7): 1-I, 2-N, 3-L, 4-G, 5-O, 6-M, 7-H. Between H (7) and I (1) are N, L, G, O, M → Five."}, {"id": 68, "num": 8, "topic": "Letter-Symbol Sequence", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Refer to the series (Left to Right): / ^ C % C L O G & U N V G J X W N \\ @ L Q\nHow many letters are immediately preceded by a symbol and also immediately followed by a symbol?", "options": ["One / एक", "None / एक भी नहीं", "Two / दो", "Three / तीन"], "ans": 0, "exp": "Checking Symbol–LETTER–Symbol: only ^ C % qualifies → One."}, {"id": 69, "num": 9, "topic": "Alphabet Test", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Given words: IMP  LOT  MUG  GET.\nEach vowel is changed to the next letter and each consonant to the previous letter in the English alphabet. In how many letter-clusters thus formed will no vowel appear?", "options": ["Four / चार", "One / एक", "Two / दो", "Three / तीन"], "ans": 3, "exp": "IMP → JLO (has O); LOT → KPS (no vowel); MUG → LVF (no vowel); GET → FFS (no vowel). Total = Three."}, {"id": 70, "num": 10, "topic": "Alphabet Test", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "The position(s) of how many letters will remain unchanged if each letter in the word HOSPITAL is arranged in English alphabetical order?", "options": ["Three / तीन", "None / एक भी नहीं", "Two / दो", "One / एक"], "ans": 1, "exp": "HOSPITAL vs AHILOPST — no letter stays in its original position → None."}, {"id": 71, "num": 11, "topic": "Analogy", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "411 is related to 1663 by a certain logic. Following the same logic, 317 is related to 1287. To which of the following is 203 related?", "options": ["846", "831", "808", "830"], "ans": 1, "exp": "Rule: 4n + 19. Check: 411×4+19 = 1663; 317×4+19 = 1287. So 203×4 + 19 = 812 + 19 = 831."}, {"id": 72, "num": 12, "topic": "Analogy", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "9 is related to 14 following a certain logic. Following the same logic, 23 is related to 28. To which of the following is 65 related? (Operations on whole numbers only.)", "options": ["72", "70", "69", "68"], "ans": 1, "exp": "Each pair adds 5: 9 + 5 = 14, 23 + 5 = 28 → 65 + 5 = 70."}, {"id": 73, "num": 13, "topic": "Coding–Decoding", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "In a certain code language, ‘crickets chatter loud’ is coded as ‘pk nh dl’ and ‘sense cluster chatter’ is coded as ‘mz ws pk’. What is the code for ‘chatter’?", "options": ["nh", "pk", "dl", "di"], "ans": 1, "exp": "The only common word between both sentences is ‘chatter’, and the only common code is ‘pk’."}, {"id": 74, "num": 14, "topic": "Syllogism", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "Statements: Some trimmers are heads. No head is a blade.\nConclusions (I): Some trimmers are blades.\nConclusions (II): Some heads are trimmers.", "options": ["Neither conclusion (I) nor (II) follows.", "Both conclusions (I) and (II) follow.", "Only conclusion (I) follows.", "Only conclusion (II) follows."], "ans": 3, "exp": "“Some trimmers are heads” validly converts to “Some heads are trimmers” (II follows). There is no definite positive link between trimmers and blades (I does not follow)."}, {"id": 75, "num": 15, "topic": "Blood Relations", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Divya is the daughter of Sandeep. Sandeep is the husband of Manisha. Manisha is the mother of Rohit. Rohit is the brother of Poonam. How is Divya related to Poonam?", "options": ["Wife / पत्नी", "Daughter / पुत्री", "Mother / माता", "Sister / बहन"], "ans": 3, "exp": "Sandeep and Manisha are parents of Divya, Rohit, and Poonam. Since Divya is female, she is Poonam’s sister."}, {"id": 76, "num": 16, "topic": "Direction & Distance", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Naitik starts from Point A and drives 25 km North, turns left 12 km, turns left 33 km, turns left 17 km, takes a final left turn and drives 8 km to stop at Point P. How far and in which direction must he drive to reach Point A again?", "options": ["5 km to the east / 5 km, पूर्व की ओर", "6 km to the east / 6 km, पूर्व की ओर", "5 km to the west / 5 km, पश्चिम की ओर", "6 km to the west / 6 km, पश्चिम की ओर"], "ans": 2, "exp": "Coordinates from A(0,0): (0,25) → (−12,25) → (−12,−8) → (5,−8) → P(5,0). P is 5 km east of A, so he must drive 5 km to the west."}, {"id": 77, "num": 17, "topic": "Direction & Distance", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "svg": null, "q": "Rohan starts from Point A and drives 8 km North, turns left 4 km, turns right 3 km, turns right 4 km, takes a final left turn and drives 2 km to stop at Point P. How far and in which direction must he drive to reach Point A again?", "options": ["11 km towards South / 11 km, दक्षिण की ओर", "13 km towards South / 13 km, दक्षिण की ओर", "11 km towards North / 11 km, उत्तर की ओर", "13 km towards North / 13 km, उत्तर की ओर"], "ans": 1, "exp": "Coordinates from A(0,0): (0,8) → (−4,8) → (−4,11) → (0,11) → P(0,13). P is 13 km north of A, so he must drive 13 km towards South."}, {"id": 78, "num": 18, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "What will come in place of ‘?’ if ‘+’ and ‘−’ are interchanged and ‘×’ and ‘÷’ are interchanged?\n45 × 5 − 24 ÷ 6 + 16 = ?", "options": ["139", "135", "133", "137"], "ans": 3, "exp": "After interchanging: 45 ÷ 5 + 24 × 6 − 16 = 9 + 144 − 16 = 137."}, {"id": 79, "num": 19, "topic": "Mathematical Operations", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "svg": null, "q": "What will come in place of ‘?’ if ‘+’ and ‘−’ are interchanged and ‘×’ and ‘÷’ are interchanged?\n99 − 27 ÷ 9 + 224 × 7 = ?", "options": ["315", "320", "316", "310"], "ans": 3, "exp": "After interchanging: 99 + 27 × 9 − 224 ÷ 7 = 99 + 243 − 32 = 310."}, {"id": 80, "num": 20, "topic": "Data Sufficiency", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "svg": null, "q": "Among 5 poles Q, R, S, I and J of different heights, which pole is the shortest?\n(I) S is taller than only two poles. Q is shorter than S and R is shorter than Q.\n(II) I is taller than J.", "options": ["Both statements I and II together are sufficient", "Data in Statement II alone is sufficient while Statement I is not", "Data in statements I and II together are NOT sufficient", "Data in Statement I alone is sufficient while Statement II is not"], "ans": 3, "exp": "From Statement I: S is taller than only 2 poles, and R < Q < S, so those two are Q and R → R is uniquely the shortest. Statement II alone is insufficient."}]}, {"id": 5, "code": "Mock 05", "title": "Reasoning Mock 05", "subtitle": "Zeher Hardest · Set 1", "badge": "Hardest", "durationSec": 1080, "questions": [{"id": 81, "num": 1, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "E, R, T, Y, U and W live on six different floors (1 = lowermost to 6 = topmost). R lives on an odd-numbered floor but not 3. The sum of floors of T and R is 4. Only 3 people live between U and E. Y lives immediately above W. The sum of floors of W and U is 10. How many people live below W?", "options": ["1", "3", "4", "2"], "ans": 1, "exp": "R odd ≠ 3 and T + R = 4 ⇒ R = 1, T = 3. W + U = 10 with Y immediately above W ⇒ W = 4, Y = 5, U = 6. Three between U(6) and E ⇒ E = 2. Order (1→6): R, E, T, W, Y, U. Below W(4) = 3 people."}, {"id": 82, "num": 2, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "I, N, S, E, R and T live on six different floors (1 to 6). N lives on an even floor but not 4. Only two people live between N and R. E lives on an odd floor but not floor 1. Only two people live between E and I. T lives immediately below E. How many people live between S and T?", "options": ["Three / तीन", "Four / चार", "Two / दो", "One / एक"], "ans": 2, "exp": "N = 6, R = 3 (N = 2 clashes with T). E = 5, T = 4, I = 2, S = 1. Order (1→6): S, I, R, T, E, N. Between S(1) and T(4) live I and R → Two."}, {"id": 83, "num": 3, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "E, R, T, Y, U and W live on six different floors (1 to 6). E lives on an even floor but not 4. Sum of floors of E and T is 9. Only 3 people live between R and Y. Sum of floors of U and Y is 3. How many people live below T?", "options": ["3", "4", "1", "2"], "ans": 3, "exp": "E even ≠ 4 and E + T = 9 ⇒ E = 6, T = 3. U + Y = 3 ⇒ {1, 2}. Three between R and Y ⇒ Y = 1, R = 5, U = 2, W = 4. Below T(3) live Y and U → 2 people."}, {"id": 84, "num": 4, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "H, W, E, K, M and N live on six different floors (1 to 6). H lives on floor 1. M lives on floor 6. E lives on an even floor but not 2. Only one person lives between E and N. K lives immediately above N. Who lives on floor 5?", "options": ["W", "K", "E", "M"], "ans": 0, "exp": "H = 1, M = 6, E = 4, N = 2, K = 3. The remaining floor 5 belongs to W."}, {"id": 85, "num": 5, "topic": "Syllogism", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Statements: Some engineers are masons. Some engineers are painters. Some doctors are masons.\nConclusion (I): All doctors are engineers.\nConclusion (II): All painters are doctors.", "options": ["Only conclusion (II) follows / केवल निष्कर्ष (II) अनुसरण करता है", "Only conclusion (I) follows / केवल निष्कर्ष (I) अनुसरण करता है", "Both conclusions (I) and (II) follow / निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं", "Neither conclusion (I) nor (II) follows / न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है"], "ans": 3, "exp": "Doctors overlap only masons, and painters overlap only engineers; neither universal conclusion follows."}, {"id": 86, "num": 6, "topic": "Syllogism", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Statements: Some trains are doors. Some cars are trains. No doors are roads.\nConclusion (I): Some cars are doors.\nConclusion (II): Some cars are not roads.", "options": ["Only conclusion (I) follows / केवल निष्कर्ष (I) अनुसरण करता है।", "Both conclusions (I) and (II) follow / निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं।", "Only conclusion (II) follows / केवल निष्कर्ष (II) अनुसरण करता है।", "Neither conclusion (I) nor (II) follows / न तो निष्कर्ष (I) और न ही निष्कर्ष (II) अनुसरण करता है।"], "ans": 3, "exp": "No definite link exists between cars and doors, so neither 'some cars are doors' nor 'some cars are not roads' definitely follows."}, {"id": 87, "num": 7, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "A + B = mother, A − B = brother, A × B = wife, A % B = father, A # B = daughter. How is Z related to R if 'Z # C × N − Q # R'?", "options": ["Son's wife / पुत्र की पत्नी", "Son's daughter / पुत्र की पुत्री", "Daughter's daughter / पुत्री की पुत्री", "Brother's wife / भाई की पत्नी"], "ans": 1, "exp": "Z is daughter of C; C is wife of N (so Z is N's daughter); N is brother of Q; Q is daughter of R (so N is R's son). Thus Z is R's son's daughter."}, {"id": 88, "num": 8, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "A ^ B = father, A # B = mother, A : B = daughter. If 'R : S ^ T : K # L', how is R related to L?", "options": ["Mother / माता", "Husband's mother / पति की माता", "Sister / बहन", "Husband's sister / पति की बहन"], "ans": 2, "exp": "R is daughter of S; S is father of T; T is daughter of K (so S and K are married); K is mother of L. Thus R and L are siblings, and R is L's sister."}, {"id": 89, "num": 9, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "In a code language:\n'ornithologist observes sparrow migration' = 'nO eK bT mG'\n'preserves sparrow sanctuary migration' = 'eK bT zM nC'\n'sparrow documents ornithologist curious' = 'mG hD nP bT'\nHow is 'migration' coded?", "options": ["nP", "mG", "eK", "nO"], "ans": 2, "exp": "'sparrow' is in all 3 sentences → bT. Sentences 1 & 2 share 'sparrow' and 'migration' → bT and eK. Hence migration = eK."}, {"id": 90, "num": 10, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "In a code language:\n'spacecraft mission astronaut commands' = 'in yq oi wg'\n'spacecraft mission supports station' = 'mf yq mo in'\n'explores spacecraft astronaut trained' = 'vk wg pz yq'\nHow is 'astronaut' coded?", "options": ["wg", "mo", "vk", "pz"], "ans": 0, "exp": "'spacecraft' is in all 3 → yq. Sentences 1 & 3 share 'spacecraft' and 'astronaut' → yq and wg. Hence astronaut = wg."}, {"id": 91, "num": 11, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Five laboratories – Helix, Ion, Matrix, Nova, Orbit – are arranged left to right. Which is at the extreme left?\n(I) Ion is immediately to the right of Helix.\n(II) Matrix is immediately left of Nova, Orbit is immediately right of Nova, and Helix is to the left of Matrix.", "options": ["Data in Statement II alone is sufficient", "Data in Statement I alone is sufficient", "Both statements I and II together are NOT sufficient", "Both statements I and II together (and not alone) are sufficient"], "ans": 3, "exp": "II gives Matrix–Nova–Orbit with Helix left of Matrix, but Ion could be extreme left. Combining with I (Helix–Ion) fixes Helix, Ion, Matrix, Nova, Orbit ⇒ both statements together are needed."}, {"id": 92, "num": 12, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Five three-digit numbers: 356, 745, 178, 739, 268.\nIf 2 is added to the first digit of every number, in how many numbers will the first digit be exactly divisible by the second digit?", "options": ["3", "2", "1", "4"], "ans": 1, "exp": "New numbers: 556 (5÷5 ✔), 945 (9÷4 ✘), 378 (3÷7 ✘), 939 (9÷3 ✔), 468 (4÷6 ✘). Count = 2."}, {"id": 93, "num": 13, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Series (left to right): M 9 $ A * 6 Z # 2 D & 7 P % 5 T @ 1 F 4 * K 7 @ B 2 # X 9 % L\nHow many symbols are immediately preceded by a letter and immediately followed by a number?", "options": ["Four / चार", "Six / छह", "Seven / सात", "Five / पांच"], "ans": 3, "exp": "Qualifying Letter–Symbol–Number triplets: A*6, Z#2, D&7, P%5, T@1 → Five."}, {"id": 94, "num": 14, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Series: # M 5 & P 9 ! Q 3 * R 7 ^ S 4 @ T 2 % U 6 $ V 8 * W 1 # X 0 ! Y 5 @ Z 3\nIf all letters and numbers are dropped, which symbol is 7th from the right?", "options": ["@", "&", "*", "$"], "ans": 0, "exp": "Remaining symbols: # & ! * ^ @ % $ * # ! @. Counting from right: @(1), !(2), #(3), *(4), $(5), %(6), @(7) → @."}, {"id": 95, "num": 15, "topic": "Direction & Distance", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Meenakshi drives East 7 km, left 3 km, left 4 km, left 9 km, right 10 km, right 9 km, and finally right 7 km to reach her office. How far and in which direction must she drive to reach home again?", "options": ["6 kms towards the North / 6 km उत्तर की ओर", "3 kms towards the North / 3 km उत्तर की ओर", "3 kms towards the South / 3 km दक्षिण की ओर", "6 kms towards the South / 6 km दक्षिण की ओर"], "ans": 2, "exp": "Coordinates from home (0,0): (7,0)→(7,3)→(3,3)→(3,−6)→(−7,−6)→(−7,3)→(0,3). Office is 3 km North of home, so she must drive 3 km South."}, {"id": 96, "num": 16, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Five three-digit numbers: 483, 725, 391, 564, 218. If arranged in ascending order, what is the second digit of the third number from the left?", "options": ["6", "9", "7", "8"], "ans": 3, "exp": "Ascending: 218, 391, 483, 564, 725. The 3rd number is 483; its second digit is 8."}, {"id": 97, "num": 17, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Five three-digit numbers: 742, 318, 659, 481, 573. If arranged in descending order, what is the third digit of the middle number?", "options": ["2", "9", "1", "3"], "ans": 3, "exp": "Descending: 742, 659, 573, 481, 318. The middle number is 573; its third digit is 3."}, {"id": 98, "num": 18, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Which option follows the same whole-number operations as:\n2 - 4 - 3 - 8  and  38 - 76 - 75 - 80", "options": ["1 - 3 - -3 - 2", "32 - 64 - 56 - 61", "20 - 20 - 14 - 18", "8 - 16 - 15 - 20"], "ans": 3, "exp": "Pattern: ×2, −1, +5. Option (d): 8×2 = 16, 16−1 = 15, 15+5 = 20."}, {"id": 99, "num": 19, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "Words: FOX, JAB, VAN, PIG. In each word, each vowel is replaced by the next letter and each consonant by the previous letter. In how many clusters thus formed will NO vowel appear?", "options": ["Two / दो", "None / एक में भी नहीं", "Three / तीन", "One / एक"], "ans": 1, "exp": "FOX → EPW, JAB → IBA, VAN → UBM, PIG → OJF. Every cluster contains at least one vowel (E, I/A, U, O) → None."}, {"id": 100, "num": 20, "topic": "Analogy", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "svg": null, "q": "7 is related to 196, and 9 is related to 324. Following the same whole-number logic, 12 is related to:", "options": ["624", "484", "512", "576"], "ans": 3, "exp": "Rule: (2n)². (2×7)² = 196, (2×9)² = 324 ⇒ (2×12)² = 24² = 576."}]}, {"id": 6, "code": "Mock 06", "title": "Reasoning Mock 06", "subtitle": "Zeher Hardest · Set 2", "badge": "Hardest", "durationSec": 1080, "questions": [{"id": 101, "num": 1, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "S, T, O, R, E and D live on six different floors (1 = lowermost to 6 = topmost). Only three people live between T and D, where T lives below D. E lives on an odd-numbered floor and immediately above T. R lives below S and above O. Who lives on floor 5?", "options": ["S", "O", "E", "T"], "ans": 0, "exp": "Three between T and D (T < D) ⇒ (1,5) or (2,6). E is odd immediately above T ⇒ T=2, E=3, D=6. Remaining 1,4,5 with O < R < S ⇒ O=1, R=4, S=5. Floor 5 = S."}, {"id": 102, "num": 2, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "T, U, V, W, Y and Z live on six floors (1 to 6). Z lives on floor 1. Only one person lives between Z and W. Only two people live between U and V. Only two people live between T and W. U lives above W. How many people live between Y and T?", "options": ["Three / तीन", "One / एक", "Two / दो", "None / एक भी नहीं"], "ans": 1, "exp": "Z=1 ⇒ W=3 ⇒ T=6. U above W with 2 between U & V ⇒ U=5, V=2 (U=4 clashes with Z=1). Y=4. Order (1→6): Z, V, W, Y, U, T. Between Y(4) and T(6) lives only U → One."}, {"id": 103, "num": 3, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "E, R, T, Y, U and W live on six floors (1 to 6). T lives on an even floor but not 6. Sum of floors of U and T is 7. W lives immediately above E. Sum of floors of T and R is 3. How many people live below U?", "options": ["4", "2", "5", "3"], "ans": 0, "exp": "T even ≠ 6 and T+R=3 ⇒ T=2, R=1. U+T=7 ⇒ U=5. W immediately above E in {3,4,6} ⇒ E=3, W=4, Y=6. Below U(5) live 4 people."}, {"id": 104, "num": 4, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Ax, Bd, Cm, Df and Ep sit around a circular table facing the centre. Who sits to the immediate right of Ax?\n(I) Ax is the immediate neighbour of Df and Ep. Cm sits second to the left of Ax.\n(II) Bd sits to the immediate left of Cm. Ax sits second to the right of Cm.", "options": ["Data in statement II alone is sufficient", "Data in statement I alone is sufficient", "Both statements I and II together are sufficient", "Data in statements I and II together are NOT sufficient"], "ans": 3, "exp": "Even combining I and II fixes Ax, Bd, and Cm, but Df and Ep can still swap sides around Ax. Thus both statements together are NOT sufficient."}, {"id": 105, "num": 5, "topic": "Syllogism", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Statements: All tigers are roses. No tiger is a milk. All milks are butchers.\nConclusion (I): No butcher is a rose.\nConclusion (II): Some butchers are tigers.", "options": ["Only conclusion I follows", "Both conclusions I and II follow", "Only conclusion II follows", "Neither conclusion I nor II follows"], "ans": 3, "exp": "No definite negative link exists between butchers and roses, nor any definite positive link between butchers and tigers. Neither follows."}, {"id": 106, "num": 6, "topic": "Syllogism", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Statements: All toys are kites. No rocks are toys. All grapes are toys.\nConclusion (I): No kites are rocks.\nConclusion (II): Some kites are grapes.", "options": ["Neither conclusion (I) nor (II) follows", "Both conclusions (I) and (II) follow", "Only conclusion (I) follows", "Only conclusion (II) follows"], "ans": 3, "exp": "All grapes are toys and all toys are kites ⇒ all grapes are kites ⇒ Some kites are grapes (II follows). Rocks could still overlap kites outside toys (I does not follow)."}, {"id": 107, "num": 7, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "A+B = mother, A−B = brother, A×B = wife, A%B = father, A#B = daughter. How is K related to L if 'L % C # V # N × K'?", "options": ["Wife's father / पत्नी का पिता", "Husband's father / पति का पिता", "Daughter's husband / पुत्री का पति", "Son's daughter / पुत्र की पुत्री"], "ans": 0, "exp": "L is father of C; C is daughter of V (and V is daughter of N, so V is L's wife); N is wife of K ⇒ K is V's father = L's wife's father."}, {"id": 108, "num": 8, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "A+B = son, A−B = brother, A×B = wife, A÷B = father. How is H related to R if 'H + U − N × T ÷ R'?", "options": ["Mother's sister's Son / माता की बहन का पुत्र", "Mother's brother's Son / माता के भाई का पुत्र", "Mother's brother / माता का भाई", "Mother's father / माता का पिता"], "ans": 1, "exp": "T is father of R; N is wife of T (R's mother); U is brother of N (R's maternal uncle); H is son of U ⇒ R's mother's brother's son."}, {"id": 109, "num": 9, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "'dictionary compiles entry lexicographer' = 'oV wP eM gH'\n'maintains entry archive dictionary' = 'gH rE eM zI'\n'dictionary updates scholarly lexicographer' = 'vT xA gH wP'\nHow is 'lexicographer' coded?", "options": ["wP", "vT", "xA", "eM"], "ans": 0, "exp": "'dictionary' is in all 3 → gH. Sentences 1 & 3 share 'dictionary' and 'lexicographer' → gH and wP. Hence lexicographer = wP."}, {"id": 110, "num": 10, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "'converts translator document language' = 'dF wB rX pV'\n'document client language provides' = 'hE rX nL dF'\n'translator reviews document fluent' = 'uL pV rX gH'\nHow is 'translator' coded?", "options": ["rX", "uL", "hE", "pV"], "ans": 3, "exp": "'document' is in all 3 → rX. Sentences 1 & 3 share 'document' and 'translator' → rX and pV. Hence translator = pV."}, {"id": 111, "num": 11, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Five software releases – Alpha, Beta, Gamma, Omega, Sigma – launched Monday to Friday (one per day). On which day was Omega launched?\n(I) Omega was launched two days after Beta.\n(II) Beta was launched on Wednesday.", "options": ["Both statements I and II together are NOT sufficient", "Data in Statement I alone is sufficient", "Both statements I and II together (and not alone) are sufficient", "Data in Statement II alone is sufficient"], "ans": 2, "exp": "Neither statement alone gives Omega's day; together Beta = Wednesday ⇒ Omega = Friday."}, {"id": 112, "num": 12, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Five three-digit numbers: 139, 243, 242, 578, 769.\nIf 2 is added to the first digit of every number, in how many numbers will the first digit be exactly divisible by the second digit?", "options": ["3", "4", "1", "2"], "ans": 1, "exp": "New numbers: 339 (3÷3 ✔), 443 (4÷4 ✔), 442 (4÷4 ✔), 778 (7÷7 ✔), 969 (9÷6 ✘). Count = 4."}, {"id": 113, "num": 13, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Series: @ B 2 # X 9 % L M 9 $ A * 6 Z # 2 7 P % 5 T @ 1 F 4 D & * K 7\nHow many symbols are immediately preceded by a letter and immediately followed by a number?", "options": ["Three / तीन", "Two / दो", "Four / चार", "One / एक"], "ans": 2, "exp": "Qualifying Letter–Symbol–Number triplets: A*6, Z#2, P%5, T@1 → Four."}, {"id": 114, "num": 14, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Series: 4 V 1 * Z 5 & M # 7 Q @ 2 D % $ C 7 @ L W & 4 H 5 S * 8\nHow many symbols are immediately preceded by a letter and immediately followed by a number?", "options": ["Three / तीन", "Two / दो", "Five / पाँच", "Four / चार"], "ans": 3, "exp": "Qualifying triplets: M#7, Q@2, W&4, S*8 → Four."}, {"id": 115, "num": 15, "topic": "Direction & Distance", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Tejas starts from Y: South 28 km, left 61 km, right 59 km, right 26 km, right 47 km, right 41 km, left 40 km, right 16 km to stop at Z. Shortest distance and direction to return to Y?", "options": ["85 km towards south / 85 km, दक्षिण की ओर", "92 km towards west / 92 km, पश्चिम की ओर", "87 km towards east / 87 km, पूर्व की ओर", "97 km towards east / 97 km, पूर्व की ओर"], "ans": 1, "exp": "Coordinates from Y(0,0): (0,−28)→(61,−28)→(61,−87)→(35,−87)→(35,−40)→(76,−40)→(76,0)→(92,0). Z is 92 km East of Y ⇒ drive 92 km towards West."}, {"id": 116, "num": 16, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Five numbers: 582, 439, 716, 854, 321. Arranged in descending order, what is the sum of the first and third digits of the middle number?", "options": ["8", "9", "7", "5"], "ans": 2, "exp": "Descending: 854, 716, 582, 439, 321. Middle = 582 ⇒ 5 + 2 = 7."}, {"id": 117, "num": 17, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Five numbers: 821, 753, 271, 623, 572. If arranged in descending order, how many numbers remain in their original position?", "options": ["2", "1", "0", "3"], "ans": 0, "exp": "Descending: 821, 753, 623, 572, 271. Positions 1 (821) and 2 (753) remain unchanged → 2."}, {"id": 118, "num": 18, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Which option follows the same whole-number operations as:\n2600 – 13000 – 13250 – 31500;  2800 – 14000 – 14250 – 33500", "options": ["2900 – 14500 – 14800 – 34600", "2500 – 12500 – 12600 – 30200", "3300 – 16500 – 16750 – 39000", "2700 – 13500 – 13750 – 32500"], "ans": 3, "exp": "Pattern: ×5, +250, ×2 + 5000. Option (d): 2700×5=13500 → +250=13750 → 13750×2+5000=32500."}, {"id": 119, "num": 19, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "Words: SHY, AND, ICE, DRY. Each vowel moves +1 letter forward and each consonant −1 letter back. How many resulting clusters contain NO vowel?", "options": ["None / एक भी नहीं", "Two / दो", "Four / चार", "Three / तीन"], "ans": 2, "exp": "SHY→RGX, AND→BMC, ICE→JBF, DRY→CQX. None of the four clusters has any vowel → Four."}, {"id": 120, "num": 20, "topic": "Analogy", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "svg": null, "q": "36 is related to 145, and 43 is related to 173. Following the same whole-number logic, 51 is related to:", "options": ["205", "207", "203", "209"], "ans": 0, "exp": "Rule: n × 4 + 1. 36×4+1=145, 43×4+1=173 ⇒ 51×4+1 = 205."}]}, {"id": 7, "code": "Mock 07", "title": "Reasoning Mock 07", "subtitle": "Real Exam Level · Set 1", "badge": "Real Exam", "durationSec": 1080, "questions": [{"id": 121, "num": 1, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Which of the following letter-number clusters will replace the question mark (?) in the given series to make it logically complete?\nFU30, HS32, JQ34, LO36, ?", "options": ["LM40", "NM40", "LM38", "NM38"], "ans": 3, "exp": "First letters: F → H → J → L → N (+2). Second letters: U → S → Q → O → M (−2). Numbers: 30 → 32 → 34 → 36 → 38 (+2). Next = NM38."}, {"id": 122, "num": 2, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "What should come in place of the question mark (?) in the given series?\n8, 25, 59, 110, 178, ?", "options": ["263", "264", "265", "262"], "ans": 0, "exp": "Differences: 25 − 8 = 17, 59 − 25 = 34, 110 − 59 = 51, 178 − 110 = 68 (multiples of 17). Next difference = 17 × 5 = 85. 178 + 85 = 263."}, {"id": 123, "num": 3, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "What should come in place of '?' in the given series?\n57  66  84  93  111  ?", "options": ["115", "125", "130", "120"], "ans": 3, "exp": "Differences alternate +9, +18: 57 + 9 = 66, 66 + 18 = 84, 84 + 9 = 93, 93 + 18 = 111. Next: 111 + 9 = 120."}, {"id": 124, "num": 4, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "What will come in the place of the question mark (?) in the following equation, if '+' and '−' are interchanged and '×' and '÷' are interchanged?\n14 ÷ 6 + 9 × 3 − 2 = ?", "options": ["83", "82", "76", "68"], "ans": 0, "exp": "Interchange + ↔ − and × ↔ ÷: 14 × 6 − 9 ÷ 3 + 2 = 84 − 3 + 2 = 83."}, {"id": 125, "num": 5, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "What will come in the place of the question mark (?) in the following equation, if '+' and '−' are interchanged, and '×' and '÷' are interchanged?\n125 ÷ 2 + 230 × 10 − 102 = ?", "options": ["340", "329", "342", "332"], "ans": 1, "exp": "Interchange + ↔ − and × ↔ ÷: 125 × 2 − 230 ÷ 10 + 102 = 250 − 23 + 102 = 329."}, {"id": 126, "num": 6, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "425 is related to 487 following a certain logic. Following the same logic, 509 is related to 571. To which of the given options is 612 related, following the same logic? (Perform operations on whole numbers without breaking digits.)", "options": ["866", "682", "674", "692"], "ans": 2, "exp": "Rule: add 62. 425 + 62 = 487; 509 + 62 = 571. Therefore, 612 + 62 = 674."}, {"id": 127, "num": 7, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "A, B, C, D, E, F and G are sitting around a circular table facing the centre. G sits to the immediate left of F. D sits to the immediate left of B. B sits second to the left of A. E sits third to the left of F. How many people sit between A and F when counted from the right of A?", "options": ["1", "3", "2", "4"], "ans": 0, "exp": "Facing centre, left = clockwise. Placing F=0 gives G=1, E=3. With B=A+2 and D=A+3 on free seats {2,4,5,6}: A=2, B=4, D=5, C=6. Clockwise order: F, G, A, E, B, D, C. Counting from the right of A (anticlockwise): G, then F → 1 person."}, {"id": 128, "num": 8, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Seven people, A, B, C, D, P, Q and R, are sitting in a row, facing the north. Only three people are sitting between A and Q. Only D is sitting to the right of Q. C is sitting to the immediate left of P. B is sitting at one of the positions to the right of P. Who is sitting at the extreme left end of the row?", "options": ["C", "A", "R", "Q"], "ans": 2, "exp": "Seats 1–7 from left: Only D right of Q → Q=6, D=7. Three between A and Q → A=2. C immediately left of P and B right of P → C=3, P=4, B=5. Remaining seat 1 is R. Row: R, A, C, P, B, Q, D."}, {"id": 129, "num": 9, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Seven boxes G, H, I, J, K, C and D are kept one over the other. Only two boxes are kept between G and J. Only I is kept above C. No box is kept below J. D is kept at some place below H but at some place above K. Which box is kept third above K?", "options": ["D", "K", "G", "H"], "ans": 3, "exp": "Positions 1 (bottom) to 7 (top): J=1, G=4, I=7, C=6. Remaining 2, 3, 5 hold K < D < H → K=2, D=3, H=5. Third above K (2) is position 5 = H."}, {"id": 130, "num": 10, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "TVWA is related to OQDH in a certain way based on the English alphabetical order. In the same way, ZBYC is related to UWFJ. To which of the given options is KMTX related, following the same logic?", "options": ["FHEA", "FAEH", "FAHE", "FHAE"], "ans": 3, "exp": "Rule: −5, −5, +7, +7. Applying to KMTX: K−5=F, M−5=H, T+7=A (27→1), X+7=E (31→5) → FHAE."}, {"id": 131, "num": 11, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the letter-cluster that DOES NOT belong to that group?", "options": ["QOL", "MKH", "WUR", "TRP"], "ans": 3, "exp": "Positions: QOL (17,15,12 → −2, −3), MKH (13,11,8 → −2, −3), WUR (23,21,18 → −2, −3), but TRP (20,18,16 → −2, −2). So TRP does not belong."}, {"id": 132, "num": 12, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Which of the following letter-clusters should replace # and % so that the relationship on the left side of :: is the same as on the right side?\n# : JED :: QLK : %", "options": ["# = NIH, % = MHG", "# = MOP, % = JHX", "# = KMH, % = NMI", "# = BJM, % = HJT"], "ans": 0, "exp": "Rule is each letter −4: NIH → N−4=J, I−4=E, H−4=D (JED). Applying to QLK: Q−4=M, L−4=H, K−4=G → MHG."}, {"id": 133, "num": 13, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Select the option that is related to the fifth letter-cluster in the same way as the second is to the first and the fourth is to the third.\nSQTU : HIJKGHFG :: BZCD : YZABXYWX :: AYBC : ?", "options": ["ZABCYZXY", "ZABDYZXZ", "ZBBCYWXY", "ZABDYAXY"], "ans": 0, "exp": "Each letter is replaced by its opposite letter (sum 27) followed by the next letter: A → Z A, Y → B C, B → Y Z, C → X Y → ZABCYZXY."}, {"id": 134, "num": 14, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Select the pair that follows the same pattern as the two pairs given below:\nJJP : KLT\nPVT : QXX", "options": ["YER : ZGV", "OSH : PUK", "LVU : NYY", "MFL : NHO"], "ans": 0, "exp": "Rule: +1, +2, +4. JJP → KLT (+1, +2, +4) and PVT → QXX (+1, +2, +4). YER → ZGV follows Y+1=Z, E+2=G, R+4=V."}, {"id": 135, "num": 15, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "In a certain code language, 'JUST' is coded as '5806' and 'SHUT' is coded as '7085'. What is the code for 'H' in that language?", "options": ["5", "7", "8", "0"], "ans": 1, "exp": "Common letters in JUST and SHUT are U, S, T; common digits are 5, 0, 8. Leftover in JUST: J = 6; leftover in SHUT: H = 7."}, {"id": 136, "num": 16, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "R is the brother of S. S is the sister of T. T is the wife of G. G is the father of H. How is R related to H?", "options": ["Mother's father's brother / माता के पिता का भाई", "Mother's father / माता का पिता", "Mother's sister / माता की बहन", "Mother's brother / माता का भाई"], "ans": 3, "exp": "R is brother of S and S is sister of T → R is T's brother. T is wife of G and G is father of H → T is H's mother. Thus R is H's mother's brother."}, {"id": 137, "num": 17, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "In a certain code language, A @ B means 'A is the daughter of B', A ≤ B means 'A is the wife of B', A ₹ B means 'A is the father of B', and A + B means 'A is the brother of B'. How is S related to C if 'S + T @ U ≤ B ₹ C'?", "options": ["Brother / भाई", "Brother's wife's sister / भाई की पत्नी की बहन", "Brother's Wife's mother / भाई की पत्नी की माता", "Wife's brother / पत्नी का भाई"], "ans": 0, "exp": "S is brother of T; T is daughter of U; U is wife of B; B is father of C. So U is C's mother, T is C's sister, and S is C's brother."}, {"id": 138, "num": 18, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Refer to the following letter series (Left to Right):\nK H R P U D E Q L G T N J V I X O M A Z F\nHow many such consonants are there which are immediately preceded by a vowel and also immediately followed by a vowel?", "options": ["Two / दो", "Three / तीन", "One / एक", "Zero / एक भी नहीं"], "ans": 1, "exp": "Look for Vowel–Consonant–Vowel triplets: U-D-E, I-X-O, O-M-A. Count = Three."}, {"id": 139, "num": 19, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Refer to the following number and symbol series (all numbers are single-digit):\n(Left) 9 * & ^ 7 # 5 @ 4 1 2 + ? $ 2 9 8 # 2 (Right)\nIf all the symbols are dropped from the series, which of the following will be the seventh from the right?", "options": ["5", "9", "4", "7"], "ans": 2, "exp": "Dropping symbols leaves: 9 7 5 4 1 2 2 9 8 2. Counting from right: 2(1st), 8(2nd), 9(3rd), 2(4th), 2(5th), 1(6th), 4(7th)."}, {"id": 140, "num": 20, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "svg": null, "q": "Lavnya ranked 10th from the bottom and 28th from the top in his class. How many students are there in his class?", "options": ["39", "37", "36", "38"], "ans": 1, "exp": "Total students = rank from top + rank from bottom − 1 = 28 + 10 − 1 = 37."}]}, {"id": 8, "code": "Mock 08", "title": "Reasoning Mock 08", "subtitle": "Ramban Reasoning · Set 15", "badge": "Ramban", "durationSec": 1080, "questions": [{"id": 141, "num": 1, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "What should come in place of '?' in the given series?\n185, 207, 229, 251, 273, ?", "options": ["297", "295", "299", "293"], "ans": 1, "exp": "Each term increases by +22: 273 + 22 = 295."}, {"id": 142, "num": 2, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "What should come in place of '?' in the given series?\n12, 20, 30, 42, 56, ?", "options": ["74", "70", "72", "68"], "ans": 2, "exp": "Differences are +8, +10, +12, +14, +16 ⇒ 56 + 16 = 72 (also 3×4, 4×5, ..., 8×9 = 72)."}, {"id": 143, "num": 3, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "Which letter-number cluster will replace '?' in the series?\nIP13, JQ21, KR29, LS37, ?", "options": ["MS45", "MT46", "MT45", "MS46"], "ans": 2, "exp": "1st letter +1 (L→M), 2nd letter +1 (S→T), number +8 (37→45) ⇒ MT45."}, {"id": 144, "num": 4, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "If '+' means '−', '−' means '×', '×' means '÷' and '÷' means '+', then:\n40 − 3 ÷ 108 × 9 + 27 = ?", "options": ["105", "102", "114", "121"], "ans": 0, "exp": "Becomes 40 × 3 + 108 ÷ 9 − 27 = 120 + 12 − 27 = 105."}, {"id": 145, "num": 5, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "If 'A' = '+', 'B' = '−', 'C' = '×', 'D' = '÷', find:\n15 A 48 D 6 B 4 C 2 = ?", "options": ["14", "16", "15", "17"], "ans": 2, "exp": "15 + 48 ÷ 6 − 4 × 2 = 15 + 8 − 8 = 15."}, {"id": 146, "num": 6, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "13 is related to 52, and 18 is related to 72. Following the same whole-number logic, 22 is related to:", "options": ["72", "88", "80", "76"], "ans": 1, "exp": "Rule: n × 4 ⇒ 22 × 4 = 88."}, {"id": 147, "num": 7, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "A, B, C, D, E, F and G have exams Mon–Sun (one per day). Only C is before E. Only 3 people are between B and E. Only 3 people are between G and D. F is before D and after A. Who has the exam on Saturday?", "options": ["G", "B", "D", "F"], "ans": 1, "exp": "C=Mon, E=Tue; 3 between B & E ⇒ B=Sat. Order: C, E, G, A, F, B, D → B is on Saturday."}, {"id": 148, "num": 8, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "Seven people A–G sit in a row facing north. No one is left of G. Only four sit between D and B. A sits second right of B. C is immediate neighbour of E and A. How many sit between G and C?", "options": ["Two / दो", "One / एक", "Three / तीन", "Five / पांच"], "ans": 2, "exp": "Row (1→7): G, B, F, A, C, E, D. Between G(1) and C(5) sit B, F, A → Three."}, {"id": 149, "num": 9, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "Six friends H, I, J, K, C, D live on floors 1–6. Only 3 live between H and I (H below I). C lives on an odd floor immediately above H. K lives below J and above D. Who lives on floor 4?", "options": ["H", "C", "K", "J"], "ans": 2, "exp": "H=2, C=3, I=6; remaining 1,4,5 with D < K < J ⇒ D=1, K=4, J=5. Floor 4 = K."}, {"id": 150, "num": 10, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "How many letters remain in the same position if the letters of CRUMPET are arranged in alphabetical order?", "options": ["1", "2", "3", "0"], "ans": 0, "exp": "CRUMPET → CEMPRTU. Only the 1st letter (C) stays
