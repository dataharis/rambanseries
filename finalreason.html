in place → 1."}, {"id": 151, "num": 11, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "Words: EAR, HER, YOU, THE.\nHow many letters lie in the English alphabet between the 2nd letter of the 1st word from the left and the 2nd letter of the 1st word from the right?", "options": ["6", "8", "7", "5"], "ans": 0, "exp": "2nd letter of EAR = A; 2nd letter of THE = H. Between A and H: B, C, D, E, F, G → 6."}, {"id": 152, "num": 12, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "WABE : DEZAYZVW :: FJKN : UVQRPQMN :: PTUX : ?", "options": ["KMGHFDCD", "KLGIFGCE", "KLGHFGCD", "KLGIFHCD"], "ans": 2, "exp": "Each letter maps to its opposite letter followed by the next letter: P→KL, T→GH, U→FG, X→CD ⇒ KLGHFGCD."}, {"id": 153, "num": 13, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "Replace # and % so both sides follow the same rule:\n# : ZVB :: UZW : %", "options": ["# = ERG, % = PDR", "# = FLH, % = ERG", "# = PDR, % = KHM", "# = KHM, % = FLH"], "ans": 0, "exp": "Rule: −5, +4, −5. ERG → ZVB and UZW → PDR."}, {"id": 154, "num": 14, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "SP 18 is related to UK 4, and JR 15 is related to LM 1. Following the same logic, CN 19 is related to:", "options": ["EI 5", "DG 14", "FI 12", "EK 17"], "ans": 0, "exp": "Rule: 1st letter +2, 2nd letter −5, number −14. CN 19 → C+2=E, N−5=I, 19−14=5 ⇒ EI 5."}, {"id": 155, "num": 15, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "In a certain code language, 'FATE' is coded as '9403' and 'LEAF' is coded as '3064'. What is the code for 'L'?", "options": ["4", "6", "0", "3"], "ans": 1, "exp": "Common letters F, A, E match 4, 0, 3; remaining letter L in LEAF maps to 6."}, {"id": 156, "num": 16, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "A+B = father, A−B = brother, A×B = daughter, A÷B = mother. If 'G + E + S − C × U', how is S related to G?", "options": ["Daughter's daughter / पुत्री की पुत्री", "Son's daughter / पुत्र की पुत्री", "Daughter's son / पुत्री का पुत्र", "Son's son / पुत्र का पुत्र"], "ans": 3, "exp": "G is father of E; E is father of S; S is brother of C (so S is male) ⇒ S is G's son's son."}, {"id": 157, "num": 17, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "A+B = mother, A−B = brother, A×B = wife, A÷B = father. How is M related to Q if 'M + N − O × P ÷ Q'?", "options": ["Father's sister / पिता की बहन", "Father's mother / पिता की माता", "Mother's sister / माता की बहन", "Mother's mother / माता की माता"], "ans": 3, "exp": "M is mother of N & O; O is wife of P (Q's father), so O is Q's mother ⇒ M is Q's mother's mother."}, {"id": 158, "num": 18, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "Series (left to right): 2 9 € % 8 9 9 # 8 € 1 £ 3 £ # 4 8 £ © 7\nHow many symbols are immediately preceded by a number and immediately followed by a symbol?", "options": ["6", "4", "5", "3"], "ans": 3, "exp": "Number–Symbol–Symbol triplets: 9-€-%, 3-£-#, 8-£-© → 3."}, {"id": 159, "num": 19, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "Series (left to right): F C S L S ? & R = Z < E X @ V K A # A W\nHow many symbols are immediately preceded by a consonant and immediately followed by a consonant?", "options": ["Four / चार", "Two / दो", "One / एक", "Three / तीन"], "ans": 1, "exp": "Consonant–Symbol–Consonant triplets: R-=-Z and X-@-V → Two."}, {"id": 160, "num": 20, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "svg": null, "q": "Manu ranked 23rd from the top and 15th from the bottom in his class. How many students are in his class?", "options": ["35", "36", "38", "37"], "ans": 3, "exp": "Total = 23 + 15 − 1 = 37."}]}, {"id": 9, "code": "Mock 09", "title": "Reasoning Mock 09", "subtitle": "Ramban Reasoning · Set 14", "badge": "Ramban", "durationSec": 1080, "questions": [{"id": 161, "num": 1, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Which of the following letter-number clusters will replace the question mark (?) in the given series to make it logically complete?\nJP21, KQ30, LR39, MS48, ?", "options": ["NT57", "NT58", "NU57", "NU58"], "ans": 0, "exp": "Letters: J→K→L→M→N (+1) and P→Q→R→S→T (+1). Numbers: 21→30→39→48→57 (+9). Next term = NT57."}, {"id": 162, "num": 2, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Which of the following letter-number clusters will replace the question mark (?) in the given series to make it logically complete?\nNPJ 14, MOI 23, LNH 32, KMG 41, ?", "options": ["JLF51", "JLE51", "JLF50", "JLE50"], "ans": 2, "exp": "Each letter moves −1: NPJ → MOI → LNH → KMG → JLF. Numbers rise by +9: 14 → 23 → 32 → 41 → 50. Next term = JLF50."}, {"id": 163, "num": 3, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Select the number from among the given options that can replace the question mark (?) in the following series.\n541, 526, 511, 496, 481, ?", "options": ["462", "466", "470", "467"], "ans": 1, "exp": "Each term decreases by 15: 541 − 15 = 526, ..., 481 − 15 = 466."}, {"id": 164, "num": 4, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "What will come in the place of the question mark (?) in the following equation, if '+' and '−' are interchanged, and '×' and '÷' are interchanged?\n1 + 2 ÷ 6 × 4 − 36 = ?", "options": ["36", "34", "35", "32"], "ans": 1, "exp": "After interchanging + ↔ − and × ↔ ÷: 1 − 2 × 6 ÷ 4 + 36 = 1 − 12 ÷ 4 + 36 = 1 − 3 + 36 = 34."}, {"id": 165, "num": 5, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "10 is related to 110 following a certain logic. Following the same logic, 20 is related to 420. To which of the following is 30 related, following the same logic? (Perform operations on whole numbers only.)", "options": ["930", "961", "900", "920"], "ans": 0, "exp": "Rule: n × (n + 1) = n² + n. 10 × 11 = 110, 20 × 21 = 420, so 30 × 31 = 930."}, {"id": 166, "num": 6, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "What will come in place of the question mark (?) in the following equation, if '+' and '−' are interchanged and '×' and '÷' are interchanged?\n90 × 3 − 9 ÷ 5 + 43 = ?", "options": ["32", "34", "33", "31"], "ans": 0, "exp": "After interchanging: 90 ÷ 3 + 9 × 5 − 43 = 30 + 45 − 43 = 32."}, {"id": 167, "num": 7, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "M, N, O, P, U, V and W are sitting around a circular table facing the centre. P is an immediate neighbour of both O and W. W sits third to the left of U. V sits to the immediate left of U. N is not an immediate neighbour of W. Who sits third to the left of M?", "options": ["U", "P", "W", "O"], "ans": 3, "exp": "Number seats 0–6 clockwise (left = clockwise): U=0, V=1, W=3. P neighbours O and W ⇒ P=4, O=5. N not next to W(3) ⇒ N=6, M=2. Third left of M(2) is 5 = O."}, {"id": 168, "num": 8, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "F, G, H, J, K and L live on six different floors of the same building (1 = lowermost to 6 = topmost). Only K lives above H. J lives immediately below H. Only G lives below L. How many people live between F and G?", "options": ["Four / चार", "Three / तीन", "Two / दो", "One / एक"], "ans": 3, "exp": "Floors from bottom to top: G(1), L(2), F(3), J(4), H(5), K(6). Between F(3) and G(1) lives only L → One person."}, {"id": 169, "num": 9, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Seven people, A, B, C, D, E, F and G, are sitting in a row, facing north. Only three people sit to the left of B. Only F sits to the right of E. Only three people sit between E and C. G sits at some place to the left of A but at some place to the right of D. How many people sit to the left of G?", "options": ["1", "2", "3", "4"], "ans": 1, "exp": "Seats 1–7: B=4, E=6, F=7, C=2. Remaining seats 1, 3, 5 with D < G < A ⇒ D=1, G=3, A=5. Row: D, C, G, B, A, E, F. Left of G: D and C → 2."}, {"id": 170, "num": 10, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group?", "options": ["UO - RL", "NH - KE", "JD - GB", "PJ - MG"], "ans": 2, "exp": "In UO−RL, NH−KE, and PJ−MG, both clusters have a gap of 6 (21−15=6, 18−12=6, etc.). In JD−GB, J(10)−D(4)=6 but G(7)−B(2)=5. Thus JD - GB is the odd one out."}, {"id": 171, "num": 11, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "The position(s) of how many letters will remain unchanged if each of the letters in the word ENCHANTING is arranged in alphabetical order?", "options": ["One / एक", "Two / दो", "Four / चार", "Three / तीन"], "ans": 0, "exp": "Word: E N C H A N T I N G; Alphabetical: A C E G H I N N N T. Only the 9th letter (N) stays in the same position → One."}, {"id": 172, "num": 12, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "LM 8 is related to IO 27 in a certain way. In the same way, DV 11 is related to AX 30. To which of the following is RG 3 related, following the same logic?", "options": ["RO 20", "OO 18", "ER 12", "OI 22"], "ans": 3, "exp": "Rule: 1st letter −3, 2nd letter +2, number +19. Applying to RG 3: R−3 = O, G+2 = I, 3+19 = 22 ⇒ OI 22."}, {"id": 173, "num": 13, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Which of the following letter-clusters should replace # and % so that the pattern followed on the left side of :: is the same as on the right side?\n# : VAD :: BGJ : %", "options": ["# = OTW, % = INO", "# = YTW, % = INQ", "# = OTW, % = INQ", "# = OTW, % = INM"], "ans": 2, "exp": "Rule: each letter +7. OTW + 7 → VAD (O+7=V, T+7=A, W+7=D). BGJ + 7 → INQ (B+7=I, G+7=N, J+7=Q)."}, {"id": 174, "num": 14, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "3 is related to 63 following a certain logic. Following the same logic, 32 is related to 324. To which of the following is 6 related, following the same logic? (Perform operations on whole numbers only.)", "options": ["88", "91", "90", "92"], "ans": 2, "exp": "Rule: (n + 4) × 9. (3 + 4) × 9 = 63, (32 + 4) × 9 = 324, so (6 + 4) × 9 = 90."}, {"id": 175, "num": 15, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "In a certain code language, 'DECK' is coded as '4572' and 'DUKE' is coded as '7325'. What is the code for 'U' in the given code language?", "options": ["5", "2", "3", "7"], "ans": 2, "exp": "Common letters in DECK and DUKE are D, E, K corresponding to common digits 7, 2, 5. The remaining letter U in DUKE maps to 3."}, {"id": 176, "num": 16, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "R is the brother of S. S is the son of T. T is the father of G. G is the wife of H. How is R related to H?", "options": ["Brother's wife's father / भाई की पत्नी के पिता", "Brother / भाई", "Wife's brother / पत्नी का भाई", "Brother's wife's brother / भाई की पत्नी का भाई"], "ans": 2, "exp": "R, S, and G are siblings (children of T). Since G is H's wife, R is H's wife's brother."}, {"id": 177, "num": 17, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "In a certain code language: A + B means 'A is the daughter of B'; A @ B means 'A is the father of B'; A # B means 'A is the son of B'; A ÷ B means 'A is the sister of B'. How is M related to U if 'M # I @ N ÷ K + U'?", "options": ["Husband / पति", "Son / पुत्र", "Brother / भाई", "Father / पिता"], "ans": 1, "exp": "M is son of I; I is father of N; N is sister of K; K is daughter of U ⇒ I and U are married parents of M, N, K. Hence M is U's son."}, {"id": 178, "num": 18, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Refer to the series (left to right): 6 7 1 4 2 1 2 8 3 5 4 2 4 9 5 6 6 3 7 8 1 6 2 4 3 2 4\nHow many such even digits are there, each of which is immediately preceded by an even digit and also immediately followed by an odd digit?", "options": ["Seven / सात", "Four / चार", "Five / पांच", "Six / छह"], "ans": 2, "exp": "Even–Even–Odd triplets: 4-2-1, 2-8-3, 2-4-9, 6-6-3, 2-4-3. Total count = Five."}, {"id": 179, "num": 19, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Refer to the given series (left to right): R F % A > B $ R U B % W # U > A U # P H\nHow many such symbols are there, each of which is immediately preceded by a consonant and also immediately followed by a consonant?", "options": ["Two / दो", "Three / तीन", "Five / पांच", "Four / चार"], "ans": 0, "exp": "Checking every symbol for Consonant–Symbol–Consonant: only B-$-R and B-%-W qualify. Total = Two."}, {"id": 180, "num": 20, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "svg": null, "q": "Kiran ranked 5th from the bottom and 35th from the top in his class. How many students are there in his class?", "options": ["40", "39", "38", "37"], "ans": 1, "exp": "Total students = Rank from top + Rank from bottom − 1 = 35 + 5 − 1 = 39."}]}, {"id": 10, "code": "Mock 10", "title": "Reasoning Mock 10", "subtitle": "Ramban Reasoning · Set 13", "badge": "Ramban", "durationSec": 1080, "questions": [{"id": 181, "num": 1, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "What should come in place of the question mark (?) in the given series?\n18, 24, 36, 54, 78, ?", "options": ["109", "108", "106", "107"], "ans": 1, "exp": "Differences are +6, +12, +18, +24, +30 ⇒ 78 + 30 = 108."}, {"id": 182, "num": 2, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "What should come in place of (?) in the given series?\n2, 4, 16, 256, ?", "options": ["65534", "65533", "65535", "65536"], "ans": 3, "exp": "Each term is the square of the previous term: 2²=4, 4²=16, 16²=256, 256² = 65536."}, {"id": 183, "num": 3, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "What should come in place of (?) in the given series?\n9, 27, 13.5, 40.5, 20.25, ?", "options": ["15.1875", "45.5625", "30.375", "60.75"], "ans": 3, "exp": "Alternating ×3 and ÷2: 9×3=27, 27÷2=13.5, 13.5×3=40.5, 40.5÷2=20.25, 20.25×3 = 60.75."}, {"id": 184, "num": 4, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "If ‘A’ = ‘−’, ‘B’ = ‘×’, ‘C’ = ‘÷’, and ‘D’ = ‘+’, which expression equals 11?", "options": ["5 D 2 C 3 A 4 B 2", "5 C 2 A 3 D 4 B 2", "5 A 2 B 3 C 4 D 2", "5 B 2 D 3 A 4 C 2"], "ans": 3, "exp": "Option (d): 5 × 2 + 3 − 4 ÷ 2 = 10 + 3 − 2 = 11."}, {"id": 185, "num": 5, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "If ‘+’ and ‘−’ are interchanged and ‘×’ and ‘÷’ are interchanged, evaluate:\n15 ÷ 3 + 56 × 8 − 10 = ?", "options": ["49", "51", "48", "50"], "ans": 2, "exp": "Becomes 15 × 3 − 56 ÷ 8 + 10 = 45 − 7 + 10 = 48."}, {"id": 186, "num": 6, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "If ‘+’ and ‘−’ are interchanged and ‘×’ and ‘÷’ are interchanged, evaluate:\n30 ÷ 2 + 14 × 7 − 5 = ?", "options": ["74", "63", "78", "69"], "ans": 1, "exp": "Becomes 30 × 2 − 14 ÷ 7 + 5 = 60 − 2 + 5 = 63."}, {"id": 187, "num": 7, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "C, D, E, F, K, I and L each have an exam on a different day from Monday to Sunday. D is on Thursday, E on Saturday. K is immediately before F, and L is immediately after F. I is after C. How many people have exams between I and L?", "options": ["Four / चार", "One / एक", "Two / दो", "Three / तीन"], "ans": 3, "exp": "K-F-L must take Mon-Tue-Wed; then D=Thu, C=Fri, E=Sat, I=Sun. Between L (Wed) and I (Sun) are D, C, E ⇒ Three."}, {"id": 188, "num": 8, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "A, B, C, D, E, F and G have exams on different days Mon–Sun. Only 3 people are between E and F; only 3 between G and C. A is before D and after B. Only C is after F. Who has the exam on Thursday?", "options": ["E", "G", "A", "F"], "ans": 2, "exp": "F=Sat, C=Sun ⇒ E=Tue, G=Wed. Remaining Mon, Thu, Fri in order B < A < D ⇒ B=Mon, A=Thu, D=Fri. Thursday = A."}, {"id": 189, "num": 9, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "A, B, C, D, E, F, G sit around a circular table facing the centre. C is immediate right of A. 3 people sit between C and B (from C's left). 3 people sit between A and E (from A's left). F is immediate right of D. How many people sit between A and D counted from D's left?", "options": ["2", "4", "3", "1"], "ans": 1, "exp": "Clockwise (= left) order from A: A, F, D, B, E, G, C. Counting clockwise (left) from D to A: B, E, G, C ⇒ 4 people."}, {"id": 190, "num": 10, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "What should come in place of (?) in the alphabetical series?\nOIK, PJL, QKM, RLN, ?", "options": ["SNO", "SMO", "SNP", "SMP"], "ans": 1, "exp": "Each letter advances +1: R+1=S, L+1=M, N+1=O ⇒ SMO."}, {"id": 191, "num": 11, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "Based on the words: HKC, WLB, RTE, PIC. If each letter is changed to the next letter (+1), how many resulting words will have a vowel?", "options": ["One / एक", "Four / चार", "Two / दो", "Three / तीन"], "ans": 2, "exp": "HKC→ILD (vowel I ✓), WLB→XMC (none), RTE→SUF (vowel U ✓), PIC→QJD (none) ⇒ Two words."}, {"id": 192, "num": 12, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "Which letter-clusters should replace # and % so both sides follow the same pattern?\n# : KNH :: VYS : %", "options": ["# = PRL, % = RUO", "# = ORL, % = RCO", "# = ORL, % = RUB", "# = ORL, % = RUO"], "ans": 3, "exp": "Rule: each letter −4. ORL − 4 = KNH; VYS − 4 = RUO."}, {"id": 193, "num": 13, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "Which letter-clusters should replace # and % so both sides follow the same pattern?\n# : IFJ :: PMQ : %", "options": ["# = NJH, % = NHL", "# = LPN, % = NJU", "# = MJN, % = LIM", "# = LGY, % = HGU"], "ans": 2, "exp": "Rule: each letter −4. MJN − 4 = IFJ; PMQ − 4 = LIM."}, {"id": 194, "num": 14, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "Which letter-clusters should replace # and % so both sides follow the same pattern?\n# : NUR :: ELI : %", "options": ["# = RXU, % = EJH", "# = PYV, % = DLH", "# = QUV, % = FKG", "# = PWT, % = CJG"], "ans": 3, "exp": "Rule: each letter −2. PWT − 2 = NUR; ELI − 2 = CJG."}, {"id": 195, "num": 15, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "In a certain code language, ‘1039’ is coded as ‘DIAL’ and ‘9201’ is coded as ‘MAID’. What is the code for ‘M’?", "options": ["2", "9", "1", "0"], "ans": 0, "exp": "Common digits {1, 0, 9} correspond to common letters {D, I, A}. Remaining digit 2 in 9201 corresponds to M ⇒ M = 2."}, {"id": 196, "num": 16, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "A+B: mother; A−B: brother; A×B: sister; A÷B: father. How is P related to Q if ‘P − M + N × Q’?", "options": ["Sister's son / बहन का पुत्र", "Sister's daughter / बहन की पुत्री", "Mother’s sister / माता की बहन", "Mother’s brother / माता का भाई"], "ans": 3, "exp": "P is brother of M; M is mother of N; N is sister of Q (so M is Q's mother) ⇒ P is Q's Mother's brother."}, {"id": 197, "num": 17, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "A+B: mother; A−B: son; A×B: brother; A÷B: sister. How is V related to J if ‘J × C − V ÷ W’?", "options": ["Mother / माता", "Son / पुत्र", "Father / पिता", "Daughter / पुत्री"], "ans": 0, "exp": "J is brother of C; C is son of V; V is sister of W (female) ⇒ V is J's Mother."}, {"id": 198, "num": 18, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "In the single-digit series (left to right):\n5 9 7 1 5 4 6 3 7 8 4 9 3 6 1 2 4 8 6 7 4 8 1 9 4 6 5\nHow many odd numbers are immediately preceded by an even number and immediately followed by an odd number?", "options": ["Two / दो", "Three / तीन", "More than three / तीन से अधिक", "One / एक"], "ans": 1, "exp": "Even–Odd–Odd triples: 6 3 7, 4 9 3, and 8 1 9 ⇒ Three."}, {"id": 199, "num": 19, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "In the series (left to right):\nJ T $ H O £ K # W N Q * V E # M £ A * © © *\nHow many letters are immediately preceded by a symbol and immediately followed by a symbol?", "options": ["2", "3", "5", "4"], "ans": 1, "exp": "Symbol–Letter–Symbol triples: £ K #, # M £, and £ A * ⇒ 3."}, {"id": 200, "num": 20, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "svg": null, "q": "Raghav ranked 29th from the top and 49th from the bottom in his class. How many students are there in his class?", "options": ["75", "76", "78", "77"], "ans": 3, "exp": "Total = 29 + 49 − 1 = 77."}]}, {"id": 11, "code": "Mock 11", "title": "Reasoning Mock 11", "subtitle": "Ramban Reasoning · Set 12", "badge": "Ramban", "durationSec": 1080, "questions": [{"id": 201, "num": 1, "topic": "Direction & Distance", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "In a row of 27 students facing north, Varun is 12th from the right end. If Nisha is 9th to the left of Varun, what is Nisha’s position from the left end?", "options": ["Sixth / छठे", "Fifth / पाँचवें", "Eighth / आठवें", "Seventh / सातवें"], "ans": 3, "exp": "Varun from left = 27 − 12 + 1 = 16th. Nisha is 9 places to his left ⇒ 16 − 9 = 7th (Seventh) from the left."}, {"id": 202, "num": 2, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "Select the set related in the same way as (60, 78, 18) and (83, 112, 29). (Whole-number operations only.)", "options": ["(88, 180, 91)", "(60, 151, 89)", "(90, 150, 60)", "(91, 130, 29)"], "ans": 2, "exp": "Rule: 3rd number = 2nd − 1st. 78 − 60 = 18; 112 − 83 = 29. Similarly, 150 − 90 = 60."}, {"id": 203, "num": 3, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "Based on the words: JET, CAR, MOP, WIN. How many letters are there between the first letter of the third word from the left and the third letter of the first word from the right in the English alphabet?", "options": ["Two / दो", "Three / तीन", "None / एक भी नहीं", "One / एक"], "ans": 2, "exp": "3rd word from left = MOP (1st letter = M); 1st word from right = WIN (3rd letter = N). M and N are consecutive ⇒ None."}, {"id": 204, "num": 4, "topic": "Non-verbal (Figure based)", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": "M11_VENN_Q4", "q": "Study the Venn diagram of Painters, Masons, and Carpenters. How many of the carpenters are also masons?", "options": ["45", "28", "33", "38"], "ans": 3, "exp": "Carpenters who are also masons = region common to Carpenters & Masons = 18 (all three) + 20 (carpenters & masons only) = 38."}, {"id": 205, "num": 5, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "If '+' means '−', '−' means '×', '×' means '÷', and '÷' means '+', what will come in place of (?)?\n132 + 201 ÷ 72 × 4 − 5 = ?", "options": ["11", "18", "21", "19"], "ans": 2, "exp": "After replacing signs: 132 − 201 + 72 ÷ 4 × 5 = 132 − 201 + 18 × 5 = 132 − 201 + 90 = 21."}, {"id": 206, "num": 6, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "If ‘+’ means ‘−’, ‘−’ means ‘×’, ‘×’ means ‘÷’, ‘÷’ means ‘+’, what will come in place of (?)?\n88 ÷ 240 × 12 + 14 − 6 = ?", "options": ["24", "23", "22", "20"], "ans": 0, "exp": "After replacing signs: 88 + 240 ÷ 12 − 14 × 6 = 88 + 20 − 84 = 24."}, {"id": 207, "num": 7, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "What should come in place of (?) in the given series?\n71, 73, 77, 83, 91, ?", "options": ["101", "99", "98", "100"], "ans": 0, "exp": "Differences are +2, +4, +6, +8, +10 ⇒ 91 + 10 = 101."}, {"id": 208, "num": 8, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "What should come in place of (?) in the given series?\n75, 91, 69, 85, 63, 79, ?", "options": ["63", "57", "51", "49"], "ans": 1, "exp": "Two alternating −6 series: (75 → 69 → 63 → 57) and (91 → 85 → 79). Next term = 57."}, {"id": 209, "num": 9, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "If '+' and '−' are interchanged and '×' and '÷' are interchanged, what will come in place of (?)?\n124 × 4 ÷ 8 + 7 − 4 = ?", "options": ["245", "244", "248", "243"], "ans": 0, "exp": "After interchanging: 124 ÷ 4 × 8 − 7 + 4 = 31 × 8 − 7 + 4 = 248 − 3 = 245."}, {"id": 210, "num": 10, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "Select the number-pair related in the same way as (17, 75) and (14, 60). (Whole-number operations only.)", "options": ["21, 95", "12, 80", "19, 105", "18, 90"], "ans": 0, "exp": "Rule: Second = First × 5 − 10. 17×5−10 = 75; 14×5−10 = 60. Similarly, 21×5−10 = 95."}, {"id": 211, "num": 11, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "Three of the following four letter-cluster pairs are alike. Which pair does NOT belong to the group?", "options": ["TR – US", "FD – GE", "LJ – MK", "QN – QO"], "ans": 3, "exp": "In TR–US, FD–GE, and LJ–MK, the first cluster drops by −2 and the second cluster shifts +1 from the first. In QN–QO, Q→N is −3 and Q stays Q, so QN–QO is the odd one out."}, {"id": 212, "num": 12, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "In a certain code language:\n“mechanic battery engine inspects” = “oZ iK jL gT”\n“garage contains battery engine” = “cI vO iK jL”\n“repairs mechanic battery expert” = “iK gT gU vK”\nHow is 'mechanic' coded?", "options": ["gU", "oZ", "gT", "iK"], "ans": 2, "exp": "“battery” appears in all 3 sentences ⇒ code is iK. “mechanic” appears in sentences 1 and 3 ⇒ common codes are iK and gT ⇒ mechanic = gT."}, {"id": 213, "num": 13, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "Three of the following four letter-clusters form a group. Which one does NOT belong?", "options": ["QSY", "KMS", "EGM", "OPI"], "ans": 3, "exp": "Q(+2)S(+6)Y, K(+2)M(+6)S, E(+2)G(+6)M all follow +2, +6. O(+1)P(−7)I breaks the pattern."}, {"id": 214, "num": 14, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "Seven boxes E, F, G, H, I, J, K are stacked vertically. F is 3rd from the bottom. Exactly 3 boxes are between J and F. Only K is below I. Exactly 4 boxes are between K and G. H is immediately below E. How many boxes are kept above E?", "options": ["Four / चार", "One / एक", "None / एक भी नहीं", "Two / दो"], "ans": 3, "exp": "Top→bottom: 1-J, 2-G, 3-E, 4-H, 5-F, 6-I, 7-K. Boxes above E are J and G ⇒ Two."}, {"id": 215, "num": 15, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "A + B means A is sister of B; A @ B means A is brother of B; A # B means A is wife of B; A ÷ B means A is father of B. How is X related to P if ‘X ÷ Y + L @ O # P’?", "options": ["Father / पिता", "Wife's brother / पत्नी का भाई", "Brother / भाई", "Wife's father / पत्नी के पिता"], "ans": 3, "exp": "X is father of Y; Y, L, O are siblings (all children of X); O is wife of P ⇒ X is P's Wife's father."}, {"id": 216, "num": 16, "topic": "Analogy", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "Select the triad following the same pattern as: PS-RW-TA and LO-NS-PW.", "options": ["TP-OT-QA", "RT-OT-BA", "MP-OT-QX", "JP-OT-PX"], "ans": 2, "exp": "1st letters shift +2 (P→R→T, L→N→P) and 2nd letters shift +4 (S→W→A, O→S→W). For MP-OT-QX: M→O→Q (+2) and P→T→X (+4)."}, {"id": 217, "num": 17, "topic": "Non-verbal (Figure based)", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": "M11_VENN_Q17", "q": "Study the Venn diagram of Carpenters, Plumbers, and China. How many carpenters are also plumbers and are from China?", "options": ["3", "5", "4", "2"], "ans": 1, "exp": "The region common to all three circles (Carpenters ∩ Plumbers ∩ China) contains 5."}, {"id": 218, "num": 18, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "In a row of 36 people, Jaya was 12th from the left and Karan was 19th from the right. If Anu was seated 21st to the right of Jaya, how many people were seated between Karan and Anu?", "options": ["16", "14", "13", "15"], "ans": 1, "exp": "Anu from left = 12 + 21 = 33rd. Karan from left = 36 − 19 + 1 = 18th. People between them = 33 − 18 − 1 = 14."}, {"id": 219, "num": 19, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "What should come in place of ‘?’ in the given series?\n5, 20, 54, 169, 499, ?", "options": ["1478", "1500", "1506", "1498"], "ans": 2, "exp": "Pattern: ×3+5, ×3−6, ×3+7, ×3−8, ×3+9 ⇒ 499 × 3 + 9 = 1497 + 9 = 1506."}, {"id": 220, "num": 20, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "svg": null, "q": "A+B: mother; A−B: brother; A×B: sister; A÷B: father; A%B: husband; A#B: wife. How is E related to R if ‘W − R + N # K ÷ E % L’?", "options": ["Son / पुत्र", "Son's Daughter / पुत्र की पुत्री", "Son's Son / पुत्र का पुत्र", "Daughter's Son / पुत्री का पुत्र"], "ans": 3, "exp": "R is mother of N; N is wife of K (so N is R's daughter); K is father of E; E is husband of L (male) ⇒ E is R's Daughter's Son."}]}, {"id": 12, "code": "Mock 12", "title": "Reasoning Mock 12", "subtitle": "Ramban Reasoning · Set 11", "badge": "Ramban", "durationSec": 1080, "questions": [{"id": 221, "num": 1, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "In the number pairs below, which values should replace X and Y so that the pattern on both sides of :: is the same? (Operations on whole numbers only.)\nX : 530 :: 48 : Y", "options": ["X = 54, Y = 470", "X = 53, Y = 490", "X = 52, Y = 470", "X = 54, Y = 480"], "ans": 0, "exp": "Rule: Second = (First × 10) − 10. Check: 54 × 10 − 10 = 530, and 48 × 10 − 10 = 470."}, {"id": 222, "num": 2, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "What should come in place of the question mark (?) in the given alphabetical series?\nPRK, NPI, LNG, JLE, ?", "options": ["HJD", "HJC", "HIC", "HID"], "ans": 1, "exp": "Each letter shifts −2 at every step: P→N→L→J→H, R→P→N→L→J, K→I→G→E→C ⇒ HJC."}, {"id": 223, "num": 3, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "In a certain code language: 'A + B' means A is son of B; 'A − B' means A is brother of B; 'A × B' means A is wife of B; 'A ÷ B' means A is father of B. How is D related to J if 'D − F + G ÷ H × J'?", "options": ["Wife's brother / पत्नी का भाई", "Father / पिता", "Wife's father / पत्नी का पिता", "Brother / भाई"], "ans": 0, "exp": "D−F ⇒ D is brother of F; F+G ⇒ F is son of G; G÷H ⇒ G is father of H; H×J ⇒ H is wife of J. Thus D, F, H are siblings and H is J's wife ⇒ D is J's wife's brother."}, {"id": 224, "num": 4, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Select the set in which the numbers are related in the same way as (32, 38, 45) and (41, 47, 54). (Whole-number operations only.)", "options": ["(24, 31, 39)", "(48, 53, 59)", "(50, 56, 61)", "(39, 45, 52)"], "ans": 3, "exp": "Pattern: +6, then +7. 32+6=38, 38+7=45; 41+6=47, 47+7=54. Similarly, 39+6=45, 45+7=52."}, {"id": 225, "num": 5, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Three of the following four letter-group pairs are alike in a certain way. Which pair does NOT belong to the group?", "options": ["US – WU", "JH – LJ", "QO – SQ", "FG – HJ"], "ans": 3, "exp": "In US–WU, JH–LJ, and QO–SQ, within each group the 2nd letter is −2 from the 1st, and the 2nd group is +2 from the 1st. In FG–HJ, F+1=G and H+2=J, so FG–HJ is the odd one out."}, {"id": 226, "num": 6, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Refer to the series (left to right):\n(Left) S C © X & & $ © X © @ © E E @ Q % Z # % K L (Right)\nHow many symbols are immediately preceded by a letter and immediately followed by a letter?", "options": ["Four / चार", "Five / पाँच", "Three / तीन", "Two / दो"], "ans": 2, "exp": "Looking for Letter–Symbol–Letter: C © X, E @ Q, and Q % Z ⇒ Three such symbols."}, {"id": 227, "num": 7, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "What should come in place of (?) to complete the series logically?\nA2D, E2H, I2L, ?", "options": ["M2Q", "M2P", "E2X", "E2P"], "ans": 1, "exp": "1st letter +4 (A→E→I→M), middle number stays 2, last letter +4 (D→H→L→P) ⇒ M2P."}, {"id": 228, "num": 8, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "In a certain code language, ‘P#ST’ is coded as ‘4025’ and ‘RS#T’ is coded as ‘0125’. What is the code for ‘R’?", "options": ["2", "0", "1", "5"], "ans": 2, "exp": "Common characters #, S, T correspond to common digits 0, 2, 5. The remaining character P = 4 and R = 1."}, {"id": 229, "num": 9, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Which option follows the same sequence of operations as:\n66 - 22 - 88 - 44  and  84 - 28 - 112 - 56?", "options": ["60 - 20 - 80 - 30", "51 - 17 - 68 - 34", "93 - 21 - 84 - 42", "42 - 14 - 56 - 38"], "ans": 1, "exp": "Operations: ÷3, ×4, ÷2. Check option (b): 51 ÷ 3 = 17; 17 × 4 = 68; 68 ÷ 2 = 34."}, {"id": 230, "num": 10, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Seven boxes A, C, D, F, G, I, L are stacked vertically. Only one box is below F. Only one box is above I. G is below F. Only C is exactly between F and A. Only one box is between C and L. How many boxes are between D and F?", "options": ["Two / दो", "Four / चार", "One / एक", "Five / पाँच"], "ans": 1, "exp": "Top→bottom: 1-D, 2-I, 3-L, 4-A, 5-C, 6-F, 7-G. Between D and F lie I, L, A, C ⇒ Four boxes."}, {"id": 231, "num": 11, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Seven boxes A, B, C, D, S, T, U are stacked vertically. Only two boxes are between T and D. Only B is above A. No box is below D. S is below U but above C. Which box is kept third above C?", "options": ["D", "A", "U", "T"], "ans": 2, "exp": "Top→bottom: 1-B, 2-A, 3-U, 4-T, 5-S, 6-C, 7-D. Third above C (position 6 − 3 = 3) is U."}, {"id": 232, "num": 12, "topic": "Coding–Decoding", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "In a certain code language:\n“pattern designer fabric creates” = “dv xi ca vu”\n“pattern fashion fabric demands” = “xi lp vl dv”\n“designer stitches fabric innovative” = “gb pt vu xi”\nHow is 'pattern' coded?", "options": ["xi", "dv", "ca", "lp"], "ans": 1, "exp": "“fabric” appears in all 3 sentences ⇒ code is xi. “pattern” appears in sentences 1 and 2 ⇒ common codes are xi and dv. Hence pattern = dv."}, {"id": 233, "num": 13, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Based on the words: SIN, COS, TAN, ZEN. Each vowel is changed to the next letter (+1) and each consonant to the previous letter (−1). In how many resulting clusters will NO vowel appear?", "options": ["Three / तीन", "One / एक", "Two / दो", "Four / चार"], "ans": 3, "exp": "SIN → RJM, COS → BPR, TAN → SBM, ZEN → YFM. None of the four clusters contains a vowel ⇒ Four."}, {"id": 234, "num": 14, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "What should come in place of ‘?’ in the given series?\n130, 138, 154, 178, 210, ?", "options": ["250", "221", "210", "254"], "ans": 0, "exp": "Consecutive differences are +8, +16, +24, +32, +40. Thus 210 + 40 = 250."}, {"id": 235, "num": 15, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "If + means ÷, − means +, × means −, and ÷ means ×, then what will come in place of (?)?\n48 − 14 + 7 × 3 ÷ 12 = ?", "options": ["14", "55", "36", "18"], "ans": 0, "exp": "Replacing signs: 48 + 14 ÷ 7 − 3 × 12 = 48 + 2 − 36 = 14."}, {"id": 236, "num": 16, "topic": "Venn Diagrams", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": "M12_VENN_Q16", "q": "Select the Venn diagram that best illustrates the relationship between: Lamp (L), Rack (R), Kettle (K).", "options": ["Diagram (a) — K separate, L inside R", "Diagram (b) — L, R, K overlapping in a chain", "Diagram (c) — Three completely separate circles", "Diagram (d) — Three mutually intersecting circles"], "ans": 2, "exp": "A lamp, a rack, and a kettle are three completely distinct, unrelated objects ⇒ three separate circles, Diagram (c)."}, {"id": 237, "num": 17, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Select the set related in the same way as (10, 1331, 121) and (12, 2197, 169). (Whole-number operations only.)", "options": ["(16, 4096, 289)", "(14, 2744, 196)", "(13, 2197, 144)", "(15, 4096, 256)"], "ans": 3, "exp": "Pattern: (n, (n+1)³, (n+1)²). For n=15: 16³ = 4096 and 16² = 256 ⇒ (15, 4096, 256)."}, {"id": 238, "num": 18, "topic": "Number, Letter & Symbol Sequence", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "Refer to the series (left to right):\n(Left) 7 4 < 6 9 6 # @ 4 6 8 4 5 7 * 8 3 1 % 4 & 5 = 8 (Right)\nHow many symbols are immediately preceded by an odd number and immediately followed by an even number?", "options": ["Two / दो", "One / एक", "Three / तीन", "None / एक भी नहीं"], "ans": 2, "exp": "Looking for Odd–Symbol–Even: 7 * 8, 1 % 4, and 5 = 8 ⇒ Three such symbols."}, {"id": 239, "num": 19, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": null, "q": "H, I, J, K, L and M sit around a circular table facing the centre. K sits second to the left of H. M sits third to the right of K. L sits to the immediate right of J. How many people sit between H and L when counted from the left of H?", "options": ["Two / दो", "One / एक", "Three / तीन", "Four / चार"], "ans": 0, "exp": "Facing centre (clockwise = left): H → I → K (2nd left of H) → L (imm. right of J) → J → M (3rd right of K). Counting from left of H: I and K sit between H and L ⇒ Two."}, {"id": 240, "num": 20, "topic": "Embedded & Completing Figures", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "svg": "M12_EMBED_Q20", "q": "Select the option in which the given figure is embedded (rotation is NOT allowed).", "options": ["Option (a)", "Option (b)", "Option (c)", "Option (d)"], "ans": 2, "exp": "The exact cup-shaped curve with the top L-shaped vertical stroke and bottom-right L-tail appears without rotation inside Option (c)."}]}, {"id": 13, "code": "Mock 13", "title": "Reasoning Mock 13", "subtitle": "Ramban Reasoning · Set 10", "badge": "Ramban", "durationSec": 1080, "questions": [{"id": 241, "num": 1, "topic": "Syllogism", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Statements: Some doors are eagles. All shoes are eagles. All roads are shoes.\nConclusions:\n(I) Some doors are shoes.\n(II) All roads are eagles.\nDecide which conclusion(s) logically follow.", "options": ["Only conclusion (II) follows. / केवल निष्कर्ष (II) अनुसरण करता है।", "Both conclusions (I) and (II) follow. / दोनों निष्कर्ष (I) और (II) अनुसरण करते हैं।", "Neither conclusion (I) nor (II) follows. / न तो (I) और न ही (II) अनुसरण करता है।", "Only conclusion (I) follows. / केवल निष्कर्ष (I) अनुसरण करता है।"], "ans": 0, "exp": "All roads are shoes and all shoes are eagles ⇒ all roads are eagles, so Conclusion (II) definitely follows. Doors are linked only to eagles, giving no definite relation between doors and shoes, so (I) does not follow."}, {"id": 242, "num": 2, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Based on the English alphabet, FRTH is related to NZBP in a certain way. Similarly, LXZN is related to TFHV. Following the same reasoning, what is JVXL related to?", "options": ["RFDT", "RTFE", "RDFT", "TFRE"], "ans": 2, "exp": "Each letter shifts forward by +8 (wrapping around Z→A): F→N, R→Z, T→B, H→P and L→T, X→F, Z→H, N→V. Applying +8 to JVXL: J→R, V→D, X→F, L→T ⇒ RDFT."}, {"id": 243, "num": 3, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "In a certain code language: ‘A + B’ means A is son of B; ‘A − B’ means A is brother of B; ‘A × B’ means A is wife of B; ‘A ÷ B’ means A is father of B. If ‘D + F ÷ G − H × J’, how is D related to J?", "options": ["Wife’s brother / पत्नी का भाई", "Wife’s father / पत्नी का पिता", "Father / पिता", "Brother / भाई"], "ans": 0, "exp": "D + F ⇒ D is son of F; F ÷ G ⇒ F is father of G; G − H ⇒ G is brother of H; H × J ⇒ H is wife of J. Thus D, G, H are children of F and H is J's wife ⇒ D is J's wife's brother."}, {"id": 244, "num": 4, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Seven people M, N, O, P, Q, R and S sit around a circular table facing the centre. Q sits third to the right of R. Only two people sit between Q and O. Only three people sit between R and S. N sits to the immediate right of R and M sits immediately left of Q. Who sits immediate right of P?", "options": ["S", "Q", "O", "N"], "ans": 2, "exp": "Facing centre (anti-clockwise = right): R → N (imm. right) → M → Q (3rd right of R, M imm. left of Q) → S (3 people between R and S) → P → O (2 people between Q and O). Thus O sits to the immediate right of P."}, {"id": 245, "num": 5, "topic": "Statement & Assumption / Argument", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Statement: Following a major cyberattack that disabled the payment portal of City B's public transit system last week, transport officials claim the transit authority will suffer catastrophic revenue loss this month and fail to pay staff salaries unless a government grant is issued immediately.\nWhich of the following will weaken the argument that the transit authority cannot pay staff salaries without a government grant?", "options": ["Cyberattack incidents on public transport infrastructure have increased globally over the past two years.", "The payment portal only handles advance annual pass renewals, while 92% of daily fare revenue is collected through physical smart-card turnstiles unaffected by the breach.", "Other municipal public services in City B have also reported minor cybersecurity vulnerabilities.", "Repairing the affected payment portal will require hiring external cybersecurity consultants."], "ans": 1, "exp": "The officials' claim assumes the portal outage halts most revenue. Option (b) directly refutes this by showing 92% of daily fare revenue comes through unaffected physical smart-card turnstiles, weakening the argument."}, {"id": 246, "num": 6, "topic": "Direction & Distance", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Gaurav starts from Point A and drives 8 km east. He takes a right turn, drives 5 km, turns right and drives 11 km. He then takes a right turn and drives 13 km. He takes a final right turn, drives 3 km and stops at Point P. How far (shortest distance) and in which direction should he drive to reach Point A again?", "options": ["8 km to the south / 8 km दक्षिण की ओर", "7 km to the south / 7 km दक्षिण की ओर", "7 km to the north / 7 km उत्तर की ओर", "8 km to the north / 8 km उत्तर की ओर"], "ans": 0, "exp": "Taking A = (0, 0): East 8 → (8, 0); Right/South 5 → (8, −5); Right/West 11 → (−3, −5); Right/North 13 → (−3, 8); Right/East 3 → P = (0, 8). Since P is 8 km north of A, he must drive 8 km to the south."}, {"id": 247, "num": 7, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Seven boxes T, N, C, L, E, J and X are kept one over another. J is third from the top. Only three boxes are between C and J. Only one box is between E and C. N is immediately below X. L is not above T. How many boxes are kept between T and N?", "options": ["One / एक", "Three / तीन", "Two / दो", "Four / चार"], "ans": 0, "exp": "Top to bottom: 1-X, 2-N, 3-J, 4-T, 5-E, 6-L, 7-C. (J=3 ⇒ C=7 ⇒ E=5; X-N adjacent ⇒ X=1, N=2; L below T ⇒ T=4, L=6). Between T and N there is only J ⇒ One box."}, {"id": 248, "num": 8, "topic": "Alphabet & Dictionary Order", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Based on the words: HIP, JAG, KEN, IVY. If each letter in each word is replaced by the next letter in the English alphabet, how many words formed will have no vowels?", "options": ["two / दो", "four / चार", "one / एक", "three / तीन"], "ans": 0, "exp": "Shifting each letter by +1: HIP → IJQ (has I), JAG → KBH (no vowel ✓), KEN → LFO (has O), IVY → JWZ (no vowel ✓). Hence two words have no vowels."}, {"id": 249, "num": 9, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Select the set in which the numbers are related in the same way as: (35, 116, 3) and (49, 164, 5). (Operations on whole numbers only.)", "options": ["(39, 182, 21)", "(23, 99, 11)", "(32, 168, 25)", "(11, 42, 4)"], "ans": 0, "exp": "Pattern: 2nd number = 3 × (1st + 3rd) + 2. Check: 3×(35+3)+2 = 116; 3×(49+5)+2 = 164. For (39, 182, 21): 3×(39+21)+2 = 180 + 2 = 182."}, {"id": 250, "num": 10, "topic": "Blood Relations", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "In a certain code language: 'A # B' means A is sister of B; 'A % B' means A is brother of B; 'A ÷ B' means A is wife of B; 'A & B' means A is father of B. If 'A # D % G ÷ K & M', how is A related to M?", "options": ["Maternal Aunt (Mother's sister) / माता की बहन", "Sister / बहन", "Mother / माता", "Maternal Grandmother / माता की माता"], "ans": 0, "exp": "A # D ⇒ A is sister of D; D % G ⇒ D is brother of G; G ÷ K ⇒ G is wife of K; K & M ⇒ K is father of M (so G is M's mother). Since A is sister of G, A is M's Maternal Aunt (mother's sister)."}, {"id": 251, "num": 11, "topic": "Number & Letter Series", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Five three-digit numbers are given: (Left) 959, 873, 355, 567, 314 (Right). What will be the resultant if the second digit of the highest number is added to the third digit of the lowest number?", "options": ["6", "7", "5", "9"], "ans": 3, "exp": "Highest number = 959 ⇒ second digit = 5. Lowest number = 314 ⇒ third digit = 4. Sum = 5 + 4 = 9."}, {"id": 252, "num": 12, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "The position of how many letters will remain unchanged if each of the letters in the word BLUSHING is arranged in alphabetical order?", "options": ["Four / चार", "One / एक", "Two / दो", "Three / तीन"], "ans": 1, "exp": "Original: B L U S H I N G. Alphabetical: B G H I L N S U. Comparing position by position, only B (position 1) remains unchanged ⇒ One."}, {"id": 253, "num": 13, "topic": "Mathematical Operations", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Select the number-pair related in the same way as (17, 52) and (21, 64). (Operations on whole numbers only.)", "options": ["23, 73", "24, 74", "23, 74", "24, 73"], "ans": 3, "exp": "Logic: Second number = (First × 3) + 1. 17×3+1 = 52; 21×3+1 = 64. Similarly, 24×3+1 = 73."}, {"id": 254, "num": 14, "topic": "Venn Diagrams", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": "M13_VENN_Q14", "q": "Select the Venn diagram that best illustrates the relationship between the following classes: Forest (F), Bracelet (B), User (U).", "options": ["Diagram (a) — Three overlapping circles in a chain", "Diagram (b) — Three completely separate circles", "Diagram (c) — Three mutually intersecting circles", "Diagram (d) — U separate, F completely inside B"], "ans": 1, "exp": "Forest, bracelet, and user (a person) are three completely unrelated classes with no overlap, so they are represented by three completely separate circles — Diagram (b)."}, {"id": 255, "num": 15, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "The position(s) of how many letters will remain unchanged if each letter in the word PROBLEM is arranged in alphabetical order?", "options": ["1", "0", "2", "3"], "ans": 1, "exp": "Original: P R O B L E M. Alphabetical: B E L M O P R. No letter matches its original position ⇒ 0."}, {"id": 256, "num": 16, "topic": "Ranking & Order", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Each vowel in the word DRUMSTICK is changed to the third letter following it (+3), and each consonant to the second letter following it (+2) in the English alphabet. Then all resulting letters are arranged alphabetically. Which letter will be third from the right?", "options": ["O", "U", "V", "T"], "ans": 1, "exp": "Vowels (U, I) +3 → X, L; Consonants (D, R, M, S, T, C, K) +2 → F, T, O, U, V, E, M. Resulting letters: F T X O U V L E M. Alphabetical order: E F L M O T U V X. Third from the right is U."}, {"id": 257, "num": 17, "topic": "Direction & Distance", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "Varun starts from Point A and drives 46 km north. He turns right and drives 29 km, turns right and drives 48 km, turns right and drives 31 km. He takes a final right turn, drives 2 km and stops at Point P. How far and in which direction should he drive to reach Point A again?", "options": ["2 km towards east / 2 km, पूर्व की ओर", "4 km towards east / 4 km, पूर्व की ओर", "3 km towards east / 3 km, पूर्व की ओर", "1 km towards east / 1 km, पूर्व की ओर"], "ans": 0, "exp": "Taking A = (0, 0): North 46 → (0, 46); East 29 → (29, 46); South 48 → (29, −2); West 31 → (−2, −2); North 2 → P = (−2, 0). P is 2 km west of A, so he must drive 2 km towards east."}, {"id": 258, "num": 18, "topic": "Seating Arrangement & Puzzles", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "svg": null, "q": "E, M, A, I, L and S live on six floors numbered 1 (bottom) to 6 (top). Only two people live between E and A. Only two people live between M and L. Only one person lives between I and L. I lives on floor 1. E lives above L. How many people live between S and M?", "options": ["Three / तीन", "One / एक", "Two / दो", "Zero / एक भी नहीं"], "ans": 1, "exp": "I = 1 ⇒ L     const DURATION_SEC = 1080; // 18 minutes per mock
    const STORAGE_ANS = "reas13_dsssb_answers_v1";
    const STORAGE_SUB = "reas13_dsssb_submitted_v1";
    const STORAGE_THEME = "reas13_dsssb_theme_v1";

    function safeGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function safeSet(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    let answers = safeGet(STORAGE_ANS, {});
    let submittedMocks = safeGet(STORAGE_SUB, {});
    let activeMockId = 1;
    let quizMode = "instant";
    let activeFilter = "all";

    const timerState = {};
    DATA.mocks.forEach((m) => {
      timerState[m.id] = { remaining: m.durationSec || DURATION_SEC, running: false };
    });
    let tickInterval = null;

    function getActiveMock() {
      return DATA.mocks.find((m) => m.id === activeMockId);
    }

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function isRevealed(mockId, qId) {
      if (quizMode === "instant") return answers[qId] !== undefined;
      return Boolean(submittedMocks[mockId]);
    }

    function computeMockStats(mock) {
      let attempted = 0, correct = 0, wrong = 0;
      const showTruth = quizMode === "instant" || Boolean(submittedMocks[mock.id]);
      mock.questions.forEach((q) => {
        if (answers[q.id] !== undefined) {
          attempted++;
          if (showTruth) {
            if (answers[q.id] === q.ans) correct++;
            else wrong++;
          }
        }
      });
      const marks = showTruth ? (correct * 1 - wrong * 0.25) : 0;
      const acc = showTruth && attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
      return { attempted, correct, wrong, marks, acc, showTruth };
    }

    function computeOverallStats() {
      let done = 0, correct = 0, wrong = 0;
      DATA.mocks.forEach((m) => {
        const showTruth = quizMode === "instant" || Boolean(submittedMocks[m.id]);
        m.questions.forEach((q) => {
          if (answers[q.id] !== undefined) {
            done++;
            if (showTruth) {
              if (answers[q.id] === q.ans) correct++;
              else wrong++;
            }
          }
        });
      });
      return { done, marks: (correct - wrong * 0.25).toFixed(2) };
    }

    function stopInterval() {
      if (tickInterval) {
        clearInterval(tickInterval);
        tickInterval = null;
      }
    }

    function pauseAllTimers() {
      Object.keys(timerState).forEach((k) => { timerState[k].running = false; });
      stopInterval();
    }

    function startTimerForActive() {
      const st = timerState[activeMockId];
      if (st.remaining <= 0) st.remaining = DURATION_SEC;
      pauseAllTimers();
      st.running = true;
      updateTimerUI();
      tickInterval = setInterval(() => {
        const cur = timerState[activeMockId];
        if (!cur.running) { stopInterval(); return; }
        cur.remaining = Math.max(0, cur.remaining - 1);
        updateTimerUI();
        if (cur.remaining === 0) {
          cur.running = false;
          stopInterval();
          onTimeUp();
        }
      }, 1000);
    }

    function toggleTimer() {
      const st = timerState[activeMockId];
      if (st.running) {
        st.running = false;
        stopInterval();
        updateTimerUI();
      } else {
        startTimerForActive();
      }
    }

    function resetTimer() {
      const st = timerState[activeMockId];
      st.running = false;
      st.remaining = DURATION_SEC;
      stopInterval();
      updateTimerUI();
    }

    function updateTimerUI() {
      const st = timerState[activeMockId];
      const formatted = formatTime(st.remaining);
      const heroText = document.getElementById("heroTimerText");
      const miniText = document.getElementById("miniTimerText");
      const miniPill = document.getElementById("miniTimerPill");
      const statusBadge = document.getElementById("timerStatusBadge");
      const toggleBtn = document.getElementById("timerToggleBtn");
      const bar = document.getElementById("timerProgressBar");

      heroText.textContent = formatted;
      miniText.textContent = formatted;
      toggleBtn.textContent = st.running ? "Pause" : (st.remaining < DURATION_SEC && st.remaining > 0 ? "Resume" : "Start");
      statusBadge.textContent = st.remaining === 0 ? "TIME UP" : (st.running ? "LIVE" : (st.remaining < DURATION_SEC ? "PAUSED" : "READY"));

      const pct = Math.max(0, (st.remaining / DURATION_SEC) * 100);
      bar.style.width = `${pct}%`;

      miniPill.classList.remove("timer-urgent", "bg-rose-100", "dark:bg-rose-950/60", "text-rose-700", "dark:text-rose-300", "border-rose-300", "bg-amber-100", "dark:bg-amber-950/60", "text-amber-700", "dark:text-amber-300", "border-amber-300");
      bar.classList.remove("bg-emerald-300", "bg-amber-300", "bg-rose-400");

      if (st.remaining <= 90) {
        bar.classList.add("bg-rose-400");
        miniPill.classList.add("bg-rose-100", "dark:bg-rose-950/60", "text-rose-700", "dark:text-rose-300", "border-rose-300");
        if (st.running) miniPill.classList.add("timer-urgent");
      } else if (st.remaining <= 180) {
        bar.classList.add("bg-amber-300");
        miniPill.classList.add("bg-amber-100", "dark:bg-amber-950/60", "text-amber-700", "dark:text-amber-300", "border-amber-300");
      } else {
        bar.classList.add("bg-emerald-300");
      }
    }

    function openModal(title, bodyHtml, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      buttons.forEach((b) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = b.label;
        btn.className = b.cls;
        btn.addEventListener("click", () => {
          closeModal();
          if (b.onClick) b.onClick();
        });
        actions.appendChild(btn);
      });
      document.getElementById("modalBackdrop").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.add("hidden");
    }

    function showScorecardModal(titlePrefix) {
      const mock = getActiveMock();
      submittedMocks[mock.id] = true;
      safeSet(STORAGE_SUB, submittedMocks);
      const st = computeMockStats(mock);
      renderAll();
      openModal(
        `${titlePrefix} — ${mock.code} Scorecard`,
        `
          <div class="grid grid-cols-2 gap-2.5 text-center">
            <div class="rounded-xl bg-purple-50 dark:bg-purple-500/15 p-3">
              <div class="text-xl font-black text-purple-700 dark:text-purple-300">${st.marks.toFixed(2)} / 20</div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">NET MARKS</div>
            </div>
            <div class="rounded-xl bg-emerald-50 dark:bg-emerald-500/15 p-3">
              <div class="text-xl font-black text-emerald-700 dark:text-emerald-300">${st.acc}%</div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">ACCURACY</div>
            </div>
            <div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-2.5 text-xs font-bold">Correct: <span class="text-emerald-600 dark:text-emerald-400">${st.correct}</span></div>
            <div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-2.5 text-xs font-bold">Wrong: <span class="text-rose-600 dark:text-rose-400">${st.wrong}</span> &bull; Left: ${20 - st.attempted}</div>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400">All answers and explanations for ${escapeHtml(mock.code)} are now unlocked below. Use <strong>Wrong Only</strong> to revise mistakes.</p>
        `,
        [
          {
            label: "Review Wrong Only",
            cls: "px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer",
            onClick: () => { activeFilter = "wrong"; renderAll(); }
          },
          {
            label: "View All Solutions",
            cls: "px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold cursor-pointer"
          }
        ]
      );
    }

    function onTimeUp() {
      showScorecardModal("⏱ 18:00 Time's Up!");
    }

    function renderMockTabs() {
      const wrap = document.getElementById("mockTabs");
      wrap.innerHTML = DATA.mocks.map((m) => {
        const active = m.id === activeMockId;
        const done = m.questions.filter((q) => answers[q.id] !== undefined).length;
        const cls = active
          ? "bg-purple-600 text-white border-purple-600 shadow-xs"
          : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-800 hover:border-purple-300 dark:hover:border-purple-700";
        const pillCls = active
          ? "bg-white/20 text-white"
          : "bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400";
        return `
          <button type="button" data-mock-id="${m.id}"
            class="mock-tab shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-bold transition cursor-pointer ${cls}">
            <span>${escapeHtml(m.code)}</span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full tabular-nums ${pillCls}">${done}/20</span>
          </button>
        `;
      }).join("");
    }

    function renderHeroAndStats() {
      const mock = getActiveMock();
      const st = computeMockStats(mock);
      const ov = computeOverallStats();

      document.getElementById("heroBadge").textContent = `${mock.badge} · ${mock.subtitle}`;
      document.getElementById("heroTitle").textContent = `${mock.title} — General Intelligence & Reasoning`;
      document.getElementById("heroSub").textContent =
        mock.id <= 4
          ? "Every question carries its exact DSSSB exam & shift PYQ tag. Start the 18-minute timer or tap an option to begin."
          : "Curated DSSSB TGT CS Reasoning practice set with source exam tag and 18-minute CBT countdown timer.";

      document.getElementById("statAttempted").textContent = `${st.attempted}/20`;
      document.getElementById("statMarks").textContent = st.showTruth ? st.marks.toFixed(2) : "—";
      document.getElementById("statAccuracy").textContent = st.showTruth ? `${st.acc}%` : "—";
      document.getElementById("overallScorePill").textContent = `${ov.done}/260 Done • ${ov.marks} Marks`;

      const instBtn = document.getElementById("modeInstantBtn");
      const examBtn = document.getElementById("modeExamBtn");
      const subBtn = document.getElementById("submitExamBtn");

      if (quizMode === "instant") {
        instBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-purple-600 text-white cursor-pointer";
        examBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer";
        subBtn.classList.add("hidden");
      } else {
        examBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-purple-600 text-white cursor-pointer";
        instBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer";
        if (!submittedMocks[mock.id]) subBtn.classList.remove("hidden");
        else subBtn.classList.add("hidden");
      }

      document.querySelectorAll("#filterGroup .flt-btn").forEach((btn) => {
        const active = btn.dataset.filter === activeFilter;
        btn.className = active
          ? "flt-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-purple-50 dark:bg-purple-500/20 text-purple-700 dark:text-purple-300 cursor-pointer"
          : "flt-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer";
      });

      document.getElementById("prevMockBtn").disabled = activeMockId <= 1;
      document.getElementById("nextMockBtn").disabled = activeMockId >= DATA.mocks.length;
      updateTimerUI();
    }

    function renderPalette() {
      const mock = getActiveMock();
      const wrap = document.getElementById("questionPalette");
      const showTruth = quizMode === "instant" || Boolean(submittedMocks[mock.id]);
      wrap.innerHTML = mock.questions.map((q) => {
        const picked = answers[q.id];
        let cls = "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700";
        if (picked !== undefined) {
          if (!showTruth) cls = "bg-purple-600 text-white border-purple-600";
          else if (picked === q.ans) cls = "bg-emerald-600 text-white border-emerald-600";
          else cls = "bg-rose-600 text-white border-rose-600";
        }
        return `
          <button type="button" data-jump="qcard-${q.id}"
            class="pal-btn h-7 rounded-lg border text-[11px] font-bold tabular-nums hover:opacity-85 cursor-pointer ${cls}">
            ${q.num}
          </button>
        `;
      }).join("");
    }

    function renderQuestions() {
      const mock = getActiveMock();
      const list = document.getElementById("questionsList");
      const showTruthGlobal = quizMode === "instant" || Boolean(submittedMocks[mock.id]);

      const filtered = mock.questions.filter((q) => {
        const picked = answers[q.id];
        if (activeFilter === "unanswered") return picked === undefined;
        if (activeFilter === "wrong") {
          return showTruthGlobal && picked !== undefined && picked !== q.ans;
        }
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 text-center space-y-2">
            <p class="text-sm font-bold text-slate-700 dark:text-slate-200">No questions match the current filter.</p>
            <button type="button" id="clearFilterBtn" class="px-3.5 py-1.5 rounded-xl bg-purple-600 text-white text-xs font-bold cursor-pointer">Show All 20 Questions</button>
          </div>
        `;
        const cf = document.getElementById("clearFilterBtn");
        if (cf) cf.addEventListener("click", () => { activeFilter = "all"; renderAll(); });
        return;
      }

      const letters = ["A", "B", "C", "D"];
      list.innerHTML = filtered.map((q) => {
        const picked = answers[q.id];
        const revealed = isRevealed(mock.id, q.id);
        const tagCls = q.isShift
          ? "text-amber-800 dark:text-amber-300 bg-amber-100 dark:bg-amber-900/40 border-amber-200 dark:border-amber-800"
          : "text-sky-800 dark:text-sky-300 bg-sky-100 dark:bg-sky-900/40 border-sky-200 dark:border-sky-800";

        const visHtml = q.svg && DATA.visuals[q.svg] ? DATA.visuals[q.svg] : "";

        const optsHtml = q.options.map((opt, idx) => {
          let btnCls = "border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40 hover:border-purple-400 dark:hover:border-purple-500 text-slate-800 dark:text-slate-100";
          let badgeCls = "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700";
          let mark = "";

          if (revealed) {
            if (idx === q.ans) {
              btnCls = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200";
              badgeCls = "bg-emerald-600 text-white border-emerald-600";
              mark = '<span class="ml-auto text-xs font-extrabold text-emerald-600 dark:text-emerald-400">✓ Correct</span>';
            } else if (picked === idx) {
              btnCls = "border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-900 dark:text-rose-200";
              badgeCls = "bg-rose-600 text-white border-rose-600";
              mark = '<span class="ml-auto text-xs font-extrabold text-rose-600 dark:text-rose-400">✗ Your Pick</span>';
            } else {
              btnCls = "border-slate-200/70 dark:border-slate-800/70 bg-white dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 opacity-75";
            }
          } else if (picked === idx) {
            btnCls = "border-purple-600 bg-purple-50 dark:bg-purple-950/50 text-purple-900 dark:text-purple-200";
            badgeCls = "bg-purple-600 text-white border-purple-600";
            mark = '<span class="ml-auto text-xs font-bold text-purple-600 dark:text-purple-400">Selected</span>';
          }

          return `
            <button type="button" data-qid="${q.id}" data-opt="${idx}"
              class="opt-btn w-full text-left flex items-center gap-3 p-3 rounded-xl border text-xs sm:text-sm font-medium transition cursor-pointer ${btnCls}">
              <span class="w-6 h-6 rounded-lg border text-xs font-extrabold flex items-center justify-center shrink-0 ${badgeCls}">${letters[idx]}</span>
              <span class="flex-1 leading-snug">${escapeHtml(opt)}</span>
              ${mark}
            </button>
          `;
        }).join("");

        const expHtml = revealed && q.exp ? `
          <div class="mt-3 rounded-xl bg-purple-50/80 dark:bg-purple-950/40 border border-purple-200/80 dark:border-purple-800/60 p-3.5 text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
            <span class="font-extrabold text-purple-700 dark:text-purple-300">Logic / Solution: </span>${escapeHtml(q.exp)}
          </div>
        ` : "";

        return `
          <article id="qcard-${q.id}" class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5 shadow-xs scroll-mt-32">
            <div class="flex flex-wrap items-center gap-2 mb-2.5">
              <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-purple-600 text-white">Q${q.num}</span>
              <span class="text-[11px] font-bold text-slate-500 dark:text-slate-400">${escapeHtml(q.topic)}</span>
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${tagCls}">${q.isShift ? "🏛 " : "📘 "}${escapeHtml(q.exam)}</span>
            </div>
            <p class="text-sm sm:text-base font-semibold text-slate-900 dark:text-white leading-relaxed whitespace-pre-line mb-3">${escapeHtml(q.q)}</p>
            ${visHtml}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-3">
              ${optsHtml}
            </div>
            ${expHtml}
          </article>
        `;
      }).join("");
    }

    function renderAll() {
      renderMockTabs();
      renderHeroAndStats();
      renderPalette();
      renderQuestions();
    }

    document.getElementById("mockTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".mock-tab");
      if (!btn) return;
      const nextId = Number(btn.dataset.mockId);
      if (nextId === activeMockId) return;
      pauseAllTimers();
      activeMockId = nextId;
      activeFilter = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("questionsList").addEventListener("click", (e) => {
      const btn = e.target.closest(".opt-btn");
      if (!btn) return;
      const qId = Number(btn.dataset.qid);
      const optIdx = Number(btn.dataset.opt);
      const mock = getActiveMock();

      const st = timerState[activeMockId];
      if (!st.running && st.remaining === DURATION_SEC) {
        startTimerForActive();
      }

      if (quizMode === "instant") {
        if (answers[qId] !== undefined) return;
        answers[qId] = optIdx;
      } else {
        if (submittedMocks[mock.id]) return;
        answers[qId] = optIdx;
      }
      safeSet(STORAGE_ANS, answers);
      renderAll();
    });

    document.getElementById("questionPalette").addEventListener("click", (e) => {
      const btn = e.target.closest(".pal-btn");
      if (!btn) return;
      const target = document.getElementById(btn.dataset.jump);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      } else {
        activeFilter = "all";
        renderAll();
        setTimeout(() => {
          const el = document.getElementById(btn.dataset.jump);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 50);
      }
    });

    document.getElementById("filterGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".flt-btn");
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      renderAll();
    });

    document.getElementById("modeInstantBtn").addEventListener("click", () => {
      quizMode = "instant";
      renderAll();
    });

    document.getElementById("modeExamBtn").addEventListener("click", () => {
      quizMode = "exam";
      renderAll();
    });

    document.getElementById("submitExamBtn").addEventListener("click", () => {
      pauseAllTimers();
      showScorecardModal("Mock Submitted");
    });

    document.getElementById("timerToggleBtn").addEventListener("click", toggleTimer);
    document.getElementById("timerResetBtn").addEventListener("click", resetTimer);

    document.getElementById("resetMockBtn").addEventListener("click", () => {
      const mock = getActiveMock();
      openModal(
        `Reset ${mock.code}?`,
        `<p>This will clear all saved answers and reset the 18-minute timer for <strong>${escapeHtml(mock.code)}</strong>.</p>`,
        [
          {
            label: "Cancel",
            cls: "px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer"
          },
          {
            label: "Reset Mock",
            cls: "px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold cursor-pointer",
            onClick: () => {
              mock.questions.forEach((q) => { delete answers[q.id]; });
              delete submittedMocks[mock.id];
              safeSet(STORAGE_ANS, answers);
              safeSet(STORAGE_SUB, submittedMocks);
              resetTimer();
              activeFilter = "all";
              renderAll();
            }
          }
        ]
      );
    });

    document.getElementById("prevMockBtn").addEventListener("click", () => {
      if (activeMockId > 1) {
        pauseAllTimers();
        activeMockId--;
        activeFilter = "all";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("nextMockBtn").addEventListener("click", () => {
      if (activeMockId < DATA.mocks.length) {
        pauseAllTimers();
        activeMockId++;
        activeFilter = "all";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("modalCloseX").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.classList.toggle("dark", isDark);
      document.getElementById("themeIcon").textContent = isDark ? "☀️" : "🌙";
    }
    const savedTheme = safeGet(STORAGE_THEME, "light");
    applyTheme(savedTheme);
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
      safeSet(STORAGE_THEME, next);
      applyTheme(next);
    });

    renderAll();
  </script>
</body>
</html>
