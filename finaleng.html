", "pragmatic"], "ans": 2, "exp": "Lucrative = highly profitable; its antonym is unprofitable."}, {"id": 8, "num": 8, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Choose the one-word substitution for: 'To return to the country of origin'", "options": ["rehabilitate", "repatriate", "migration", "emigration"], "ans": 1, "exp": "Repatriate = to send or bring someone back to their own country."}, {"id": 9, "num": 9, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Choose the correct idiom to substitute the underlined section:\nEven after repeated warnings, the student continued to BEHAVE IN A FOOLISH AND RECKLESS MANNER.", "options": ["jump on the bandwagon", "burn the midnight oil", "throw caution to the wind", "play it safe"], "ans": 2, "exp": "'Throw caution to the wind' means to act recklessly without worrying about risks."}, {"id": 10, "num": 10, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Replace the segment in quotes with an appropriate proverb:\nWhen the young lawyer argued endlessly over trivial details, the judge reminded him that 'minor issues should not obscure the main matter.'", "options": ["Don't miss the wood for the trees", "The proof of the pudding is in the eating", "Don't make a mountain out of a molehill", "First things first"], "ans": 0, "exp": "'Don't miss the wood for the trees' means do not let minor details obscure the overall big picture."}, {"id": 11, "num": 11, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Identify the incorrectly spelt word in the passage: '...families, colleagues, and classmates... decorated to comemmorate the achievement... accomplishment... occasion...'", "options": ["Colleagues", "Comemmorate", "Accomplishment 1:00 PM", "isShift": true, "passage": null, "q": "Rearrange the segments:\nA/ while the rain poured down heavily, B/ ran towards the shelter, C/ the soaked children, D/ trying to avoid the puddles, E/ with laughter and shouts.", "options": ["A E B C D", "D A C B E", "C B D E A", "B C E D A"], "ans": 2, "exp": "C (subject) → B (verb) → D (participle) → E (manner) → A (time clause) → C B D E A."}, {"id": 20, "num": 20, "topic": "Sentence Rearrangement", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "First segment is fixed. Rearrange A–E:\n1) A terrible groaning was heard\nA) in the way that had alarmed them so\nB) Thor went out and found lying\nC) near him a huge giant,\nD) who slept and snored\nE) during the night, and at dawn of day,", "options": ["BADCE", "CDBAE", "DCBAE", "EBCDA"], "ans": 3, "exp": "(1) A terrible groaning was heard (E) during the night, and at dawn of day, (B) Thor went out and found lying (C) near him a huge giant, (D) who slept and snored (A) in the way that had alarmed them so → EBCDA."}]}, {"id": 2, "code": "Mock 02", "title": "English Mock 02", "subtitle": "DSSSB PYQ Shifts · Set 2", "badge": "PYQ Shifts", "durationSec": 600, "questions": [{"id": 21, "num": 1, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M2_ENG_RC_18", "q": "Which of the following is true based on the passage?", "options": ["Caribbean box jellyfish stings cause death.", "Scientists unanimously agree on jellyfish treatment.", "Porins may rupture cells and release potassium.", "All box jellyfish stings cause Irukandji syndrome."], "ans": 2, "exp": "The passage notes scientists found 'porins, that rip cells open, which releases enough potassium to cause heart failure.'"}, {"id": 22, "num": 2, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M2_ENG_RC_18", "q": "What is the tone of the passage?", "options": ["Analytical and informative", "Humorous and casual", "Emotional and fearful", "Persuasive and opinionated"], "ans": 0, "exp": "The passage objectively presents scientific facts and research perspectives → analytical and informative."}, {"id": 23, "num": 3, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M2_ENG_RC_18", "q": "What is the best title for the passage?", "options": ["Swimming with Jellyfish: A Mysterious Underwater Adventure", "How to Capture and breed a Jellyfish Safely", "Jellyfish Migration Patterns in the Pacific", "Understanding the Potent and Mysterious Venom of Box Jellyfish"], "ans": 3, "exp": "The passage centers on the potency, effects, and unresolved science of box jellyfish venom."}, {"id": 24, "num": 4, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M2_ENG_RC_18", "q": "What can be inferred about the severity of a box jellyfish sting?", "options": ["Box jellyfish stings only affect the skin's surface.", "Severity depends on toxin strength and amount of skin exposed.", "All jellyfish stings are fatal.", "Severity is determined solely by species and its composition."], "ans": 1, "exp": "Severity varies by species' toxin strength (Australian vs Caribbean) and how much skin contacts the tentacles."}, {"id": 25, "num": 5, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M2_ENG_RC_18", "q": "What is the central idea of the passage?", "options": ["Differences between Atlantic and Pacific jellyfish", "The composition and varied effects of box jellyfish venom", "Why jellyfish avoid human contact", "How jellyfish reproduce in different climates and geographical area"], "ans": 1, "exp": "The passage focuses on box jellyfish venom's protein composition and its varied physiological effects."}, {"id": 26, "num": 6, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Choose the correct synonym of the underlined word:\nThe INTREPID boy stepped into the burning building to save the people trapped within.", "options": ["Prudent", "Timorous", "Dauntless", "Apathetic"], "ans": 2, "exp": "Intrepid = fearless / Dauntless."}, {"id": 27, "num": 7, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Select the antonym for the highlighted word:\nHer PRAGMATIC approach to solving problems impressed the committee.", "options": ["analytical", "idealistic", "cautious", "efficient"], "ans": 1, "exp": "Pragmatic (practical, realistic) ↔ idealistic."}, {"id": 28, "num": 8, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Substitute the underlined segment:\nA system with complete control over the state is called RULE BY ONE PERSON WITH ABSOLUTE POWER.", "options": ["capitalism", "dictatorship", "federalism", "democracy"], "ans": 1, "exp": "Rule by one person with absolute power = dictatorship."}, {"id": 29, "num": 9, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "One-word substitute for: 'A person who believes that pleasure is the chief good and aim of life'", "options": ["Altruist", "Hedonist", "Pessimist", "Stoic"], "ans": 1, "exp": "Hedonist = one who pursues pleasure as the highest good."}, {"id": 30, "num": 10, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Choose the meaning of the idiom: 'Break a leg'", "options": ["To physically injure oneself", "To criticize harshly", "To wish someone good luck", "To start performing poorly"], "ans": 2, "exp": "'Break a leg' is a theatrical idiom meaning 'good luck'."}, {"id": 31, "num": 11, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Select the correctly spelt word to rectify 'antideluvian':", "options": ["Antidelvian", "Antediluvian", "Antedeluvean", "Antideluvion"], "ans": 1, "exp": "Antediluvian = ante (before) + diluvian (the Flood)."}, {"id": 32, "num": 12, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Convert to future perfect tense: 'They had left before sunset.'", "options": ["They will have left before sunset.", "They will be leaving before sunset.", "They will have been leaving before sunset.", "They will leave before sunset."], "ans": 0, "exp": "Future Perfect = will have + V₃ → 'They will have left before sunset.'"}, {"id": 33, "num": 13, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "The traveller mentioned that he had been waiting for hours because the announcement had stated that the train ______.", "options": ["is delayed due to technical faults", "was delayed due to technical faults", "has been delayed due to technical faults", "will be delayed due to technical faults"], "ans": 1, "exp": "Past reporting clause ('had stated') requires past tense in the subordinate clause: 'was delayed'."}, {"id": 34, "num": 14, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 16 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "He is a(n) ______ who believes that God does not exist.", "options": ["mystic", "atheist", "theist", "agnostic"], "ans": 1, "exp": "An atheist believes God does not exist."}, {"id": 35, "num": 15, "topic": "Error Detection", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Rectify the error: 'They told us that we could join them if we wanted, but we had to bring my own supplies.'", "options": ["we could join us", "They told you that", "but I had to bring", "our own supplies."], "ans": 3, "exp": "Subject 'we' requires possessive 'our own supplies', not 'my own supplies'."}, {"id": 36, "num": 16, "topic": "Error Detection", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Rectify the error: 'She writes the report and submitted it to the manager last night.'", "options": ["She has written the report and submit it to the manager last night.", "She had wrote the report and submitted it to the manager last night.", "She writing the report and submitted it to the manager last night.", "She wrote the report and submitted it to the manager last night."], "ans": 3, "exp": "'last night' requires consistent simple past tense: 'wrote' and 'submitted'."}, {"id": 37, "num": 17, "topic": "Sentence Improvement", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Correct the sentence: 'This was an unique presentation on the harsh realities of rural life.'", "options": ["This was an unique presentation on the harsh realities of a rural life.", "This was the unique presentation on a harsh realities of rural life.", "This was a unique presentation on the harsh realities of rural life.", "This was unique presentation on the harsh realities of rural life."], "ans": 2, "exp": "'unique' starts with the consonant sound /j/ ('yoo'), so it takes 'a unique'."}, {"id": 38, "num": 18, "topic": "Sentence Rearrangement", "exam": "DSSSB IT Assistant Grade A · 18 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "First segment fixed. Rearrange A–D:\nAlthough the results were promising,\nA. to be conducted independently\nB. the committee demanded\nC. before approving the treatment\nD. more clinical trials", "options": ["B – D – A – C", "B – C – A – D", "A – B – C – D", "B – C – D – A"], "ans": 0, "exp": "the committee demanded (B) more clinical trials (D) to be conducted independently (A) before approving the treatment (C) → B–D–A–C."}, {"id": 39, "num": 19, "topic": "Sentence Rearrangement", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "S1 fixed: The rapid expansion of online education\nP: for students who previously lacked access\nQ: has created new opportunities\nR: to specialised courses and expert instructors\nS: located in distant academic institutions", "options": ["PSQR", "QPRS", "SQRP", "RPSQ"], "ans": 1, "exp": "S1 → Q (verb) → P (for students...) → R (access to courses...) → S (located in...) → QPRS."}, {"id": 40, "num": 20, "topic": "Active & Passive Voice", "exam": "DSSSB IT Assistant Grade A · 18 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Choose the passive form: 'The committee is going to announce the results at the end of the meeting.'", "options": ["The results are going to be announced by the committee at the end of the meeting.", "The results were going to be announced by the committee at the end of the meeting.", "The results will be announced by the committee at the end of the meeting.", "The results are being announced by the committee at the end of the meeting."], "ans": 0, "exp": "`is/am/are going to + V₁` becomes `is/am/are going to be + V₃` in passive voice."}]}, {"id": 3, "code": "Mock 03", "title": "English Mock 03", "subtitle": "DSSSB PYQ Shifts · Set 3", "badge": "PYQ Shifts", "durationSec": 600, "questions": [{"id": 41, "num": 1, "topic": "Cloze Test", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "passage": "M3_ENG_CLOZE_19", "q": "Select the most appropriate option to fill in blank 1.", "options": ["sporadic", "provisional", "ubiquitous", "negligent"], "ans": 2, "exp": "Found throughout all marine environments = ubiquitous."}, {"id": 42, "num": 2, "topic": "Cloze Test", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "passage": "M3_ENG_CLOZE_19", "q": "Select the most appropriate option to fill in blank 2.", "options": ["promotion", "abnormality", "significance", "discrepancy"], "ans": 2, "exp": "'The ecological significance of such exposure' = importance/impact."}, {"id": 43, "num": 3, "topic": "Cloze Test", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "passage": "M3_ENG_CLOZE_19", "q": "Select the most appropriate option to fill in blank 3.", "options": ["controlled", "interrupted", "disputed", "reported"], "ans": 3, "exp": "'Researchers have reported that some particles can transport chemical pollutants...'"}, {"id": 44, "num": 4, "topic": "Cloze Test", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "passage": "M3_ENG_CLOZE_19", "q": "Select the most appropriate option to fill in blank 4.", "options": ["difficult", "soluble", "temporary", "conspicuous"], "ans": 0, "exp": "Microplastics are extremely 'difficult' to remove once dispersed."}, {"id": 45, "num": 5, "topic": "Cloze Test", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "passage": "M3_ENG_CLOZE_19", "q": "Select the most appropriate option to fill in blank 5.", "options": ["throughout", "beneath", "upon", "for"], "ans": 3, "exp": "The adjective 'essential' takes the preposition 'for' ('essential for protecting')."}, {"id": 46, "num": 6, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Choose the synonym for the highlighted word:\nHer remarks were CAUSTIC, leaving the audience silent.", "options": ["bitter", "tedious", "ambiguous", "euphoric"], "ans": 0, "exp": "Caustic = biting, sharply critical, bitter."}, {"id": 47, "num": 7, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Identify the antonym of the bold word:\nThe modern monastery was built with intentional SUPERFLUITY, featuring bare stone walls and minimal decoration.", "options": ["extremity", "excessive", "insobriety", "austerity"], "ans": 3, "exp": "Superfluity (excess) ↔ austerity (plainness, simplicity)."}, {"id": 48, "num": 8, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Substitute the underlined segment:\nThe PR team orchestrated the hiring of A GROUP OF PEOPLE TO APPLAUD in the audience.", "options": ["fugitive", "caucus", "claque", "clique"], "ans": 2, "exp": "A group of people hired to applaud = claque."}, {"id": 49, "num": 9, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Substitute with the most appropriate proverb:\nMr. Rajat funded the project; HE SHOULD DECIDE HOW IT PROCEEDS.", "options": ["he that would have eggs must endure the cackling of hens", "beggars cannot be choosers", "he who pays the piper calls the tune", "every cloud has a silver lining"], "ans": 2, "exp": "'He who pays the piper calls the tune' = the funder has the right to decide."}, {"id": 50, "num": 10, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Replace the underlined segment with the most appropriate proverb:\n...showing that SOMEONE WHO HAS ONCE BEEN HARMED TENDS TO FEAR A SIMILAR RISK AGAIN.", "options": ["a burnt child dreads fire", "once bitten, twice shy", "forewarned is forearmed", "look before you leap"], "ans": 1, "exp": "'Once bitten, twice shy' expresses heightened caution after a bad experience."}, {"id": 51, "num": 11, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Select the correct spelling to rectify 'recepient':", "options": ["Recipient", "Racipient", "Recipeint", "Recipiant"], "ans": 0, "exp": "Correct spelling: Recipient."}, {"id": 52, "num": 12, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Choose the correct future perfect continuous conversion of: 'I read this book.'", "options": ["I will have been reading this book.", "I will read this book.", "I will have read this book.", "I will be reading this book."], "ans": 0, "exp": "Future Perfect Continuous = will have been + V-ing."}, {"id": 53, "num": 13, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Convert into simple present tense: 'The train will depart from the station at 6 p.m.'", "options": ["The train has departed from the station at 6 p.m.", "The train is departing from the station at 6 p.m.", "The train depart from the station at 6 p.m.", "The train departs from the station at 6 p.m."], "ans": 3, "exp": "3rd person singular simple present = 'The train departs...'."}, {"id": 54, "num": 14, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Choose the antonym of 'capricious' to complete the sentence:\n'What the industry needs right now is a far more ________ administrative approach that provides long-term stability.'", "options": ["meticulous", "lenient", "consistent", "stringent"], "ans": 2, "exp": "Capricious (unpredictable, erratic) ↔ consistent."}, {"id": 55, "num": 15, "topic": "Error Detection", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Correct the highlighted part:\nHe was a person CAPABLE IN MANAGING large, diverse teams effectively.", "options": ["capable for managing", "capable about managing", "capable of managing", "capable to managing"], "ans": 2, "exp": "'Capable' always takes 'of' + gerund → 'capable of managing'."}, {"id": 56, "num": 16, "topic": "Error Detection", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Correct the adjective in: 'Keats and Byron are romantic poets, but my professor prefers the later.'", "options": ["last", "older", "elder", "latter"], "ans": 3, "exp": "The second of two mentioned items is 'the latter' ('later' refers to time)."}, {"id": 57, "num": 17, "topic": "Sentence Improvement", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Replace the underlined interjection:\nWOW, the experiment has failed again despite multiple revisions.", "options": ["Alas", "Yikes", "Eh", "Hurray"], "ans": 0, "exp": "'Alas' expresses sorrow or regret."}, {"id": 58, "num": 18, "topic": "Sentence Rearrangement", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Part A is fixed. Arrange B, C, D, E:\nThe volunteers carefully checked every donation (A) / before placing it on the display shelves (B) / to ensure that each item was clean (C) / and suitable for younger readers (D) / which had arrived from local families (E)", "options": ["B-C-D-E", "E-C-B-D", "E-C-D-B", "E-D-C-B"], "ans": 2, "exp": "A → E (which had arrived...) → C (to ensure... clean) → D (and suitable...) → B (before placing...) → E-C-D-B."}, {"id": 59, "num": 19, "topic": "Sentence Rearrangement", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Rearrange P, Q, R, S:\nP. once comprehensive sales data became available\nQ. that reshaped investment strategies across the sector\nR. was eventually recognised as a structural shift in consumer demand\nS. what appeared to be a short-term market correction", "options": ["SRQP", "SPQR", "SQPR", "QRPS"], "ans": 0, "exp": "S (subject clause) → R (verb) → Q (relative clause) → P (time clause) → SRQP."}, {"id": 60, "num": 20, "topic": "Direct & Indirect Speech", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Direct: Arjun said, \"I am happy today.\"\nIndirect: Arjun said that ...............", "options": ["he has been happy that day.", "he is happy that day.", "he was happy today.", "he was happy that day."], "ans": 3, "exp": "Past reporting verb shifts `I → he`, `am → was`, `today → that day`."}]}, {"id": 4, "code": "Mock 04", "title": "English Mock 04", "subtitle": "DSSSB PYQ Shifts · Set 4", "badge": "PYQ Shifts", "durationSec": 600, "questions": [{"id": 61, "num": 1, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M4_ENG_RC_20", "q": "Select an appropriate title for the passage.", "options": ["Climate Change and the Future of Wetland Habitats", "Wetlands as Tourist Attractions in Different Countries", "Wetlands of Jammu and Kashmir: Biodiversity and Value", "The Global Threats to Wetland Ecosystems Worldwide"], "ans": 2, "exp": "The passage outlines the general value of wetlands and focuses specifically on Jammu & Kashmir’s 21 wetlands, their biodiversity, and socio-economic value."}, {"id": 62, "num": 2, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M4_ENG_RC_20", "q": "Identify the central theme of the passage.", "options": ["The ecological and socio-economic importance of wetlands in Jammu and Kashmir.", "The development of national parks and sanctuaries across India.", "The role of migratory birds in maintaining wetland ecosystems globally.", "The threats of human activities on the wetlands of South Asia."], "ans": 0, "exp": "The passage highlights the “socio-economic, ecological and bio-aesthetic importance” of wetlands and details J&K’s wetlands."}, {"id": 63, "num": 3, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M4_ENG_RC_20", "q": "Identify the tone of the passage.", "options": ["Descriptive and informative about the value of wetlands.", "Persuasive and argumentative against wetland destruction.", "Critical and analytical of the tourism policies in wetlands.", "Narrative and personal about visiting wetland sanctuaries."], "ans": 0, "exp": "It presents objective facts (21 wetlands, migratory birds, “biological supermarkets”) without arguing or criticising → descriptive and informative."}, {"id": 64, "num": 4, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M4_ENG_RC_20", "q": "Choose the antonym of the word ‘immense’.", "options": ["fragile", "colossal", "vast", "minuscule"], "ans": 3, "exp": "Immense = very large; its antonym is minuscule (extremely small). Colossal and vast are synonyms."}, {"id": 65, "num": 5, "topic": "Reading Comprehension", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": "M4_ENG_RC_20", "q": "Identify the structure of the passage.", "options": ["Narrative", "Comparative", "Chronological", "Descriptive"], "ans": 3, "exp": "The passage describes features and factual attributes of wetlands with no story, timeline, or comparison → Descriptive."}, {"id": 66, "num": 6, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 05 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Choose the most appropriate synonym of the highlighted word:\nThe mountain peak remained *inscrutable*, hidden behind layers of mist that revealed nothing of its form.", "options": ["enigmatic", "overt", "florid", "blatant"], "ans": 0, "exp": "Inscrutable = impossible to understand or interpret → enigmatic (mysterious). Overt and blatant mean obvious."}, {"id": 67, "num": 7, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Identify the antonym of the highlighted word:\nAfter reading the letter, she sat by the window in a *pensive* mood, lost in her own thoughts.", "options": ["arrogant", "indifferent", "melancholy", "frivolous"], "ans": 3, "exp": "Pensive = deeply thoughtful and serious → antonym is frivolous (light-hearted, not serious). Melancholy is close in mood, not opposite."}, {"id": 68, "num": 8, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 18 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Select the option which means the same as the group of words given:\nThe state of being quiet and peaceful.", "options": ["Tranquillity", "Freedom", "Kindness", "Honesty"], "ans": 0, "exp": "Tranquillity denotes a calm, quiet, and peaceful state."}, {"id": 69, "num": 9, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Choose the correct meaning of the proverb: “Don’t put too many irons in the fire.”", "options": ["Avoid taking on too many tasks at once", "Keep your tools hot and ready", "Try many things at the same time for better results", "It's better to stay close to a fire in winter"], "ans": 0, "exp": "Having too many irons in the fire means trying to do too many things simultaneously; the proverb warns against overcommitting."}, {"id": 70, "num": 10, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Select the option which provides the correct meaning of the given proverb: “A stitch in time saves nine”", "options": ["Work slowly and steadily", "Sewing skills are valuable", "Timely action prevents bigger problems", "Practice makes perfect"], "ans": 2, "exp": "Fixing a small problem early prevents it from becoming much larger later."}, {"id": 71, "num": 11, "topic": "Vocabulary", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Select the wrongly spelt word.", "options": ["Privilege", "Millennium", "Commitment", "Embarassment"], "ans": 3, "exp": "The correct spelling is Embarrassment (double ‘r’ and double ‘s’). Privilege, Millennium, and Commitment are correctly spelt."}, {"id": 72, "num": 12, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 06 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Convert into the future perfect continuous tense:\n“The researcher has been studying the effects of climate change for three years.”", "options": ["The researcher will have been studying the effects of climate change for three years.", "The researcher will be studying the effects of climate change for three years.", "The researcher will have been studied the effects of climate change for three years.", "The researcher will have studied the effects of climate change for three years."], "ans": 0, "exp": "Future Perfect Continuous structure is: will have been + V-ing (+ for/since)."}, {"id": 73, "num": 13, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 11 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Choose the sentence which is correctly written in Present Tense.", "options": ["The train leaves the station at 6 p.m. daily.", "The train had left the station before I reached.", "The train left the station at 6 p.m. yesterday.", "The train will leave the station at 6 p.m. tomorrow."], "ans": 0, "exp": "Simple Present (“leaves”) expresses habitual actions and fixed timetables."}, {"id": 74, "num": 14, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 07 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Complete the sentence by choosing the correct synonym of the highlighted word:\nDespite the setbacks, her ______ attitude inspired everyone around her to remain *hopeful*.", "options": ["optimistic", "indifferent", "doubtful", "reserved"], "ans": 0, "exp": "Optimistic is the direct synonym of hopeful and fits the positive context."}, {"id": 75, "num": 15, "topic": "Fill in the Blanks", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "A person who studies ancient artifacts and cultures is called a(n) _________.", "options": ["paleontologist", "archaeologist", "anthropologist", "historian"], "ans": 1, "exp": "An archaeologist studies ancient artifacts and cultures (paleontologist = fossils; anthropologist = human societies; historian = written records)."}, {"id": 76, "num": 16, "topic": "Error Detection", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Identify the error and select the correct sentence:\n“She drives extreme carefully on winding roads, especially at night.”", "options": ["She drives extremely careful on winding roads, especially at night.", "She drives extreme careful on winding roads, especially at night.", "She drives extreme carelessly on winding roads, especially at night.", "She drives extremely carefully on winding roads, especially at night."], "ans": 3, "exp": "An adverb (“extremely”) is required to modify another adverb (“carefully”)."}, {"id": 77, "num": 17, "topic": "Error Detection", "exam": "DSSSB IT Assistant Grade A · 09 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Identify the error in the sentence and select the correct option:\n“It was him who broke the window.”", "options": ["It was him who had broken the window.", "It was he whom broke the window.", "It was him whom broke the window.", "It was he who broke the window."], "ans": 3, "exp": "After “It is / It was”, the subjective pronoun (“he”) is used when it is the doer of the action, followed by “who”."}, {"id": 78, "num": 18, "topic": "Sentence Improvement", "exam": "DSSSB IT Assistant Grade A · 04 Nov 2026 · 5:00 PM", "isShift": true, "passage": null, "q": "Select the most appropriate one-word substitute for the highlighted phrase:\nThe *rough and ill-mannered behaviour* of the host’s son at the party embarrassed his father.", "options": ["urbanity", "humility", "boorishness", "affability"], "ans": 2, "exp": "Boorishness = rough, rude, ill-mannered behaviour (urbanity = polished manners; affability = friendliness; humility = modesty)."}, {"id": 79, "num": 19, "topic": "Sentence Rearrangement", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 9:00 AM", "isShift": true, "passage": null, "q": "Fixed Segment: Despite facing severe economic challenges and\nP. startup, remaining fiercely determined to revolutionise\nQ. widespread public doubt, the ambitious young entrepreneur\nR. sustainable energy solutions across the nation\nS. courageously launched her innovative eco-friendly", "options": ["QPRS", "QSPR", "SPQR", "RPSQ"], "ans": 1, "exp": "Despite facing severe economic challenges and (Q) widespread public doubt, the ambitious young entrepreneur (S) courageously launched her innovative eco-friendly (P) startup, remaining fiercely determined to revolutionise (R) sustainable energy solutions across the nation → QSPR."}, {"id": 80, "num": 20, "topic": "Sentence Rearrangement", "exam": "DSSSB IT Assistant Grade A · 10 Nov 2026 · 1:00 PM", "isShift": true, "passage": null, "q": "Fixed Segment: The adoption of biogas technology has been promoted\nP: while also addressing environmental pollution concerns\nQ: encouraging rural communities to participate in renewable initiatives\nR: through its ability to convert waste into valuable energy\nS: as it helps manage agricultural residues efficiently", "options": ["S P R Q", "R S P Q", "P Q R S", "Q R S P"], "ans": 1, "exp": "...has been promoted (R) through its ability to convert waste into valuable energy (S) as it helps manage agricultural residues efficiently (P) while also addressing environmental pollution concerns (Q) encouraging rural communities to participate in renewable initiatives → R S P Q."}]}, {"id": 5, "code": "Mock 05", "title": "English Mock 05", "subtitle": "Zeher Hardest · Set 1", "badge": "Hardest", "durationSec": 600, "questions": [{"id": 81, "num": 1, "topic": "Error Detection", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Identify the revision that most accurately addresses any error in adjective placement:\n'The uniquely aromatic, vibrant brewed teas sourced from mountain villages often attract connoisseurs seeking subtler flavors.'", "options": ["The vibrant, uniquely aromatic brewed teas sourced from mountain villages often attract connoisseurs seeking subtler flavors.", "The brewed aromatic vibrant uniquely teas sourced from mountain villages often attract connoisseurs seeking subtler flavors.", "The aromatic, vibrant uniquely brewed teas sourced from mountain villages often attract connoisseurs seeking subtler flavors.", "The uniquely vibrant aromatic brewed teas sourced from mountain villages often attract connoisseurs seeking subtler flavors."], "ans": 0, "exp": "General quality 'vibrant' precedes the specific modifier 'uniquely aromatic', with the participle 'brewed' directly before 'teas'."}, {"id": 82, "num": 2, "topic": "Error Detection", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Select the option that identifies the precise error in adjective usage:\n'At the annual symposium, the more creative proposals received less attention than the most technical ones, leaving the more innovative participants feeling least valued than expected.'", "options": ["The phrase 'least valued than' is incorrect; it should be 'less valued than'.", "The phrase 'more creative proposals' is incorrect; it should be 'most creative proposals'.", "The use of 'most technical ones' is incorrect; it should be 'more technical ones'.", "The use of 'more innovative participants' is incorrect; it should be 'most innovative participants'."], "ans": 0, "exp": "'Least' is a superlative and cannot take 'than'; the comparative 'less valued than' is required."}, {"id": 83, "num": 3, "topic": "Error Detection", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Which of the following sentences contains an error in comparative usage?", "options": ["A young child experiences the devastating interruptions of history differently than an adult interpreting the exact same political upheaval.", "Critics argue that conveying difficult realities through a young protagonist is safer than navigating censorship with an adult narrator.", "The narrative function of the child in Mohsen Makhmalbaf's cinema is significantly more complex than Jafar Panahi.", "The political action embodied by children in Iranian films is vastly different from the emotional distance seen in Satyajit Ray's masterpieces."], "ans": 2, "exp": "Option (c) illogically compares 'the narrative function of the child' with a person ('Jafar Panahi') instead of 'that in Jafar Panahi's cinema'."}, {"id": 84, "num": 4, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Select the best meaning of the underlined idiom:\nThe senior counsel warned that settling the massive legal dispute with such a minor policy change would be like *rearranging the deckchairs on the Titanic*.", "options": ["Organizing a strategic retreat to improve the morale of the executive leadership team", "Implementing a highly efficient organizational structure during a period of crisis", "Making small, insignificant changes to a situation that is already headed for disaster", "Taking proactive measures to ensure the future safety of all the employees"], "ans": 2, "exp": "'Rearranging the deckchairs on the Titanic' means making futile minor adjustments while facing inevitable disaster."}, {"id": 85, "num": 5, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Select the most appropriate meaning of the idiom:\nOne good turn deserves another", "options": ["A person who keeps changing jobs has fewer responsibilities and no fixed home", "A person who is careless with finances will quickly lose wealth", "A person sometimes does nice things only to get something back", "A person should do something nice for someone who has done something nice for him or her"], "ans": 3, "exp": "'One good turn deserves another' means one should return kindness or help received."}, {"id": 86, "num": 6, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Choose the one-word substitute for: *a person who publicly renounces and abandons a formerly held political, religious, or ideological belief*.", "options": ["dissident", "apostate", "iconoclast", "provocateur"], "ans": 1, "exp": "An apostate publicly renounces a previously held religious, political, or ideological belief."}, {"id": 87, "num": 7, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Arrange P, Q, R, S between S1 and S6:\nS1: Discipline in school life is very important for students.\nP: We can't be well educated without discipline.\nQ: Earlier teachers and class monitors bore the entire burden of implementing these rules.\nR: Not learning and following discipline in school life can cost students later in their careers.\nS: In school education, discipline is a set of rules & regulations that remind us of the proper code of behaviour.\nS6: However, many schools are now using school management software and discipline tracking tools.", "options": ["PRSQ", "RPQS", "QPSR", "SPRQ"], "ans": 3, "exp": "S defines discipline (set of rules) → P states its necessity → R states cost of neglecting it → Q links 'these rules' to S6 ('However, many schools now...'). Order = SPRQ."}, {"id": 88, "num": 8, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Rearrange to form a coherent sentence:\n(A) disbursements from the contingency fund, which had been explicitly reserved\n(B) about structural risks, the administrative board continued to approve\n(C) that auditors had flagged in the previous review\n(D) despite receiving repeated warnings from the oversight committee\n(E) for emergency infrastructure repairs, thereby deepening the fiscal imbalance", "options": ["BAECD", "DBEAC", "AEBCD", "DBAEC"], "ans": 3, "exp": "(D) despite receiving repeated warnings... (B) about structural risks, the board continued to approve (A) disbursements... reserved (E) for emergency repairs, deepening the fiscal imbalance (C) that auditors had flagged... ⇒ DBAEC."}, {"id": 89, "num": 9, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Replace the underlined text with the right proverb:\nThe manager proceeded with downsizing, believing that *significant results often demand some inevitable sacrifices*.", "options": ["the forbidden fruit is always the sweetest", "you can't make an omelette without breaking a few eggs", "don't bite off more than you can chew", "if you scratch my back, I'll scratch yours"], "ans": 1, "exp": "'You can't make an omelette without breaking a few eggs' means achieving important results often requires unavoidable sacrifices."}, {"id": 90, "num": 10, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Select the most appropriate meaning of *proprietary*:\nThe engineer warned that the algorithm was *proprietary*, and it could not be modified without the company's explicit consent.", "options": ["protected and privately owned", "outdated and inefficient", "open-source and modifiable", "experimental and theoretical"], "ans": 0, "exp": "Proprietary means privately owned and legally protected against unauthorized use or modification."}, {"id": 91, "num": 11, "topic": "Active & Passive Voice", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Choose the correct passive voice conversion:\nNo sooner had the impresario unveiled the new season than critics observed that the company had quietly retired its most celebrated repertoire.", "options": ["No sooner had the impresario unveiled the new season than critics observed that its most celebrated repertoire had quietly been retired by the company.", "No sooner had the impresario unveiled the new season than critics observed that its most celebrated repertoire has quietly been retired by the company.", "No sooner had the impresario unveiled the new season than critics observed that its most celebrated repertoire was quietly retired by the company.", "No sooner had the impresario unveiled the new season than critics observed that its most celebrated repertoire had quietly retired by the company."], "ans": 0, "exp": "Past perfect active ('had quietly retired') converts to past perfect passive ('had quietly been retired by the company')."}, {"id": 92, "num": 12, "topic": "Direct & Indirect Speech", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Convert to indirect speech:\nThe senior astrophysicist affirmed, \"I have been investigating the gravitational anomalies surrounding distant galactic clusters because recent observational evidence may redefine prevailing cosmological interpretations across contemporary astrophysical research.\"", "options": ["he had been investigating the gravitational anomalies surrounding distant galactic clusters because recent observational evidence might redefine prevailing cosmological interpretations across contemporary astrophysical research.", "he has been investigating the gravitational anomalies surrounding distant galactic clusters because recent observational evidence may redefine prevailing cosmological interpretations across contemporary astrophysical research.", "he had investigated the gravitational anomalies surrounding distant galactic clusters because recent observational evidence might redefine prevailing cosmological interpretations across contemporary astrophysical research.", "he would be investigating the gravitational anomalies surrounding distant galactic clusters because recent observational evidence might redefine prevailing cosmological interpretations across contemporary astrophysical research."], "ans": 0, "exp": "Past reporting verb 'affirmed' backshifts 'have been investigating' → 'had been investigating' and 'may redefine' → 'might redefine'."}, {"id": 93, "num": 13, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Convert to indirect speech:\nThe renowned quantum physicist asserted, \"I will demonstrate the mathematical validity of the proposed theoretical model after independent researchers verify the experimental observations under controlled laboratory conditions.\"", "options": ["he will demonstrate the mathematical validity of the proposed theoretical model after independent researchers verified the experimental observations under controlled laboratory conditions.", "he would demonstrate the mathematical validity of the proposed theoretical model after independent researchers verified the experimental observations under controlled laboratory conditions.", "he would have demonstrated the mathematical validity of the proposed theoretical model after independent researchers verified the experimental observations under controlled laboratory conditions.", "he had demonstrated the mathematical validity of the proposed theoretical model after independent researchers had verified the experimental observations under controlled laboratory conditions."], "ans": 1, "exp": "'will demonstrate' → 'would demonstrate' and 'verify' → 'verified' under the past reporting verb 'asserted'."}, {"id": 94, "num": 14, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Convert to indirect speech:\nThe distinguished marine ecologist acknowledged, \"I have discovered unprecedented biodiversity patterns within deep-sea ecosystems because recent oceanographic surveys reveal previously undocumented ecological interactions.\"", "options": ["he would discover unprecedented biodiversity patterns within deep-sea ecosystems because recent oceanographic surveys had revealed previously undocumented ecological interactions.", "he had discovered unprecedented biodiversity patterns within deep-sea ecosystems because recent oceanographic surveys revealed previously undocumented ecological interactions.", "he has discovered unprecedented biodiversity patterns within deep-sea ecosystems because recent oceanographic surveys reveal previously undocumented ecological interactions.", "he discovered unprecedented biodiversity patterns within deep-sea ecosystems because recent oceanographic surveys revealed previously undocumented ecological interactions."], "ans": 1, "exp": "'have discovered' backshifts to 'had discovered' and 'reveal' backshifts to 'revealed'."}, {"id": 95, "num": 15, "topic": "Parts of Speech & Grammar Terms", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": null, "q": "Choose the sentence that correctly uses the Future Perfect Continuous Tense.", "options": ["By the time the advanced engineering symposium commences, the research and development team will have been developing innovative prototypes under stringent laboratory conditions for several uninterrupted years, despite frequent setbacks and resource limitations.", "By the time the advanced engineering symposium commences, the research and development team will have developed innovative prototypes under stringent laboratory conditions for several uninterrupted years, despite frequent setbacks and resource limitations.", "By the time the advanced engineering symposium commences, the research and development team will develop innovative prototypes under stringent laboratory conditions for several uninterrupted years, despite frequent setbacks and resource limitations.", "By the time the advanced engineering symposium commences, the research and development team will be developing innovative prototypes under stringent laboratory conditions for several uninterrupted years, despite frequent setbacks and resource limitations."], "ans": 0, "exp": "Future Perfect Continuous uses `will have been + verb-ing` ('will have been developing... for several uninterrupted years')."}, {"id": 96, "num": 16, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": "M5_ENG_RC_Z1", "q": "Which option best captures the implied summary of the passage?", "options": ["Planetary change is primarily the result of industrialisation, with limited impact from pre-industrial human activity.", "Modern Earth system science integrates physical, biological, and human processes to explain environmental change holistically worldwide.", "Earlier ecological models separated atmosphere, lithosphere, hydrosphere, and biosphere without accounting for feedbacks.", "Human activity is irrelevant to Earth system processes, which unfold independently of societal intervention."], "ans": 1, "exp": "The passage explains how modern Earth system science views the planet as an integrated network of physical, biological, and human processes."}, {"id": 97, "num": 17, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": "M5_ENG_RC_Z1", "q": "How does the passage structurally develop its argument?", "options": ["It introduces Earth system science, illustrates feedback mechanisms, and concludes with uneven vulnerability and governance implications globally", "It emphasizes globalisation and supply chains first, then superficially addresses feedback mechanisms", "It lists environmental phenomena randomly without connecting them to theory or governance", "It begins with policy recommendations, retroactively explaining planetary feedbacks"], "ans": 0, "exp": "The progression is: Earth system science → feedback loops & Anthropocene → uneven vulnerability & justice-oriented governance."}, {"id": 98, "num": 18, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": "M5_ENG_RC_Z1", "q": "Which text-to-world connection is most consistent with the passage's reasoning?", "options": ["Current discussions on climate adaptation, justice-oriented governance, and interdisciplinary policy to sustain planetary resilience effectively.", "Emerging technological solutions are designed exclusively for economic efficiency without consideration for ecological feedback.", "Urbanisation and industrial development policies are implemented without integrating interdisciplinary environmental data.", "Market-driven resource extraction practices ignore biogeochemical limits entirely."], "ans": 0, "exp": "The passage calls for holistic, justice-oriented governance, coordinated policy, and interdisciplinary research—aligning directly with (a)."}, {"id": 99, "num": 19, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": "M5_ENG_RC_Z1", "q": "Which inference is most strongly supported by the discussion of Anthropocene debates?", "options": ["Debates about the Anthropocene are irrelevant for governance because environmental feedbacks operate independently.", "Human activity now functions as a geological force reshaping biogeochemical cycles at unprecedented scales across Earth systems.", "Scholarly disagreement undermines Earth system science by negating human-induced processes.", "Industrialisation alone accounts for all planetary change with negligible pre-industrial influence."], "ans": 1, "exp": "Despite differing chronologies, the passage stresses broad agreement that human activity now functions as a geological force reshaping biogeochemical cycles."}, {"id": 100, "num": 20, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 01", "isShift": false, "passage": "M5_ENG_RC_Z1", "q": "The tone of the passage is best described as:", "options": ["Alarmist and prescriptive, prioritizing urgent ecological collapse narratives", "Neutral and purely descriptive, cataloging phenomena without linking them to governance", "Analytically reflective and cautiously normative, emphasizing interdisciplinary integration, ethical stewardship, and systemic understanding of planetary processes", "Celebratory and optimistic, portraying human influence as wholly positive"], "ans": 2, "exp": "The author analyzes systemic Earth processes carefully (analytically reflective) and concludes with measured ethical governance recommendations (cautiously normative)."}]}, {"id": 6, "code": "Mock 06", "title": "English Mock 06", "subtitle": "Zeher Hardest · Set 2", "badge": "Hardest", "durationSec": 600, "questions": [{"id": 101, "num": 1, "topic": "Error Detection", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Identify the adjective error in: 'The historian argued that the newly discovered manuscript was the most perfect evidence yet... less authentic... highly questionable... strongest pieces...'", "options": ["strongest", "highly questionable", "the most perfect", "less authentic"], "ans": 2, "exp": "'Perfect' is an absolute adjective and cannot take 'most'."}, {"id": 102, "num": 2, "topic": "Error Detection", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Which sentence contains an error regarding the degree of comparison?", "options": ["Shows featuring adult humor became incredibly iconic despite raising eyebrows.", "Today's younger audiences are adapting more quicker to new digital platforms than previous generations ever did.", "Writers must pace their episodes rapidly for viewers consuming digital content at an accelerating rate.", "The network's longest-running franchise won multiple prestigious awards."], "ans": 1, "exp": "'More quicker' is an incorrect double comparative; it should be 'more quickly'."}, {"id": 103, "num": 3, "topic": "Error Detection", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Identify the sentence in which an adjective is incorrectly used with its complement:", "options": ["The revised theoretical model is capable of accommodating substantial variations.", "The researchers were concerned about the potentially adverse consequences.", "The principal investigator was responsible for ensuring compliance.", "The proposed analytical framework is capable to accommodate substantial variations in the empirical data."], "ans": 3, "exp": "'Capable' takes 'of + -ing' ('capable of accommodating'), not 'to + infinitive'."}, {"id": 104, "num": 4, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Replace the highlighted phrase with the correct proverb:\nShe stayed despite noisy neighbors, thinking *it was better to deal with a difficult situation she knew than to risk facing a new one that could be worse*.", "options": ["a known devil is better for her than an unknown angel", "a task begun is better finished than left unfinished", "a woman is better to die on her feet than live on her knees", "a task well done is better than many left unfinished"], "ans": 0, "exp": "'A known devil is better than an unknown angel' expresses preferring a familiar difficulty to an unknown risk."}, {"id": 105, "num": 5, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Substitute the underlined phrase:\nHer strategy reflected the flawed logic that *even the most unlikely plans may somehow succeed*.", "options": ["even a blind squirrel finds a nut once in a while", "a rising tide lifts all boats", "the squeaky wheel gets the grease", "you can't make an omelette without breaking eggs"], "ans": 0, "exp": "'Even a blind squirrel finds a nut once in a while' means even an unlikely/flawed effort might succeed by chance."}, {"id": 106, "num": 6, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Select the meaning of the proverb: 'The apple doesn't fall far from the tree.'", "options": ["One's environment shapes identity more than hereditary factors.", "Individuals develop characteristics independent of family.", "Personal growth is solely determined by external experiences.", "A person's traits, behaviours or abilities are often inherited from their parents."], "ans": 3, "exp": "The proverb means children commonly resemble their parents in traits, behaviour, or abilities."}, {"id": 107, "num": 7, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Segment (A) is fixed. Rearrange B, C, D:\n(A) Although the committee initially treated the discrepancy as evidence that the revised protocol had improved reliability,\n(B) a less plausible explanation for the reported improvement than deliberate retrospective selection of favorable observations.\n(C) a later audit showed that the cases most responsible for the apparent gain had been reclassified\n(D) before the new criteria were formally adopted, a sequence of events that made methodological refinement", "options": ["ACBD", "ADBC", "ACDB", "ADCB"], "ans": 2, "exp": "(A) Although... → (C) a later audit showed... reclassified → (D) before the new criteria... refinement → (B) a less plausible explanation... ⇒ ACDB."}, {"id": 108, "num": 8, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Fixed: The committee convened to deliberate on the new venture.\nA. The proposal's financial implications were weighed by several members.\nB. It was acknowledged that long-term benefits might outweigh immediate costs.\nC. Some skepticism regarding short-term feasibility was expressed.\nD. The chair summarized that consensus had not yet been achieved.", "options": ["A, B, D, C", "A, C, B, D", "C, A, D, B", "D, B, C, A"], "ans": 1, "exp": "Weigh finances (A) → express short-term skepticism (C) → balance with long-term benefits (B) → chair summarizes no consensus (D) ⇒ A, C, B, D."}, {"id": 109, "num": 9, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Substitute the underlined segment:\nSome people are born with natural talents and abilities, *or others develop their* intelligence through hard work and dedication.", "options": ["while others develop their", "instead others develops their", "but others develops their", "meanwhile others develop there"], "ans": 0, "exp": "'while others develop their' properly contrasts the two groups with correct plural verb agreement and possessive 'their'."}, {"id": 110, "num": 10, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Choose the opposite of *indelible*:\nThe *indelible* mark of his groundbreaking research revolutionized neuroscience.", "options": ["mediocre", "inconspicuous", "complicated", "temporary"], "ans": 3, "exp": "Indelible means permanent / impossible to erase; its antonym is 'temporary'."}, {"id": 111, "num": 11, "topic": "Active & Passive Voice", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Convert to passive voice:\nWhatever the sommelier now insists, the estate could easily have been blending inferior fruit into its flagship vintage for several seasons.", "options": ["Whatever the sommelier now insists, inferior fruit could easily have blended into its flagship vintage by the estate for several seasons.", "Whatever the sommelier now insists, inferior fruit could easily have been blending into its flagship vintage by the estate for several seasons.", "Whatever the sommelier now insists, inferior fruit could easily have been blended into its flagship vintage by the estate for several seasons.", "Whatever the sommelier now insists, inferior fruit could easily be blended into its flagship vintage by the estate for several seasons."], "ans": 2, "exp": "Modal perfect passive uses `could have been + past participle` → 'inferior fruit could easily have been blended...'."}, {"id": 112, "num": 12, "topic": "Direct & Indirect Speech", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Indirect speech for:\nThe distinguished paleoclimatologist remarked, \"I have identified compelling stratigraphic evidence suggesting that prolonged climatic oscillations significantly influenced prehistoric settlement patterns across multiple continental regions.\"", "options": ["he would identify compelling stratigraphic evidence suggesting that prolonged climatic oscillations had significantly influenced prehistoric settlement patterns across multiple continental regions.", "he had identified compelling stratigraphic evidence suggesting that prolonged climatic oscillations had significantly influenced prehistoric settlement patterns across multiple continental regions.", "he has identified compelling stratigraphic evidence suggesting that prolonged climatic oscillations significantly influenced prehistoric settlement patterns across multiple continental regions.", "he identified compelling stratigraphic evidence suggesting that prolonged climatic oscillations significantly influenced prehistoric settlement patterns across multiple continental regions."], "ans": 1, "exp": "'have identified' → 'had identified' and 'influenced' → 'had influenced' after past reporting verb 'remarked'."}, {"id": 113, "num": 13, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Indirect speech for:\nThe distinguished behavioural economist maintained, \"I am investigating the cognitive biases influencing long-term financial decision-making because emerging empirical findings may substantially challenge conventional economic assumptions.\"", "options": ["he would investigate... might substantially challenge...", "he is investigating... may substantially challenge...", "he had investigated... might substantially challenge...", "he was investigating the cognitive biases influencing long-term financial decision-making because emerging empirical findings might substantially challenge conventional economic assumptions."], "ans": 3, "exp": "'am investigating' → 'was investigating' and 'may' → 'might'."}, {"id": 114, "num": 14, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Which sentence contains an incorrect adjective collocation or grammatical construction?", "options": ["The regulatory body expressed serious concern over the increasingly frequent sexualisation of younger television talent.", "The secretary-general noted that current compliance levels are as high, if not higher than, previous ones.", "The council emphasized that networks targeting younger audiences needed to be significantly more careful.", "Broadcasters argued that imposing additional programming restraints was much harder without specific separate classifications."], "ans": 1, "exp": "'as high, if not higher than' omits the mandatory second 'as'; it must be 'as high as, if not higher than'."}, {"id": 115, "num": 15, "topic": "Parts of Speech & Grammar Terms", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": null, "q": "Choose the correct form of future perfect tense.", "options": ["By the time the committee arrives, the administration has completed all the required upgrades.", "By the time the committee arrives, the administration will have been completing all the required upgrades.", "By the time the international accreditation committee arrives to inspect the university's research facilities, the administration will have completed all the required infrastructural upgrades and regulatory documentation.", "By the time the committee arrives, the administration will complete all the required upgrades."], "ans": 2, "exp": "Future perfect tense = `will have + past participle` ('will have completed')."}, {"id": 116, "num": 16, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": "M6_ENG_RC_Z2", "q": "Which statement best captures the underlying thematic message communicated by the passage?", "options": ["Youth anxiety arises from multifaceted external demands that require active personal coping mechanisms", "Academic institutions must fundamentally restructure grading frameworks to protect emotional health", "Economic inequalities represent the primary driver of persistent psychological distress", "Technological progress inevitably relieves psychological strain"], "ans": 0, "exp": "The passage traces youth anxiety to performance, conformity, self-improvement, and peer comparison, and advocates active personal coping strategies."}, {"id": 117, "num": 17, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": "M6_ENG_RC_Z2", "q": "The overall tone of the passage can best be described as:", "options": ["Analytical and empathetic", "Dismissive and mocking", "Satirical and cynical", "Aggressive and confrontational"], "ans": 0, "exp": "The author objectively analyses causes of adolescent stress while expressing empathy for students' psychological burden."}, {"id": 118, "num": 18, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": "M6_ENG_RC_Z2", "q": "What can be logically inferred regarding the societal perception of adolescent mental health?", "options": ["Educational institutions deliberately ignore student anxiety for rankings", "Peer interactions are the sole source of emotional validation", "Adults typically overestimate teenagers' emotional maturity", "Society routinely minimizes the severe mental strain experienced by modern high school students"], "ans": 3, "exp": "The opening states that teenage stress is widely dismissed as mere exaggeration due to the misconception of a carefree youth."}, {"id": 119, "num": 19, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": "M6_ENG_RC_Z2", "q": "What does the text imply about the role of personal mindset in navigating modern competitive environments?", "options": ["Rigid daily routines designed by experts are more effective than personal autonomy", "Psychological adaptability empowers individuals to handle heavy stress despite persistent external challenges", "Eliminating all social comparison is mandatory for self-esteem", "External circumstances must undergo major structural reforms before achieving peace of mind"], "ans": 1, "exp": "The concluding paragraph stresses that adaptability, a balanced rational perspective, and realistic optimism insulate youth against continuing pressures."}, {"id": 120, "num": 20, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Zeher Hardest Mock 02", "isShift": false, "passage": "M6_ENG_RC_Z2", "q": "Which immediate physical technique is explicitly recommended in the passage to reduce acute psychological distress?", "options": ["Consistently journaling personal thoughts", "Organizing complex assignments into smaller tasks", "Practicing intentional deep breathing exercises to quickly restore mental composure and serenity", "Engaging in structured daily physical exercise"], "ans": 2, "exp": "The passage explicitly recommends 'deliberate deep breathing' to immediately alleviate acute anxiety and restore composure."}]}, {"id": 7, "code": "Mock 07", "title": "English Mock 07", "subtitle": "Real Exam Level · Set 1", "badge": "Real Exam", "durationSec": 600, "questions": [{"id": 121, "num": 1, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": "M7_ENG_RC_16", "q": "Which of the following is the central theme of the passage?", "options": ["Governments create policies for economic and industrial development.", "Doctors provide valuable services during emergencies and outbreaks.", "Public healthcare systems support community health and overall well-being.", "Medical research improves treatment methods and healthcare technology."], "ans": 2, "exp": "The passage focuses on why public healthcare systems matter, the challenges they face, and how strengthening them improves community health and well-being."}, {"id": 122, "num": 2, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": "M7_ENG_RC_16", "q": "What is the predominant tone of the passage?", "options": ["Concerned and informative", "Critical and dismissive", "Neutral and detached", "Humorous and entertaining"], "ans": 0, "exp": "The author highlights real challenges (showing concern) and explains practical solutions and benefits (informative)."}, {"id": 123, "num": 3, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": "M7_ENG_RC_16", "q": "Which of the following statements best reflects the information given in the passage?", "options": ["Medical equipment is equally available in every rural region.", "Public campaigns help people learn about hygiene and healthy habits.", "Modern hospitals completely eliminate the spread of all diseases.", "Citizens rarely need support during major health emergencies."], "ans": 1, "exp": "The passage explicitly states that awareness campaigns can educate people about hygiene, nutrition, and regular health check-ups."}, {"id": 124, "num": 4, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": "M7_ENG_RC_16", "q": "Which of the following inferences can be logically drawn from the passage?", "options": ["Medical education has reduced the need for healthcare workers.", "Industrial growth remains the main goal of public hospitals today.", "Technological advances have solved all public health challenges.", "Distance from healthcare facilities may affect treatment in villages."], "ans": 3, "exp": "Since rural healthcare facilities are often far away, making medical care difficult for villagers, distance clearly affects treatment in villages."}, {"id": 125, "num": 5, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": "M7_ENG_RC_16", "q": "Which of the following best describes the structure of the passage?", "options": ["It presents historical events, leaders, achievements, and lessons.", "It presents scientific studies, methods, findings, and conclusions.", "It presents educational reforms, challenges, policies, and outcomes.", "It presents healthcare needs, problems, solutions, and benefits."], "ans": 3, "exp": "The passage moves logically from why public healthcare is needed → problems faced → solutions → long-term benefits."}, {"id": 126, "num": 6, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Select the most appropriate option to complete the given sentence.\nWhen alternatives are peddled as 'the lesser evil', virtue is __________ added as a measure of degrees.", "options": ["previously", "adversely", "reassuringly", "artificially"], "ans": 3, "exp": "When something is sold as 'the lesser evil', its virtue is not genuine but artificially added by comparison."}, {"id": 127, "num": 7, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "The committee postponed the discussion on climate regulations as several key members were unavailable ______ the international summit taking place in Geneva.", "options": ["within", "beneath", "beyond", "during"], "ans": 3, "exp": "'During' is the preposition of time indicating throughout the period of an event (the international summit)."}, {"id": 128, "num": 8, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Select the most appropriate article to fill in the blank.\nMy friend had _________ 100 rupee note in his book.", "options": ["the", "No article required", "an", "a"], "ans": 3, "exp": "'100' is pronounced starting with a consonant sound ('one hundred' /w/ or 'hundred' /h/), and the note is non-specific, so 'a' is used."}, {"id": 129, "num": 9, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "The ______ student completed a challenging research project with remarkable dedication and consistent effort.", "options": ["industrious", "critical", "ambiguous", "empathetic"], "ans": 0, "exp": "'Industrious' means diligent and hard-working, matching 'remarkable dedication and consistent effort'."}, {"id": 130, "num": 10, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Select the most appropriate article to fill in the blank.\nLet us have dinner at ______ restaurant near my uncle's house.", "options": ["No article", "an", "a", "the"], "ans": 3, "exp": "The restaurant is specifically identified ('near my uncle's house'), requiring the definite article 'the'."}, {"id": 131, "num": 11, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Choose the antonym for the highlighted word.\nThe manager decided to ACCELERATE the project to meet the deadline.", "options": ["Advance", "Hasten", "Delay", "Expedite"], "ans": 2, "exp": "Accelerate = speed up; its antonym is Delay (slow down / postpone). Advance, hasten, and expedite are synonyms."}, {"id": 132, "num": 12, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Select the most appropriate ANTONYM of the underlined word:\nA washerman hangs DIAPHANOUS garments to dry on the mortared walls of a house in Mumbai.", "options": ["Solid", "Frail", "Opaque", "Sheer"], "ans": 2, "exp": "Diaphanous means light, delicate, and translucent/sheer. Its exact antonym is Opaque (not letting light pass through)."}, {"id": 133, "num": 13, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Choose the correct proverbial option to substitute the underlined segment:\n...as their lawyer cautiously reminded them, UNEXPECTED OBSTACLES COULD STILL ARISE AT ANY MOMENT, POTENTIALLY PREVENTING THEM FROM REACHING THE FINAL AGREEMENT.", "options": ["the mills of God grind slowly but surely", "there's many a slip twixt cup and lip", "a drowning man will clutch at a straw", "an oak is not felled at one stroke"], "ans": 1, "exp": "'There's many a slip 'twixt the cup and the lip' means things can still go wrong before a nearly certain outcome is finalized."}, {"id": 134, "num": 14, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Choose the correct one-word substitution for the underlined segment:\nThe response was DELIBERATELY INTENDED TO PROVOKE ANGER.", "options": ["inflammatory", "impartial", "tentative", "conciliatory"], "ans": 0, "exp": "Inflammatory = intended to arouse angry or violent feelings. Conciliatory is its opposite."}, {"id": 135, "num": 15, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Choose the incorrectly spelt word in the sentence.\nThe organization conducted a feasability study to evaluate the long-term impact of the environmental policy.", "options": ["conducted", "feasability", "environmental", "evaluate"], "ans": 1, "exp": "'Feasability' is misspelt; the correct spelling is 'feasibility' (feasible + -ity)."}, {"id": 136, "num": 16, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Select the INCORRECTLY spelt word in the given sentence.\nThe company is planning on aquiring a new office space the following year.", "options": ["following", "aquiring", "company", "planning"], "ans": 1, "exp": "'Aquiring' is misspelt; the correct spelling is 'acquiring' (with 'c' before 'q')."}, {"id": 137, "num": 17, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "The first segment is fixed. Rearrange P, Q, R, S:\nDemocratic institutions weaken\nP) persistent misinformation\nQ) that distort collective reasoning\nR) when public trust erodes gradually through\nS) amplified by digital echo chambers", "options": ["PQRS", "RQSP", "RPSQ", "QRSP"], "ans": 2, "exp": "Democratic institutions weaken (R) when public trust erodes gradually through (P) persistent misinformation (S) amplified by digital echo chambers (Q) that distort collective reasoning → RPSQ."}, {"id": 138, "num": 18, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Rearrange the segments to form a coherent statement:\nAs history often repeats (O) / Rather than foreign invasion (P) / Under the weight of internal decay (Q) / The empire began to crumble (R) / Without warning or ceremony (S)", "options": ["PRQSO", "QSORP", "RPOQS", "ORQPS"], "ans": 3, "exp": "(O) As history often repeats, (R) the empire began to crumble (Q) under the weight of internal decay (P) rather than foreign invasion (S) without warning or ceremony → ORQPS."}, {"id": 139, "num": 19, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Select the most appropriate option to replace the underlined words:\nIt is never a choice for the champions to just ACCEPT DEFEAT AND NOT FIGHT BACK.", "options": ["throw in the towel", "bite off more than they can chew", "spill the beans", "let sleeping dogs lie"], "ans": 0, "exp": "'Throw in the towel' means to admit defeat and give up."}, {"id": 140, "num": 20, "topic": "Parts of Speech & Grammar Terms", "exam": "DSSSB TGT CS · Ramban Mock 16 (Real Exam)", "isShift": false, "passage": null, "q": "Choose the sentence that uses the correct past tense.", "options": ["She was upset because she is missing the train.", "She was upset because she had being missing the train.", "She was upset because she had missed the train.", "She is upset because she miss the train."], "ans": 2, "exp": "Missing the train occurred before she became upset, so the earlier past action uses past perfect ('had missed')."}]}, {"id": 8, "code": "Mock 08", "title": "English Mock 08", "subtitle": "Ramban English · Set 15", "badge": "Ramban", "durationSec": 600, "questions": [{"id": 141, "num": 1, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": "M8_ENG_RC_15", "q": "Which of the following can be inferred from the passage?", "options": ["The war has reduced tensions between Afghanistan and Pakistan considerably", "Economic cooperation between India and Pakistan has strengthened recently", "Regional alliances are increasing the strategic significance of the conflict", "International organisations have successfully resolved the border dispute"], "ans": 2, "exp": "Beijing's alliance with Pakistan and New Delhi's growing influence in Afghanistan turn border skirmishes into a war with regional implications."}, {"id": 142, "num": 2, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": "M8_ENG_RC_15", "q": "According to the passage, which statement is correct?", "options": ["India and China jointly mediated peace talks", "Pakistan fully supports Afghanistan's improving relationship with India", "The TTP was created after the Afghan
