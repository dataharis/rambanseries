istan-Pakistan war started", "The Taliban returned to power in Kabul during the year 2021"], "ans": 3, "exp": "The passage explicitly mentions 'since the Taliban returned to power in Kabul in 2021'."}, {"id": 143, "num": 3, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": "M8_ENG_RC_15", "q": "Which situation best reflects the summary of the passage?", "options": ["A trade agreement succeeds after removing restrictions", "A sports rivalry becomes popular after media coverage", "Two neighbouring states improve relations through cultural festivals", "A local border dispute expands because larger nations support opposing sides"], "ans": 3, "exp": "A bilateral border conflict widens in strategic stakes because China and India back opposing sides."}, {"id": 144, "num": 4, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": "M8_ENG_RC_15", "q": "Which best expresses the central theme of the passage?", "options": ["Economic globalisation has reduced military tensions", "Regional rivalries and strategic alliances are intensifying the Afghanistan-Pakistan conflict", "Religious reforms are transforming political institutions", "Technological competition is replacing military confrontation"], "ans": 1, "exp": "The passage centers on how regional rivalries (China–Pakistan vs. India–Afghanistan) intensify the conflict."}, {"id": 145, "num": 5, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": "M8_ENG_RC_15", "q": "Which word is the closest antonym of 'dissent' as used in the passage?", "options": ["Worry", "Consequence", "Abuse", "Agreement"], "ans": 3, "exp": "Dissent means disagreement; its antonym is Agreement."}, {"id": 146, "num": 6, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "If the librarian had whispered the secret code, the hidden bookshelf would have ________ open to reveal the underground archive.", "options": ["slides", "slide", "sliding", "slid"], "ans": 3, "exp": "Type 3 conditional requires past participle: slide – slid – slid → 'would have slid'."}, {"id": 147, "num": 7, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "The new policy has been met with ________ reactions from the employees, ranging from enthusiasm to skepticism.", "options": ["congruent", "ambivalent", "vigilant", "tedious"], "ans": 1, "exp": "'Enthusiasm to skepticism' indicates mixed/contradictory feelings → ambivalent."}, {"id": 148, "num": 8, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "When Raju came to school, Mr. Anand __________ there for five years.", "options": ["had taught", "taught", "was teaching", "had been teaching"], "ans": 3, "exp": "An action continuing up to a past point with a duration ('for five years') takes past perfect continuous: 'had been teaching'."}, {"id": 149, "num": 9, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Despite the heavy rain, the children ______ in the park until sunset.", "options": ["played", "play", "have played", "playing"], "ans": 0, "exp": "A completed past event ('until sunset') uses simple past: 'played'."}, {"id": 150, "num": 10, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "The professor reminded the students ___ the importance of deadlines and warned them ___ the consequences of negligence.", "options": ["for, over", "of, about", "to, on", "at, with"], "ans": 1, "exp": "Standard collocations: 'reminded ... of' and 'warned ... about'."}, {"id": 151, "num": 11, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Choose the antonym of the underlined word:\nDespite his *meticulous* preparation, he still made some mistakes.", "options": ["thorough", "negligent", "precise", "careful"], "ans": 1, "exp": "Meticulous (very careful) ↔ negligent (careless)."}, {"id": 152, "num": 12, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Choose the antonym of *opulent*:\nThe city's *opulent* downtown district stands in sharp contrast to the industrial zones on the outskirts.", "options": ["Lavish", "Obscure", "Sagacious", "Penurious"], "ans": 3, "exp": "Opulent (wealthy, luxurious) ↔ Penurious (extremely poor)."}, {"id": 153, "num": 13, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Substitute with one word:\nThe antenna that my father put up is *capable of moving in all directions*.", "options": ["omnipresent", "omniscient", "omnidirectional", "omnipotent"], "ans": 2, "exp": "Omnidirectional = operating/moving in all directions."}, {"id": 154, "num": 14, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Select the best one-word substitute for: 'The formal act of stepping down from something'", "options": ["Desecrate", "Reverence", "Espousal", "Abdication"], "ans": 3, "exp": "Abdication is the formal renunciation or stepping down from a position of power/throne."}, {"id": 155, "num": 15, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Select the sentence which has the INCORRECTLY spelt word.", "options": ["His exubberant personality often made him the centre of attention.", "The researcher's analytical skills were crucial in deciphering the data.", "The propaganda campaign manipulated public opinion.", "Her excitement was apparent when she received the job offer."], "ans": 0, "exp": "'Exubberant' is misspelt; the correct spelling is 'exuberant' (single 'b')."}, {"id": 156, "num": 16, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Replace the highlighted phrase with the suitable proverb:\nTrying to solve all problems at once is difficult; *sometimes, small steps are more manageable*.", "options": ["Every dog has its day", "Out of sight, out of mind", "Strike while the iron is hot", "Rome wasn't built in a day"], "ans": 3, "exp": "'Rome wasn't built in a day' means major work takes time and steady incremental steps."}, {"id": 157, "num": 17, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Rearrange: P: is poised to | Q: the internet | R: society fundamentally | S: transform our | T: in the next decade", "options": ["TPRSQ", "QSPRT", "TRPQS", "QPSRT"], "ans": 3, "exp": "The internet (Q) is poised to (P) transform our (S) society fundamentally (R) in the next decade (T) ⇒ QPSRT."}, {"id": 158, "num": 18, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Rearrange:\nO: promotes digestion | P: but also strengthens our immune system, | Q: and provides essential nutrients vital for long-term well-being | R: incorporating a variety of fruits and vegetables into our daily diet | S: not only enhances our overall health", "options": ["QSOPR", "RSPOQ", "PQORS", "ORPQS"], "ans": 1, "exp": "R (subject) → S (not only...) → P (but also...) → O (promotes...) → Q (and provides...) ⇒ RSPOQ."}, {"id": 159, "num": 19, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Improve the underlined part:\nThey used to live *move by jowl* with each other, sharing meals and laughter.", "options": ["call by jowl", "reside by jowl", "made by jowl", "cheek by jowl"], "ans": 3, "exp": "The fixed idiom is 'cheek by jowl' (living very close together, side by side)."}, {"id": 160, "num": 20, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 15", "isShift": false, "passage": null, "q": "Replace the bracketed segment:\nIn the realm of ambition and power, (to have a jackal by the ears) illustrates the precariousness of holding onto something dangerous.", "options": ["to have a wolf by the ears", "no correction needed", "to have a lion by the paws", "to have a dog by the tail"], "ans": 0, "exp": "The correct idiom is 'to have a wolf by the ears' (risky both to hold on and to let go)."}]}, {"id": 9, "code": "Mock 09", "title": "English Mock 09", "subtitle": "Ramban English · Set 14", "badge": "Ramban", "durationSec": 600, "questions": [{"id": 161, "num": 1, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": "M9_ENG_RC_14", "q": "What attitude does the passage convey towards colonial power structures?", "options": ["Critical examination of their consequences", "Nostalgia for aristocratic traditions", "Strong admiration for imperial order", "Indifference toward historical conflicts"], "ans": 0, "exp": "The passage highlights mistrust, confinement, alienation, madness, and 'the lingering violence of colonial history'—a critical examination of colonial power."}, {"id": 162, "num": 2, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": "M9_ENG_RC_14", "q": "What social condition shapes the atmosphere of the protagonist's childhood?", "options": ["Economic uncertainty after emancipation", "Technological change within plantation life", "Political unity among social classes", "Religious prosperity across the colonies"], "ans": 0, "exp": "The passage explicitly states it is set in post-emancipation Jamaica where she grows up amid 'isolation, fractured family bonds, and economic uncertainty'."}, {"id": 163, "num": 3, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": "M9_ENG_RC_14", "q": "What does the word \"alienation\" most nearly mean in the passage?", "options": ["A condition of political loyalty", "A method of cultural preservation", "A process of legal negotiation", "A feeling of social separation"], "ans": 3, "exp": "Alienation refers to feeling isolated, estranged, or socially separated—not belonging fully to either Caribbean or European worlds."}, {"id": 164, "num": 4, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": "M9_ENG_RC_14", "q": "What thematic concern is most strongly connected with madness in the passage?", "options": ["The decline of aristocratic traditions", "The burden of inherited superstition", "The impact of emotional and social confinement", "The influence of technological modernity"], "ans": 2, "exp": "The passage links madness directly to dependence, marital confinement, dismissed emotions, cultural displacement, and 'emotional imprisonment'."}, {"id": 165, "num": 5, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": "M9_ENG_RC_14", "q": "What can be inferred about the protagonist's identity crisis in the passage?", "options": ["It results from financial ambition exclusively", "It emerges from conflicting cultural expectations", "It develops through political rebellion alone", "It originates in religious disagreement primarily"], "ans": 1, "exp": "She belongs fully to neither colonisers nor formerly enslaved people, and Caribbean vs. European worldviews clash as her husband tries to redefine her."}, {"id": 166, "num": 6, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Choose the correct option to complete the sentence.\nThe teacher appreciated Riya's ______ attitude towards challenges, which inspired her classmates to stay positive even during difficult times.", "options": ["eloquent", "stronger", "optimistic", "abundant"], "ans": 2, "exp": "'Inspired her classmates to stay positive' directly points to 'optimistic' (hopeful and positive)."}, {"id": 167, "num": 7, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Select the most appropriate option to fill in the blank.\nThe company's _________ approach to customer service has earned them a loyal customer base.", "options": ["perfunctory", "impersonal", "cursory", "personalised"], "ans": 3, "exp": "Earning a loyal customer base requires a warm, tailored approach—'personalised'. Perfunctory, cursory, and impersonal are negative."}, {"id": 168, "num": 8, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Choose the correct option to complete the sentence.\nAfter years of research, the scientist finally developed ______ method that could detect early signs of cancer with remarkable accuracy, revolutionizing the field of medical diagnostics.", "options": ["an", "the", "a", "no article"], "ans": 2, "exp": "'Method' is introduced for the first time as a singular countable noun starting with a consonant sound, so 'a' is used."}, {"id": 169, "num": 9, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Fill in the blank with the most appropriate option.\nHe almost always finishes his work _____ and efficiently.", "options": ["promptly", "loudly", "recently", "softly"], "ans": 0, "exp": "Parallel with 'efficiently' (adverb of manner), 'promptly' (quickly, without delay) fits naturally."}, {"id": 170, "num": 10, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Select the most appropriate option to fill in the blanks.\nThey brought _____ umbrella in case of rain and also packed _____ extra one.", "options": ["an; a", "a; the", "a; a", "an; an"], "ans": 3, "exp": "Both 'umbrella' and 'extra' begin with vowel sounds, so 'an' is used in both blanks."}, {"id": 171, "num": 11, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Find the ANTONYM of 'magnanimous' from the given sentence.\nHis petty remarks, sarcastic tone, and stubborn attitude shocked everyone in the auditorium.", "options": ["petty", "sarcastic", "calm", "stubborn"], "ans": 0, "exp": "Magnanimous means generous and big-hearted; its opposite is 'petty' (small-minded, mean)."}, {"id": 172, "num": 12, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Select the most appropriate antonym of the word 'occasional'.", "options": ["Exclusive", "Common", "Recurrent", "Informal"], "ans": 2, "exp": "Occasional means happening infrequently; its opposite is 'Recurrent' (happening repeatedly)."}, {"id": 173, "num": 13, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Select the most appropriate idiom that can substitute the underlined segment:\nDespite their promises, the officials *failed to take any action* on the complaints.", "options": ["turned over a new leaf", "sat on their hands", "took a back seat", "beat around the bush"], "ans": 1, "exp": "'Sat on their hands' means did nothing / failed to take action when needed."}, {"id": 174, "num": 14, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Choose the correct proverbial option to substitute the underlined segment:\nDespite her reputation for impeccable planning, the teacher accidentally left an important permission slip behind, proving once again that *even the most skilled or experienced individuals can make mistakes*.", "options": ["a chain is only as strong as its weakest link", "even Homer sometimes nods", "a rolling stone gathers no moss", "the devil is in the details"], "ans": 1, "exp": "'Even Homer sometimes nods' means even the most expert or careful people occasionally make mistakes."}, {"id": 175, "num": 15, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Replace the highlighted text with the correct idiom:\nLast quarter, Martin presented a clean project timeline, but behind the scenes, he'd skipped several testing steps. When the error surfaced, his manager said that this is *to deceive the company* for unfair advantage.", "options": ["Worth its weight in gold", "To cost an arm and a leg", "To pull a fast one on someone", "To weather the storm"], "ans": 2, "exp": "'To pull a fast one on someone' means to trick or deceive someone for unfair advantage."}, {"id": 176, "num": 16, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Select the correctly spelt word to complete the sentence.\nHer climate change presentation was so _________ that even skeptics began to reconsider.", "options": ["convinching", "convincing", "convinsing", "convencing"], "ans": 1, "exp": "The correct spelling is 'convincing' (convince + -ing, dropping the silent 'e')."}, {"id": 177, "num": 17, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Rearrange all the segments to form a coherent statement:\nA. play a critical role in pollination\nB. hummingbirds and bats\nC. by transferring pollen from one flower to another\nD. while feeding on nectar,\nE. ensuring the reproduction of many plant species", "options": ["ABCDE", "BACDE", "EDACB", "BADCE"], "ans": 3, "exp": "Subject (B) + Verb (A) + Circumstance (D) + Method (C) + Result (E) ⇒ BADCE."}, {"id": 178, "num": 18, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Rearrange the segments to form a meaningful sentence:\n1. and addressing them requires collective efforts\n2. global challenges such as climate change\n3. that transcend national boundaries\n4. are complex problems\n5. from governments, organisations, and individuals", "options": ["42153", "32451", "23415", "24315"], "ans": 3, "exp": "2 (global challenges...) + 4 (are complex problems) + 3 (that transcend...) + 1 (and addressing them...) + 5 (from governments...) ⇒ 24315."}, {"id": 179, "num": 19, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Select the option that means the same as the underlined segment.\nThe manager warned that without careful planning, the project might end up *worse than before despite good intentions*.", "options": ["You can lead a horse to water, but you can't make it drink", "The road to hell is paved with good intentions", "Do not count your chickens before they are fully hatched yet", "A chain is only as strong as its weakest link"], "ans": 1, "exp": "'The road to hell is paved with good intentions' means good intentions without proper planning/action can lead to bad outcomes."}, {"id": 180, "num": 20, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 14", "isShift": false, "passage": null, "q": "Complete the sentence with the grammatically correct combination:\nThey must pass ________ our house ______ arrive _______ yours.", "options": ["by / to / at", "near / for / in", "of / to / on", "on / for / of"], "ans": 0, "exp": "'pass by' (go past), 'to arrive' (purpose infinitive), and 'arrive at' (a specific building/house) ⇒ 'by / to / at'."}]}, {"id": 10, "code": "Mock 10", "title": "English Mock 10", "subtitle": "Ramban English · Set 13", "badge": "Ramban", "durationSec": 600, "questions": [{"id": 181, "num": 1, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": "M10_ENG_RC_13", "q": "Select an appropriate title for the passage.", "options": ["Different Types of Regional Foods", "Popular Food Choices Among Teenagers", "Problems Caused by Unhealthy Eating", "Health Benefits of a Balanced Diet"], "ans": 3, "exp": "The entire passage explains how a balanced, nutritious diet keeps the body strong, prevents chronic illness, and improves well-being."}, {"id": 182, "num": 2, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": "M10_ENG_RC_13", "q": "What is the main idea of the passage?", "options": ["Daily exercise builds strong muscles and improves fitness.", "Healthy eating supports good health, prevents illness, and promotes overall well-being.", "Fresh food and clean water provide daily energy.", "Modern medicines treat many diseases and increase longevity."], "ans": 1, "exp": "Every paragraph reinforces that healthy, balanced eating supports good health, prevents chronic diseases, and promotes overall well-being."}, {"id": 183, "num": 3, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": "M10_ENG_RC_13", "q": "What is the structure of the passage?", "options": ["Expository", "Descriptive", "Narrative", "Chronological"], "ans": 0, "exp": "The passage informs and explains facts about balanced nutrition — classic Expository writing."}, {"id": 184, "num": 4, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": "M10_ENG_RC_13", "q": "What is the tone of the passage?", "options": ["Emotional and Persuasive", "Critical and Disapproving", "Humorous and Informative", "Informative and Encouraging"], "ans": 3, "exp": "The passage gives factual nutrition guidance (informative) and motivates early healthy habits (encouraging)."}, {"id": 185, "num": 5, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": "M10_ENG_RC_13", "q": "Select the correct ANTONYM of 'Moderation' from the passage.", "options": ["Illness", "Weakness", "Excess", "Shortage"], "ans": 2, "exp": "'Moderation' (reasonable limits) is directly contrasted with 'Excess' (excessive sugar, salt, fats)."}, {"id": 186, "num": 6, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Fill in the blank:\nMany Mughal Kings were fond _______ architecture.", "options": ["on", "of", "for", "at"], "ans": 1, "exp": "'Fond' always takes the preposition 'of': fond of architecture."}, {"id": 187, "num": 7, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "She possesses ______ extraordinary talent for playing the violin.", "options": ["an", "the", "No Article", "a"], "ans": 0, "exp": "'Extraordinary' starts with a vowel sound ⇒ 'an extraordinary talent'."}, {"id": 188, "num": 8, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "The ancient key was discovered buried deep ______ the floorboards of the abandoned cottage.", "options": ["among", "beneath", "over", "behind"], "ans": 1, "exp": "'Beneath' means directly underneath something (under the floorboards)."}, {"id": 189, "num": 9, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "She returned home after _____ hour.", "options": ["the", "an", "a", "No article required"], "ans": 1, "exp": "'Hour' begins with a silent 'h' (vowel sound) ⇒ 'an hour'."}, {"id": 190, "num": 10, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Had the committee members been more transparent, the public ______ them with greater trust.", "options": ["would have regarded", "regarded", "will regard", "have regarded"], "ans": 0, "exp": "Type-3 inverted conditional ('Had they been…') requires 'would have + past participle' ⇒ 'would have regarded'."}, {"id": 191, "num": 11, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Choose the ANTONYM of the underlined word:\nAfter hearing the sad news, he walked into the room with a _lugubrious_ expression.", "options": ["furious", "lethargic", "blithe", "pessimistic"], "ans": 2, "exp": "'Lugubrious' means mournful/gloomy; its antonym is 'blithe' (cheerful, carefree)."}, {"id": 192, "num": 12, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Choose the idiom substituting the underlined segment:\nThe gym's programmes were decided by the top sponsor, proving that _the one who provides the funding has the authority to make the decisions_.", "options": ["he who pays the piper calls the tune", "the lion’s share goes to the strongest", "he who hesitates is lost", "a rising tide lifts all boats"], "ans": 0, "exp": "'He who pays the piper calls the tune' means the person supplying the money controls the decisions."}, {"id": 193, "num": 13, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Identify the ANTONYM of the highlighted word:\nThe policy was condemned as **anachronistic** in a rapidly evolving digital economy.", "options": ["Experimental", "Contemporary", "Bureaucratic", "Controversial"], "ans": 1, "exp": "'Anachronistic' means outdated/belonging to a past era; its antonym is 'Contemporary' (modern, current)."}, {"id": 194, "num": 14, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Choose the best alternative for the bold idiom:\nScientists at NASA **left no stone unturned** in their quest to find signs of life on Mars.", "options": ["delayed their progress", "made careless mistakes", "explored every possibility", "ignored minor details"], "ans": 2, "exp": "'Leave no stone unturned' means to try every possible approach or explore every possibility."}, {"id": 195, "num": 15, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "One-word substitution: 'A remedy that can cure all diseases'", "options": ["Vaccination", "Antidote", "Panacea", "Therapy"], "ans": 2, "exp": "'Panacea' (Greek pan = all + akos = cure) means a universal remedy for all diseases or ills."}, {"id": 196, "num": 16, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Replace the underlined segment with the correct proverb:\nHe was caught cheating again—proving that _people cannot change who they are_.", "options": ["the higher the monkey climbs, the more he shows his tail", "you can take a horse to the water, but you can’t make it drink", "every herring must hang by its own gill", "the leopard does not change his spots"], "ans": 3, "exp": "'The leopard does not change his spots' means a person cannot change their inherent nature."}, {"id": 197, "num": 17, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "First segment is fixed. Rearrange P–S:\nLanguage evolves continuously,\nP) and shifting power dynamics\nQ) across historical periods\nR) shaped by cultural exchange\nS) technological innovation", "options": ["SQRP", "RSPQ", "PSQR", "QRSP"], "ans": 1, "exp": "'Language evolves continuously, shaped by cultural exchange (R), technological innovation (S) and shifting power dynamics (P) across historical periods (Q).' ⇒ RSPQ."}, {"id": 198, "num": 18, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Arrange the words into a meaningful sentence:\nwas / the / concert / last / amazing / night", "options": ["The concert was amazing last night.", "Concert was the last amazing night.", "The last night was amazing concert.", "Was amazing concert the last night."], "ans": 0, "exp": "Standard Subject + Verb + Complement + Time order: 'The concert was amazing last night.'"}, {"id": 199, "num": 19, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Substitute the underlined segment:\nFaisal is _very similar to his father in terms of his personality and character_.", "options": ["saddled with his father's baggage", "the apple of his father's eye", "the black sheep of the family", "a chip off the old block"], "ans": 3, "exp": "'A chip off the old block' describes someone who closely resembles a parent in character or behaviour."}, {"id": 200, "num": 20, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 13", "isShift": false, "passage": null, "q": "Select the sentence that has a grammatical error.", "options": ["The manager review the financial report.", "I solved the problem using data from the computer.", "Sohan completed the analysis before the deadline.", "Mr. Dutta developed a new strategy for the business."], "ans": 0, "exp": "Singular subject 'The manager' requires 'reviews' or 'reviewed', not 'review'."}]}, {"id": 11, "code": "Mock 11", "title": "English Mock 11", "subtitle": "Ramban English · Set 12", "badge": "Ramban", "durationSec": 600, "questions": [{"id": 201, "num": 1, "topic": "Mixed Grammar & Usage", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Which term describes the practice of obtaining something, especially money, through force or threats?", "options": ["Bribery", "Usury", "Extortion", "Embezzlement"], "ans": 2, "exp": "'Extortion' is obtaining money or property through force or threats."}, {"id": 202, "num": 2, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Arrange A–D into a coherent paragraph:\nA. Tourists usually notice vandalism on the walls where hieroglyphs had been chipped off.\nB. What they might not notice is that the chipping is in a specific horizontal band.\nC. In recent times, archaeologists have discovered something very interesting about wall carvings in Egyptian temples.\nD. There is no chipping above or below that.", "options": ["BADC", "CABD", "DBAC", "ADBC"], "ans": 1, "exp": "C introduces the discovery → A what tourists notice → B what they might not notice (horizontal band) → D no chipping above/below that. Order: CABD."}, {"id": 203, "num": 3, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "She gave me _______ honest opinion and shared _______ MBA graduate's perspective.", "options": ["an; an", "a; a", "a; an", "an; a"], "ans": 0, "exp": "Both 'honest' (silent h) and 'MBA' ('em') start with vowel sounds ⇒ 'an; an'."}, {"id": 204, "num": 4, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Select the grammatically correct sentence.", "options": ["He looked at moon.", "He looked at the moon.", "He looked at a moon.", "He looked at an moon."], "ans": 1, "exp": "Unique objects like the sun, the moon, and the earth take the definite article 'the': 'He looked at the moon.'"}, {"id": 205, "num": 5, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Arrange A–E into a coherent paragraph:\nA. It is one of the largest cities in eastern Europe.\nB. Other people work in publishing, engineering, or manufacturing.\nC. Many people in Kiev work in government or business offices.\nD. The economy of Kiev depends on trade, industry, and service businesses.\nE. Kiev is the capital of the country of Ukraine.", "options": ["DAEBC", "BEDAC", "CBEDA", "EADCB"], "ans": 3, "exp": "E introduces Kiev → A ('It') → D economy → C many people's jobs → B 'Other people'. Order: EADCB."}, {"id": 206, "num": 6, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "First segment (A) is fixed. Rearrange P–S:\nAfter multiple privacy complaints, (A) / user data policies (P) / updated promptly to (Q) / restore public trust (R) / on digital platforms were (S)", "options": ["PQRS", "SQRP", "RPQS", "PSQR"], "ans": 3, "exp": "'After multiple privacy complaints, user data policies (P) on digital platforms were (S) updated promptly to (Q) restore public trust (R).' ⇒ PSQR."}, {"id": 207, "num": 7, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "(A) is fixed. Rearrange B–D:\n(A) because the regulatory inspection team compared laboratory procurement complaint summaries with independent compliance reports during the pilot evaluation\n(B) the comparison showed that the problem resulted from poor interagency coordination\n(C) therefore administrators revised appeal procedures before district implementation\n(D) field officers identified procedural bottlenecks across multiple review files", "options": ["ACBD", "ADBC", "ACDB", "ADCB"], "ans": 1, "exp": "A (comparison conducted) → D (officers identified bottlenecks) → B ('the comparison showed' cause) → C ('therefore' revised procedures). Order: ADBC."}, {"id": 208, "num": 8, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Indirect speech conversion:\nThe teacher said to us, 'You must submit your work today.'\n→ The teacher told us that we ___ submit our work that day.", "options": ["should", "could", "had to", "would"], "ans": 2, "exp": "In indirect speech, 'must' denoting obligation converts to 'had to'."}, {"id": 209, "num": 9, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Select the most appropriate meaning of the idiom: 'Cut the Gordian knot'", "options": ["To solve a difficult problem in a very direct way by doing something forceful or extreme", "To make a situation more complicated", "To run away from a difficult problem", "To tie a knot perfectly"], "ans": 0, "exp": "'Cut the Gordian knot' means resolving an intricate problem swiftly through a bold, direct action."}, {"id": 210, "num": 10, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Identify the erroneous bold segment:\nThe research chemist found that the compound became **highly unstable** when exposed to light, making it **an un-usable element** for **commercial photographic** film or **long-lasting medical** imaging.", "options": ["highly unstable", "an un-usable element", "long-lasting medical", "commercial photographic"], "ans": 1, "exp": "The prefix 'un-' attaches directly without a hyphen: 'an unusable element'."}, {"id": 211, "num": 11, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "First segment is fixed. Rearrange P–S:\nAfter the meeting ended / They decided to implement the changes (P) / The team reviewed the project details and (Q) / Who was still unsure, requested another discussion (R) / But the manager (S)", "options": ["PQSR", "RSPQ", "QPSR", "PQRS"], "ans": 2, "exp": "'After the meeting ended, the team reviewed the project details and (Q) they decided to implement the changes (P), but the manager (S), who was still unsure, requested another discussion (R).' ⇒ QPSR."}, {"id": 212, "num": 12, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Select the most appropriate meaning of the idiom: 'Throw in the towel'", "options": ["To wash hands of something", "To clean up a mess", "To fight harder", "To give up or surrender"], "ans": 3, "exp": "'Throw in the towel' means to give up or admit defeat."}, {"id": 213, "num": 13, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Replace the underlined text with the correct idiom:\nFor the students, the researcher’s complex theory _caused a confusing and misleading situation_.", "options": ["led them up the garden path", "beat around the bush", "added fuel to the fire", "spilled the beans"], "ans": 0, "exp": "'Lead someone up the garden path' means to mislead or deceive someone."}, {"id": 214, "num": 14, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Select the most appropriate meaning of the idiom: 'Break the ice'", "options": ["Jump into cold water", "Cause trouble", "Start a conversation", "Shatter something"], "ans": 2, "exp": "'Break the ice' means to initiate a conversation and ease social tension."}, {"id": 215, "num": 15, "topic": "Parts of Speech & Grammar Terms", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": null, "q": "Rectify the sentence:\n'The article focuses over the implications in regard of climate-induced migration across borders.'", "options": ["The article focuses on the implications in regard of climate-induced migration beyond borders.", "The article focuses over the implications in respect of climate-induced migration across borders.", "The article focuses on the implications to regard of climate-induced migration across borders.", "The article focuses on the implications with regard to climate-induced migration across borders."], "ans": 3, "exp": "The verb 'focus' pairs with 'on', and the correct prepositional phrase is 'with regard to'."}, {"id": 216, "num": 16, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": "M11_ENG_RC_12", "q": "What is the primary focus of the scientist's latest experiment?", "options": ["Developing a new technology", "Conducting complex chemical reactions", "Documenting natural phenomena", "Observing biological specimens"], "ans": 1, "exp": "The opening sentence states the experiment involved 'a complex series of chemical reactions'."}, {"id": 217, "num": 17, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": "M11_ENG_RC_12", "q": "What quality of the scientist is highlighted by her perseverance through failures?", "options": ["Creativity", "Determination", "Patience", "Intelligence"], "ans": 1, "exp": "The passage notes: 'Despite facing countless setbacks and repeated failures, her determination remained steadfast.'"}, {"id": 218, "num": 18, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": "M11_ENG_RC_12", "q": "What did the scientist discover that could change her research?", "options": ["A crucial piece of equipment", "An unexpected variable", "A hidden formula", "A new chemical element"], "ans": 1, "exp": "She identified 'an unexpected variable — a factor she hadn't considered — that had the potential to alter the entire direction of her research.'"}, {"id": 219, "num": 19, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": "M11_ENG_RC_12", "q": "What was the atmosphere in the lab as the scientist prepared to test her hypothesis?", "options": ["Nervous", "Excited", "Calm", "Tense"], "ans": 1, "exp": "The discovery 'sent a spark of excitement through the lab, filling the air with an almost tangible sense of anticipation.'"}, {"id": 220, "num": 20, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 12", "isShift": false, "passage": "M11_ENG_RC_12", "q": "Which of the following best describes the scientist's documentation process?", "options": ["Brief and summarised", "Erratic and haphazard", "Sporadic and incomplete", "Detailed and meticulous"], "ans": 3, "exp": "The passage calls it 'a meticulous undertaking … carefully documented in her well-worn lab journal'."}]}, {"id": 12, "code": "Mock 12", "title": "English Mock 12", "subtitle": "Ramban English · Set 11", "badge": "Ramban", "durationSec": 600, "questions": [{"id": 221, "num": 1, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Arrange the jumbled sentences into a coherent paragraph:\nP. Many believe that technology is the solution to most global challenges.\nQ. However, there are those who argue that technology may create more problems than it solves.\nR. It is said that while technology can solve some issues, it may also exacerbate others.\nS. This debate over technology’s role in society is a long-standing one.", "options": ["P Q R S", "S P Q R", "S R P Q", "P S R Q"], "ans": 0, "exp": "P states the positive view → Q ('However') introduces the counter-argument → R balances both sides → S ('This debate') concludes. Order: PQRS."}, {"id": 222, "num": 2, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Select the INCORRECTLY spelt word in the sentence:\n'The miscellaneous collection of paraphernalia strewn across the room created an atmosphere of chaotic disorganisation, overwhelming even the most unflapable individuals.'", "options": ["Paraphernalia", "Unflapable", "Miscellaneous", "Overwhelming"], "ans": 1, "exp": "The correct spelling is 'Unflappable' (with double 'p'), meaning calm in a crisis."}, {"id": 223, "num": 3, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Select the most appropriate adjective:\nYou won't find a _______ hotel than this for a night.", "options": ["cheaper", "more cheap", "cheapest", "more cheaper"], "ans": 0, "exp": "Before 'than', use the comparative degree; 'cheap' is a one-syllable adjective whose comparative is 'cheaper'."}, {"id": 224, "num": 4, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Select the idiom that conveys the same meaning as the underlined segment:\n_There’s no point in discussing after the damage is done_ why the accident happened in the first place!", "options": ["Cut corners", "Better late than never", "Speak of the devil", "Let sleeping dogs lie"], "ans": 3, "exp": "'Let sleeping dogs lie' means do not disturb or reopen a settled/past issue that may only cause trouble."}, {"id": 225, "num": 5, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Select the most appropriate synonym for the highlighted word:\nDuring his solo trip through Kerala’s backwaters, he found the slow-paced lifestyle to be **idyllic**.", "options": ["idle", "unpleasant", "picturesque", "chaotic"], "ans": 2, "exp": "'Idyllic' means extremely peaceful, happy, and charming — closest in meaning to 'picturesque'."}, {"id": 226, "num": 6, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Which word is the ANTONYM of 'trivial' as used in the sentence?\n'Although the team initially dismissed the anomaly as trivial, further investigation revealed it to be a matter of profound consequence.'", "options": ["Marginal", "Insignificant", "Minor", "Substantial"], "ans": 3, "exp": "'Trivial' means unimportant; its antonym is 'Substantial' (considerable, significant)."}, {"id": 227, "num": 7, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Identify the segment containing the adjective-related error:\n'During the committee's brisk deliberation, the less vocal member grew increasingly hesitant, while the more assertively colleagues became even quieter than earlier.'", "options": ["More assertively colleagues became even quieter", "than earlier in the proceedings", "Less vocal member grew increasingly hesitant", "Brisk deliberation conducted by the committee"], "ans": 0, "exp": "A noun ('colleagues') must be modified by an adjective, not an adverb: 'more assertive colleagues' instead of 'more assertively colleagues'."}, {"id": 228, "num": 8, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Select the ANTONYM of the underlined word:\nWhile the artist was known for her _innovative_ techniques, her latest work seemed surprisingly ordinary.", "options": ["experimental", "derivative", "inspired", "radical"], "ans": 1, "exp": "'Innovative' means original and new; its antonym is 'derivative' (imitative, unoriginal)."}, {"id": 229, "num": 9, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Complete the sentence:\nThe manager said, “I ______ the final decision by this evening.”", "options": ["announce", "will announce", "would announce", "had announced"], "ans": 1, "exp": "Inside direct speech referring to a future action ('by this evening'), simple future 'will announce' is required."}, {"id": 230, "num": 10, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Complete the sentence:\nWe are meeting tomorrow morning to finalize the annual report, and the Director _________ us online.", "options": ["will join", "will have joined", "joins", "will have been joining"], "ans": 0, "exp": "A definite future action ('tomorrow morning') takes simple future: 'will join'."}, {"id": 231, "num": 11, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Choose the word OPPOSITE in meaning to the underlined word:\nMy colleague’s _unctuous_ flattery of the coordinator came across as contrived and self-serving.", "options": ["Smug", "Smarmy", "Genuine", "Oleaginous"], "ans": 2, "exp": "'Unctuous' means excessively flattering and insincere (synonyms: smarmy, oleaginous). Its antonym is 'Genuine'."}, {"id": 232, "num": 12, "topic": "Mixed Grammar & Usage", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Identify the sentence with INCORRECT adjective usage:", "options": ["The committee adopted a pragmatic approach to resolving the institutional dispute.", "The panel praised the candidate's insightful interpretation of the historical evidence.", "The report contained several ambiguity recommendations that required clarification.", "The researcher offered a methodical analysis of the conflicting evidence."], "ans": 2, "exp": "'Ambiguity' is a noun; the adjective 'ambiguous' is needed before 'recommendations'."}, {"id": 233, "num": 13, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Which part of the sentence has an error?\nRitwik set aside some savings (1) / so that he would have (2) / a few money for emergencies. (3) / No error (4)", "options": ["2", "3", "4", "1"], "ans": 1, "exp": "'Money' is uncountable, so 'a few money' in part (3) is incorrect; it should be 'a little money' or 'some money'."}, {"id": 234, "num": 14, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Identify the ANTONYM of the highlighted word:\nThe **eupeptic** classmate was not liked by all as he overwhelmed a certain section of people.", "options": ["Melancholic", "Conspicuous", "Vivacious", "Conceited"], "ans": 0, "exp": "'Eupeptic' means cheerful and optimistic (synonym: vivacious). Its antonym is 'Melancholic' (gloomy, sad)."}, {"id": 235, "num": 15, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": null, "q": "Which best describes the meaning of the proverb:\n'Don’t put too many irons in the fire'?", "options": ["Focus on one task at a time to avoid failure", "Delegate tasks to others to ensure efficiency", "Take on as many tasks as possible to succeed", "Don't put too much hope on yourself"], "ans": 0, "exp": "The proverb advises against taking on too many tasks simultaneously, as dividing attention may cause failure."}, {"id": 236, "num": 16, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": "M12_ENG_RC_11", "q": "Select the correct ANTONYM of 'Exacerbate' from the passage.", "options": ["Threaten", "Mitigate", "Accelerate", "Implement"], "ans": 1, "exp": "'Exacerbate' means to make worse; its antonym in the passage is 'Mitigate' (make less severe)."}, {"id": 237, "num": 17, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": "M12_ENG_RC_11", "q": "What is the main idea of this passage?", "options": ["It highlights global warming, its causes/effects, and why it is a distant threat.", "It highlights global warming, its minor effects, and why it requires little action.", "The passage highlights what global warming is, its causes, effects, and the urgent need for collective action to mitigate its impact.", "It highlights global warming and why individuals have no role in combatting it."], "ans": 2, "exp": "The passage outlines causes and effects of global warming and emphasizes urgent collective action by governments, businesses, and individuals."}, {"id": 238, "num": 18, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": "M12_ENG_RC_11", "q": "Identify the structure of the passage.", "options": ["Descriptive", "Chronological", "Compare and Contrast", "Problem and Solution"], "ans": 3, "exp": "Paragraph 1 defines the problem (causes/effects of global warming) and the remaining paragraphs lay out multi-level solutions ⇒ Problem and Solution."}, {"id": 239, "num": 19, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": "M12_ENG_RC_11", "q": "Select the correct ANTONYM of 'Incompetence' from the passage.", "options": ["Agreement", "Efficiency", "Transportation", "Investment"], "ans": 1, "exp": "'Incompetence' means inability to perform well; its antonym from the passage is 'Efficiency'."}, {"id": 240, "num": 20, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 11", "isShift": false, "passage": "M12_ENG_RC_11", "q": "Select the most appropriate title for the given passage.", "options": ["Addressing Global Warming: A Shared Responsibility", "Global Warming is a Hoax", "Addressing Global Warming: A Local Concern", "Global Warming: A Natural Phenomenon"], "ans": 0, "exp": "Since governments, businesses, and individuals must all act together, 'Addressing Global Warming: A Shared Responsibility' fits best."}]}, {"id": 13, "code": "Mock 13", "title": "English Mock 13", "subtitle": "Ramban English · Set 10", "badge": "Ramban", "durationSec": 600, "questions": [{"id": 241, "num": 1, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Arrange A–D between 1 and 6:\n1. On the first landing there was only one door, and it was locked.\nA) There came forth to meet me the chill musty air.\nB) The same air that is characteristic of a long unoccupied room.\nC) But when I turned the handle, it opened.\nD) On the second landing there was also only one door.\n6. With it there came an indescribable odour.", "options": ["ABCD", "BCDA", "DABC", "DCAB"], "ans": 3, "exp": "1 (first landing door locked) → D (second landing also had one door) → C ('But' this time it opened) → A (chill musty air came out) → B ('The same air' of an unoccupied room) → 6 ('With it' came an odour). Order: DCAB."}, {"id": 242, "num": 2, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Select the most appropriate synonym of the highlighted word:\nThe cake was **exquisite** in taste, leaving everyone impressed with its delicate flavour.", "options": ["mediocre", "sour", "bland", "delicious"], "ans": 3, "exp": "'Exquisite' means extremely fine, delicate, or pleasant; for taste, its closest synonym is 'delicious'."}, {"id": 243, "num": 3, "topic": "Sentence Rearrangement", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Arrange P–S between A1 and A6:\nA1. Art has played an important role in human culture and tradition.\nP. There are many art forms like painting, sculpture, music and dance used to express human experiences.\nQ. It is a channel to reflect on society and articulate social trends.\nR. The purpose is related to entertainment, education and awareness.\nS. Thus, art impacts person's thought and inspires a change in the world.\nA6. If we engage ourselves with art, we will enhance our understanding of the world.", "options": ["SQPR", "QRSP", "RSQP", "PQRS"], "ans": 3, "exp": "A1 introduces art → P lists its forms → Q ('It is a channel') explains its social role → R states its purpose → S ('Thus') concludes its impact → A6. Order: PQRS."}, {"id": 244, "num": 4, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Select the most appropriate option to fill in the blank:\nJohn lost a large amount of money in gambling, _____ he still seems to live a lavish life.", "options": ["or", "because", "but", "nor"], "ans": 2, "exp": "The two clauses express contrast (lost a lot of money, yet lives lavishly), so the coordinating conjunction 'but' is correct."}, {"id": 245, "num": 5, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Select the option that lists all the INCORRECTLY spelt words in the passage:\n'The intermittant variances in readings were linked to extranious environmental influences rather than inherent fault lines in the system. Experts proposed recalibraeting the devices and reassessing the experimental parametres. Although the findings were rigorously documented, the final assessment was deemed insufficiently decisive for immediate implementation.'", "options": ["recalibraeting, extranious, intermittant, parametres", "recalibraeting, parametres, decisive, influences", "recalibraeting, extranious, parametres, intermittent", "variances, parametres, implementation, fault lines"], "ans": 0, "exp": "All four misspelled words in the passage are: recalibraeting (recalibrating), extranious (extraneous), intermittant (intermittent), and parametres (parameters)."}, {"id": 246, "num": 6, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Identify the erroneous bold segment:\nThe laboratory technicians discovered that **the newly formulated** cleaning agent rendered the bio-hazard containment unit completely **bacteria-less** after a single application, allowing researchers **safe re-entry** into the **restricted testing zone**.", "options": ["bacteria-less", "the newly formulated", "restricted testing zone", "safe re-entry"], "ans": 0, "exp": "The correct idiomatic adjective is 'bacteria-free'; the suffix '-free' indicates absence of something undesirable or harmful."}, {"id": 247, "num": 7, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Choose the most appropriate one-word substitute for the underlined expression:\nThe professor's latest book was _intended to teach moral principles as well as academic concepts_.", "options": ["allegorical", "didactic", "satirical", "fictional"], "ans": 1, "exp": "'Didactic' means intended to teach, particularly in having moral instruction as an ulterior motive."}, {"id": 248, "num": 8, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Choose the correct one-word substitute:\nA person who is exceptionally generous in giving gifts, money, or support, often on a large scale and without expecting anything in return.", "options": ["Parsimonious", "Frugal", "Munificent", "Penurious"], "ans": 2, "exp": "'Munificent' means characterized by great generosity. Parsimonious, Frugal, and Penurious all imply thriftiness or stinginess."}, {"id": 249, "num": 9, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Identify the error and select the option that rectifies it:\n(A) If he would have / (B) worked harder, he / (C) could have passed / (D) the examination easily.", "options": ["worked hard, he", "could have been passing", "If he had", "the examination easy."], "ans": 2, "exp": "In a third conditional sentence, the if-clause takes past perfect ('If he had worked harder'), never 'would have'."}, {"id": 250, "num": 10, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Choose the correct form of the erroneous sentence:\n'Next month, I will starts my new job and will been working there full-time.'", "options": ["Next month, I will start my new job and will be working there full-time.", "Next month, I will starts my new job and will work there full-time.", "Next month, I start my new job and will be working there full-time.", "Next month, I will start my new job and will have been working there full-time."], "ans": 0, "exp": "After modal 'will', use the base verb ('will start'), and future continuous takes 'will be + V-ing' ('will be working')."}, {"id": 251, "num": 11, "topic": "Sentence Improvement", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Substitute the underlined section:\nHe is a/an _person who takes pleasure in the suffering of others_.", "options": ["sadist", "pacifist", "optimist", "realist"], "ans": 0, "exp": "A 'sadist' derives pleasure from inflicting pain or witnessing the suffering of others."}, {"id": 252, "num": 12, "topic": "Vocabulary", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Select the most appropriate antonym of the bold word:\nAfter the marathon, she felt too **languid** to speak even when her friends congratulated her.", "options": ["lethargic", "apathetic", "energetic", "pathetic"], "ans": 2, "exp": "'Languid' means weak, slow, or lacking energy; its direct antonym is 'energetic' (lethargic is a synonym)."}, {"id": 253, "num": 13, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Identify the option that contains an adjective error:\n'After the conference, several innovative proposals were discussed during the closed session, but only the more promising solutions received further consideration by the committee.'", "options": ["received further consideration by the committee", "several innovative proposals were discussed", "only the more promising solutions received further consideration", "during the closed session"], "ans": 2, "exp": "Since solutions are selected from 'several' (more than two) proposals, the superlative degree is required: 'only the most promising solutions'."}, {"id": 254, "num": 14, "topic": "Fill in the Blanks", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Select the most appropriate meaning of the expression:\n'A bird in the hand is worth two in the bush.'", "options": ["It is better to hold onto something certain than risk it for more uncertain gains.", "You should always aim for bigger rewards.", "Birds are always more valuable than other animals.", "One must take risks to succeed in life."], "ans": 0, "exp": "The proverb means it is wiser to keep what you already securely have than to risk losing it chasing something bigger but uncertain."}, {"id": 255, "num": 15, "topic": "Error Detection", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": null, "q": "Choose the segment that contains an error:\n'Despite the committee's most detailed plan, their final proposal was least effective than the previous year's.'", "options": ["most detailed plan.", "previous year's", "least effective than", "final proposal was less effective"], "ans": 2, "exp": "The comparative conjunction 'than' requires the comparative degree: 'least effective than' should be 'less effective than'."}, {"id": 256, "num": 16, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": "M13_ENG_RC_10", "q": "What are the two major issues that are handled by FAO in addition to food and agriculture?", "options": ["Religious harmony and respect for all", "Sharing of knowledge and advice on fisheries", "Equal distribution of food and its availability", "Gender and climate change related issues"], "ans": 3, "exp": "The passage explicitly states: 'Cross-cutting issues such as Gender and Climate Change are also addressed.'"}, {"id": 257, "num": 17, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": "M13_ENG_RC_10", "q": "What is the meaning of the word ‘harness’ in the passage?", "options": ["Employ", "Derive", "Suppress", "Borrow"], "ans": 0, "exp": "In 'harnessing Indian expertise', 'harness' means to make effective use of or employ."}, {"id": 258, "num": 18, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": "M13_ENG_RC_10", "q": "What is the ANTONYM of the word ‘contentious’ in the given passage?", "options": ["Combative", "Cooperative", "Argumentative", "Peaceful"], "ans": 3, "exp": "'Contentious' means causing or likely to cause argument/dispute. Its antonym here is 'Peaceful' (free from dispute)."}, {"id": 259, "num": 19, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": "M13_ENG_RC_10", "q": "What does the word ‘trans-boundary’ suggest?", "options": ["Having no consideration for gender", "Across the national boundaries", "Within cities of a nation", "Across the cross-section of society"], "ans": 1, "exp": "'Trans-boundary' means extending across national borders (e.g., crop and livestock diseases spreading between countries)."}, {"id": 260, "num": 20, "topic": "Reading Comprehension", "exam": "DSSSB TGT CS · Ramban Full Mock 10", "isShift": false, "passage": "M13_ENG_RC_10", "q": "What is the central theme of the passage?", "options": ["FAO-India and capacity building programmes across nations", "Agricultural production in India is affected by FAO.", "FAO and developing countries require equal cooperation.", "Food security in India in the current scenario is challenging."], "ans": 0, "exp": "The passage centers on FAO's partnership with India in technical assistance, capacity building, global public goods, and sharing Indian centres of excellence with other nations."}]}], "passages": {"M1_ENG_RC_17": {"title": "Reading Comprehension Passage (Q1 – Q5)", "text": "Mandala Art, a geometric configuration of symbols, is far more than a decorative pattern; it is a profound spiritual and ritualistic symbol in various Eastern traditions, particularly Hinduism and Buddhism. The term 'Mandala' is Sanskrit for 'circle' or 'completion,' reflecting its core structure. Characteristically, a mandala is organized around a central point, expanding outward in concentric circles and squares, often containing detailed iconography representing the cosmos, deities, or spiritual concepts.\n\nFor practitioners, the creation and contemplation of a mandala serves as a meditative tool—a way to establish a sacred space and aid in deep concentration. The intricate, symmetric construction symbolizes the universe's harmonious order and the journey from the outer world of distraction to the inner world of enlightenment. In modern contexts, mandala coloring and drawing have gained popularity as a therapeutic art form, recognized for their calming effect and ability to promote focus. While the form remains historically sacred, its contemporary use underscores the universal human need for balance, order, and spiritual coherence through artistic expression."}, "M2_ENG_RC_18": {"title": "Reading Comprehension Passage (Q1 – Q5)", "text": "A sting by a highly toxic box jellyfish, such as the Australian box jellyfish, will cause a person to feel extreme pain and may cause paralysis, cardiac arrest, and death. These effects can appear in just five minutes. For other species with weaker toxins, such as the Caribbean box jellyfish, the sting may cause days of pain but not death. In some cases, a box jellyfish sting can cause Irukandji syndrome—which presents as muscle cramps, vomiting, agitation, and even heart failure—whose symptoms may begin about a half hour after being stung.\n\nFor all box jellyfish stings, the severity largely depends upon how much skin comes into contact with the tentacles. The venom of a toxic box jellyfish is made up of several proteins. Scientists studying the venom's effects on various animal cells have not reached a clear consensus on how, at the microbiological level, the venom affects its victims. In addition, there is little agreement on how to treat envenomation. Some scientists have found that the venom contains proteins, called porins, that rip cells open, which releases enough potassium to cause heart failure, whereas others note that proteins in the venom may directly attack heart muscle."}, "M3_ENG_CLOZE_19": {"title": "Cloze Test Passage (Q1 – Q5)", "text": "Prolonged exposure to sunlight, waves, and mechanical abrasion can transform larger objects into microscopic particles known as microplastics. These particles are now (1) _______ throughout marine environments, from coastal waters to remote oceanic regions. Marine organisms may ingest them accidentally, potentially introducing contaminants into food webs. The ecological (2) _______ of such exposure remains an active area of scientific investigation. Researchers have (3) _______ that some particles can transport chemical pollutants across considerable distances. Because microplastics are extremely (4) _______ to remove once dispersed, reducing plastic leakage is essential (5) _______ protecting aquatic ecosystems."}, "M4_ENG_RC_20": {"title": "Reading Comprehension Passage (Q1 – Q5)", "text": "The wetlands are among the most productive life support systems in the world and are of immense socio-economic, ecological and bio-aesthetic importance to mankind. Wetlands are valuable as sources, sinks, and transformers of a multitude of chemical, biological, and genetic materials. They are often called \"biological supermarkets\" for the extensive food chain and rich biodiversity they support. They play major roles in the landscape by providing unique habitats for a wide variety of flora and fauna.\n\nThe State of Jammu & Kashmir is famous world over for several of its important wetlands, which are directly linked to the livelihood requirements of the local population apart from their ecological, biodiversity and tourism values. These wetlands are also primary habitat for hundreds of species of waterfowl, fish, mammals, insects, etc. A variety of migratory birds from Siberia, Northern Europe and Central Asia visit these wetlands during the winter months. Several wetlands exist in the State of Jammu and Kashmir, some of them inside sanctuaries and some independently as conservation reserves. So far, a total of 21 wetlands has been identified. Of these, seven (7) wetlands / lakes are within the limits of National Parks and Wildlife Sanctuaries."}, "M5_ENG_RC_Z1": {"title": "Reading Comprehension Passage (Q16 – Q20)", "text": "Modern Earth system science conceptualises the planet as an integrated network of physical, biological, and human processes, rejecting earlier compartmentalised models that treated the atmosphere, hydrosphere, lithosphere, and biosphere as isolated domains. Central to this perspective are feedback loops—nonlinear mechanisms through which environmental change is amplified or moderated. Melting Arctic ice, for instance, reduces surface albedo, accelerates warming, and intensifies further ice loss, demonstrating that ecological disruption unfolds through interlinked processes rather than linear causality. Human interventions such as deforestation, agricultural intensification, and urban expansion similarly produce cascading consequences across multiple Earth subsystems, highlighting the complex interplay between anthropogenic activity and natural processes.\n\nGeographers emphasise that interpreting planetary change requires combining spatial analysis with historical depth. Debates surrounding the Anthropocene illustrate this approach: some scholars situate its origins in industrialisation, while others trace it to early agriculture, colonial land-use regimes, or post-fifteenth-century ecological exchanges. Despite differing chronologies, there is broad agreement that human activity now functions as a geological force reshaping biogeochemical cycles and planetary feedback at unprecedented scales.\n\nThese transformations are unevenly distributed. Vulnerability varies across regions due to geography, economic capacity, and political institutions. Small island states confront sea-level rise, arid regions face water scarcity, and urban centres experience concentrated environmental stress. Globalisation intensifies interdependence but simultaneously amplifies systemic risk, as fragile supply chains rely on climatic and political stability. Earth system science therefore demands holistic, justice-oriented frameworks for sustainable governance, requiring coordinated policy, interdisciplinary research, and ethical stewardship to ensure that planetary resilience is maintained amid accelerating environmental change."}, "M6_ENG_RC_Z2": {"title": "Reading Comprehension Passage (Q16 – Q20)", "text": "The widespread dismissal of teenage stress as mere exaggeration reflects a prevalent societal misconception that youth is characterized by a carefree existence. In reality, the modern socio-academic landscape subjects adolescents to intense psychological pressure and pervasive anxiety. Far from leading an unburdened life, today's youth must navigate a hyper-competitive, unpredictable environment that continuously demands academic excellence and social conformity.\n\nAdolescent distress primarily stems from three distinct sources of pressure: performance, conformity, and self-improvement. Academic demands imposed by parents, educators, and peers frequently force students into demanding academic paths without adequate regard for individual aptitude or personal preference. Simultaneously, societal expectations often compel adolescents to conform to conventional norms, while relentless adult oversight dictates their daily routines, effectively stripping them of personal autonomy. Adding to these pressures is the persistent anxiety surrounding peer comparison—ranging from intelligence to socio-economic status—which further undermines their self-esteem and emotional well-being.\n\nMitigating this psychological burden requires both pragmatic coping mechanisms and emotional resilience. Simple techniques, such as deliberate deep breathing, can immediately alleviate acute anxiety and restore mental composure. Furthermore, to overcome chronic procrastination, adolescents must cultivate the discipline of immediate task initiation, pushing past initial discomfort to build momentum. Ultimately, effective stress management hinges upon adopting a balanced, rational perspective toward competition and personal differences. By fostering adaptability, developing self-confidence, and confronting unforeseen challenges with realistic optimism, young individuals can successfully insulate themselves against the formidable psychological pressures of modern life."}, "M7_ENG_RC_16": {"title": "Reading Comprehension Passage (Q1 – Q5)", "text": "Public healthcare systems are important because they provide medical services to large populations at affordable costs. However, many countries still face challenges such as overcrowded hospitals, lack of doctors, and limited medical equipment. Poor sanitation, pollution, and unhealthy lifestyles also increase the number of patients requiring treatment. In rural areas, healthcare facilities are often far away, making medical care difficult for villagers.\n\nGovernments must invest more in hospitals, medical education, and disease prevention programs to improve public health services. Awareness campaigns can educate people about hygiene, nutrition, and regular health check-ups. During health emergencies, strong public healthcare systems help control diseases and protect communities effectively. Cooperation between governments, hospitals, and citizens is necessary for better healthcare management. Improving public healthcare systems will reduce suffering, increase life expectancy, and create healthier societies for future generations across the world. Better funding and planning can ensure fair medical access for everyone everywhere today."}, "M8_ENG_RC_15": {"title": "Reading Comprehension Passage (Q1 – Q5)", "text": "While the world's attention is rightly focused on the war in Iran, another conflict is unfolding along Iran's eastern border. Since 27 February 2026, Afghanistan and Pakistan have been officially at war, yet the fighting has drawn relatively little notice. Even if the Pakistan-Afghanistan war continues under the radar, its consequences could shape the region for years to come. Beijing's alliance with Pakistan and New Delhi's growing influence over Afghanistan have turned border skirmishes between two neighbours into a war with regional implications.\n\nPakistan and Afghanistan have had a rocky relationship since the Taliban returned to power in Kabul in 2021. The proximate cause of the war was Pakistan's claim that its northern neighbour is harbouring the Tehrik-e-Taliban Pakistan (TTP), a terrorist group that has long plagued Islamabad and was responsible for the 2014 Peshawar school massacre that killed an estimated 144 people, mostly children. The Afghan Taliban seems determined not to give the Pakistani Taliban up to Islamabad, for fear of internal dissent and hardliner backlash in their own ranks. In the background of the conflict stand two regional giants: India and China. This is the first sustained encounter between an incipient Indian ally and the Western tip of China's military spear. Pakistan is concerned that Afghanistan is fast becoming a proxy for India. Although Afghan-Indian relations predate the return of the Taliban to power in Kabul, Pakistan sees the improving ties between the two states as a threat to its own security."}, "M9_ENG_RC_14": {"title": "Reading Comprehension Passage (Q1 – Q5)", "text": "Set in post-emancipation Jamaica and England, the novel examines how colonial power, racial hierarchy, and gendered dependence shape individual identity and psychological decline. Through the experiences of a young Creole woman raised amid social hostility and cultural dislocation, the narrative explores the fragile position occupied by those who belong fully to neither the colonisers nor the formerly enslaved population. Although legal slavery has ended, its emotional and social consequences continue to govern relationships, creating an atmosphere of mistrust, resentment, and instability. The protagonist grows up in an environment marked by isolation, fractured family bonds, and economic uncertainty. Her search for affection and belonging becomes increasingly complicated by cultural prejudice and patriarchal control.\n\nMarriage, initially imagined as a source of stability, gradually transforms into another form of confinement, as her husband attempts to redefine her identity according to his own assumptions and fears. The conflict between Caribbean and European worldviews intensifies this alienation, revealing how colonial attitudes distort intimacy and understanding. The novel further investigates the relationship between womanhood and madness. Emotional sensitivity is repeatedly dismissed as irrationality, while financial and social dependence leave women exposed to manipulation and abandonment. Memory, dreams, and fragmented narration create an atmosphere of psychological unease, suggesting that identity itself becomes unstable under systems of domination. Ultimately, the work presents madness not merely as personal collapse, but as the consequence of cultural displacement, emotional imprisonment, and the lingering violence of colonial history."}, "M10_ENG_RC_13": {"title": "Reading Comprehension Passage (Q1 – Q5)", "text": "A healthy diet is essential for maintaining overall well-being, keeping the body strong and active. It protects individuals from chronic conditions such as diabetes, heart disease, and cancer. A balanced diet includes fruits, vegetables, grains, and proteins in the right amounts, which prevents fatigue and supports proper growth in children. Ultimately, consuming nutritious food provides vital energy and bolsters the immune system.\n\nThis dietary approach relies on balance, variety, and moderation. Individuals should limit their intake of excessive sugar, salt, and unhealthy fats, which can lead to severe health complications and obesity. Furthermore, staying hydrated with clean water and choosing fresh foods further enhances vitality. Developing these nutritional habits early in life ensures long-term benefits well into adulthood.\n\nNutrient-rich meals improve both physical and mental well-being. By reducing the risk of chronic ailments, a proper diet ensures the body functions optimally, supporting long-term fitness and quality of life."}, "M11_ENG_RC_12": {"title": "Reading Comprehension Passage (Q16 – Q20)", "text": "The scientist’s latest experiment was a meticulous undertaking, involving a complex series of chemical reactions carefully documented in her well-worn lab journal. Each step demanded unwavering precision, from exact measurements to finely-tuned timing, all essential for achieving the desired outcome. Despite facing countless setbacks and repeated failures, her determination remained steadfast, her passion for discovery fueling every attempt.\n\nNow, on the edge of a long-awaited breakthrough, she identified an unexpected variable—a factor she hadn’t considered—that had the potential to alter the entire direction of her research. The discovery sent a spark of excitement through the lab, filling the air with an almost tangible sense of anticipation. Her colleagues paused, watching as she prepared her apparatus and recalibrated her instruments, ready to test her new hypothesis. This moment held the weight of years of hard work, as the scientist approached the experiment with both caution and hope, eager to see where this new path would lead."}, "M12_ENG_RC_11": {"title": "Reading Comprehension Passage (Q16 – Q20)", "text": "Global warming is one of the most pressing challenges of our time, driven primarily by human activities that release greenhouse gases into the atmosphere. The burning of fossil fuels, deforestation, and industrial processes have significantly increased carbon dioxide (CO2) levels, trapping heat and raising global temperatures. As a result, we are witnessing more frequent and intense extreme weather events, such as hurricanes, wildfires, droughts, and floods. Rising sea levels threaten coastal communities, while heat waves and air pollution pose serious health risks. The continued rise in temperatures also accelerates glacier melting, disrupting ecosystems and biodiversity.\n\nAddressing global warming requires urgent action at both government and individual levels.\n\nGovernments must implement strict policies to reduce carbon emissions by promoting renewable energy sources like solar and wind power. Investments in green technologies and sustainable infrastructure can help minimise environmental damage. Additionally, reforestation efforts can absorb excess CO2, while international agreements like the Paris Agreement play a crucial role in setting global emission reduction targets. Businesses must also adopt eco-friendly practices, such
